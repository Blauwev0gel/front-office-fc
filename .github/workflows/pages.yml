name: Publish game versions

on:
  push:
    branches: [main, chatgpt, claude-game]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize the entire build and deployment. Each run reads the latest branch
# heads so a queued older push cannot restore an outdated preview.
concurrency:
  group: front-office-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          path: versions/main
          persist-credentials: false
      - name: Check out ChatGPT version
        uses: actions/checkout@v6
        with:
          ref: chatgpt
          path: versions/chatgpt
          persist-credentials: false
      - name: Check out Claude version
        uses: actions/checkout@v6
        with:
          ref: claude-game
          path: versions/claude
          persist-credentials: false
      - name: Check out Northmarch L1/L2 preview
        uses: actions/checkout@v6
        with:
          ref: slimline-main
          path: versions/northmarch
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and check all versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/chatgpt site/claude site/northmarch
          for branch in main chatgpt claude; do
            (
              cd "versions/$branch"
              mkdir -p dist
              python build.py
              node test/preview-save.js
              node -e 'const fs=require("fs"),vm=require("vm");const html=fs.readFileSync("dist/index.html","utf8");if(html.includes("/*CSS*/")||html.includes("/*JS*/"))throw Error("Unresolved build placeholder");const script=html.match(/<script>([\s\S]*?)<\/script>/);if(!script)throw Error("Missing game script");new vm.Script(script[1]);'
            )
            target="site/$branch"
            if [ "$branch" = main ]; then target=site; fi
            cp "versions/$branch/dist/index.html" "$target/index.html"
          done
          cp versions/main/releases/northmarch/v18.3.html site/northmarch/index.html
          touch site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game versions including Northmarch
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
