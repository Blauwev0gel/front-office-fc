name: Publish Northmarch

# One simple route: the live game is built from slimline-main and published at /northmarch/.
on:
  push:
    branches: [slimline-main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: northmarch-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: slimline-main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and publish the single-file game
        run: |
          set -euo pipefail
          (cd standalone/front-office-fc/northmarch-layered && node build.js)
          mkdir -p site/northmarch
          cp standalone/front-office-fc/northmarch-layered/dist/northmarch-layered.html site/northmarch/index.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=northmarch/"><a href="northmarch/">Northmarch</a>' > site/index.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
