name: Slimline CI
# Required status checks for the official Slimline branch (see standalone/front-office-fc/northmarch-layered/docs/DEV_PROTOCOL.md).
# Leaves .github/workflows/pages.yml untouched.
on:
  pull_request:
    branches: [slimline-main]
  push:
    branches: [slimline-main]

defaults:
  run:
    working-directory: standalone/front-office-fc/northmarch-layered

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run the fast engine tests (no browser)
        run: SKIP_BROWSER=1 bash tests/run-fast.sh

  mobile-browser:
    name: mobile-browser
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build default L1/L2 HTML and play through mobile light and dark
        run: |
          node build.js
          node tests/playtest.js

  dev-state-updated:
    name: dev-state-updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docs/DEV_STATE.md must be updated in every pull request
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q 'northmarch-layered/docs/DEV_STATE.md$'; then
            echo "DEV_STATE.md updated"
          else
            echo "::error::Update standalone/front-office-fc/northmarch-layered/docs/DEV_STATE.md (official SHA, work areas, open changes, test status, artifact SHA) in this pull request."
            exit 1
          fi
