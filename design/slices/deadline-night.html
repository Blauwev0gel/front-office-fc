<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deadline Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="slices.css">
<style>:root{--club:#7a1f2b}</style>
</head><body>
<div class="wrap">
  <div class="bar"><b>Harwick Town</b><span>Div Two</span><span id="barCash" class="num"></span><span class="clock" id="barClock"></span></div>
  <a class="back" href="./">← All slices</a>
  <main id="app" class="stack" style="margin-top:14px"></main>
</div>
<script src="slices.js"></script>
<script>
const {rng,money,hhmm,wait,clamp,match,seedFromUrl,esc}=NM;
let seed=seedFromUrl(), R, S;
const END=1380;
const open=()=>!S.deal&&!S.keep;
const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)||n%10>3?0:n%10]);
const app=document.getElementById('app');
const STAR='Kofi Brennan', AGENT='Maurice Vane', TD='Helen Achterberg', CAPT='Sam Drury', RIVAL='Stockfield Rovers', CALDER='Calder City', RUTH='Ruth Ainsley';

function init(){
  R=rng(seed);
  S={screen:'intro',t:540,cash:480000,wage:41000,turn:66000,trust:61,
    motive:R.pick(['money','ambition','home']),calderReal:R.chance(.5),
    stockMax:1300000+R.int(0,5)*50000,stockBid:900000,stockAlive:true,ultimatum:false,
    calderBid:R.chance(.5)?700000:750000,known:{},lewinGone:false,signed:[],
    deal:null,keep:null,pending:null,feed:[],press:null,desk:[],bluffCaught:false,fired:{}};
  log(S.t,`${AGENT} rings at 09:00. ${RIVAL} have bid ${money(S.stockBid)} for ${STAR}. Window shuts at 23:00.`,true);
}
function log(t,txt,hot){S.feed.unshift({t,txt,hot});}

/* ---------- the clock ---------- */
const EVENTS=[
  [600,()=>log(600,`Radio Harwick confirm the ${RIVAL} bid. The phone-in is full.`)],
  [720,()=>{ if(S.stockAlive&&open()&&S.stockBid<1100000){S.stockBid=1100000;log(720,`${RIVAL} raise their bid to ${money(S.stockBid)}.`,true);} }],
  [900,()=>{ if(!S.press) S.desk.push('press'); }],
  [1080,()=>{ if(!S.signed.includes('Lewin')){S.lewinGone=true;log(1080,`Jordan Lewin signs for Tarnby. Option A is gone.`,true);} }],
  [1260,()=>{ if(S.stockAlive&&open()){S.stockBid=Math.max(S.stockBid,Math.min(S.stockMax,S.stockBid+150000));S.ultimatum=true;S.desk.push('ultimatum');log(1260,`ULTIMATUM: ${RIVAL} final offer ${money(S.stockBid)}. Answer by 22:00.`,true);} }],
  [1320,()=>{ if(S.stockAlive&&open()){S.stockAlive=false;S.desk=S.desk.filter(d=>d!=='ultimatum');log(1320,`${RIVAL} sign Dale Pruitt instead. Their interest in ${STAR} is over.`,true);} }],
];
function advance(mins){
  const to=Math.min(END,S.t+mins);
  while(S.t<to){
    S.t+=5;
    for(const [at,fn] of EVENTS) if(!S.fired[at]&&S.t>=at){S.fired[at]=1;fn();}
    if(S.pending&&S.t>=S.pending.at){resolveCounter();}
    if(S.desk.length) break; // the clock stops when the chairman is needed
  }
  if(S.t>=END) closeWindow();
}
function resolveCounter(){
  const p=S.pending;S.pending=null;
  if(!S.stockAlive||!open()) return;
  if(p.kind==='sellon'){
    if(R.chance(.7)){agree(RIVAL,S.stockBid,{sellon:true});log(S.t,`${RIVAL} accept a 25% sell-on clause. Deal agreed at ${money(S.stockBid)}.`,true);}
    else log(S.t,`${RIVAL} refuse the sell-on clause. Their bid stays ${money(S.stockBid)}.`,true);
    return;
  }
  if(p.ask<=S.stockMax){S.stockBid=p.ask;agree(RIVAL,p.ask);log(S.t,`${RIVAL} accept your price: ${money(p.ask)}. Club record sale.`,true);}
  else if(R.chance(.5)){S.stockBid=S.stockMax;log(S.t,`${RIVAL}: "${money(S.stockMax)}. Not a penny more." The offer stands for now.`,true);}
  else{S.stockAlive=false;log(S.t,`${RIVAL} pull out. Their chairman to the press: "We won't be held to ransom."`,true);}
}
function agree(to,fee,extra){
  S.deal=Object.assign({to,fee,at:S.t},extra||{});
  S.cash+=fee;S.wage-=6000;S.desk=S.desk.filter(d=>d!=='ultimatum');
}
function closeWindow(){
  S.t=END;
  if(!S.deal&&!S.keep){S.keep={type:'silent',at:S.t};}
  log(S.t,'WINDOW CLOSED.',true);
  S.screen='closed';
}

/* ---------- actions ---------- */
const ACTIONS={
  agent:{label:`Call ${AGENT} (agent)`,cost:30,run(){S.known.agent=1;log(S.t,`${AGENT}: "${CALDER} are in too, ${money(S.calderBid)}. Kofi wants to test himself higher up. Don't stand in his way."`);}},
  ruth:{label:`Ring ${RUTH}, ${CALDER} chair`,cost:45,need:()=>S.known.agent,run(){S.known.ruth=1;
    if(S.calderReal){S.calderBid=850000;log(S.t,`${RUTH}: "It's real. Move today and we'll go to ${money(S.calderBid)}. We are not Stockfield."`,true);}
    else log(S.t,`${RUTH} laughs. "We never bid. Your man Vane is using our name."`,true);}},
  visit:{label:`Drive to the training ground, see ${STAR.split(' ')[0]}`,cost:90,run(){S.known.player=1;
    const line={money:`"I'm on six grand. Their offer is fifteen. I've got a kid coming. Pay me properly and I'll stay."`,
      ambition:`"I'm 24. If I don't go now I never will. I want to play at the top. Nothing personal."`,
      home:`"I don't want Stockfield. I grew up on Mill End. Maurice says it's the move. My mam would never speak to me."`}[S.motive];
    log(S.t,`${STAR}, in the car park: ${line}`,true);}},
  td:{label:`Ask ${TD} (TD) for a plan B`,cost:30,run(){S.known.td=1;
    log(S.t,`${TD}: "Option A: Jordan Lewin, 23, nine goals in Div Three. ${money(350000)}, gone by 18:00. Option B: Carl Hoyt, 31, free, knows the league. Without Kofi I see us mid-table."`);}},
  capt:{label:`Hear ${CAPT} (captain)`,cost:30,run(){S.known.capt=1;
    log(S.t,`${CAPT}: "He's 14 of our 31 goals. Sell him to anyone, we'll cope. Sell him to Stockfield and the lads think we've given up."`);}},
};
function canAct(k){const a=ACTIONS[k];return !S.known[k==='visit'?'player':k]&&(!a.need||a.need())&&S.t+a.cost<=END&&!S.desk.length;}

function act(k){const a=ACTIONS[k];advanceThen(a.cost,()=>a.run());}
function advanceThen(mins,fn){ // the action happens at the end of the time it costs
  const start=S.t;advance(mins);
  if(S.screen!=='night') return render();
  fn();render();
}

/* ---------- decisions ---------- */
function decide(kind,arg){
  if(kind==='acceptStock'){agree(RIVAL,S.stockBid);log(S.t,`You accept ${money(S.stockBid)} from ${RIVAL}.`,true);}
  if(kind==='counter'){S.pending={kind:'ask',ask:S.stockBid+arg,at:S.t+60};log(S.t,`You ask ${RIVAL} for ${money(S.stockBid+arg)}. They'll come back within the hour.`);advance(0);}
  if(kind==='sellon'){S.pending={kind:'sellon',at:S.t+60};log(S.t,`You ask ${RIVAL} for a 25% sell-on clause at ${money(S.stockBid)}.`);}
  if(kind==='calder'){
    if(S.calderReal){agree(CALDER,S.calderBid);log(S.t,`Deal with ${CALDER}: ${money(S.calderBid)}. Not to Stockfield.`,true);}
    else{S.bluffCaught=true;S.known.ruth=1;log(S.t,`${CALDER} deny any bid. Vane was bluffing. An hour lost on the phone.`,true);advance(60);}
  }
  if(kind==='contract'){S.keep={type:'contract',at:S.t};S.wage+=3500;log(S.t,`New deal offered: £9.5k a week, four years. ${STAR} stays.`,true);S.desk=S.desk.filter(d=>d!=='ultimatum');}
  if(kind==='refuse'){S.keep={type:'refuse',at:S.t};log(S.t,`"He's going nowhere." No new deal.`,true);S.desk=S.desk.filter(d=>d!=='ultimatum');}
  if(kind==='lewin'){S.signed.push('Lewin');S.cash-=350000;S.wage+=4000;log(S.t,`Lewin signs: ${money(350000)}, £4k a week.`,true);}
  if(kind==='hoyt'){S.signed.push('Hoyt');S.wage+=2500;log(S.t,`Hoyt signs on a free, £2.5k a week.`,true);}
  if(kind==='press'){S.press={pick:arg,at:S.t};S.desk=S.desk.filter(d=>d!=='press');
    const q={none:'No comment.',notsale:`"${STAR} is not for sale."`,price:'"Every player has a price."'}[arg];
    log(S.t,`To the Echo: ${q}`);
    if(arg==='price') S.trust-=3;}
  if(kind==='close'){advance(END-S.t);}
  render();
}

/* ---------- after the window: 12 matchdays ---------- */
function season(){
  const r=rng(seed*7+3);
  const names=['Harwick Town',RIVAL,'Tarnby','Ollerton Vale','Brackley Moor','Kessington','Fennick Athletic','Wexley Park','Holme Bridge','Saltash United','Durrow','Pellham Rangers','Corby Mills','Ashwell','Garron Forest','Lyndon Albion'];
  let str=66, kofiIn=!S.deal, kofiMood=0;
  if(kofiIn){const m=S.motive,c=S.keep.type==='contract',v=S.known.player;
    kofiMood= m==='money'?(c?8:2): m==='ambition'?(c?5:1): (v||c?9:6);
    str+=kofiMood;}
  if(S.signed.includes('Lewin')) str+=5;
  if(S.signed.includes('Hoyt')) str+=2;
  const T=names.map((n,i)=>({n,s:i===0?str:i===1?(S.deal&&S.deal.to===RIVAL?78:72):r.int(58,73),p:0,gf:0,ga:0}));
  const you=T[0],stock=T[1];
  const games=[];let kofiGoals=0,kofiVsYou=0,derby=null;
  for(let w=1;w<=12;w++){
    const order=[...T.keys()].slice(1).sort(()=>r()-.5);
    const opp= w===7?1 : order.find(i=>i!==1&&!games.some(g=>g.opp===i))||order[0];
    const pairs=[[0,opp]];const rest=order.filter(i=>i!==opp);
    for(let i=0;i<rest.length;i+=2) pairs.push([rest[i],rest[i+1]]);
    for(const [a,b] of pairs){
      const home=(w+a)%2===0, H=home?a:b, A=home?b:a;
      const m=match(r,T[H].s,T[A].s);
      const gh=m.h.length,ga=m.a.length;
      T[H].gf+=gh;T[H].ga+=ga;T[A].gf+=ga;T[A].ga+=gh;
      if(gh>ga)T[H].p+=3;else if(ga>gh)T[A].p+=3;else{T[H].p++;T[A].p++;}
      const kofiTeam=S.deal?(S.deal.to===RIVAL?1:-1):0;
      let kg=0;
      if(kofiTeam>=0&&(H===kofiTeam||A===kofiTeam)){const goals=H===kofiTeam?gh:ga;for(let i=0;i<goals;i++)if(r.chance(.42))kg++;}
      if(S.deal&&S.deal.to===CALDER) kg=0;
      if(a===0){
        const us=home?gh:ga,them=home?ga:gh;
        if(kofiTeam===0) kofiGoals+=kg;
        if(kofiTeam===1&&opp===1){kofiVsYou=kg;}
        games.push({w,opp,home,us,them});
        if(w===7) derby={home,us,them,kofi:kofiTeam===1?kg:0,kofiFor:kofiTeam===0?kg:0};
      }
    }
  }
  T.sort((x,y)=>y.p-x.p||(y.gf-y.ga)-(x.gf-x.ga));
  const pos=T.indexOf(you)+1;
  return {T,games,pos,kofiGoals,derby,str,kofiMood,names};
}

function verdict(sea){
  const lines=[];let tr=S.trust;
  const at=S.deal?hhmm(S.deal.at):S.keep?hhmm(S.keep.at):'';
  if(S.deal&&S.deal.to===RIVAL){tr-=12;lines.push(['Mill End Ultras',`"Sold our lad to ${RIVAL} at ${at}. Never forget."`,-12]);}
  if(S.deal&&S.deal.to===CALDER){tr-=4;lines.push(['Mill End Ultras',`"Gutted he's gone, but at least not to them."`,-4]);}
  if(S.deal&&S.deal.fee>=1200000){tr+=3;lines.push(['Business Club',`"${money(S.deal.fee)} is a club record. The books needed that."`,+3]);}
  if(S.deal&&S.deal.sellon){lines.push(['Business Club',`"The sell-on clause was clever. If he moves again, we get a quarter."`,0]);}
  if(S.keep&&S.keep.type==='contract'&&S.motive!=='ambition'){tr+=2;lines.push(['Old Boys',`"Kept him and paid him. That's a chairman."`,+2]);}
  if(S.keep&&S.keep.type!=='contract'&&S.motive==='money'){tr-=2;lines.push(['Old Boys',`"He's sulking on six grand a week. Everyone can see it."`,-2]);}
  if(S.keep&&S.motive==='ambition'){lines.push(['Old Boys',`"He stayed, but he plays like a man waiting for January."`,0]);}
  if(S.press&&S.press.pick==='notsale'&&S.deal){tr-=6;lines.push(['The Echo',`"'Not for sale' at ${hhmm(S.press.at)}. Sold at ${at}."`,-6]);}
  if(S.press&&S.press.pick==='price'){lines.push(['The Echo',`"'Every player has a price.' Honest, at least."`,-3]);}
  if(S.bluffCaught){lines.push(['Business Club',`"Caught the agent bluffing. Good to know who we deal with."`,0]);}
  const d=sea.derby;
  if(d){ if(d.us>d.them){tr+=6;lines.push(['Mill End Ultras',`"Beat ${RIVAL} ${d.us}–${d.them}. That's the only table that matters in October."`,+6]);}
    else if(d.us<d.them){const k=d.kofi>0;tr-=k?8:5;lines.push(['Mill End Ultras',k?`"Brennan scored against us in the derby. He didn't celebrate. Doesn't help."`:`"Lost the derby ${d.us}–${d.them}."`,k?-8:-5]);}
  }
  const dp=Math.round((6-sea.pos)*1.5);tr+=dp;
  lines.push(['League',`${ord(sea.pos)} after 12 games (expected 6th)`,dp]);
  return {tr:clamp(tr,5,95),lines};
}

/* ---------- render ---------- */
function bar(){document.getElementById('barCash').textContent=money(S.cash)+' cash';document.getElementById('barClock').textContent=S.screen==='intro'?'Deadline day':S.screen==='night'||S.screen==='closed'?hhmm(S.t):'Autumn';}
function meters(){
  const ratio=Math.round(S.wage/S.turn*100);
  return `<div class="meters">
   <div class="meter"><span>Cash</span><b>${money(S.cash)}</b></div>
   <div class="meter"><span>Wages/turnover</span><b class="${ratio>67?'bad':''}">${ratio}%</b></div>
   <div class="meter"><span>Members</span><b>${S.trust}%</b></div>
   <div class="meter"><span>Window</span><b>${S.screen==='night'?hhmm(END-S.t).replace(':','h ')+'m':'shut'}</b></div></div>`;}
function who(face,name,role,line){return `<div class="who"><div class="face">${face}</div><div><div class="name">${name}</div><div class="role">${role}</div>${line?`<q>${line}</q>`:''}</div></div>`;}

function render(){
  bar();
  if(S.screen==='intro') app.innerHTML=`
   <p class="kicker">Slice A · Selection & market × event</p>
   <h1>Deadline night</h1>
   <p class="lead">31 August, 09:00. Your best player's agent is on the phone. A rival wants him. The window shuts at 23:00. You don't negotiate the deal; your TD does. But the call to sell, to whom, and what you say tonight is yours.</p>
   ${who('KB',STAR,'Striker · 24 · academy · 14 goals last season','')}
   <div class="rows">
    <div class="row"><span>Contract</span><span class="r">£6k/week, 2 years left</span></div>
    <div class="row"><span>Bid</span><span class="r">${RIVAL}, ${money(900000)}</span></div>
    <div class="row"><span>Club record sale</span><span class="r">${money(1200000)}</span></div>
    <div class="row"><span>${RIVAL}</span><span class="r">Derby rival, same division</span></div>
   </div>
   <p class="muted">Every call costs time. The clock runs only when you act. Some people will tell you the truth.</p>
   <button class="btn primary" data-act="start">Pick up the phone</button>
   <p class="muted" style="font-size:12px">Night #${seed}. The motive, the bluff and the rival's limit change per night.</p>`;
  if(S.screen==='night'||S.screen==='closed') app.innerHTML=night();
  if(S.screen==='after') app.innerHTML=after();
}

function night(){
  const desk=S.desk[0];let deskHtml='';
  if(desk==='press') deskHtml=`<div class="sec"><h2 class="bad">On your desk · 15:00</h2>
    ${who('E','Nina Coyle','Harwick Echo','Is Kofi Brennan for sale? Yes or no, chairman. It goes in tomorrow\'s paper.')}
    <div class="btns">
     <button class="btn" data-act="press" data-arg="none">"No comment." <small>safe, nobody is pleased</small></button>
     <button class="btn" data-act="press" data-arg="notsale">"He is not for sale." <small>fans cheer, if you mean it</small></button>
     <button class="btn" data-act="press" data-arg="price">"Every player has a price." <small>−3 members now</small></button>
    </div></div>`;
  if(desk==='ultimatum') deskHtml=`<div class="sec"><h2 class="bad">On your desk · ultimatum</h2>
    ${who('SR','Gareth Lomas',RIVAL+' chairman',`${money(S.stockBid)}. Final. Yes by 22:00 or we sign someone else.`)}
    <div class="btns">
     <button class="btn" data-act="acceptStock">Accept ${money(S.stockBid)} <small>to the derby rival</small></button>
     <button class="btn" data-act="dismiss">Let it run <small>they walk at 22:00</small></button>
    </div></div>`;
  const decided=S.deal||S.keep;
  const status= S.deal?`<p class="lead"><b>${STAR}</b> is joining <b>${S.deal.to}</b> for <b>${money(S.deal.fee)}</b>${S.deal.sellon?' + 25% sell-on':''}. Agreed at ${hhmm(S.deal.at)}.</p>`
    : S.keep?`<p class="lead"><b>${STAR}</b> stays${S.keep.type==='contract'?' on a new £9.5k deal':''}. Decided at ${hhmm(S.keep.at)}.</p>`
    : S.pending?`<p class="lead">Waiting for ${RIVAL} (by ${hhmm(S.pending.at)}).</p>`:'';
  const acts=Object.keys(ACTIONS).filter(k=>!S.known[k==='visit'?'player':k]&&(!ACTIONS[k].need||ACTIONS[k].need()));
  const closed=S.screen==='closed';
  return `${meters()}
   ${deskHtml}
   ${closed?`<div class="echo"><div class="mast"><span>Harwick Echo</span><span>1 Sept</span></div><div class="head">${S.deal?`Brennan gone: ${money(S.deal.fee)} to ${S.deal.to===RIVAL?'Stockfield':'Calder'}`:'Brennan stays'}</div><p>${S.deal?`The deal was agreed at ${hhmm(S.deal.at)}.`:S.keep.type==='contract'?`A new four-year deal, signed at ${hhmm(S.keep.at)}.`:S.keep.type==='refuse'?`"He's going nowhere," said the chairman at ${hhmm(S.keep.at)}.`:'The window closed without a decision. Brennan is still on £6k a week.'} ${S.signed.length?`In: ${S.signed.join(', ')}.`:''}</p></div>
     <button class="btn primary" data-act="after">Play the autumn <small>12 matchdays</small></button>`:''}
   ${!closed?`<div class="sec"><h3>${decided?'Done':'Your calls'}</h3>${status}
   ${!decided?`<div class="btns">${acts.map(k=>`<button class="btn" data-act="do" data-arg="${k}" ${canAct(k)?'':'disabled'}>${ACTIONS[k].label}<small>${ACTIONS[k].cost} min</small></button>`).join('')||'<p class="muted">Nobody left to call.</p>'}</div>`:''}</div>`:''}
   ${!closed&&!decided&&!S.desk.length?`<div class="sec"><h3>Decide on ${STAR.split(' ')[0]}</h3><div class="btns">
     ${S.stockAlive&&!S.pending?`<button class="btn" data-act="acceptStock">Accept ${RIVAL} ${money(S.stockBid)}<small>derby rival</small></button>
       <button class="btn" data-act="counter" data-arg="250000">Ask ${RIVAL} for ${money(S.stockBid+250000)}<small>reply in 1h · they may walk</small></button>
       <button class="btn" data-act="counter" data-arg="500000">Ask ${RIVAL} for ${money(S.stockBid+500000)}<small>reply in 1h · greedy</small></button>
       <button class="btn" data-act="sellon">Same fee + 25% sell-on<small>reply in 1h</small></button>`:''}
     ${S.known.agent&&!(S.known.ruth&&!S.calderReal)?`<button class="btn" data-act="calder">Sell to ${CALDER} for ${money(S.calderBid)}<small>${S.known.ruth?'confirmed':'unverified'}</small></button>`:''}
     <button class="btn" data-act="contract">Keep him: offer £9.5k a week<small>+£3.5k wages</small></button>
     <button class="btn" data-act="refuse">"He's going nowhere."<small>no new deal</small></button>
   </div></div>`:''}
   ${!closed&&S.known.td?`<div class="sec"><h3>Plan B (your TD signs, you fund)</h3><div class="btns">
     <button class="btn" data-act="lewin" ${S.lewinGone||S.signed.includes('Lewin')||S.cash<350000?'disabled':''}>Fund Jordan Lewin, ${money(350000)}<small>${S.signed.includes('Lewin')?'signed':S.lewinGone?'gone':'until 18:00'}</small></button>
     <button class="btn" data-act="hoyt" ${S.signed.includes('Hoyt')?'disabled':''}>Fund Carl Hoyt, free<small>${S.signed.includes('Hoyt')?'signed':'£2.5k/w'}</small></button>
   </div></div>`:''}
   ${!closed&&!S.desk.length?`<button class="btn primary" data-act="close">${decided?'Wait for 23:00':'Let the clock run to 23:00'}</button>`:''}
   <div class="sec"><h3>The night so far</h3><div class="feed">${S.feed.map(f=>`<div><span class="t">${hhmm(f.t)}</span><span class="${f.hot?'hot':''}">${esc(f.txt)}</span></div>`).join('')}</div></div>
   ${design()}`;
}

function after(){
  const sea=S.sea||(S.sea=season());const v=verdict(sea);
  const d=sea.derby, you=sea.T.find(t=>t.n==='Harwick Town');
  const pass=v.tr>=50;
  const heads=[];
  const g1=sea.games[0];heads.push([`Matchday 1`,`${g1.us>g1.them?'Winning start':g1.us<g1.them?'Losing start':'Point on day one'}: ${g1.us}–${g1.them} v ${sea.names[g1.opp]}`]);
  if(d) heads.push([`Matchday 7 · the derby`, d.kofi?`Brennan scores for Stockfield. Booed all afternoon, he doesn't celebrate. ${d.us}–${d.them}.`:d.kofiFor?`Brennan scores in the derby. Mill End sings his name. ${d.us}–${d.them}.`:`Derby ends ${d.us}–${d.them}.`]);
  if(!S.deal) heads.push(['Kofi watch',`${sea.kofiGoals} goals in 12. ${S.motive==='ambition'?'His agent is already talking about January.':S.motive==='money'&&S.keep.type!=='contract'?'Body language: not great.':'Playing like a man at home.'}`]);
  else if(S.signed.length) heads.push(['New faces',`${S.signed.join(' and ')} in for Brennan. ${S.signed.includes('Lewin')?'Lewin: young, quick, raw.':'Hoyt: experienced, honest, slow.'}`]);
  return `<p class="kicker">After the window · September to November</p>
   <h1>What the night did</h1>
   ${heads.map(h=>`<div class="echo"><div class="mast"><span>Harwick Echo</span><span>${h[0]}</span></div><div class="head" style="font-size:22px">${esc(h[1])}</div></div>`).join('')}
   <div class="sec"><h3>Division Two after 12</h3><div class="tablewrap"><table class="t"><tr><th>#</th><th>Club</th><th>GD</th><th>Pts</th></tr>
    ${sea.T.slice(0,8).map((t,i)=>`<tr class="${t===you?'you':''}"><td>${i+1}</td><td>${t.n}</td><td>${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td><td>${t.p}</td></tr>`).join('')}
    ${sea.pos>8?`<tr class="you"><td>${sea.pos}</td><td>Harwick Town</td><td>${you.gf-you.ga}</td><td>${you.p}</td></tr>`:''}</table></div></div>
   <div class="sec"><h3>If the members voted tonight</h3>
    <div class="rows">${v.lines.map(l=>`<div class="row"><span><b>${l[0]}</b> ${esc(l[1])}</span><span class="r ${l[2]>0?'good':l[2]<0?'bad':'muted'}">${l[2]>0?'+':''}${l[2]||'·'}</span></div>`).join('')}</div>
    <div class="echo"><div class="head ${pass?'good':'bad'}">${v.tr}% for · ${pass?'You would survive':'You would be voted out'}</div><p class="muted">You need 50% at the ALV in May. ${pass?'Seven months to go.':'Seven months to win them back.'}</p></div>
   </div>
   <div class="rows"><div class="row"><span>Cash</span><span class="r">${money(S.cash)}</span></div><div class="row"><span>Wage bill / turnover</span><span class="r">${Math.round(S.wage/S.turn*100)}%</span></div><div class="row"><span>What Kofi really wanted</span><span class="r">${{money:'a proper wage',ambition:'a bigger club',home:'to stay home'}[S.motive]}</span></div><div class="row"><span>Was ${CALDER}'s bid real?</span><span class="r">${S.calderReal?'yes':'no, a bluff'}</span></div></div>
   <div class="btns"><button class="btn primary" data-act="again">Another night <small>new seed</small></button><button class="btn" data-act="replay">Replay night #${seed}</button></div>
   ${design()}`;
}
function design(){return `<details class="design"><summary>Ontwerpnotitie (voor de eigenaar)</summary><p>Vult §14 <b>Selectie en markt × gebeurtenis</b> (transferverzoek ✗→✓) en <b>Mensen buiten de club × gebeurtenis</b> (pers ✗→~). Voorzitterswerk: je onderhandelt niet, je beslist of, aan wie en wat je zegt. Tijd is de enige schaarste (MB-12): elk gesprek kost minuten en de klok stopt bij de pers en het ultimatum (MB-32). Onzekerheid: het motief van de speler, de bluf van de makelaar en de limiet van de rivaal zijn verborgen en per seed anders. Gevolg met tijdstempel in de krant en bij de leden (bijbel §3 ‘Gevolg’).</p></details>`;}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,arg=b.dataset.arg;
  if(a==='start'){S.screen='night';render();return;}
  if(a==='do'){act(arg);return;}
  if(a==='dismiss'){S.desk=S.desk.filter(d=>d!=='ultimatum');advance(5);render();return;}
  if(a==='after'){S.screen='after';render();scrollTo(0,0);return;}
  if(a==='again'){seed=Math.floor(Math.random()*99999)+1;location.hash='seed'+seed;init();render();scrollTo(0,0);return;}
  if(a==='replay'){init();render();scrollTo(0,0);return;}
  if(['counter'].includes(a)){decide('counter',+arg);return;}
  decide(a,arg);
});
init();render();
</script>
</body></html>
