<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The New Stand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="slices.css">
<style>
:root{--club:#1d4e89}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:8px 12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--mono);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.votes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.vote{aspect-ratio:1;max-width:100%;border:2px solid var(--line);border-radius:4px;display:grid;place-items:center;font:800 16px var(--display)}
.vote.y{background:var(--good);border-color:var(--good);color:var(--bg)}
.vote.n{background:var(--bad);border-color:var(--bad);color:var(--bg)}
</style>
</head><body>
<div class="wrap">
  <div class="bar"><b>Ashby Mill FC</b><span>Div Three</span><span id="barCash" class="num"></span><span class="clock" id="barClock"></span></div>
  <a class="back" href="./">← All slices</a>
  <main id="app" class="stack" style="margin-top:14px"></main>
</div>
<script src="slices.js"></script>
<script>
const {rng,money,wait,clamp,seedFromUrl,esc}=NM;
let seed=seedFromUrl(),R,S,running=false;
const app=document.getElementById('app');
const RESERVE=4*28000;
const PLANS={
  patch:{name:'Patch the East Stand',cost:380000,weeks:8,cap:6200,council:false,upkeep:1500,
    blurb:'New timber, new barriers, same 1931 stand. Quick and cheap. The inspector comes back in two years.'},
  new:{name:'Build a new East Stand',cost:1600000,weeks:22,cap:7400,council:true,upkeep:2500,
    blurb:'2,800 seats with a cantilever roof. Bars underneath. Needs planning permission.'},
  move:{name:'Leave Mill Lane',cost:5200000,offset:2400000,weeks:30,cap:11000,council:true,upkeep:6000,
    blurb:'An 11,000 ground at Cotter\'s Field. A developer pays £2.4m for Mill Lane. Two seasons of growth in one move. You ground-share at Holme Bridge while it is built.'},
};
const COUNCILLORS=[
  ['Ames','parking'],['Bhatt','noise'],['Corrigan','heritage'],['Dunmore','jobs'],['Ellery','lights'],
  ['Fosse','parking'],['Grieve','jobs'],['Hallam','noise'],['Iqbal','youth']];
const CONCESSIONS={
  park:{name:'Matchday park & ride',cost:90000,hits:['parking'],note:'£90k'},
  curfew:{name:'No kick-offs after 19:45',cost:0,season:-25000,hits:['noise'],note:'−£25k a season'},
  pitch:{name:'Community 3G pitch for schools',cost:160000,hits:['youth','jobs'],note:'£160k'},
  leds:{name:'Shielded LED floodlights',cost:70000,hits:['lights'],note:'£70k'},
  arch:{name:'Keep the 1931 turnstile arch',cost:25000,hits:['heritage'],note:'£25k'},
};

function init(){
  R=rng(seed);
  S={screen:'letter',week:0,cash:620000,trust:57,cap:4100,plan:null,
    fund:{cash:0,loan:0,naming:false,shares:false},loanRate:.075,debt:0,
    conc:{},council:null,lean:COUNCILLORS.map(()=>.25+R()*.5),votes:[],
    progress:0,overrun:0,delay:0,events:[],feed:[],said:null,standName:null,
    shareYield:.45+R()*.85,gateWeekly:0,season:[],done:{},roofCut:false,appeal:false,
    evWeeks:{steel:R.int(4,6),culvert:R.int(8,10),press:R.int(11,13),rent:R.int(15,17)}};
}
const P=()=>PLANS[S.plan];
const need=()=>P().cost-(P().offset||0)+Object.keys(S.conc).reduce((a,k)=>a+CONCESSIONS[k].cost,0);
const raised=()=>S.fund.cash+S.fund.loan+(S.fund.naming?600000:0)+(S.fund.shares?400000:0);
const gate=(cap)=>Math.round(cap*.82*14); // 82% full at £14 average
function log(txt,hot){S.feed.unshift({w:S.week,txt,hot});}

/* ---------- ascii stand ---------- */
function art(p,full){
  const W=36,line=(c)=>' '+c.repeat(W)+' ';
  const rows=[];
  const crane= p<.95&&p>0?['        |=========+',`        |         ${p>.5?'#':'|'}`,'        |','        |']:['','','',''];
  if(full){rows.push(' '+'_'.repeat(W)+' ');rows.push('/'+'#'.repeat(W)+'\\');}
  else if(p>=.85){rows.push(' '+'_'.repeat(W)+' ');rows.push('/'+(S.roofCut?' ':'=').repeat(W)+'\\');}
  else{rows.push(crane[0]);rows.push(crane[1]);}
  const tiers=4;
  for(let i=0;i<tiers;i++){
    const t=(i+1)/tiers;
    let c=' ';
    if(full) c= (i%2? 'o':'O');
    else if(p>=.6+t*.25) c=':';
    else if(p>=.25+t*.3) c='|';
    else c=' ';
    let s=c==='|'?' '+Array.from({length:W},(_,k)=>k%4===0?'|':' ').join('')+' ':line(c);
    if(full&&i===0) s=' '+'o'.repeat(6)+'ASHBY'+'o'.repeat(W-11-4)+'MILL'+'o'.repeat(6)+' ';
    rows.push(s.slice(0,W+2));
  }
  rows.push(p>=.15||full?' '+'▀'.repeat(W)+' ':' '+'.'.repeat(W)+' ');
  rows.push(' '+'~'.repeat(W)+' ');
  rows.push('  pitch');
  return rows.join('\n');
}

/* ---------- the books ---------- */
function weekly(){ // one week of club money while building
  const home=S.week%2===0;
  let g=0;
  if(home){
    if(S.plan==='move') g=Math.round(gate(4100)*.45); // ground-share at Holme Bridge
    else g=gate(S.cap);
  }
  const interest=Math.round(S.debt*S.loanRate/52);
  S.cash+=g-6000-interest;S.gateWeekly=g||S.gateWeekly;
  return {home,g,interest};
}

/* ---------- build events: the clock stops ---------- */
function pendingEvent(){
  const w=S.week,ev=S.evWeeks,d=S.done;
  if(!d.steel&&w>=ev.steel) return 'steel';
  if(S.fund.shares&&!d.shares&&w>=6) return 'shares';
  if(S.plan!=='patch'&&!d.culvert&&w>=ev.culvert) return 'culvert';
  if(!d.press&&w>=ev.press&&S.plan!=='patch') return 'press';
  if(S.plan==='move'&&!d.rent&&w>=ev.rent) return 'rent';
  if(S.progress>=1&&!d.name) return 'name';
  return null;
}
function totalWeeks(){return P().weeks+S.delay;}
async function run(){
  if(running) return; running=true;
  while(S.screen==='build'){
    const ev=pendingEvent(); if(ev){S.event=ev;break;}
    if(S.progress>=1){break;}
    S.week++;const w=weekly();
    S.progress=clamp(S.week/totalWeeks(),0,1);
    if(w.home) log(`Home game: ${money(w.g)} on the gate${S.plan==='move'?' (ground-share, 45% of normal)':` (capacity ${S.cap.toLocaleString('en-GB')})`}.`);
    render(); await wait(260);
  }
  running=false; render();
}
function resolve(ev,pick){
  S.done[ev]=1;S.event=null;
  const cost=(n)=>{S.overrun+=n;};
  if(ev==='steel'){
    const extra=S.plan==='patch'?60000:Math.round(P().cost*.18);
    if(pick==='cash'){S.cash-=extra;cost(extra);log(`Paid ${money(extra)} from cash for the ${S.plan==='patch'?'dry rot':'steel rise'}.`,true);}
    if(pick==='loan'){S.debt+=extra;cost(extra);log(`Loan extended by ${money(extra)}.`,true);}
    if(pick==='roof'){S.roofCut=true;S.trust-=4;log(`Roof dropped from the design. Members: "We'll get wet for a hundred years."`,true);}
  }
  if(ev==='shares'){
    const got=Math.round(400000*S.shareYield/1000)*1000;
    const gap=400000-got;
    if(gap>0){S.debt+=gap;S.loanRate=Math.max(S.loanRate,.09);log(`Share issue raised ${money(got)}. Short ${money(gap)}: covered by a bank loan at 9%.`,true);}
    else{S.cash+=-gap;log(`Share issue oversubscribed: ${money(got)}! ${money(-gap)} extra in the bank.`,true);}
    S.trust+=gap>0?3:7;S.shareGot=got;
  }
  if(ev==='culvert'){
    if(pick==='fix'){S.cash-=85000;cost(85000);log('Culvert fixed fast: £85k.',true);}
    else{S.delay+=3;log('Three weeks lost to a Victorian culvert.',true);}
  }
  if(ev==='press'){S.said=pick;if(pick==='open'){S.trust-=2;log(`To the Echo: "We are ${money(S.overrun)} over. Here is why."`);}else log('To the Echo: "On time and on budget."');}
  if(ev==='rent'){
    if(pick==='pay'){S.cash-=30000;log('Paid Holme Bridge the extra £30k rent.',true);}
    else{S.trust-=3;log('Home games move to Corby for the rest of the build. Gates fall further.',true);}
  }
  if(ev==='name'){S.standName=pick;S.screen='open';}
  render(); if(S.screen==='build') run();
}

/* ---------- council vote ---------- */
function voteProb(i){
  const [,concern]=COUNCILLORS[i];let p=S.lean[i]+(S.appeal?.1:0);
  for(const k in S.conc) if(CONCESSIONS[k].hits.includes(concern)) p+=.35;
  if(S.plan==='move'&&(concern==='heritage'||concern==='parking')) p-=.15;
  if(S.plan==='move'&&concern==='jobs') p+=.2;
  return clamp(p,.03,.97);
}
function band(p){return p>.62?['likely yes','good']:p<.38?['likely no','bad']:['undecided','gold'];}
async function holdVote(){
  S.votes=[];S.screen='vote';render();
  const r=rng(seed*13+(S.appeal?99:1));
  for(let i=0;i<9;i++){await wait(550);S.votes.push(r()<voteProb(i));render();}
  const yes=S.votes.filter(Boolean).length;
  S.council=yes>=5;
  log(`Planning committee: ${yes}–${9-yes}. ${S.council?'Permission granted.':'Refused.'}`,true);
  render();
}
function payConcessions(){
  for(const k in S.conc){S.cash-=CONCESSIONS[k].cost;}
}
function startBuild(){
  // money in
  S.cash-=S.fund.cash; S.debt+=S.fund.loan;
  const surplus=raised()-(P().cost-(P().offset||0)); if(surplus>0){S.cash+=surplus;log(`${money(surplus)} more raised than needed goes back in the bank.`);}
  if(S.fund.naming){S.trust-=7;}
  if(S.plan==='move'){S.trust-=6;}
  if(S.plan==='patch'){S.trust+=2;}
  payConcessions();
  if(S.conc.pitch) S.trust+=3;
  S.screen='build';log(`Work starts: ${P().name}. ${totalWeeks()} weeks.`,true);render();run();
}

/* ---------- final verdict ---------- */
function finale(){
  const cap=P().cap, before=gate(4100), after=gate(cap)*(S.plan!=='patch'?1.08:1); // new stands sell more bars and boxes
  const lines=[];let tr=S.trust;
  lines.push(['Mill Lane regulars',S.plan==='move'?'"We left Mill Lane. I was born two streets away."':S.plan==='patch'?'"Same old stand. Ours."':'"A proper stand at Mill Lane at last."',S.plan==='move'?-6:S.plan==='patch'?2:4]);
  if(S.plan==='new') tr+=4;
  if(S.fund.naming) lines.push(['Supporters\' Trust',S.standName==='brightwell'?'"The Brightwell Kitchens Stand. Says it all."':'',-7]);
  if(S.fund.shares) lines.push(['Supporters\' Trust',`"${money(S.shareGot||0)} raised by fans. We own a bit of this club now."`,S.shareGot>=400000?7:3]);
  if(S.conc.pitch) lines.push(['Schools',`"Two hundred kids a week on the new pitch."`,3]);
  if(S.said==='budget'&&S.overrun>0){tr-=6;lines.push(['The Echo',`"'On time and on budget.' It was ${money(S.overrun)} over."`,-6]);}
  if(S.said==='open') lines.push(['The Echo','"At least the chairman told us the truth about the overrun."',-2]);
  if(S.standName==='crane'){tr+=3;lines.push(['Old Boys','"The Ada Crane Stand. She\'d have loved it."',3]);}
  if(S.roofCut) lines.push(['Old Boys','"No roof. In Ashby. In February."',-4]);
  const upkeep=P().upkeep*52, interest=Math.round(S.debt*S.loanRate), naming=S.fund.naming?150000:0, curfew=S.conc.curfew?25000:0;
  const homeGames=23, gain=Math.round((after-before)*homeGames);
  const net=gain-upkeep-interest-curfew;
  const years=[0,1,2,3,4,5].map(y=>S.cash+net*y-(y>=1?Math.round(S.debt/10)*y:0));
  return {cap,before,after:Math.round(after),lines,tr:clamp(tr,5,95),upkeep,interest,gain,net,years,curfew};
}

/* ---------- render ---------- */
function bar(){document.getElementById('barCash').textContent=money(S.cash)+' cash';document.getElementById('barClock').textContent=S.screen==='build'?`Build week ${S.week}/${totalWeeks()}`:S.screen==='open'?'Opening day':'July';}
function who(face,name,role,line){return `<div class="who"><div class="face">${face}</div><div><div class="name">${name}</div><div class="role">${role}</div>${line?`<q>${line}</q>`:''}</div></div>`;}
function books(){
  return `<div class="meters"><div class="meter"><span>Cash</span><b class="${S.cash<RESERVE?'bad':''}">${money(S.cash)}</b></div>
   <div class="meter"><span>Debt</span><b>${money(S.debt)}</b><i>${(S.loanRate*100).toFixed(1)}%</i></div>
   <div class="meter"><span>Capacity</span><b>${S.cap.toLocaleString('en-GB')}</b></div>
   <div class="meter"><span>Members</span><b>${S.trust}%</b></div></div>`;
}
function design(){return `<details class="design"><summary>Ontwerpnotitie (voor de eigenaar)</summary><p>Vult §14 <b>Infrastructuur × gebeurtenis</b> (vergunning, overschrijding ✗→✓), <b>Mensen buiten de club × gebeurtenis</b> (gemeente ✗→✓, pers ~) en <b>Inkomsten × gebeurtenis</b> (sponsorbod). Eén groot project, drie verdedigbare plannen, vier geldbronnen met elk een prijs (rente, ledenvertrouwen, onzekere opbrengst). De klok loopt per week en stopt bij elk voorval (MB-32). Gevolg zichtbaar in de tekening, de recette per thuiswedstrijd en het oordeel van de leden. Geen upgrade-meter: het stadion wordt anders (MB-08).</p></details>`;}

function render(){
  bar();
  const s=S.screen;
  if(s==='letter') app.innerHTML=`
   <p class="kicker">Slice B · Infrastructure × event</p>
   <h1>The new stand</h1>
   <p class="lead">Monday, 3 July. A letter from the borough safety officer is on your desk.</p>
   <div class="echo"><div class="mast"><span>Borough of Ashby</span><span>Ref. SGSA/114</span></div>
    <p>Following inspection, the East Stand at Mill Lane (built 1931) is closed to spectators with immediate effect. Timber decay in the rear terraces and roof trusses. Licensed capacity is reduced from <b>6,200</b> to <b>4,100</b>.</p></div>
   <pre class="art" aria-label="Mill Lane, East Stand closed">${art(0)}\n  EAST STAND: CLOSED</pre>
   <div class="rows">
    <div class="row"><span>Gate per home game, before</span><span class="r">${money(gate(6200))}</span></div>
    <div class="row"><span>Gate per home game, now</span><span class="r bad">${money(gate(4100))}</span></div>
    <div class="row"><span>Lost over a season (23 home games)</span><span class="r bad">${money((gate(6200)-gate(4100))*23)}</span></div>
   </div>
   ${who('MR','Marion Reilly','Commercial & grounds','The East Stand is where the Old Boys have stood since their dads took them. Whatever we do, they will judge us on it.')}
   <button class="btn primary" data-act="toPlan">Call the board together</button>
   <p class="muted" style="font-size:12px">Club #${seed}. Councillors, share uptake and setbacks change per club.</p>`;

  if(s==='plan') app.innerHTML=`${books()}<h2>Three plans on the table</h2>
   ${Object.entries(PLANS).map(([k,p])=>`<div class="choice"><b>${p.name}</b><p>${p.blurb}</p>
     <div class="rows"><div class="row"><span>Cost</span><span class="r">${money(p.cost)}${p.offset?` (−${money(p.offset)} from Mill Lane)`:''}</span></div>
     <div class="row"><span>Build</span><span class="r">${p.weeks} weeks</span></div>
     <div class="row"><span>Capacity after</span><span class="r">${p.cap.toLocaleString('en-GB')}</span></div>
     <div class="row"><span>Gate per home game after</span><span class="r">${money(gate(p.cap)*(k==='patch'?1:1.08))}</span></div>
     <div class="row"><span>Upkeep</span><span class="r">+${money(p.upkeep)}/week</span></div>
     <div class="row"><span>Planning permission</span><span class="r">${p.council?'needed':'no'}</span></div></div>
     <button class="btn" data-act="plan" data-arg="${k}">Choose this plan</button></div>`).join('')}
   ${design()}`;

  if(s==='fund'){
    const n=need(),r=raised(),avail=Math.max(0,S.cash-RESERVE-Object.keys(S.conc).reduce((a,k)=>a+CONCESSIONS[k].cost,0));
    const chip=(key,val,label)=>`<button class="chip" data-act="fund" data-k="${key}" data-v="${val}" aria-pressed="${S.fund[key]===val}">${label}</button>`;
    app.innerHTML=`${books()}<h2>Pay for it</h2><p class="lead">${P().name}: you need <b>${money(n)}</b>. You have raised <b class="${r>=n?'good':'bad'}">${money(r)}</b>.</p>
     <div class="prog" aria-hidden="true"><i style="width:${Math.min(100,r/n*100)}%"></i></div>
     <div class="sec"><h3>Club cash</h3><p class="muted">Keep four weeks of wages (${money(RESERVE)}) in the bank. Available: ${money(avail)}.</p>
      <div class="chips">${chip('cash',0,'£0')}${[150000,300000,450000].filter(v=>v<=avail).map(v=>chip('cash',v,money(v))).join('')}</div></div>
     <div class="sec"><h3>Bank loan · 7.5%</h3><p class="muted">Ten years. Interest is paid every week, win or lose.</p>
      <div class="chips">${[0,500000,1000000,2000000,3000000].map(v=>chip('loan',v,v?money(v)+` · ${money(v*.075/52)}/w`:'£0')).join('')}</div></div>
     <div class="sec"><h3>Naming rights</h3>${who('BK','Lee Brightwell','Brightwell Kitchens','£150k a year for five years, paid up front. My name on the stand, in letters you can see from the bypass.')}
      <div class="chips"><button class="chip" data-act="tog" data-k="naming" aria-pressed="${S.fund.naming}">${S.fund.naming?'Accepted: +£600k · −7 members':'Accept: +£600k · −7 members'}</button></div></div>
     <div class="sec"><h3>Supporters' share issue</h3>${who('ST','Jas Kaur','Supporters\' Trust','Target £400k at £100 a share. I can\'t promise we\'ll hit it. If we do, the fans own part of this.')}
      <div class="chips"><button class="chip" data-act="tog" data-k="shares" aria-pressed="${S.fund.shares}">${S.fund.shares?'Launched: ~£400k, uncertain':'Launch: ~£400k, result in week 6'}</button></div>
      <p class="note">If the issue falls short, the gap becomes a bank loan at 9%.</p></div>
     <button class="btn primary" data-act="toCouncil" ${r>=n?'':'disabled'}>${P().council?'Submit the planning application':'Start the work'}</button>
     <button class="btn" data-act="toPlan">Back to the plans</button>`;
  }

  if(s==='council'){
    app.innerHTML=`${books()}<h2>Planning committee · Thursday 19:00</h2>
     <p class="lead">Nine councillors. You need five. Each has one worry. You can buy goodwill, but every concession costs money or matchday income.</p>
     <div class="rows">${COUNCILLORS.map(([n,c],i)=>{const [b,cls]=band(voteProb(i));return `<div class="row"><span>Cllr ${n} <span class="muted">· ${c}</span></span><span class="r ${cls}">${b}</span></div>`;}).join('')}</div>
     <div class="sec"><h3>Concessions</h3><div class="btns">${Object.entries(CONCESSIONS).map(([k,c])=>`<button class="btn" data-act="conc" data-k="${k}" aria-pressed="${!!S.conc[k]}">${S.conc[k]?'✓ ':''}${c.name}<small>${c.note} · ${c.hits.join(', ')}</small></button>`).join('')}</div>
     <p class="muted">Concession costs come out of cash on top of the build: ${money(Object.keys(S.conc).reduce((a,k)=>a+CONCESSIONS[k].cost,0))}. ${S.cash-S.fund.cash-Object.keys(S.conc).reduce((a,k)=>a+CONCESSIONS[k].cost,0)<RESERVE?'<b class="bad">That takes you below your wage reserve.</b>':''}</p></div>
     <button class="btn primary" data-act="vote">Go to the vote</button>${design()}`;
  }

  if(s==='vote'){
    const yes=S.votes.filter(Boolean).length,doneV=S.votes.length===9;
    app.innerHTML=`<h2>The vote</h2><div class="votes">${COUNCILLORS.map(([n],i)=>`<div class="vote ${i<S.votes.length?(S.votes[i]?'y':'n'):''}" title="Cllr ${n}">${i<S.votes.length?(S.votes[i]?'Y':'N'):n[0]}</div>`).join('')}</div>
     <p class="lead num">${yes} for · ${S.votes.length-yes} against</p>
     ${doneV?(S.council?`<div class="echo"><div class="mast"><span>Ashby Echo</span><span>Friday</span></div><div class="head">Green light for Ashby Mill</div><p>${yes}–${9-yes}. ${Object.keys(S.conc).length?'Concessions: '+Object.keys(S.conc).map(k=>CONCESSIONS[k].name.toLowerCase()).join(', ')+'.':'No concessions offered.'}</p></div><button class="btn primary" data-act="build">Start the work</button>`
      :`<div class="echo"><div class="mast"><span>Ashby Echo</span><span>Friday</span></div><div class="head bad">Stand plan thrown out</div><p>${yes}–${9-yes}. Residents cheer in the gallery.</p></div>
       <div class="btns">${!S.appeal?`<button class="btn" data-act="appeal">Appeal <small>£40k fees, 6 weeks later</small></button>`:''}<button class="btn" data-act="downscale">Patch the old stand instead <small>no permission needed</small></button></div>`):''}`;
  }

  if(s==='build'){
    const ev=S.event;
    let evHtml='';
    if(ev==='steel') evHtml=S.plan==='patch'?evBox('Dry rot in the roof beams','Site foreman','Worse than the survey said. £60k more, or we can\'t sign it off.',[['cash','Pay £60k from cash'],['loan','Add it to the loan']])
      :evBox(`Steel price up 18%`,'Main contractor',`Our supplier just repriced. That's ${money(Math.round(P().cost*.18))} on the frame.`,[['cash','Pay from cash'],['loan','Extend the loan'],['roof','Drop the roof · −4 members']]);
    if(ev==='shares') evHtml=evBox('Share issue closes','Jas Kaur, Supporters\' Trust','The count is in.',[['ok','Read the result']]);
    if(ev==='culvert') evHtml=evBox('A Victorian culvert under the north end','Site foreman','An old brick drain nobody had on a map. Fix it fast or work around it.',[['fix','Fix it fast · £85k'],['wait','Work around it · 3 weeks later']]);
    if(ev==='press') evHtml=evBox('The Echo is asking','Nina Coyle, Ashby Echo',`I hear the stand is over budget. Is it?${S.overrun?'':' (So far it isn\'t.)'}`,[['open',S.overrun?`"We're ${money(S.overrun)} over. Here's why." · −2 now`:'"Here are the books." · −2 now'],['budget','"On time and on budget."']]);
    if(ev==='rent') evHtml=evBox('Holme Bridge raise the rent','Holme Bridge secretary','Our pitch is taking a beating. £30k more for the rest of the season, or find somewhere else.',[['pay','Pay £30k'],['corby','Move to Corby · −3 members']]);
    if(ev==='name') evHtml=S.fund.naming?evBox('Opening day','Lee Brightwell','My letters went up this morning.',[['brightwell','Open the Brightwell Kitchens Stand']])
      :evBox('Name the stand','Marion Reilly','It is yours to name.',[['crane','The Ada Crane Stand · our 1950s captain'],['east','Just "the East Stand"']]);
    app.innerHTML=`${books()}<pre class="art" aria-label="Build progress">${art(S.progress)}\n  ${P().name.toUpperCase()} · ${Math.round(S.progress*100)}%</pre>
     <div class="prog"><i style="width:${S.progress*100}%"></i></div>
     <div class="rows"><div class="row"><span>Over budget</span><span class="r ${S.overrun?'bad':''}">${money(S.overrun)}</span></div><div class="row"><span>Delay</span><span class="r">${S.delay} weeks</span></div></div>
     ${evHtml}
     ${!ev&&!running&&S.progress<1?`<button class="btn primary" data-act="run">Continue</button>`:''}
     <div class="sec"><h3>On site</h3><div class="feed">${S.feed.map(f=>`<div><span class="t">wk ${f.w}</span><span class="${f.hot?'hot':''}">${esc(f.txt)}</span></div>`).join('')}</div></div>`;
  }

  if(s==='open'){
    const f=finale();S.cap=f.cap;const pass=f.tr>=50;
    const nm={brightwell:'The Brightwell Kitchens Stand',crane:'The Ada Crane Stand',east:'The East Stand'}[S.standName];
    const max=Math.max(...f.years.map(Math.abs),1);
    app.innerHTML=`${books()}<p class="kicker">Opening day · ${S.plan==='move'?'Cotter\'s Field':'Mill Lane'}</p><h1>${S.plan==='move'?'Cotter\'s Field opens':esc(nm)}</h1>
     <pre class="art" aria-label="Full stand">${art(1,true)}\n  ${f.cap.toLocaleString('en-GB')} · SOLD OUT</pre>
     <div class="rows"><div class="row"><span>Gate per home game</span><span class="r">${money(f.before)} → <b class="good">${money(f.after)}</b></span></div>
      <div class="row"><span>Extra gate per season</span><span class="r good">+${money(f.gain)}</span></div>
      <div class="row"><span>Upkeep per season</span><span class="r bad">−${money(f.upkeep)}</span></div>
      <div class="row"><span>Interest per season</span><span class="r bad">−${money(f.interest)}</span></div>
      ${f.curfew?`<div class="row"><span>Curfew (no late kick-offs)</span><span class="r bad">−${money(f.curfew)}</span></div>`:''}
      <div class="row"><span><b>Net per season</b></span><span class="r ${f.net>=0?'good':'bad'}"><b>${f.net>=0?'+':''}${money(f.net)}</b></span></div>
      <div class="row"><span>Over budget in the end</span><span class="r">${money(S.overrun)}</span></div></div>
     <div class="sec"><h3>Cash, next five seasons (gate gain minus upkeep, interest and repayments)</h3>
      <svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Cash projection">${f.years.map((v,i)=>{const h=Math.abs(v)/max*50;return `<rect x="${12+i*48}" y="${v>=0?60-h:60}" width="30" height="${Math.max(1,h)}" fill="${v>=0?'var(--accent)':'var(--bad)'}"/><text x="${27+i*48}" y="${v>=0?Math.max(10,54-h):Math.min(116,72+h)}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${money(v)}</text><text x="${27+i*48}" y="${v>=0?74:52}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${i?'Y'+i:'now'}</text>`;}).join('')}<line x1="0" y1="60" x2="300" y2="60" stroke="var(--line)"/></svg></div>
     <div class="sec"><h3>The members on the stand</h3><div class="rows">${f.lines.filter(l=>l[1]).map(l=>`<div class="row"><span><b>${l[0]}</b> ${esc(l[1])}</span><span class="r ${l[2]>0?'good':l[2]<0?'bad':'muted'}">${l[2]>0?'+':''}${l[2]}</span></div>`).join('')}</div>
      <div class="echo"><div class="head ${pass?'good':'bad'}">${f.tr}% for · ${pass?'Re-elected':'Voted out'}</div><p class="muted">If the ALV were held on opening day.</p></div></div>
     <div class="btns"><button class="btn primary" data-act="again">Another club <small>new seed</small></button><button class="btn" data-act="replay">Replay club #${seed}</button></div>${design()}`;
  }
}
function evBox(title,from,line,opts){return `<div class="sec"><h2 class="bad">${esc(title)}</h2>${who(from.split(' ').map(w=>w[0]).join('').slice(0,2),from,'The clock is stopped',esc(line))}<div class="btns">${opts.map(([k,l])=>`<button class="btn" data-act="ev" data-arg="${k}">${esc(l)}</button>`).join('')}</div></div>`;}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='toPlan'){S.screen='plan';}
  if(a==='plan'){S.plan=b.dataset.arg;S.screen='fund';S.fund={cash:0,loan:0,naming:false,shares:false};}
  if(a==='fund'){S.fund[b.dataset.k]=+b.dataset.v;}
  if(a==='tog'){S.fund[b.dataset.k]=!S.fund[b.dataset.k];}
  if(a==='toCouncil'){if(P().council){S.screen='council';}else{startBuild();return;}}
  if(a==='conc'){const k=b.dataset.k;if(S.conc[k])delete S.conc[k];else S.conc[k]=1;}
  if(a==='vote'){holdVote();return;}
  if(a==='build'){startBuild();return;}
  if(a==='appeal'){S.appeal=true;S.cash-=40000;S.delay+=6;log('Appeal lodged: £40k, six weeks.',true);S.screen='council';}
  if(a==='downscale'){const keep={...S.fund};S.plan='patch';S.conc={};S.fund=keep;S.screen='fund';}
  if(a==='run'){run();return;}
  if(a==='ev'){resolve(S.event,b.dataset.arg);return;}
  if(a==='again'){seed=Math.floor(Math.random()*99999)+1;location.hash='seed'+seed;init();}
  if(a==='replay'){init();}
  render();
  if(['toPlan','plan','toCouncil','again','replay','build','downscale'].includes(a)) scrollTo(0,0);
});
init();render();
</script>
</body></html>
