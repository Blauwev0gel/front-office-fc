<title>Front Office Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a phone-width game home screen (390px) in three concepts; controls above, the phone below. */
:root{--bg:#f4d8cc;--paper:#f8e4da;--ink:#1f1715;--soft:#5b4842;--rule:rgba(31,23,21,.18);--club:#7a1e2b;--club2:#f4e9d8;--opp:#1d4ed8;--gold:#e9c46a;--good:#1d6b3c;--bad:#b3261e;
  --sky1:#bfd9ea;--sky2:#f6e7d6;--wall:#e9cdbf;--wood:#8a5a3c;--grass:#3f7a4a;
  --head:'Oswald',Impact,'Arial Narrow',sans-serif;--body:'Source Serif 4',Georgia,serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.18);--club:#a33447;--club2:#f4e9d8;--opp:#3b6fe0;--gold:#e9c46a;--good:#6fcf97;--bad:#ff8a80;--sky1:#1d2b3d;--sky2:#3a2a2a;--wall:#2e221e;--wood:#5a3a26;--grass:#2c5a36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.18);--club:#a33447;--club2:#f4e9d8;--opp:#3b6fe0;--gold:#e9c46a;--good:#6fcf97;--bad:#ff8a80;--sky1:#1d2b3d;--sky2:#3a2a2a;--wall:#2e221e;--wood:#5a3a26;--grass:#2c5a36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);margin:0}
.wrap{max-width:440px;margin:0 auto;padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.ctl{display:grid;gap:6px}.ctl small{font:600 11px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{min-height:44px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font:600 14px var(--head);letter-spacing:.03em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.idea{margin:0;font:italic 400 14px var(--body);color:var(--soft)}
/* the phone */
.phone{position:relative;width:100%;max-width:390px;margin:0 auto;height:760px;border:2px solid var(--ink);border-radius:28px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}.crest{width:30px;height:34px;flex:none}
.top b{font:italic 700 20px var(--head);letter-spacing:.01em}.top .wk{margin-left:auto;font:600 12px var(--head);background:var(--ink);color:var(--bg);border-radius:8px;padding:3px 8px}
.screen{flex:1;min-height:0;position:relative;overflow:hidden}
.go{margin:0 14px 10px;min-height:58px;border:2.5px solid var(--ink);border-radius:14px;background:var(--club);color:#fff;font:italic 700 20px var(--head);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.go small{font:600 13px var(--body);font-style:normal;opacity:.85}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1.5px solid var(--rule);padding-bottom:6px}
.tabs span{display:grid;place-items:center;min-height:48px;font:600 11px var(--head);color:var(--soft);letter-spacing:.03em}.tabs span.on{color:var(--ink)}
/* faces */
.face{width:var(--s,56px);height:var(--s,56px);border-radius:50%;border:2.5px solid var(--ink);background:#fff;overflow:hidden;flex:none}
.who{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink);cursor:pointer;min-width:64px;min-height:44px;padding:0}
.who small{font:600 11px var(--head);letter-spacing:.03em;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:1px 6px}
.bang{position:absolute;top:-4px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);color:#1f1715;font:700 13px/18px var(--head);text-align:center}
/* A: the office */
.office{position:absolute;inset:0}
.office svg.room{position:absolute;inset:0;width:100%;height:100%}
.hotspot{position:absolute;background:none;border:0;cursor:pointer;border-radius:12px}
.paperOn{position:absolute;left:28px;bottom:84px;width:150px;padding:8px 10px;background:#f7efe3;color:#1f1715;border:2px solid #1f1715;border-radius:4px;transform:rotate(-4deg);box-shadow:3px 3px 0 rgba(0,0,0,.25);text-align:left;cursor:pointer}
.paperOn small{display:block;font:700 9px var(--head);letter-spacing:.12em;border-bottom:1.5px double #1f1715;padding-bottom:2px;margin-bottom:3px}
.paperOn b{font:700 15px/1.1 var(--head)}
.door{position:absolute;right:14px;bottom:96px;display:flex;flex-direction:column;gap:8px;align-items:center}
.caption{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.caption .tag{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:6px 10px;max-width:70%}
.caption .tag b{display:block;font:italic 700 18px/1.1 var(--head)}.caption .tag span{font:400 12px var(--body);color:var(--soft)}
.caption .pos{background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 10px;text-align:center;font:700 18px/1 var(--head)}.caption .pos small{display:block;font:500 10px var(--head);letter-spacing:.06em;opacity:.8;margin-top:2px}
/* B: countdown */
.hero{margin:6px 14px 0;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;display:grid;grid-template-rows:auto auto}
.hero .sides{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:150px}
.hero .side{height:100%;display:grid;place-items:center;padding:14px 6px;color:#fff;text-align:center}
.hero .side b{font:700 22px/1 var(--head);letter-spacing:.02em}.hero .side small{display:block;font:500 12px var(--head);opacity:.9;margin-top:4px}
.hero .vs{font:italic 700 18px var(--head);padding:0 4px;color:var(--ink)}
.hero .meta{padding:10px 12px;background:var(--paper);display:grid;gap:2px}.hero .meta b{font:italic 700 20px var(--head)}.hero .meta span{font:400 14px var(--body);color:var(--soft)}
.derby{display:inline-block;background:var(--gold);color:#1f1715;font:700 12px var(--head);letter-spacing:.1em;padding:2px 8px;border-radius:6px;margin-bottom:2px}
.atdoor{margin:12px 14px 0}.atdoor h3,.cols h3{margin:0 0 8px;font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.row{display:flex;gap:10px}.empty{font:italic 400 14px var(--body);color:var(--soft);margin:0}
.strip{margin:12px 14px 0;display:flex;gap:10px;align-items:center;border-top:1.5px solid var(--rule);padding-top:10px;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);text-align:left;cursor:pointer;width:calc(100% - 28px)}
.strip b{font:700 15px var(--head)}.strip small{font:600 10px var(--head);letter-spacing:.12em;color:var(--soft);display:block}
/* C: front page */
.fp{margin:4px 14px 0;background:#f7efe3;color:#1f1715;border:2px solid var(--ink);border-radius:6px;padding:10px 12px 12px;box-shadow:4px 4px 0 var(--ink)}
.fp .mast{text-align:center;border-bottom:3px double #1f1715;padding-bottom:4px}.fp .mast b{font:700 20px/1 Georgia,serif;letter-spacing:.02em}.fp .mast small{display:block;font:600 9px var(--head);letter-spacing:.12em;color:#5b4842;margin-top:2px}
.fp h2{margin:8px 0 6px;font:700 30px/1 var(--head);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.fp .lead{display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(31,23,21,.3);padding-bottom:8px}
.fp .lead p{margin:0;font:italic 400 14px/1.35 Georgia,serif}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.col{background:none;border:0;border-left:1px solid rgba(31,23,21,.3);padding:0 0 0 6px;text-align:left;color:#1f1715;cursor:pointer;min-height:44px}
.col:first-child{border-left:0;padding-left:0}
.col small{display:block;font:700 9px var(--head);letter-spacing:.1em;text-transform:uppercase;color:#7a1e2b}.col b{display:block;font:700 15px/1.1 var(--head)}.col span{font:400 12px/1.3 Georgia,serif;color:#5b4842}
/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:2.5px solid var(--ink);border-radius:18px 18px 0 0;padding:14px 14px 16px;display:grid;gap:10px;box-shadow:0 -8px 24px rgba(0,0,0,.25);transform:translateY(0);transition:transform .25s ease}
.sheet[hidden]{display:none!important}
.sheet .hd{display:flex;gap:10px;align-items:center}.sheet .hd b{font:italic 700 18px var(--head)}.sheet .hd small{display:block;font:600 12px var(--body);color:var(--soft)}
.sheet p{margin:0;font:400 16px/1.4 var(--body)}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet .btns button{min-height:48px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);font:600 15px var(--head);cursor:pointer}.sheet .btns button.k{background:var(--ink);color:var(--bg)}
.note{font:400 13px/1.4 var(--body);color:var(--soft);margin:0}

/* D: the inbox */
.ib{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.ibh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.ibh b{display:block;font:italic 700 24px/1.05 var(--head)}.ibh span{font:400 13px var(--body);color:var(--soft)}
.ibh .pos{flex:none;text-align:right;font:700 20px/1 var(--head)}.ibh .pos small{display:block;font:500 11px var(--head);letter-spacing:.05em;color:var(--soft);margin-top:2px}
.sat{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);text-align:left;cursor:pointer;min-height:56px}
.sat .kit{display:flex}.sat .kit i{width:16px;height:30px;border:2px solid var(--ink);border-radius:4px}.sat .kit i+i{margin-left:-4px}
.sat b{display:block;font:700 16px var(--head)}.sat span{font:400 13px var(--body);color:var(--soft)}.sat em{margin-left:auto;font:700 11px var(--head);letter-spacing:.08em;font-style:normal;background:var(--gold);color:#1f1715;border-radius:6px;padding:2px 6px}
.grp h3{margin:0 0 6px;display:flex;justify-content:space-between;font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}.grp h3 i{font-style:normal}
.list{border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper)}
.msg{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;min-height:68px;border:0;border-top:1.5px solid var(--rule);background:none;color:var(--ink);text-align:left;cursor:pointer}
.msg:first-child{border-top:0}.msg .txt{flex:1;min-width:0}
.msg .from{display:flex;justify-content:space-between;gap:6px;font:700 14px var(--head);letter-spacing:.01em}.msg .from small{font:500 11px var(--head);color:var(--soft);white-space:nowrap}
.msg .subj{display:block;font:600 15px/1.25 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .prev{display:block;font:400 13px/1.3 var(--body);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.read .subj{font-weight:400}.msg.done{opacity:.6}
.dot{width:10px;height:10px;border-radius:50%;background:var(--club);flex:none}.dot.off{background:transparent}
.need .list{border-color:var(--club);box-shadow:0 3px 0 var(--club)}
.calm{margin:0;padding:12px;font:italic 400 14px var(--body);color:var(--soft);text-align:center}
.paperav{width:44px;height:44px;flex:none;border:2.5px solid var(--ink);border-radius:8px;background:#f7efe3;color:#1f1715;display:grid;place-items:center;font:700 13px Georgia,serif}
/* open message */
.open{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding:6px 14px 14px;gap:12px;overflow-y:auto}
.open .back{align-self:flex-start;min-height:44px;border:0;background:none;color:var(--ink);font:600 14px var(--head);cursor:pointer;padding:0}
.open .hd{display:flex;gap:12px;align-items:center}.open .hd b{display:block;font:italic 700 20px var(--head)}.open .hd small{font:600 12px var(--body);color:var(--soft)}
.open h2{margin:0;font:700 24px/1.15 var(--head);text-wrap:balance}
.open p{margin:0;font:400 17px/1.45 var(--body)}
.open .why{font:italic 400 14px var(--body);color:var(--soft);border-left:3px solid var(--club);padding-left:10px}
.ans{display:grid;gap:8px;margin-top:auto}
.ans button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font:600 16px var(--head);text-align:left;cursor:pointer}
.ans button small{font:500 12px var(--body);color:var(--soft);text-align:right}
.ans .left{font:italic 400 13px var(--body);color:var(--soft);text-align:center}
.reply{padding:12px;border:2px solid var(--good);border-radius:14px;font:400 15px var(--body)}

/* Depts: your people, then one page per department */
.dp{position:absolute;inset:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:12px}
.dp .ibh b{font-size:22px}
.person{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;min-height:72px;border:0;border-top:1.5px solid var(--rule);background:none;color:var(--ink);text-align:left;cursor:pointer}
.person:first-child{border-top:0}.person .txt{flex:1;min-width:0}
.person .dept{font:600 11px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.person b{display:block;font:700 16px var(--head)}
.person .line{display:block;font:400 13px/1.3 var(--body);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{flex:none;font:700 12px var(--head);letter-spacing:.04em;padding:3px 8px;border-radius:8px;border:1.5px solid currentColor}
.state.good{color:var(--good)}.state.mid{color:var(--soft)}.state.bad{color:var(--bad)}
.word{position:absolute;top:8px;left:44px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--ink)}
.pg{position:absolute;inset:0;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px}
.pg .hd{display:flex;gap:12px;align-items:center}.pg .hd b{display:block;font:italic 700 22px/1.1 var(--head)}.pg .hd small{display:block;font:600 12px var(--body);color:var(--soft)}
.verdict{border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:12px 14px;display:grid;gap:4px}
.verdict small{font:600 11px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}.verdict b{font:italic 700 24px var(--head)}.verdict b.good{color:var(--good)}.verdict b.bad{color:var(--bad)}
.back{align-self:flex-start;min-height:44px;border:0;background:none;color:var(--ink);font:600 14px var(--head);cursor:pointer;padding:0}
.verdict p{margin:0;font:400 15px/1.4 var(--body)}.verdict q{quotes:none;font:italic 400 14px var(--body);color:var(--soft)}
.sec2 h3{margin:0 0 6px;font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.work{border:2px solid var(--ink);border-radius:14px;background:var(--paper);overflow:hidden}
.work > div{padding:10px 12px;border-top:1.5px solid var(--rule)}.work > div:first-child{border-top:0}
.work b{display:block;font:700 15px var(--head)}.work span{font:400 13px var(--body);color:var(--soft)}
.bar{height:6px;border-radius:3px;background:var(--rule);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--club)}
.rowl{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:10px 12px;border:0;border-top:1.5px solid var(--rule);background:none;color:var(--ink);text-align:left;cursor:pointer}
.rowl:first-child{border-top:0}.rowl b{font:700 15px var(--head)}.rowl span{font:400 13px var(--body);color:var(--soft)}

/* department-specific content */
.kid{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1.5px solid var(--rule)}.kid:first-child{border-top:0}
.kid .txt{flex:1;min-width:0}.kid b{display:block;font:700 15px var(--head)}.kid span{font:400 13px var(--body);color:var(--soft)}
.stars{font:600 13px var(--head);letter-spacing:.02em;color:var(--ink);white-space:nowrap;text-align:right}.stars small{display:block;font:500 11px var(--body);color:var(--soft)}
.pill{font:700 11px var(--head);letter-spacing:.05em;padding:2px 7px;border-radius:7px;border:1.5px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)}.pill.bad{color:var(--bad)}.pill.mid{color:var(--soft)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{border:2px solid var(--ink);border-radius:12px;background:var(--paper);padding:10px 12px}
.kpi small{display:block;font:600 11px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}.kpi b{font:700 22px var(--head);font-variant-numeric:tabular-nums}.kpi span{display:block;font:400 12px var(--body);color:var(--soft)}
.form{display:flex;gap:4px}.form i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font:700 12px var(--head);font-style:normal;color:#fff}.form .W{background:var(--good)}.form .D{background:#8a8a8a}.form .L{background:var(--bad)}
.stand{display:flex;gap:6px;align-items:flex-end;height:64px;padding:8px 12px 10px}.stand i{flex:1;border:2px solid var(--ink);border-radius:4px 4px 0 0;background:var(--club);position:relative}.stand i em{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:600 10px var(--head);font-style:normal;color:var(--soft)}

/* rooms: depth by drill-down */
.room{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;padding:12px;min-height:64px;border:0;border-top:1.5px solid var(--rule);background:none;color:var(--ink);text-align:left;cursor:pointer}
.room:first-child{border-top:0}.room b{font:700 16px var(--head)}.room .val{grid-row:1 / span 2;grid-column:2;text-align:right;font:700 20px var(--head);font-variant-numeric:tabular-nums}.room .val small{display:block;font:500 11px var(--body);color:var(--soft)}
.room span{font:400 13px/1.3 var(--body);color:var(--soft)}.room .flag{color:var(--bad)}.room .ok{color:var(--good)}
.rp{position:absolute;inset:0;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px}
.rp h2{margin:0;font:italic 700 24px/1.1 var(--head)}.rp .lede{margin:0;font:400 15px/1.4 var(--body);color:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font:400 13px var(--body)}.tbl th{text-align:left;font:600 11px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:6px 4px;border-bottom:1.5px solid var(--rule)}.tbl td{padding:8px 4px;border-bottom:1px solid var(--rule)}.tbl td.r,.tbl th.r{text-align:right}
.tl2{border-left:2px solid var(--rule);margin-left:6px;padding-left:12px;display:grid;gap:10px}.tl2 div{position:relative}.tl2 div::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--club)}.tl2 b{display:block;font:700 14px var(--head)}.tl2 span{font:400 13px var(--body);color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:600 12px var(--head);padding:4px 8px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper)}
.spark{width:100%;height:56px}

/* E: the inbox, dressed as football */
.ex>*{flex:none}.mpitch .stk{display:block}.from .new{margin-right:auto}
.ex{position:absolute;inset:0;overflow-y:auto;padding:0 0 14px;display:flex;flex-direction:column;gap:12px}
.kitband{height:8px;background:repeating-linear-gradient(90deg,var(--club) 0 18px,var(--club2) 18px 26px);border-bottom:2px solid var(--ink)}
.exh{display:flex;gap:12px;align-items:center;padding:0 14px}
.exh .bigcrest{width:52px;height:58px;flex:none}
.exh .tt{flex:1}.exh .tt small{font:600 11px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}.exh .tt b{display:block;font:italic 700 24px/1.05 var(--head)}
.board{margin:0 14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:stretch}
.score{background:#15110f;color:#f8e9b0;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;text-align:center;min-width:132px;box-shadow:inset 0 0 0 2px #2b231f}
.score small{display:block;font:600 9px var(--head);letter-spacing:.14em;color:#b9a77a}.score b{display:block;font:700 26px/1.1 var(--head);letter-spacing:.06em;font-variant-numeric:tabular-nums}.score b i{font-style:normal;color:#f2c14e}
.fm{display:flex;gap:3px;justify-content:center;margin-top:3px}.fm i{width:16px;height:16px;border-radius:3px;font:700 10px/16px var(--head);font-style:normal;color:#fff}.fm .W{background:#2e8b57}.fm .D{background:#8a7f72}.fm .L{background:#c0392b}
.mtab{border:2px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden;font:500 12px var(--head)}
.mtab div{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:3px 8px;border-top:1px solid var(--rule)}.mtab div:first-child{border-top:0}
.mtab .us{background:var(--club);color:#fff;font-weight:700}.mtab .tgt{border-top:2px dashed var(--gold)}.mtab span:last-child{font-variant-numeric:tabular-nums}
.mpitch{margin:0 14px;position:relative;border:2px solid var(--ink);border-radius:14px;overflow:hidden;color:#fff;text-align:left;cursor:pointer;padding:0;display:block;width:calc(100% - 28px);
  background:repeating-linear-gradient(90deg,#2f7a3e 0 34px,#2a6f38 34px 68px)}
.mpitch svg.stad{display:block;width:100%;height:64px}
.mpitch .lines{position:absolute;inset:64px 0 0;pointer-events:none}
.mpitch .face2{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 12px 4px}
.mpitch .side2{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 14px var(--head);text-shadow:0 1px 2px rgba(0,0,0,.5)}.mpitch .side2 small{font:500 11px var(--body);opacity:.9}
.mpitch .side2 svg{width:44px;height:50px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mpitch .mid{text-align:center;font:700 13px var(--head);letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.5)}.mpitch .mid b{display:block;font:700 24px var(--head)}
.mpitch .stk{position:relative;margin:0 10px 10px;padding:8px 10px;background:rgba(10,20,12,.62);border-radius:8px;font:400 13px/1.3 var(--body)}.mpitch .stk b{font:700 14px var(--head);display:block}
.mpitch .flags{position:absolute;top:0;left:0;right:0;height:16px}
.exg{padding:0 14px}.exg h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;font:600 12px var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}.exg h3 i{font-style:normal;color:var(--club)}.exg h3 button{min-height:32px;border:0;background:none;color:var(--ink);font:600 13px var(--head);letter-spacing:0;text-transform:none;text-decoration:underline;cursor:pointer}
.new{font:700 9px var(--head);letter-spacing:.1em;color:#1f1715;background:var(--gold);border:1.5px solid var(--ink);border-radius:4px;padding:0 4px;transform:rotate(-4deg);display:inline-block;margin-left:6px}
.runrow{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;min-height:56px;border:0;border-top:1.5px solid var(--rule);background:none;color:var(--ink);text-align:left;cursor:pointer}
.runrow .ic{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 16px var(--head)}
.runrow b{display:block;font:700 14px var(--head)}.runrow span span{font:400 13px var(--body);color:var(--soft)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

function mailRow(m) { const read = STATE.read[m.id], done = STATE.answered[m.id];

function inboxView(d) { const M = MAIL[WK], need = M.need.filter(m => !STATE.answered[m.id]), m = d.match;
