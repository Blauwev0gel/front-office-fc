<style>
/* Layout: one phone column, the match as a live wire under a score bug; the game's own newsprint tokens. */
:root{--bg:#f4d8cc;--paper:#f8e4da;--ink:#1f1715;--soft:#5b4842;--rule:rgba(31,23,21,.28);--hair:rgba(31,23,21,.14);--us:#7a1e2b;--usOn:#fff;--them:#0e6a85;--themOn:#fff;--good:#1d6b3c;--bad:#b3261e;--gold:#e9c46a;
--head:'Oswald',Impact,'Arial Narrow',sans-serif;--body:'Source Serif 4',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.22);--hair:rgba(241,221,211,.12);--us:#d5596b;--usOn:#1b1412;--them:#4fb6d3;--themOn:#1b1412;--good:#6fcf97;--bad:#ff8a80;--gold:#e9c46a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.22);--hair:rgba(241,221,211,.12);--us:#d5596b;--usOn:#1b1412;--them:#4fb6d3;--themOn:#1b1412;--good:#6fcf97;--bad:#ff8a80;--gold:#e9c46a;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.note{font:600 12px var(--body);color:var(--soft);border:1px dashed var(--rule);border-radius:10px;padding:8px 10px}
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 8px;z-index:5;border-bottom:2px solid var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tm{display:flex;align-items:center;gap:8px;font:700 20px var(--head);letter-spacing:.02em;min-width:0}.tm.r{justify-content:flex-end}
.crest{width:30px;height:34px;flex:none}
.sc{text-align:center}.sc b{font:700 40px/1 var(--head);display:block;font-variant-numeric:tabular-nums}.sc b.pop{animation:pop .5s}
.clk{display:inline-block;margin-top:4px;background:var(--gold);color:#1f1715;font:700 13px var(--head);border-radius:9px;padding:1px 9px;font-variant-numeric:tabular-nums}
@keyframes pop{40%{transform:scale(1.25)}}
.prog{height:4px;background:var(--hair);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s linear}
.zone{display:grid;gap:6px}.zl{display:flex;justify-content:space-between;font:600 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.zbar{position:relative;display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1.4fr 1fr;height:34px;border-radius:8px;overflow:hidden;border:1.5px solid var(--ink)}
.zbar span{background:var(--paper);border-right:1px solid var(--hair)}.zbar span:nth-child(1),.zbar span:nth-child(5){background:color-mix(in srgb,var(--paper) 80%,var(--ink))}.zbar span:last-child{border:0}
.ball{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--paper);left:50%;transition:left .5s cubic-bezier(.3,.7,.3,1)}
.who{font:600 13px var(--body);color:var(--soft);min-height:19px}
.mom svg{width:100%;height:46px;display:block}.mom .mu{fill:var(--us);opacity:.85}.mom .mt{fill:var(--them);opacity:.85}.mom .ax{stroke:var(--rule)}
.now{min-height:76px}
.card{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;animation:in .3s ease-out}
.card.goal{border-width:3px;box-shadow:4px 4px 0 var(--ink)}.card.goal .t{font:700 20px/1.2 var(--head);letter-spacing:.01em}
.card.us.goal{background:var(--us);color:var(--usOn);border-color:var(--us)}.card.them.goal{background:var(--them);color:var(--themOn);border-color:var(--them)}
@keyframes in{from{transform:translateY(6px);opacity:.4}}
.mm{font:700 13px var(--head);color:inherit;opacity:.8}.t{margin:2px 0 0}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--head);background:var(--hair);color:var(--ink)}.av.us{background:var(--us);color:var(--usOn)}.av.them{background:var(--them);color:var(--themOn)}.av.sm{width:22px;height:22px;font-size:10px}
.card.goal .av{background:var(--paper);color:var(--ink)}
ul.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--hair);font-size:15px}
.feed li .m{font:700 13px var(--head);color:var(--soft);font-variant-numeric:tabular-nums}.feed li.small{font-size:14px;color:var(--soft)}.feed li.big{font-weight:600}.feed li.goal{font:600 16px var(--head);letter-spacing:.01em}
.feed li.goal.us .m,.feed li.goal.us{color:var(--us)}.feed li.goal.them .m,.feed li.goal.them{color:var(--them)}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:600 15px var(--head);letter-spacing:.03em;min-height:44px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button.pri{background:var(--ink);color:var(--bg)}
.ft{display:grid;gap:10px;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:14px}
.ft h2{margin:0;font:700 28px var(--head);text-wrap:balance}.ft h3{margin:4px 0 0;font:600 15px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.stats{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-variant-numeric:tabular-nums}.stats div{display:contents}.stats b{font:700 18px var(--head)}.stats span{font:600 13px var(--body);color:var(--soft);text-align:center}.stats b:last-child{text-align:right}
.ft ul{margin:0;padding-left:18px}.ht{background:var(--paper);border:1.5px dashed var(--ink);border-radius:12px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.ball,.prog i{transition:none}.card,.sc b.pop{animation:none}}
</style>
