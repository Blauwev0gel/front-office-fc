<style>
/* Layout: a teletext page. Every panel has a fixed place and a fixed height; only the text inside changes. One deliberate dark look. */
:root{--bg:#000;--panel:#0a0a0a;--line:#1f1f1f;--fg:#f2f2f2;--dim:#9a9a9a;--yel:#ffe600;--cyan:#33e6ff;--grn:#3cff6e;--red:#ff4a3d;--mag:#ff5ce1;--band:#0b2cc9;--us:#ffe600;--them:#33e6ff;
--tt:'VT323','Lucida Console','Courier New',monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{background:var(--bg)}body{color:var(--fg);font:22px/1.15 var(--tt);margin:0}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;display:grid;gap:8px}
.note{font-size:17px;color:var(--dim);height:44px;overflow:hidden}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;height:28px;align-items:center;background:var(--band);color:#fff;padding:0 8px;font-size:22px}
.top b{color:var(--yel);font-weight:400}.top span:last-child{font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;border-bottom:2px solid var(--line)}
.score .tm{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score .tm.r{text-align:right}
.score .us{color:var(--us)}.score .them{color:var(--them)}
.score .res{font-size:52px;line-height:1;padding:0 12px;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.score .res.flash{animation:fl .9s steps(2) 3}@keyframes fl{50%{color:var(--yel);background:#3a3200}}
.clk{display:grid;grid-template-columns:1fr auto;height:24px;align-items:center;color:var(--dim)}.clk b{color:var(--grn);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line)}.bar i{display:block;height:100%;width:0;background:var(--grn)}
/* commentary: the CM panel, fixed height, newest line bright */
.com{height:150px;background:var(--panel);border:2px solid var(--line);padding:8px 12px;display:grid;grid-template-rows:44px 1fr;gap:6px}
.com .prev{color:var(--dim);font-size:19px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.com .cur{font-size:25px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.com .cur.goal{color:var(--yel)}.com .cur.goal.them{color:var(--cyan)}.com .cur.big{color:var(--fg)}.com .cur.red{color:var(--red)}.com .cur.blink{animation:bl .5s steps(2) 4}@keyframes bl{50%{opacity:.15}}
.com .cur .m{color:var(--grn)}
/* where the play is: five teletext blocks */
.zone{display:grid;gap:4px;height:58px}.zl{display:grid;grid-template-columns:1fr auto 1fr;color:var(--dim);font-size:18px}.zl span:last-child{text-align:right}
.zb{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1.4fr 1fr;gap:3px;height:26px}.zb i{background:#141414;border:1px solid var(--line)}.zb i.on{background:var(--grn)}.zb i.on.us{background:var(--us)}.zb i.on.them{background:var(--them)}
/* momentum: 19 blocks of five minutes, as mosaic bars */
.mom{display:grid;gap:2px;height:66px}.mom .lbl{display:grid;grid-template-columns:1fr auto 1fr;color:var(--dim);font-size:18px}.mom .lbl span:last-child{text-align:right}
.mg{display:grid;grid-template-columns:repeat(19,1fr);gap:2px;height:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.mg div{display:grid;grid-template-rows:1fr 1fr}.mg u{display:block;align-self:end}.mg s{display:block;align-self:start}
.mg u{background:var(--us)}.mg s{background:var(--them)}
.mg::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed #333}
/* the numbers, always in the same place */
.st{display:grid;grid-template-columns:1fr auto 1fr;height:84px;align-content:start;row-gap:2px;font-variant-numeric:tabular-nums;border-bottom:2px solid var(--line)}
.st span{color:var(--dim);text-align:center}.st b{font-weight:400}.st b.r{text-align:right}.st b.us{color:var(--us)}.st b.them{color:var(--them)}
/* livescore list: home left, minute in the middle, away right; fixed height, scrolls inside */
.ls{height:270px;overflow-y:auto;border:2px solid var(--line);background:var(--panel)}
.ls h3{position:sticky;top:0;margin:0;background:var(--band);color:#fff;font-weight:400;font-size:20px;padding:0 8px;height:26px;line-height:26px}
.row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;min-height:30px;padding:0 6px;border-bottom:1px solid var(--line);font-size:20px}
.row .h{text-align:right;padding-right:6px}.row .a{padding-left:6px}.row .mn{text-align:center;color:var(--grn)}
.row .ic{display:inline-block;width:14px;height:18px;vertical-align:-3px;margin:0 4px}.ic.yc{background:var(--yel)}.ic.rc{background:var(--red)}
.g{color:var(--fg)}.row .sub{color:var(--dim)}.row.ht{grid-template-columns:1fr}.row.ht span{text-align:center;color:var(--mag)}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font:22px var(--tt);min-height:44px;background:#111;color:var(--fg);border:2px solid var(--line);cursor:pointer}button:hover{border-color:var(--grn)}
button:focus-visible{outline:2px solid var(--yel);outline-offset:2px}button.k{color:var(--yel)}
.why{height:120px;overflow:hidden;color:var(--fg);font-size:20px}.why b{color:var(--yel);font-weight:400}
@media (prefers-reduced-motion:reduce){.score .res.flash,.com .cur.blink{animation:none}}
</style>
