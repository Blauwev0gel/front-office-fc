<title>Matchday Wire</title>

<style>
/* Layout: the game's own match wire. Every panel has a fixed place and height; only the text inside changes. Newsprint tokens from the game, light and dark. */
:root{--bg:#f4d8cc;--paper:#f8e4da;--ink:#1f1715;--soft:#5b4842;--rule:rgba(31,23,21,.28);--hair:rgba(31,23,21,.14);--fill:#ecc9bb;--us:#7a1e2b;--usOn:#fff;--them:#0e6a85;--themOn:#fff;--good:#1d6b3c;--bad:#b3261e;--gold:#e9c46a;
--head:'Oswald',Impact,'Arial Narrow',sans-serif;--body:'Source Serif 4',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.22);--hair:rgba(241,221,211,.12);--fill:#30241f;--us:#e07a89;--usOn:#1b1412;--them:#5cc0dc;--themOn:#1b1412;--good:#6fcf97;--bad:#ff8a80;--gold:#e9c46a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.22);--hair:rgba(241,221,211,.12);--fill:#30241f;--us:#e07a89;--usOn:#1b1412;--them:#5cc0dc;--themOn:#1b1412;--good:#6fcf97;--bad:#ff8a80;--gold:#e9c46a;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);margin:0}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;display:grid;gap:10px}
.note{font-size:13px;color:var(--soft);height:38px;overflow:hidden;margin:0}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:8px;height:30px;align-items:center;background:var(--ink);color:var(--bg);padding:0 10px;font:600 14px var(--head);letter-spacing:.08em;text-transform:uppercase}
.top b{color:var(--gold);font-weight:600}.top span:last-child{font-variant-numeric:tabular-nums}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:66px;border-bottom:3px solid var(--ink)}
.score .tm{font:700 22px var(--head);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score .tm.r{text-align:right}
.score .us{color:var(--us)}.score .them{color:var(--them)}
.score .res{font:700 46px/1 var(--head);padding:0 12px;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.score .res.flash{animation:fl .9s ease 2}@keyframes fl{50%{color:var(--gold)}}
.clk{display:grid;grid-template-columns:1fr auto;height:22px;align-items:center;font:600 13px var(--head);letter-spacing:.08em;color:var(--soft)}.clk b{background:var(--gold);color:#1f1715;border-radius:9px;padding:0 9px;font:700 14px var(--head);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--hair);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--gold)}
/* the commentary panel: head (minute, who attacks), the beats of one moment, a context line. Fixed height. */
.com{height:196px;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;display:grid;grid-template-rows:30px 1fr 30px;overflow:hidden}
.com .hd{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hair);font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.com .hd b{background:var(--gold);color:#1f1715;border-radius:9px;padding:0 8px;font:700 13px var(--head);letter-spacing:0}
.com .hd .us{color:var(--us)}.com .hd .them{color:var(--them)}
.com .bt{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:8px 14px;overflow:hidden}
.com .bt p{margin:0}.com .bt .old{font-size:14px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.com .bt .new{font-size:19px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.com .bt .new.wait::after{content:" ●●●";letter-spacing:.2em;color:var(--soft);animation:dots 1s steps(3) infinite}
@keyframes dots{0%{clip-path:inset(0 66% 0 0)}50%{clip-path:inset(0 33% 0 0)}}
.com .bt .new.goal{font:700 24px/1.2 var(--head);letter-spacing:.01em}.com .bt .new.goal.us{color:var(--us)}.com .bt .new.goal.them{color:var(--them)}.com .bt .new.red{color:var(--bad);font-weight:600}.com .bt .new.after{font-style:italic;font-size:17px}
.com .cx{display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--hair);font:600 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* where the play is */
.zone{display:grid;gap:4px;height:56px}.zl{display:grid;grid-template-columns:1fr auto 1fr;color:var(--soft);font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase}.zl span:last-child{text-align:right}
.zb{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1.4fr 1fr;gap:3px;height:26px}.zb i{background:var(--paper);border:1px solid var(--hair);border-radius:4px}.zb i:first-child,.zb i:last-child{background:var(--fill)}.zb i.on.us{background:var(--us);border-color:var(--us)}.zb i.on.them{background:var(--them);border-color:var(--them)}
/* momentum per five minutes */
.mom{display:grid;gap:3px;height:66px}.mom .lbl{display:grid;grid-template-columns:1fr auto 1fr;color:var(--soft);font:600 12px var(--head);letter-spacing:.08em;text-transform:uppercase}.mom .lbl span:last-child{text-align:right}
.mg{display:grid;grid-template-columns:repeat(19,1fr);gap:2px;height:44px;position:relative}
.mg div{display:grid;grid-template-rows:1fr 1fr}.mg u{display:block;align-self:end;border-radius:2px 2px 0 0}.mg s{display:block;align-self:start;border-radius:0 0 2px 2px}
.mg u{background:var(--us)}.mg s{background:var(--them)}
.mg::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--rule)}
/* the numbers */
.st{display:grid;grid-template-columns:1fr auto 1fr;height:84px;align-content:start;row-gap:4px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--rule)}
.st span{color:var(--soft);text-align:center;font:600 12px/22px var(--head);letter-spacing:.08em;text-transform:uppercase}.st b{font:700 18px/22px var(--head)}.st b.r{text-align:right}.st b.us{color:var(--us)}.st b.them{color:var(--them)}
/* key events, livescore style: home left, minute in the middle, away right */
.ls{height:260px;overflow-y:auto;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper)}
.ls h3{position:sticky;top:0;margin:0;background:var(--ink);color:var(--bg);font:600 13px/28px var(--head);letter-spacing:.08em;text-transform:uppercase;padding:0 12px;height:28px}
.row{display:grid;grid-template-columns:1fr 46px 1fr;align-items:center;min-height:34px;padding:0 8px;border-bottom:1px solid var(--hair);font-size:15px}
.row .h{text-align:right;padding-right:6px}.row .a{padding-left:6px}.row .mn{text-align:center;font:700 14px var(--head);color:var(--soft);font-variant-numeric:tabular-nums}
.row .ic{display:inline-block;width:10px;height:14px;border-radius:2px;vertical-align:-2px;margin:0 4px}.ic.yc{background:var(--gold)}.ic.rc{background:var(--bad)}
.g{font:700 15px var(--head);letter-spacing:.02em}.row .sub{color:var(--soft)}.row.ht{grid-template-columns:1fr;background:var(--fill)}.row.ht span{text-align:center;font:600 13px var(--head);letter-spacing:.08em}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:600 15px var(--head);letter-spacing:.04em;min-height:44px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button.k{background:var(--ink);color:var(--bg)}button:disabled{opacity:.45}
.why{height:120px;overflow:hidden;font-size:15px}.why b{font:600 13px var(--head);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){.score .res.flash,.com .bt .new.wait::after{animation:none}}
</style>

 const p=document.createElement('p');p.className='new'+(b.goal?' goal '+(mo.side||''):b.k==='after'?' after':mo.k==='red'&&b.k==='out'?' red':'');p.textContent=b.t;$('bt').appendChild(p);
 if(b.goal){const sc=M.ev.find(e=>e.k==='goal'&&e.m===mo.m&&e.side===mo.side);if(sc){const r=$('res');r.textContent=scoreTxt(sc.score);r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash');}}}
function play(list,k,then){if(done)return;if(k>=list.length)return then();const mo=list[k];panel(mo);momAdd(mo);zone(zoneOf(mo),mo.side);if(mo.k==='ht')key(KEY.find(e=>e.k==='ht'));let j=0;
 const step=()=>{if(done)return;if(paused){t=setTimeout(step,200);return;}if(j>=mo.beats.length)return play(list,k+1,then);const b=mo.beats[j++];beat(b,mo);t=setTimeout(step,sp(b.hold||700));};step();}
function tick(){if(done)return;if(paused){t=setTimeout(tick,200);return;}min++;if(min>94)return finish();clock(min);count(min);for(const e of keyBy[min]||[])if(e.k!=='ht')key(e);
 const here=(byMin[min]||[]);if(!here.length){if(min%3===0)zone(null);t=setTimeout(tick,sp([1,2].some(k=>byMin[min+k])?130:55));return;}
 if(here.some(mo=>mo.k==='ft'))return play(here.filter(mo=>mo.k!=='ft'),0,finish);
 if(here.some(mo=>mo.k==='ht'))$('phase').textContent='Half-time';
 play(here,0,()=>{t=setTimeout(tick,sp(60));});}
function why(){const out=[],xu=M.xg.us,xt=M.xg.them,gu=M.sc.us,gt=M.sc.them;
 if(xu-gu>=0.9)out.push(`We were wasteful: ${xu.toFixed(1)} expected, ${gu} scored.`);else if(gu-xu>=0.9)out.push(`We were clinical: ${gu} from ${xu.toFixed(1)} expected.`);
 if(gt-xt>=0.9)out.push('They scored more than their chances deserved.');else if(xt-gt>=0.9)out.push('Our keeper kept the score down.');
 if(M.red.them)out.push('Their red card gave us the ball, not the chances.');if(M.red.us)out.push('Our red card changed the game.');
 if(M.d0<-0.6)out.push('They had the better players.');else if(M.d0>0.6)out.push('We had the better players.');
 out.push(xu-xt>0.6?`We made the chances: ${xu.toFixed(1)} to ${xt.toFixed(1)} expected.`:xt-xu>0.6?`They made the chances: ${xt.toFixed(1)} to ${xu.toFixed(1)} expected.`:'Even on chances, settled by the finishing.');return out.slice(0,3);}
function finish(){if(done)return;done=true;clearTimeout(t);
 for(let m=min+1;m<=94;m++){count(m);for(const e of keyBy[m]||[])key(e);for(const mo of byMin[m]||[])if(mo.k!=='ft'&&mo.k!=='ht')momAdd(mo);}
 clock(94);zone(null);$('phase').textContent='Full time';$('res').textContent=scoreTxt(M.sc);
 const ft=B.find(mo=>mo.k==='ft');panel(ft||{m:94,ctx:''});$('cm').textContent='FT';for(const b of (ft?ft.beats:[]))beat(b,ft);
 $('why').innerHTML='<b>WHY</b><br>'+why().join('<br>');$('bP').textContent='Watch again';$('bP').onclick=restart;$('bF').disabled=true;$('bS').disabled=true;}
function restart(){clearTimeout(t);min=0;done=false;paused=false;sh={us:0,them:0};sot={us:0,them:0};xg={us:0,them:0};blk.fill(0);drawMom();$('rows').innerHTML='';$('why').innerHTML='';$('res').textContent='0-0';$('bt').innerHTML='';$('cx').textContent='';$('att').textContent='';
 $('bP').textContent='Pause';$('bP').onclick=()=>{paused=!paused;$('bP').textContent=paused?'Resume':'Pause';};$('bF').disabled=false;$('bS').disabled=false;
 clock(0);zone(null);stats();play(byMin[0]||[],0,()=>{t=setTimeout(tick,sp(300));});}
$('bF').onclick=()=>{fast=!fast;$('bF').textContent=fast?'Normal':'2× speed';};$('bS').onclick=finish;
restart();
