<style>
/* Layout: the genre's match screen (score bars, status, one-line ticker, possession, panels, info band) in the game's newsprint style.
   Every block has a fixed height; only the text inside changes. */
:root{--bg:#f4d8cc;--paper:#f8e4da;--ink:#1f1715;--soft:#5b4842;--rule:rgba(31,23,21,.28);--hair:rgba(31,23,21,.14);--fill:#ecc9bb;--wire:#1f1715;--wireFg:#f8e4da;
--us:#7a1e2b;--usOn:#fff;--them:#0e6a85;--themOn:#fff;--good:#1d6b3c;--bad:#b3261e;--gold:#e9c46a;--goldOn:#1f1715;
--head:'Oswald',Impact,'Arial Narrow',sans-serif;--body:'Source Serif 4',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.22);--hair:rgba(241,221,211,.12);--fill:#30241f;--wire:#0f0b0a;--wireFg:#f1ddd3;--us:#8e2a3a;--usOn:#fff;--them:#0f6f8b;--themOn:#fff;--good:#6fcf97;--bad:#ff8a80;--gold:#e9c46a;--goldOn:#1f1715;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1412;--paper:#241b18;--ink:#f1ddd3;--soft:#bba49a;--rule:rgba(241,221,211,.22);--hair:rgba(241,221,211,.12);--fill:#30241f;--wire:#0f0b0a;--wireFg:#f1ddd3;--us:#8e2a3a;--usOn:#fff;--them:#0f6f8b;--themOn:#fff;--good:#6fcf97;--bad:#ff8a80;--gold:#e9c46a;--goldOn:#1f1715;color-scheme:dark}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:15px/1.35 var(--body);margin:0}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 24px;display:grid;gap:6px}
.note{margin:0;font-size:12px;color:var(--soft);height:18px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* score bars */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:46px}
.sb{display:grid;grid-template-columns:1fr 44px;align-items:center;border-radius:6px;overflow:hidden}
.sb .n{font:700 19px var(--head);letter-spacing:.02em;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .g{height:100%;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:700 28px var(--head);font-variant-numeric:tabular-nums;border:2px solid currentColor}
.sb.us{background:var(--us);color:var(--usOn)}.sb.them{background:var(--them);color:var(--themOn)}.sb.us .g{border-color:var(--us)}.sb.them .g{border-color:var(--them)}
.sb .g.flash{animation:fl .7s ease 3}@keyframes fl{50%{background:var(--gold);color:var(--goldOn)}}
/* scorers under the bars */
.scr{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:38px;font:600 13px/1.4 var(--head);letter-spacing:.02em}
.scr div{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.scr div:last-child{text-align:right}
.scr b{font-weight:600}.scr span{color:var(--soft);font-weight:500}
/* status */
.stt{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;height:26px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);font:600 13px var(--head);letter-spacing:.06em;text-transform:uppercase}
.stt b{background:var(--gold);color:var(--goldOn);border-radius:8px;padding:0 8px;font-variant-numeric:tabular-nums}.stt .c{text-align:center}.stt .r{color:var(--soft)}
/* the ticker: one line, the current action; nothing else */
.tk{position:relative;display:grid;grid-template-columns:6px 1fr;height:58px;background:var(--wire);color:var(--wireFg);border-radius:8px;overflow:hidden}
.tk .side{background:var(--hair)}.tk .side.us{background:var(--us)}.tk .side.them{background:var(--them)}
.tk p{margin:0;align-self:center;padding:0 12px;font:600 18px/1.35 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tk p .m{font:700 13px/1 var(--head);color:var(--gold);margin-right:6px;vertical-align:baseline}
.tk.goal{background:var(--gold);color:var(--goldOn)}.tk.goal p{font:700 22px/1.35 var(--head);letter-spacing:.02em}.tk.goal p .m{color:var(--goldOn)}
.tk.red p{color:#ff9d93}.tk.after p{font-style:italic;font-weight:400}
/* possession, last five minutes */
.ps{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;height:30px}
.ps small{font:600 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);width:74px}
.pb{display:grid;height:22px;border-radius:5px;overflow:hidden;font:700 13px var(--head);font-variant-numeric:tabular-nums}
.pb span{display:flex;align-items:center;padding:0 6px;min-width:0;overflow:hidden;white-space:nowrap}.pb .h{justify-content:flex-start}.pb .a{justify-content:flex-end}
/* panels with tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;height:44px}
.tabs button{border-radius:8px 8px 0 0;border-bottom:0}.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pn{height:236px;border:1.5px solid var(--ink);border-radius:0 0 10px 10px;background:var(--paper);overflow:hidden;margin-top:-6px}
.pn>div{height:100%;overflow-y:auto}
.row{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;min-height:32px;padding:0 8px;border-bottom:1px solid var(--hair);font-size:14px}
.row .h{text-align:right;padding-right:6px}.row .a{padding-left:6px}.row .mn{text-align:center;font:700 13px var(--head);color:var(--soft);font-variant-numeric:tabular-nums}
.row .ic{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-2px;margin:0 4px}.ic.yc{background:var(--gold)}.ic.rc{background:var(--bad)}
.row .gl{font:700 14px var(--head);letter-spacing:.02em}.row .sub{color:var(--soft)}.row.ht{grid-template-columns:1fr;background:var(--fill)}.row.ht span{text-align:center;font:600 12px var(--head);letter-spacing:.08em}
.empty{padding:12px;color:var(--soft);font-size:14px}
.sx{display:grid;grid-template-columns:1fr auto 1fr;row-gap:2px;padding:10px 12px;font-variant-numeric:tabular-nums}
.sx span{text-align:center;font:600 12px/24px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}.sx b{font:700 17px/24px var(--head)}.sx b.r{text-align:right}.sx b.us{color:var(--us)}.sx b.them{color:var(--them)}
.rp{padding:10px 14px;display:grid;gap:6px;font-size:14px}.rp h4{margin:0;font:600 13px var(--head);letter-spacing:.08em;text-transform:uppercase}.rp ul{margin:0;padding-left:18px}
/* info band, controls, venue */
.inf{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;height:30px;align-items:center;font:600 12px var(--head);letter-spacing:.04em;color:var(--soft);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.inf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inf span:nth-child(2){text-align:center}.inf span:last-child{text-align:right}
.ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
button{font:600 15px var(--head);letter-spacing:.04em;min-height:44px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}button.k{background:var(--ink);color:var(--bg)}button:disabled{opacity:.45}
.ven{height:28px;display:grid;place-items:center;background:var(--fill);border-radius:6px;font:600 13px var(--head);letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.sb .g.flash{animation:none}}
</style>

function stats(){const r=(l,k)=>{const[a,b]=sc2(k);return `<b class="${hS}">${a}</b><span>${l}</span><b class="r ${aS}">${b}</b>`;};$('p1').innerHTML=`<div class="sx">${r('Shots',sh)}${r('On target',sot)}${r('Expected goals',{us:xg.us.toFixed(1),them:xg.them.toFixed(1)})}${r('Possession',{us:Math.round(M.poss.slice(0,Math.max(1,Math.ceil(min/5))).reduce((a,b)=>a+b,0)/Math.max(1,Math.ceil(min/5))),them:100-Math.round(M.poss.slice(0,Math.max(1,Math.ceil(min/5))).reduce((a,b)=>a+b,0)/Math.max(1,Math.ceil(min/5)))})}${r('Red cards',{us:KEY.filter(e=>e.k==='red'&&e.side==='us'&&e.m<=min).length,them:KEY.filter(e=>e.k==='red'&&e.side==='them'&&e.m<=min).length})}</div>`;}
function key(e){const p0=$('p0');const em=p0.querySelector('.empty');if(em)em.remove();const row=document.createElement('div');
 if(e.k==='ht'){row.className='row ht';row.innerHTML=`<span>HALF-TIME, ${scoreTxt(e.score)}</span>`;}
 else{const home=e.side===hS,ic=e.k==='yellow'?'<i class="ic yc"></i>':e.k==='red'?'<i class="ic rc"></i>':e.k==='goal'?'⚽':e.k==='sub'?'⇄':'✚';
  const txt=e.k==='goal'?`<span class="gl">${sur(e.who)}</span> ${scoreTxt(e.score)}`:e.k==='sub'?`<span class="sub">${sur(e.inn)} for ${sur(e.out)}</span>`:e.k==='injury'?`<span class="sub">${sur(e.who)} injured</span>`:sur(e.who);
  row.className='row';row.innerHTML=home?`<span class="h">${txt} ${ic}</span><span class="mn">${e.m}'</span><span class="a"></span>`:`<span class="h"></span><span class="mn">${e.m}'</span><span class="a">${ic} ${txt}</span>`;}
 p0.appendChild(row);p0.scrollTop=p0.scrollHeight;}
function clock(m){$('clk').textContent=(m>90?'90+'+(m-90):m)+"'";$('half').textContent=m<=45?'First half':m<=90?'Second half':'Stoppage time';const ht=KEY.find(e=>e.k==='ht');$('cmp').textContent=M.tier+(ht&&m>45?' · HT '+scoreTxt(ht.score):'');}
function why(){const out=[],xu=M.xg.us,xt=M.xg.them,gu=M.sc.us,gt=M.sc.them;
 if(xu-gu>=0.9)out.push(`We were wasteful: ${xu.toFixed(1)} expected, ${gu} scored.`);else if(gu-xu>=0.9)out.push(`We were clinical: ${gu} from ${xu.toFixed(1)} expected.`);
 if(gt-xt>=0.9)out.push('They scored more than their chances deserved.');else if(xt-gt>=0.9)out.push('Our keeper kept the score down.');
 if(M.red.them)out.push('Their red card gave us the ball, not the chances.');if(M.red.us)out.push('Our red card changed the game.');
 if(M.d0<-0.6)out.push('They had the better players.');else if(M.d0>0.6)out.push('We had the better players.');
 out.push(xu-xt>0.6?`We made the chances: ${xu.toFixed(1)} to ${xt.toFixed(1)} expected.`:xt-xu>0.6?`They made the chances: ${xt.toFixed(1)} to ${xu.toFixed(1)} expected.`:'Even on chances, settled by the finishing.');return out.slice(0,3);}
function report(){$('p2').innerHTML=done?`<div class="rp"><h4>${M.sc.us>M.sc.them?'A win':M.sc.us<M.sc.them?'A defeat':'A draw'}, ${scoreTxt(M.sc)}</h4><ul>${why().map(x=>`<li>${x}</li>`).join('')}</ul></div>`:`<div class="rp"><h4>Match report</h4><p>The report follows at full time: why we won or lost, from the real factors.</p></div>`;}
function step(){if(done)return;if(paused){t=setTimeout(step,200);return;}
 const s=steps[i];if(!s)return finish();
 if(s.m>min){min++;clock(min);count(min);poss(min);for(const e of orphan.filter(e=>e.m===min))key(e);t=setTimeout(step,sp(steps[i]&&steps[i].m>min+1?45:95));return;}
 i++;if(s.pause){const p=$('tl');p.innerHTML+=' …';t=setTimeout(step,sp(s.hold));return;}
 if(s.mo&&s.mo.k==='ht')$('half').textContent='Half-time';
 tick1(s);t=setTimeout(step,sp(s.hold));}
function finish(){if(done)return;done=true;clearTimeout(t);
 for(let k=i;k<steps.length;k++)if(steps[k].key)key(steps[k].key);for(let m=min+1;m<=94;m++){min=m;count(m);for(const e of orphan.filter(e=>e.m===m))key(e);}
 min=94;clock(94);poss(94);const [h,a]=sc2(M.sc);$('hg').textContent=h;$('ag').textContent=a;scorers();$('half').textContent='Full time';
 const ft=B.find(mo=>mo.k==='ft');tick1({m:94,t:`Full time. ${scoreTxt(M.sc)}.`,side:null});report();
 $('bP').textContent='Watch again';$('bP').onclick=restart;$('bF').disabled=true;$('bS').disabled=true;}
function restart(){clearTimeout(t);i=0;min=0;done=false;paused=false;sh={us:0,them:0};sot={us:0,them:0};xg={us:0,them:0};scs={us:0,them:0};
 $('hg').textContent='0';$('ag').textContent='0';$('hs').innerHTML='';$('as').innerHTML='';$('p0').innerHTML='<div class="empty">Goals, cards and changes appear here as they happen.</div>';
 $('bP').textContent='Pause';$('bP').onclick=()=>{paused=!paused;$('bP').textContent=paused?'Resume':'Pause';};$('bF').disabled=false;$('bS').disabled=false;
 clock(0);poss(1);stats();report();t=setTimeout(step,sp(300));}
const tabs=[0,1,2];tabs.forEach(k=>$('t'+k).onclick=()=>{tabs.forEach(j=>{$('t'+j).setAttribute('aria-selected',String(j===k));$('p'+j).hidden=j!==k;});});
$('bF').onclick=()=>{fast=!fast;$('bF').textContent=fast?'Normal':'2× speed';};$('bS').onclick=finish;
restart();
</script>
