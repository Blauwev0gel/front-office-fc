<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Founders</title><style> *{box-sizing:border-box}body{margin:0;background:#141d22;color:#e5e8dc;font:15px monospace}main{max-width:850px;margin:auto;padding:16px}h1,h2,h3{color:#e2c477}button,input,select{font:inherit;padding:10px;background:#26363b;color:#eee;border:1px solid #71847d;border-radius:3px}button{cursor:pointer;margin:3px}button:disabled{opacity:.4;cursor:default}section{border:1px solid #465b59;padding:14px;margin:12px 0;background:#1c292e}small,.muted{color:#a6b9b2}nav{display:flex;flex-wrap:wrap}p{line-height:1.5}strong{color:#e2c477}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.bad{color:#f2a49b}label{display:block;margin:8px 0}progress{width:100%}button.on{background:#82703e} </style><main id="app"></main><script>
const D={football:{name:'Football',focus:['Results','Youth integration'],cost:18},academy:{name:'Academy',focus:['Local network','Elite development'],cost:10},commercial:{name:'Commercial',focus:['Local partners','Growth'],cost:8},finance:{name:'Finance',focus:['Cash protection','Growth funding'],cost:7}};
const traits=[['Community roots',2],['Youth identity',2],['Commercial ambition',2],['Limited facilities',-2],['Small catchment',-2]];let draft={name:'',traits:[],staff:{}},s=null,view='inbox';const app=document.querySelector('#app'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>'£'+Math.round(x).toLocaleString()+'k',clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const candidates=k=>[{name:['Martin Hale','David Mercer','Anne Shaw','Helen Ward'][Object.keys(D).indexOf(k)],skill:65,ambition:35,wage:D[k].cost,style:0},{name:['Alex Reid','Tom Ellis','Sam Carter','Jo Bell'][Object.keys(D).indexOf(k)],skill:80,ambition:80,wage:D[k].cost*1.5,style:1}];
function found(){let pts=4-draft.traits.reduce((a,i)=>a+traits[i][1],0);app.innerHTML=`<h1>CLUB FOUNDERS / 01</h1><section><h2>Found a members' club</h2><label>Club name <input value="${esc(draft.name)}" oninput="draft.name=this.value"></label><p>DNA points remaining: ${pts}</p>${traits.map((t,i)=>`<button class="${draft.traits.includes(i)?'on':''}" onclick="toggle(${i})">${t[0]} (${t[1]>0?'-':'+'}${Math.abs(t[1])})</button>`).join('')}</section><section><h2>Appoint department heads</h2>${Object.keys(D).map(k=>`<h3>${D[k].name}</h3>${candidates(k).map((c,i)=>`<button class="${draft.staff[k]===i?'on':''}" onclick="draft.staff['${k}']=${i};found()">${c.name} · ${c.skill} expertise · ${money(c.wage)}/yr · ${D[k].focus[c.style]}</button>`).join('')}`).join('')}</section><button ${pts<0||Object.keys(draft.staff).length!==4?'disabled':''} onclick="start()">Open the club</button>`}function toggle(i){draft.traits=draft.traits.includes(i)?draft.traits.filter(x=>x!==i):[...draft.traits,i];found()}
function start(){s={name:draft.name.trim()||'Founders FC',dna:[...draft.traits],cash:180,trust:60,week:1,season:1,points:0,games:0,strength:45,network:0,sponsors:0,facility:draft.traits.includes(3)?0:1,projects:[],mail:[],ledger:[],depts:{},capacity:3,results:[],ended:false};for(let k in D){let c=candidates(k)[draft.staff[k]];s.depts[k]={...c,focus:c.style,authority:5,budget:20,spent:0,relation:50,knowledge:0}}msg('Board','Club founded','The members have elected you for the first season. Build a sustainable club.');render()}
function msg(from,title,body){s.mail.unshift({from,title,body,week:s.week,season:s.season});s.mail=s.mail.slice(0,100)}function book(label,amount){s.cash+=amount;s.ledger.unshift({label,amount,week:s.week});}function active(k){return s.projects.filter(p=>p.k===k&&p.left>0).length}function reserve(){return s.depts.finance.focus===0?25:12}function launch(k,type,auto=false){let d=s.depts[k],cost=type==='research'?3:type==='facility'?30:5;if(s.ended||active(k)>=1||s.cash-cost<reserve()||d.spent+cost>d.budget||(!auto&&s.capacity<1)||auto&&cost>d.authority)return false;book(D[k].name+' '+type,-cost);d.spent+=cost;if(!auto)s.capacity--;s.projects.push({k,type,left:type==='facility'?6:3,done:false});msg(D[k].name,'Project started',type+' · '+money(cost));return true}function finish(p){let d=s.depts[p.k];p.done=true;d.knowledge+=10;if(p.type==='facility'){s.facility++;msg(D[p.k].name,'Facility complete','Training capacity improved; maintenance rises.');return}if(p.type==='research'){msg(D[p.k].name,'Research findings',p.k==='academy'?'Local talent network '+s.network+'. '+(s.network<3?'A schools partnership is recommended.':'Focus on converting contacts into first-team talent.'):p.k==='finance'?'Cash '+money(s.cash)+', reserve '+money(reserve())+'.':p.k==='commercial'?'Current sponsor income '+money(s.sponsors)+' per year. '+(s.sponsors<20?'Regional partnership recommended.':'Renewal and retention recommended.'):'Squad strength '+s.strength.toFixed(1)+'. '+(s.strength<50?'Development investment recommended.':'Maintain continuity.'));return}if(p.k==='academy')s.network+=1+(d.skill>=80?1:0);if(p.k==='commercial')s.sponsors+=4+(d.focus?3:0)+(s.dna.includes(2)?2:0);if(p.k==='football')s.strength+=1+(d.skill>=80?1:0);if(p.k==='finance')d.knowledge+=5;msg(D[p.k].name,'Project completed','The '+p.type+' project has delivered measurable progress.');}
function tick(){if(s.ended)return;let income=2.4+s.sponsors/52+(s.dna.includes(0)?.5:0)-(s.dna.includes(4)?.4:0),cost=Object.values(s.depts).reduce((a,d)=>a+d.wage/52,0)+1.1+s.facility*.18;book('Weekly operations',income-cost);for(let p of s.projects)if(p.left>0&&--p.left===0)finish(p);for(let k in D){let d=s.depts[k];let need=k==='academy'?s.network<5:k==='commercial'?s.sponsors<24:k==='football'?s.strength<55:d.knowledge<20;if(need&&active(k)===0&&s.cash>reserve()+8&&d.spent+5<=d.budget){launch(k,'development',true)}}if(s.week<=30){let f=s.depts.football;let youth=f.focus===1?s.network*.35:0;let score=s.strength+(f.skill-65)*.12+youth+s.facility*.4;let r=Math.random();let win=clamp(.35+(score-45)*.025,.15,.75),res=r<win?'W':r<win+.25?'D':'L';s.points+=res==='W'?3:res==='D'?1:0;s.games++;s.results.unshift(res);s.trust=clamp(s.trust+(res==='W'?1:res==='L'?-1:0),0,100);if(f.focus===1&&s.network>0)s.strength+=.06*s.network*(s.dna.includes(1)?1.4:1);}
if(s.cash<reserve()&&(!s.warn||s.week-s.warn>=4)){s.warn=s.week;msg('Finance','Cash reserve breached','Review budgets or reduce costs.');}if(s.week%4===0)msg('Board','Monthly briefing',`Cash ${money(s.cash)} · ${s.points} points from ${s.games} matches · member trust ${s.trust}%.`);if(s.cash<0){s.ended=true;msg('Board','Insolvency','The club cannot meet its obligations.');}if(s.week===52&&!s.ended){let vote=clamp(s.trust+(s.cash>=reserve()?5:-10)+(s.points>=45?5:-5),0,100);msg('Members','Annual election',vote+'% support. '+(vote>=50?'Re-elected.':'Voted out.'));if(vote<50)s.ended=true;else{s.season++;s.week=0;s.points=0;s.games=0;s.results=[];for(let d of Object.values(s.depts))d.spent=0}}s.week++;s.capacity=3;render()}
function act(k,a){let d=s.depts[k];if(a==='meet'){if(d.met===s.season+':'+s.week)return;d.met=s.season+':'+s.week;msg(D[k].name,'Meeting notes',`Budget remaining ${money(d.budget-d.spent)}. ${active(k)?'Project in progress.':'Capacity available.'} ${D[k].focus[d.focus]} is our current direction.`)}else if(a==='focus'){if(s.capacity<1)return;d.focus=1-d.focus;s.capacity--;msg(D[k].name,'Strategy revised',D[k].focus[d.focus]);}else if(a==='budget'){if(s.capacity<1||s.cash<reserve()+10)return;d.budget+=10;s.capacity--;}else if(a==='authority'){d.authority=d.authority===5?0:5;}else launch(k,a);render()}
function render(){if(!s)return found();let body='';if(view==='inbox')body=s.mail.map(m=>`<section><small>S${m.season} W${m.week} · ${esc(m.from)}</small><h3>${esc(m.title)}</h3><p>${esc(m.body)}</p></section>`).join('');else if(view==='club')body='<div class="grid">'+Object.keys(D).map(k=>{let d=s.depts[k];return `<section><h2>${D[k].name}</h2><p>${d.name} · expertise ${d.skill}</p><p>DNA: ${D[k].focus[d.focus]}<br>Budget ${money(d.budget-d.spent)} remaining<br>Authority ${money(d.authority)}<br>Knowledge ${d.knowledge}</p><button onclick="view='${k}';render()">Open department</button></section>`}).join('')+'</div>';else if(view==='financebook')body=`<section><h2>Cash ledger</h2><p>Reserve ${money(reserve())} · annual staff cost ${money(Object.values(s.depts).reduce((a,d)=>a+d.wage,0))}</p>${s.ledger.slice(0,30).map(l=>`<p>W${l.week} ${esc(l.label)} <strong>${money(l.amount)}</strong></p>`).join('')}</section>`;else if(view==='footballtable')body=`<section><h2>Football</h2><p>${s.points} points / ${s.games} matches · strength ${s.strength.toFixed(1)}</p><p>${s.results.slice(0,15).join(' ')}</p></section>`;else {let k=view,d=s.depts[k];body=`<section><h2>${D[k].name}</h2><p>${d.name} · ${D[k].focus[d.focus]} · ${money(d.budget-d.spent)} available</p><p>Knowledge ${d.knowledge} · authority ${money(d.authority)} · facilities ${s.facility} · talent network ${s.network} · annual sponsorship ${money(s.sponsors)}</p><h3>Projects</h3>${s.projects.filter(p=>p.k===k).slice(-6).map(p=>`<p>${p.type} · ${p.left? p.left+' weeks left':'Complete'}</p>`).join('')}<h3>Owner initiatives</h3>${['meet','focus','budget','authority','research','development',...(k==='football'?['facility']:[])].map(a=>`<button ${s.ended?'disabled':''} onclick="act('${k}','${a}')">${({meet:'Meet head',focus:'Change direction',budget:'Increase budget £10k',authority:'Toggle delegated authority',research:'Commission research £3k',development:'Start development £5k',facility:'Build training facility £30k'})[a]}</button>`).join('')}</section>`}app.innerHTML=`<h1>${esc(s.name)}</h1><p>SEASON ${s.season} / WEEK ${s.week} · CASH ${money(s.cash)} · MEMBERS ${s.trust}% · INITIATIVES ${s.capacity}/3</p><nav>${[['inbox','Inbox'],['club','Departments'],['financebook','Accounts'],['footballtable','Football']].map(([k,n])=>`<button onclick="view='${k}';render()">${n}</button>`).join('')}<button ${s.ended?'disabled':''} onclick="tick()">Next week →</button><button onclick="if(confirm('Start over?')){localStorage.removeItem('founders');s=null;found()}">New game</button></nav>${s.ended?'<h2 class="bad">Your chairmanship has ended</h2>':''}${body}`;try{localStorage.setItem('founders',JSON.stringify(s))}catch(e){}}try{s=JSON.parse(localStorage.getItem('founders'))}catch(e){}render();
</script></html>
