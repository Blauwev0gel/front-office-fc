<title>De Spelmaker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: a retro football teletext page. One column of blocks under a solid top bar; chunky press-down buttons. Dark = teletext, light = matchday programme. */
:root{
  --bg:#0a0f2c; --panel:#10184a; --panel2:#18225c; --line:#2c3c8c; --ink:#f4f1e4; --dim:#a3add8;
  --bar:#ffd400; --bar-ink:#0a0f2c; --hd:#1fc8ff; --hd-ink:#04112b; --g:#3ee07f; --b:#ff5b4b; --gold:#ffd400;
  --btn:#ffd400; --btn-ink:#0a0a0a; --btn2:#f4f1e4; --edge:#000; --paper:#f4f1e4; --paper-ink:#111;
  --display:'VT323','Courier New',monospace; --body:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe7d2;--panel:#fffaf0;--panel2:#f3ecdb;--line:#1b1b1b;--ink:#141414;--dim:#55556a;--bar:#c8102e;--bar-ink:#fff;--hd:#0b2a6f;--hd-ink:#fff;--g:#0b7a37;--b:#c8102e;--gold:#9a6b00;--btn:#ffd400;--btn-ink:#0a0a0a;--btn2:#fff;--edge:#111;--paper:#fff;--paper-ink:#111;color-scheme:light}}
:root[data-theme="light"]{--bg:#efe7d2;--panel:#fffaf0;--panel2:#f3ecdb;--line:#1b1b1b;--ink:#141414;--dim:#55556a;--bar:#c8102e;--bar-ink:#fff;--hd:#0b2a6f;--hd-ink:#fff;--g:#0b7a37;--b:#c8102e;--gold:#9a6b00;--btn:#ffd400;--btn-ink:#0a0a0a;--btn2:#fff;--edge:#111;--paper:#fff;--paper-ink:#111;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hd);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.dim,.muted{color:var(--dim)} .small{font-size:13px} .r{text-align:right}
.g,.good{color:var(--g)} .b,.bad{color:var(--b)} .gold{color:var(--gold)}
.eyebrow{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* chunky buttons */
.btn,.go,.ghost,.tab,.tnav button,.seat,.choice,.tbtn,.opt,.club,.tp{border:3px solid var(--edge);border-radius:0;box-shadow:0 4px 0 var(--edge);transition:transform .05s,box-shadow .05s}
.btn:active:not(:disabled),.go:active:not(:disabled),.ghost:active:not(:disabled),.seat:active,.choice:active:not(:disabled),.tbtn:active:not(:disabled),.opt:active:not(:disabled),.club:active,.tp:active:not(:disabled),.tnav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 16px;background:var(--btn);color:var(--btn-ink);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:14px;text-align:center}
.btn.ghost{background:var(--btn2);color:#111}
.btn.sm{min-height:40px;padding:4px 10px;font-size:13px}
.btn.wide,.go{width:100%;margin-top:6px}
.btn:disabled,.go:disabled{background:var(--panel2);color:var(--dim);box-shadow:0 4px 0 var(--edge);cursor:not-allowed}
.go{min-height:56px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-size:28px;text-transform:uppercase;letter-spacing:.05em}
.ghost{background:var(--btn2);color:#111;min-height:44px;padding:6px 12px;font-weight:700;font-size:13px;text-transform:uppercase}
.ghost.on{background:var(--hd);color:var(--hd-ink)}

/* the page frame */
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bar);color:var(--bar-ink);font-family:var(--display);font-size:24px;line-height:1.1;padding:6px 12px;border:3px solid var(--edge);margin-bottom:8px}
.tb-l{display:flex;align-items:center;gap:8px}.tb-r{font-size:20px}
.crest{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);margin-right:6px;vertical-align:-1px}
.tnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;margin-bottom:12px}
.tnav button{background:var(--btn2);color:#111;min-height:44px;font-weight:700;font-size:12px;text-transform:uppercase;padding:4px 2px}
.tnav button.on{background:var(--hd);color:var(--hd-ink)}
.page{display:flex;flex-direction:column;gap:12px}
.blk{border:3px solid var(--edge);background:var(--panel)}
.bh{background:var(--hd);color:var(--hd-ink);font-size:24px;line-height:1.1;padding:4px 10px;border-bottom:3px solid var(--edge)}
.bb{padding:12px}
.bb>p:first-child{margin-top:0}.bb>p:last-child{margin-bottom:0}
.dimblk .bh{background:var(--panel2);color:var(--ink)}
.lead{font-size:16px}
.big{font-family:var(--display);font-size:32px;line-height:1;margin:0 0 4px;color:var(--gold)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:8px 0 0}
.kv dt{color:var(--dim);text-transform:uppercase;font-size:12px;padding-top:2px}.kv dd{margin:0}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:140px}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{text-align:left;font-family:var(--display);font-weight:400;font-size:18px;color:var(--dim);padding:2px 6px;border-bottom:2px solid var(--line)}
.tt td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
.tt tr.me td{background:var(--bar);color:var(--bar-ink);font-weight:700}
.tt .dimrow td{color:var(--dim)}
.scroll{overflow-x:auto}
.bd3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.bd3>div{background:#000;color:var(--gold);border:2px solid var(--edge);padding:6px 8px}
.bd3 small{display:block;color:#9fb0ff;font-size:11px;text-transform:uppercase}
.bd3 b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1}
.st{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 6px;border:2px solid var(--edge);background:var(--panel2)}
.st.ok{background:var(--g);color:#000}.st.warn{background:var(--gold);color:#000}.st.bad{background:var(--b);color:#fff}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:0 4px;border:1px solid currentColor;text-transform:uppercase;vertical-align:1px}
.tag.b{color:var(--b)}
.lst{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lst li{padding-left:14px;position:relative}.lst li:before{content:'›';position:absolute;left:0;color:var(--gold)}
.prom{margin:6px 0;padding-left:18px}
.say{border-left:4px solid var(--gold);padding:4px 0 4px 10px;margin:0 0 10px}.say p{margin:2px 0 0}
.copt{border:3px solid var(--edge);background:var(--panel2);padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.copt p{margin:0}.copt-h{font-family:var(--display);font-size:28px;line-height:1;color:var(--gold)}
.call{border:3px solid var(--edge);background:var(--panel2);padding:12px;margin-bottom:10px;box-shadow:6px 6px 0 var(--edge)}
.call:last-child{margin-bottom:0}.call p{margin:4px 0 8px}
.call-h{font-family:var(--display);font-size:24px;line-height:1.05;color:var(--gold)}
.optrow{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.optrow .btn{align-self:flex-start;text-align:left;justify-content:flex-start}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font-size:12px;padding:0 6px;border:1px solid var(--line);color:var(--dim);background:var(--bg)}
.fx span.g{color:var(--g)}.fx span.b{color:var(--b)}
.knock{border-top:2px dashed var(--line);padding:10px 0}.knock:first-of-type{border-top:0}
.knock p{margin:2px 0 4px}.knock.urg .kh b{color:var(--gold)}.knock.closed{opacity:.5}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.seat{text-align:left;background:var(--btn2);color:#111;padding:10px;min-height:64px;display:flex;flex-direction:column;gap:2px}
.seat b{text-transform:uppercase;font-size:14px}.seat span{font-size:12px}
.seat.on{background:var(--btn);outline:3px solid var(--hd);outline-offset:-6px}
.cstat{border:3px solid var(--edge);padding:8px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.cstat b{font-family:var(--display);font-size:26px;font-weight:400;line-height:1}
.cs-safe b{color:var(--g)}.cs-watched b{color:var(--ink)}.cs-underpressure b{color:var(--gold)}.cs-onthebrink{background:var(--b)}.cs-onthebrink b,.cs-onthebrink span{color:#fff}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;background:#000;color:#fff;border:2px solid var(--edge);padding:10px;margin-bottom:8px}
.fx-t{font-family:var(--display);font-size:28px;line-height:1}.fx-t:last-child{text-align:right}.fx-v{font-family:var(--display);font-size:24px;color:var(--gold)}
.paper{background:var(--paper);color:var(--paper-ink);border:3px solid var(--edge);padding:12px 14px;box-shadow:6px 6px 0 var(--edge)}
.paper p{margin:6px 0}
.pm{font-family:var(--display);font-size:18px;letter-spacing:.08em;border-bottom:3px double #111;padding-bottom:2px;margin-bottom:6px}
.ph{font-family:var(--display);font-size:clamp(34px,7vw,52px);line-height:.95;text-transform:uppercase}
.escore{font-family:var(--display);font-size:28px;margin:6px 0}
.verdict{margin-top:10px;font-family:var(--display);font-size:32px;padding:6px 12px;border:3px solid var(--edge);text-align:center}
.verdict.ok{background:var(--g);color:#000}.verdict.bad{background:var(--b);color:#fff}
.person2{border-top:2px dashed var(--line);padding:8px 0}.person2:first-child{border-top:0}
.ph2{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;text-align:left;padding:0;min-height:44px}
.opn{font-family:var(--display);font-size:28px}

/* start screen */
.hero{padding-block:8px 4px}
.logo{font-family:var(--display);font-size:clamp(56px,13vw,96px);line-height:.85;background:var(--bar);color:var(--bar-ink);display:inline-block;padding:6px 14px 2px;border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge)}
.hero p{max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input{background:var(--btn2);color:#111;border:3px solid var(--edge);border-radius:0;padding:10px 12px;font:inherit;font-size:17px;max-width:420px;min-height:48px}
.modes,.clubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.club{text-align:left;background:var(--btn2);color:#111;padding:12px;display:flex;flex-direction:column;gap:4px}
.club b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1}.club small{font-size:13px}
.club.on{background:var(--btn)}
.club .eyebrow{color:#444}
.traitpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tp{text-align:left;background:var(--btn2);color:#111;padding:8px 10px;min-height:48px}
.tp b{font-weight:700;text-transform:uppercase;font-size:13px}.tp small{display:block;font-size:12px}
.tp.on{background:var(--btn)}.tp:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:13px}

/* player mode (Dutch side mode) in the same retro skin */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bar);color:var(--bar-ink);border:3px solid var(--edge);padding:6px 12px;margin-bottom:10px;font-family:var(--display);font-size:22px}
.brand{font-size:26px}.brand span{color:inherit;text-decoration:underline}
.band{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:12px;border:3px solid var(--edge);background:var(--panel);padding:12px}
.ten{font-family:var(--display);font-size:120px;line-height:.8;background:linear-gradient(to top,var(--tc) var(--c),rgba(160,170,220,.18) var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.tenwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.tier{font-size:12px;font-weight:700;text-transform:uppercase;padding:2px 8px;border:2px solid var(--edge);background:var(--panel2)}
.who h2{font-size:38px;line-height:1}.who .sub{color:var(--dim);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;padding:1px 6px;border:2px solid var(--line)}.chip.me{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.stat{background:#000;color:var(--gold);border:2px solid var(--edge);padding:4px 6px}.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:400;line-height:1}.stat small{color:#9fb0ff;font-size:10px;text-transform:uppercase}
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.panel{border:3px solid var(--edge);background:var(--panel);padding:12px}
.panel h3{font-size:26px;margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.fixture{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.vs{font-family:var(--display);font-size:30px}.vs .at{color:var(--dim);margin:0 6px}
.sel{margin-top:8px;padding:8px;border:2px solid var(--edge);background:var(--panel2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;text-transform:uppercase;padding:2px 8px;border:2px solid var(--edge)}.pill.start{background:var(--g);color:#000}.pill.sub{background:var(--gold);color:#000}.pill.bench,.pill.inj{background:var(--b);color:#fff}
.event{border:3px solid var(--edge);background:var(--panel2);padding:12px;box-shadow:6px 6px 0 var(--edge)}.event h3{font-size:28px;color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice,.tbtn,.opt{text-align:left;background:var(--btn2);color:#111;padding:10px 12px;min-height:48px}
.choice small,.tbtn small,.opt small{display:block;font-size:12px;color:#444}
.choice:disabled,.tbtn:disabled:not(.on),.opt:disabled{opacity:.45;cursor:not-allowed}
.train{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.tbtn b{display:block;text-transform:uppercase;font-size:13px}.tbtn.on{background:var(--btn)}
.feed{display:flex;flex-direction:column;gap:4px;font-size:14px}.feed div{padding-left:10px;border-left:3px solid var(--line)}.feed .g{border-color:var(--g);color:inherit}.feed .b{border-color:var(--b);color:inherit}.feed .y{border-color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tab{background:var(--btn2);color:#111;min-height:44px;font-weight:700;font-size:12px;text-transform:uppercase}.tab.on{background:var(--hd);color:var(--hd-ink)}
.person{border-top:2px dashed var(--line);padding:8px 0}.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;background:none;border:0;text-align:left;padding:0;min-height:44px}
.phead .role{font-size:11px;text-transform:uppercase;color:var(--dim)}.phead .nm{font-family:var(--display);font-size:24px}
.op{font-family:var(--display);font-size:28px}
.opbar{height:6px;background:var(--panel2);border:1px solid var(--line);margin-top:6px;position:relative;overflow:hidden}.opbar i{position:absolute;top:0;bottom:0}
.breakdown{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px}.breakdown div{display:flex;justify-content:space-between;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tbl th{font-family:var(--display);font-weight:400;font-size:18px;color:var(--dim);text-align:right;padding:2px 5px}.tbl td{text-align:right;padding:5px;border-top:1px dashed var(--line)}.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}.tbl tr.mine td{background:var(--bar);color:var(--bar-ink);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border:2px solid var(--edge);margin-right:6px;vertical-align:-1px}
.attr{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:14px;margin:4px 0}.attr .bar{height:10px;background:var(--panel2);border:1px solid var(--line);position:relative}.attr .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}.attr .bar u{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}.attr b{font-family:var(--display);font-size:22px;font-weight:400;text-align:right}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px;background:#000;color:#fff;border:3px solid var(--edge)}
.board .team{font-family:var(--display);font-size:24px;line-height:1}.board .team.r{text-align:right}
.score{font-family:var(--display);font-size:60px;line-height:1;color:var(--gold);text-align:center}.clock{font-family:var(--display);color:#9fb0ff;text-align:center;font-size:20px}
.mstrip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:14px}.log div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}.log .m{color:var(--dim);text-align:right}.log .goal{color:var(--g)}.log .against{color:var(--b)}.log .miss{color:var(--dim)}.log .you{color:var(--gold)}
.moment{border:3px solid var(--edge);background:var(--panel2);padding:12px;box-shadow:6px 6px 0 var(--edge)}.moment h3{font-size:30px;color:var(--gold)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:center}.opt b{text-transform:uppercase;font-size:14px}.opt .pct{font-family:var(--display);font-size:28px;text-align:right}
.result{padding:10px;border:2px solid var(--edge);background:var(--panel2);margin-bottom:10px}
.rating{font-family:var(--display);font-size:72px;line-height:1}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.band{grid-template-columns:minmax(0,1fr)}.ten{font-size:84px}.bd3 b{font-size:22px}.fx-t{font-size:22px}.tbar{font-size:20px}.tb-r{font-size:17px}}
.msg{border-top:2px dashed var(--line)}.msg:first-child{border-top:0}
.mh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;background:none;border:0;text-align:left;padding:10px 0;min-height:48px}
.mh .mfrom{grid-column:1;font-size:12px;color:var(--dim);text-transform:uppercase}.mh b{grid-column:1;font-weight:700}.mh .mwhen{grid-column:2;grid-row:1/3;font-size:11px;color:var(--dim);align-self:center;text-align:right}
.msg.unread .mh b{color:var(--gold)}.msg.unread .mh b:before{content:'● ';color:var(--gold)}
.msg.news .mh b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1}
.mb{padding:0 0 12px}.mb p{margin:0 0 6px}.res{color:var(--g)}
.older{margin-top:8px;border-top:3px solid var(--edge);padding-top:4px;opacity:.85}
.dept{border-top:2px dashed var(--line);padding:8px 0}.dept:first-of-type{border-top:0}.dept p{margin:2px 0}.lvl{color:var(--gold);letter-spacing:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);padding:10px;min-height:120px}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}.tile .th{font-family:var(--display);font-size:26px;line-height:1;color:var(--gold)}
.bar5{display:grid;grid-template-columns:100px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.bar5 i{height:10px;border:1px solid var(--line);background:var(--bg);position:relative}.bar5 b{position:absolute;left:0;top:0;bottom:0;background:var(--gold)}.bar5 em{font-style:normal;text-align:right}
.sub4{font-family:var(--display);font-size:20px;font-weight:400;margin:10px 0 2px;color:var(--dim)}

/* ===================== helpers ===================== */
let RS=(Date.now()^0x9e3779b9)>>>0;const R=()=>{RS=(RS+0x6D2B79F5)>>>0;let t=RS;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}

};

const ATTR={tec:'Techniek',pas:'Passing',vis:'Visie',afw:'Afwerking',dri:'Dribbelen',snl:'Snelheid',kal:'Kalmte',uit:'Uitstraling'};

let S=null, P=null, timer=null;
const SAVE_KEY='spelmaker-v1';
const has=t=>P.traits.includes(t);
const C=role=>S.chars.find(c=>c.role===role);
const team=id=>S.teams[id];
const lastName=()=>P.name.split(' ').slice(1).join(' ')||P.name;

function tier(){const c=P.conf;return c<25?'twijfel':c<60?'normaal':c<85?'vertrouwen':'zone'}
const TIER={twijfel:['Twijfel','var(--bad)'],normaal:['Normaal','var(--chalk)'],vertrouwen:['Vol vertrouwen','var(--flood)'],zone:['In de zone','var(--gold)']};

function flash(m,tone=''){S.flash.push({m,tone})}
function chron(t){S.chron.unshift({s:`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`,w:S.week+1,t})}
function mod(role,t,v,w){const c=C(role);if(!c)return;c.mods=c.mods.filter(m=>m.t!==t);c.mods.push({t,v,w})}
function conf(d){if(d<0&&has('kalm'))d*=.6;if(has('gevoelig'))d*=1.5;const before=P.conf;P.conf=clamp(Math.round(P.conf+d),has('arrogant')?30:0,100);return P.conf-before}
function fit(d){P.fit=clamp(Math.round(P.fit+d),0,100)}
function fans(d){P.fans=clamp(Math.round(P.fans+d),0,100)}
function fame(d){if(d>0&&has('bescheiden'))d*=.7;P.fame=clamp(Math.round(P.fame+d),0,100)}

function compat(c){
  const out=[];
  for(const t of c.traits){
    if(has(t))out.push([`Allebei ${TRAITS[t].n.toLowerCase()}`,10]);
    const o=TRAITS[t].opp; if(o&&has(o))out.push([`${TRAITS[t].n} tegenover ${TRAITS[o].n.toLowerCase()}`,-15]);
  }
  if(has('arrogant'))out.push(['Vindt je arrogant',-10]);
  if(has('bescheiden')&&c.role!=='journalist')out.push(['Waardeert je bescheidenheid',5]);
  if(has('leider')&&['aanvoerder','maatje','sterspeler'].includes(c.role))out.push(['Volgt jouw voorbeeld',8]);
  if(has('feestbeest')&&c.role==='maatje')out.push(['Gezellig in de groep',6]);
  if(c.role==='trainer'){const st=COACH[c.style];
    for(const t of st.likes)if(has(t))out.push([`${st.n}: waardeert ${TRAITS[t].n.toLowerCase()}`,12]);
    for(const t of st.dislikes)if(has(t))out.push([`${st.n}: ergert zich aan ${TRAITS[t].n.toLowerCase()}`,-12]);}
  return out;
}
const opinionParts=c=>[['Eerste indruk',c.base],...compat(c),...c.mods.map(m=>[m.t,m.v])];
const opinion=c=>clamp(opinionParts(c).reduce((s,x)=>s+x[1],0),-100,100);

function mkChar(role,extra={}){
  const keys=Object.keys(TRAITS),tr=[];
  while(tr.length<2){const t=pick(keys);if(tr.includes(t)||tr.some(x=>TRAITS[x].opp===t))continue;tr.push(t)}
  return Object.assign({id:role+ri(1e5,9e5),role,name:nm(),age:ri(22,33),traits:tr,base:0,mods:[]},extra);
}
function clubChars(t){return[
  mkChar('trainer',{age:ri(41,63),style:pick(Object.keys(COACH))}),
  mkChar('aanvoerder',{age:ri(27,33),base:5}),
  mkChar('concurrent',{age:ri(21,29),base:-10,ovr:t.str-8+ri(-3,4),form:[],conf:55}),
  mkChar('maatje',{age:ri(19,24),base:15}),
  mkChar('voorzitter',{age:ri(48,70)}),
]}
const salaryFor=t=>Math.round((t.str-50)*.45*10)/10;

function setClub(i){
  S.club=i; const t=team(i);
  P.salary=salaryFor(t); P.fans=50; P.penTaker=false; P.captain=false;

  if(!keep.length){keep.push(mkChar('zaakwaarnemer',{age:ri(35,58),base:20}),mkChar('journalist',{age:ri(26,55)}))}
  S.chars=[...clubChars(t),...keep];
}
function makeFixtures(){
  const n=8,order=[...Array(n).keys()].sort(()=>R()-.5),arr=order.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push(r%2?[b,a]:[a,b])}rounds.push(m);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));
}
function newSeasonSetup(){
  S.fixtures=makeFixtures(); S.week=0;

  P=S.p; setClub(clubIdx); newSeasonSetup();
  const t=team(clubIdx), tr=C('trainer');

 {id:'pen',title:'Wie neemt de strafschoppen?',text:()=>`De vaste strafschopnemer is vertrokken. Trainer ${C('trainer').name} kijkt de groep rond: "Wie durft?"`,cond:()=>!P.penTaker,ch:[

function addProg(k,pts){P.prog[k]=(P.prog[k]||0)+pts;while(P.prog[k]>=100){P.prog[k]-=100;if(P.attrs[k]<20){P.attrs[k]++;flash(`${ATTR[k]} omhoog naar ${P.attrs[k]}.`,'g')}}}

function startWeek(){
  S.trained=null;S.social=false;S.flash=[];S.selNoise=ri(-5,5);S.event=null;
  if(R()<.65){const el=EVENTS.filter(e=>(!e.cond||e.cond())&&(S.seenEv[e.id]===undefined||S.abs-S.seenEv[e.id]>9));if(el.length)S.event=pick(el).id}
}
const A={};
A.train=k=>{
  if(S.trained)return;const t=TRAIN.find(x=>x.k===k);
  if(S.injured>0&&k!=='rust')return;
  if(t.cost){if(P.money<t.cost){flash('Daar heb je het geld niet voor.','b');return render()}P.money-=t.cost}
  S.trained=k;fit(t.fit);if(t.conf)conf(t.conf);
  const ageF=P.age<=21?1.25:P.age<=25?1:P.age<=29?.7:.4;
  const g=Math.round(32*ageF*(has('leergierig')?1.3:1)*(has('ambitieus')?1.1:1)*(t.mult||1));
  t.at.forEach(a=>addProg(a,g));
  flash(t.at.length?`${t.n}: +${g} voortgang op ${t.at.map(a=>ATTR[a].toLowerCase()).join(' en ')}.`:'Je benen danken je.','');
  render();
};
A.social=(role,k)=>{
  if(S.social)return;const c=C(role),s=(isChair()?SOCIAL_C:SOCIAL).find(x=>x.k===k);
  if(s.cost){if(P.money<s.cost){flash('Daar heb je het geld niet voor.','b');return render()}P.money-=s.cost}
  S.social=true;const[m,t]=s.f(c);flash(m,t);render();
};
A.choose=i=>{

  S.seenEv[e.id]=S.abs;const msg=c.f();flash(msg,'y');S.event=null;render();
};
A.tab=t=>{S.tab=t;render()};
A.open=id=>{S.open=S.open===id?null:id;render()};

/* ===================== match ===================== */
function chance(o,opp){
  if(o.res==='pass')return 100;
  const a=o.a.length?avg(o.a.map(k=>P.attrs[k])):12;
  let c=o.b+(a-12)*3.5+(P.conf-50)*.2-(opp.str-66)*.6;
  const t=tier();if(t==='zone')c+=6;if(t==='twijfel'&&!o.res.startsWith('safe'))c-=8;
  if(has('nuchter')&&o.res.startsWith('safe'))c+=6;if(has('showman')&&o.flair)c+=6;
  return clamp(Math.round(c),5,96);
}
function flairOk(o){return!o.flair||P.conf>=o.flair-(has('showman')?15:0)}
A.goMatch=()=>{
  if(S.event||!S.trained)return;
  const fx=myFixture(),opp=team(fx.opp),me=team(S.club);
  let role=selRole();
  if((role==='start'||role==='sub')&&P.fit<30&&R()<.35){S.injured=ri(1,3);role='inj';chron(`${P.name} raakt geblesseerd in de warming-up. ${S.injured} wk eruit.`)}
  let enter=role==='start'?0:role==='sub'?ri(55,70):role==='bench'&&R()<.25?ri(76,84):99;
  const playing=enter<90;
  const myStr=me.str+(playing?(ovr()-60)*.15:-1);
  const lamUs=1.3*Math.pow(myStr/opp.str,2)*(fx.home?1.1:.92),lamThem=1.3*Math.pow(opp.str/myStr,2)*(fx.home?.92:1.1);
  const ev=[];
  for(let i=poisson(lamUs*(playing?.7:1));i>0;i--)ev.push({min:ri(1,90),type:'gu'});
  for(let i=poisson(lamThem);i>0;i--)ev.push({min:ri(1,90),type:'gt'});
  if(playing){
    if(enter>0)ev.push({min:enter,type:'in'});
    const n=enter===0?ri(4,5):enter<75?2:1;
    for(let i=0;i<n;i++){const pen=R()<.08;ev.push({min:ri(Math.max(enter+2,4),89),type:'mo',m:pen?'pen':pick(MOMENTS.filter(x=>x.id!=='pen')).id})}
  }
  ev.sort((a,b)=>a.min-b.min);
  const intro={start:'Je staat in de basis.',sub:'Je begint op de bank.',bench:'Je zit op de bank. Het kan een lange middag worden.',inj:'Je kijkt vanaf de tribune, met ijs op je enkel.'}[role];
  S.match={opp:opp.id,home:fx.home,ev,i:0,min:0,us:0,them:0,rating:role==='start'?6.4:6.3,role,enter,playing,log:[{min:0,t:`Aftrap. ${intro}`,tone:''}],pending:null,last:null,g:0,a:0,confD:0,done:false,sum:null};
  S.phase='match';render();
};
function stepMatch(){
  const m=S.match;if(m.pending||m.done)return false;
  m.min++;
  while(m.i<m.ev.length&&m.ev[m.i].min<=m.min){
    const e=m.ev[m.i++];
    if(e.type==='gu'){m.us++;if(m.playing&&m.min>=m.enter)m.rating+=.05;m.log.push({min:e.min,t:`Doelpunt ${team(S.club).name}. ${m.us}-${m.them}.`,tone:'goal'})}
    else if(e.type==='gt'){m.them++;if(m.playing&&m.min>=m.enter)m.rating-=.1;m.log.push({min:e.min,t:`Tegengoal. ${team(m.opp).name} scoort.`,tone:'against'})}
    else if(e.type==='in'){m.log.push({min:e.min,t:`Wissel: ${lastName()} komt erin.`,tone:'you'})}
    else if(e.type==='mo'){
      if(e.m==='pen'&&!P.penTaker&&P.conf<60){m.log.push({min:e.min,t:`Strafschop! ${C('aanvoerder').name} neemt hem... `+(R()<.75?(m.us++,'en scoort.'):'en mist.'),tone:''});continue}
      m.pending=e.m;m.last=null;return false;
    }
  }
  if(m.min>=90){finishMatch();return false}
  return true;
}
A.play=(instant)=>{
  if(timer)return;const m=S.match;if(!m||m.pending||m.done)return;
  if(instant||REDUCED){while(stepMatch());render();return}
  timer=setInterval(()=>{const go=stepMatch();if(!go){clearInterval(timer);timer=null;render()}else updateBoard()},45);
};
A.resolve=k=>{
  const m=S.match,mo=MOMENTS.find(x=>x.id===m.pending),o=mo.o.find(x=>x.k===k);
  if(!flairOk(o))return;
  const opp=team(m.opp),c=chance(o,opp),ok=R()*100<c,ln=lastName();
  let d=0,cf=0,tone='you',txt='';
  const counter=p=>{if(R()<p){m.them++;d-=.25;return` De tegenstander schakelt om en scoort: ${m.us}-${m.them}.`}return''};
  switch(o.res){
    case'goal':if(ok){m.us++;m.g++;d+=o.big?1.4:1.1;cf+=o.big?14:7;tone='goal';txt=o.big?`PANENKA! ${ln} schept hem door het midden. Het stadion ontploft.`:`DOELPUNT! ${ln} ${pick(GOALTXT)}`;if(o.big){fans(8);fame(3)}}
      else{d-=o.big?.7:.25;cf-=o.big?12:2;tone='miss';txt=o.big?'De panenka is zacht en voorspelbaar. De keeper blijft gewoon staan.':pick(MISSTXT);if(o.big)fans(-5)}break;
    case'assist':if(ok){if(R()<.62){m.us++;m.a++;d+=.8;cf+=5;tone='goal';txt=`DOELPUNT! ${pick(ASSTXT)} Assist ${ln}.`}else{d+=.25;cf+=1;txt='Prachtige bal, maar de spits schiet hem over.'}}
      else{d-=.2;cf-=2;tone='miss';txt='De pass wordt onderschept.'+counter(.12)}break;
    case'chance':if(ok){if(R()<.5){m.us++;m.g++;d+=1.1;cf+=8;tone='goal';txt=`Erlangs... en binnen! DOELPUNT ${ln}!`}else{d+=.35;cf+=3;txt='Erlangs! Het schot wordt nog net gekeerd.'}}
      else{d-=.3;cf-=3;tone='miss';txt='Balverlies.'+counter(.18)}break;
    case'safe':if(ok){d+=.1;txt='Rustig in balbezit. Niks bijzonders, niks fout.'}else{d-=.4;cf-=4;tone='miss';txt='Slordig! De bal is weg.'+counter(.25)}break;
    case'safeplus':if(ok){d+=.3;cf+=2;txt='Je houdt hem af en wordt neergehaald. Vrije trap, en een knikje van de trainer.'}else{d-=.3;cf-=3;tone='miss';txt='Je verliest het duel.'+counter(.15)}break;
    case'pass':{const cap=C('aanvoerder');mod('aanvoerder','Gaf hem de strafschop',8,8);cf-=has('ambitieus')?5:1;if(R()<.75){m.us++;txt=`${cap.name} schiet hem koel binnen.`;tone='goal'}else{txt=`${cap.name} mist! De keeper heeft hem.`;tone='miss'}}break;
  }
  if(txt.includes('tegenstander schakelt'))tone='against';
  m.rating+=d;const real=conf(cf);m.confD+=real;
  m.log.push({min:m.min,t:txt,tone});m.pending=null;m.last={txt,tone,ok,c,real};
  render();
};
function finishMatch(){
  const m=S.match;m.done=true;m.min=90;
  const res=m.us>m.them?'w':m.us<m.them?'l':'d';
  const lines=[];let cd=0;
  // table: my match
  const me=S.club,op=m.opp,[h,a]=m.home?[me,op]:[op,me],[hg,ag]=m.home?[m.us,m.them]:[m.them,m.us];
  applyResult(h,a,hg,ag);
  // the rest of the round
  for(const [x,y] of S.fixtures[S.week]){if(x===me||y===me)continue;const sx=team(x).str,sy=team(y).str;applyResult(x,y,poisson(1.3*Math.pow(sx/sy,2)*1.1),poisson(1.3*Math.pow(sy/sx,2)*.92))}
  const r=C('concurrent');
  if(m.playing){
    m.rating+=res==='w'?.3:res==='l'?-.3:0;m.rating=Math.round(clamp(m.rating,3,10)*10)/10;
    P.form.push(m.rating);P.st.ratings.push(m.rating);P.st.apps++;P.st.goals+=m.g;P.st.assists+=m.a;
    S.lastRating=m.rating;
    cd+=conf((m.rating-6.6)*4+(res==='w'?2:res==='l'?-2:0));
    fit(m.enter===0?-14:-7);fans((m.rating-6.5)*4);fame(m.g*2+m.a+(m.rating>=8?2:0));
    if(m.rating>=8){mod('trainer',`Uitblinker tegen ${team(op).short}`,8,6);lines.push('De trainer noemt je naam in de persconferentie.')}
    if(m.rating<5.5){mod('trainer',`Zwakke wedstrijd tegen ${team(op).short}`,-6,4);lines.push('De trainer loopt zonder iets te zeggen langs je heen.')}
    if(m.g>=2){chron(`${P.name} scoort ${m.g}x tegen ${team(op).name}.`);mod('maatje','Vierde jouw goals mee',4,6)}
    if(m.enter===0){r.conf=clamp(r.conf-3,0,100)}else{r.form.push(Math.round((6.4+(r.ovr-60)/18+(R()-.5)*1.4)*10)/10)}
  }else{
    S.lastRating=null;
    cd+=conf(m.role==='inj'?-1:has('ambitieus')?-7:has('tevreden')?-1:-4);fit(m.role==='inj'?5:8);
    r.form.push(Math.round((6.5+(r.ovr-60)/18+(R()-.5)*1.4)*10)/10);r.conf=clamp(r.conf+3,0,100);
    if(m.role!=='inj')lines.push(`${r.name} speelt de hele wedstrijd op jouw positie.`);
  }
  if(res==='w'&&P.captain)lines.push('Als aanvoerder ga je voorop in de polonaise.');
  m.sum={res,cd:m.confD+cd,lines};
  P.form=P.form.slice(-10);r.form=r.form.slice(-10);
}
function applyResult(h,a,hg,ag){
  const H=S.table[h],Aw=S.table[a];H.p++;Aw.p++;H.gf+=hg;H.ga+=ag;Aw.gf+=ag;Aw.ga+=hg;
  if(hg>ag){H.w++;H.pts+=3;Aw.l++}else if(hg<ag){Aw.w++;Aw.pts+=3;H.l++}else{H.d++;Aw.d++;H.pts++;Aw.pts++}
}
A.afterMatch=()=>{
  S.match=null;S.week++;S.abs++;S.startBonus=0;S.rivalPenalty=0;
  for(const c of S.chars){c.mods.forEach(m=>m.w--);c.mods=c.mods.filter(m=>m.w>0)}
  P.conf=clamp(Math.round(P.conf+(50-P.conf)*.1),has('arrogant')?30:0,100);
  fit(has('professioneel')?14:has('feestbeest')?6:10);
  P.money=Math.round((P.money+P.salary)*10)/10;
  if(S.injured>0)S.injured--;
  if(S.week>=14){seasonEnd();return render()}
  S.phase='week';startWeek();render();window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
};

/* ===================== season end ===================== */
function seasonEnd(){
  const tbl=sortedTable(),pos=tbl.findIndex(r=>r.id===S.club)+1,t=team(S.club);
  const avgR=avg(P.st.ratings),yy=`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
  if(pos===1){S.trophies.push(`Landskampioen ${yy}, ${t.name}`);chron(`${t.name} is kampioen!`);fame(10)}
  if(avgR>=7.3&&P.st.apps>=8){S.trophies.push(`Speler van het jaar ${yy}`);chron(`${P.name} is speler van het jaar.`);fame(8)}
  S.seasons.push({yy,club:t.name,pos,apps:P.st.apps,goals:P.st.goals,assists:P.st.assists,avg:avgR?avgR.toFixed(2):'-'});
  P.car.apps+=P.st.apps;P.car.goals+=P.st.goals;P.car.assists+=P.st.assists;
  // offers
  const offers=[];
  for(const x of S.teams){if(x.id===S.club)continue;const sc=ovr()+(avgR?(avgR-6.5)*10:-8)+P.fame/4+ri(-8,8);if(sc>=x.str-6)offers.push({id:x.id,salary:Math.round(salaryFor(x)*(1+P.fame/200)*10)/10})}
  offers.sort((a,b)=>team(b.id).str-team(a.id).str);
  const vo=opinion(C('voorzitter'));
  const renew=vo>-30?Math.round(P.salary*(vo>30?1.3:vo>0?1.12:1)*10)/10:null;
  let list=offers.slice(0,3);
  if(!list.length&&renew===null){const low=S.teams.filter(x=>x.id!==S.club).sort((a,b)=>a.str-b.str)[0];list=[{id:low.id,salary:salaryFor(low)}]}
  S.offers={list,renew,pos,avgR};
  S.phase='season';
}
A.next=target=>{
  if(target==='retire'){S.phase='retired';chron(`${P.name} stopt met voetballen.`);return render()}
  P.age++;S.season++;S.year++;
  if(P.age<=23)for(let i=0;i<2;i++){const k=pick(Object.keys(ATTR));if(P.attrs[k]<20)P.attrs[k]++}
  if(P.age>=30){for(let i=0;i<P.age-29;i++){const k=R()<.5?'snl':pick(['dri','tec','afw','kal']);if(P.attrs[k]>1)P.attrs[k]--}}
  for(const x of S.teams)x.str=clamp(x.str+ri(-3,3),52,84);
  const r=C('concurrent');
  if(target==='stay'){P.salary=S.offers.renew;chron(`${P.name} tekent bij voor een nieuw seizoen.`);
    if(r){r.age++;r.ovr+=r.age<25?ri(1,3):r.age>30?-ri(1,2):0;r.form=[]}
    if(!P.captain&&has('leider')&&opinion(C('aanvoerder'))>40&&opinion(C('trainer'))>30){P.captain=true;chron(`${P.name} krijgt de aanvoerdersband.`)}
  }else{const o=S.offers.list.find(x=>x.id===target);chron(`Transfer: ${P.name} vertrekt naar ${team(target).name}.`);setClub(target);P.salary=o.salary}
  P.conf=clamp(Math.round((P.conf+55)/2),0,100);P.fit=95;P.form=[];
  newSeasonSetup();S.offers=null;S.phase='week';startWeek();render();window.scrollTo({top:0});
};

/* ===================== rendering ===================== */
function render(){
  if(timer&&S?.phase!=='match'){clearInterval(timer);timer=null}
  const app=document.getElementById('app');
  if(!S){app.innerHTML=startView();return}
  P=S.p;
  if(isChair()){renderChair(app);save();return}
  if(S.phase==='retired'){app.innerHTML=topbar()+retiredView();save();return}
  app.innerHTML=topbar()+band()+(S.phase==='season'?seasonView():`<div class="game"><div class="stack">${S.phase==='match'?matchView():weekView()}</div><aside class="panel">${sideView()}</aside></div>`);
  const lg=document.getElementById('log');if(lg)lg.scrollTop=lg.scrollHeight;
  save();
}

const isChair=()=>S&&S.mode==='chair';
const fm=v=>{const neg=v<0,a=Math.abs(v);const s=a>=1000?`£${(a/1000).toFixed(a>=10000?0:1)}m`:a<10&&a>0?`£${a.toFixed(1)}k`:`£${Math.round(a)}k`;return(neg?'−':'')+s};
const fw=v=>`${fm(v)}/w`;
const T=()=>DIV[S.cl.tier];const tm=()=>T().m;
const ord=n=>n+(n===1?'st':n===2?'nd':n===3?'rd':'th');
const r1=v=>Math.round(v*10)/10;
const wageFor=(r,tier)=>r1(.8*Math.pow(r/47,4)*DIV[tier].pay*(S&&S.cl&&S.cl.semi?.5:1));
const valueFor=(p,tier)=>Math.round(wageFor(p.r,tier)*60*(p.age<22?1.6:p.age<26?1.3:p.age>31?.45:1));
const uid=()=>'u'+(S.uid=(S.uid||0)+1);
const CH=role=>S.chars.find(c=>c.role===role);
const head=k=>CH(DEPT[k].head);
const hasDNA=k=>S.cl.dna.includes(k);
function remember(role,t,v){const c=CH(role);if(!c)return;c.mods=c.mods.filter(m=>m.t!==t);c.mods.push({t,v,w:999,mem:true})}
const opC=c=>clamp(c.base+c.mods.reduce((s,m)=>s+m.v,0)+c.traits.reduce((s,t)=>s+(has(t)?8:TRAITS[t].opp&&has(TRAITS[t].opp)?-10:0),0),-100,100);
const relWord=c=>{const o=opC(c);return o>=30?'Loyal':o>=10?'Warm':o>-10?'Neutral':o>-30?'Cool':'Hostile'};
const relCls=w=>({Loyal:'g',Warm:'g',Neutral:'',Cool:'b',Hostile:'b'})[w];
function trustD(d){S.trust=clamp(Math.round(S.trust+d),0,100)}
function idD(k,d){S.cl.id[k]=clamp(Math.round(S.cl.id[k]+d),0,100)}
function cuD(k,d){S.cl.cu[k]=clamp(Math.round(S.cl.cu[k]+d),0,100)}
/* ---------- ledger (P0: one debit per payment, financing separate) ---------- */
// kinds: inc (operating income), out (operating cost), capex (investment), fin (loans in, repayments out: signed)
function book(kind,cat,amt){amt=r1(amt);if(!amt)return;S.cl.cash=r1(S.cl.cash+(kind==='inc'||kind==='fin'?amt:-amt));const L=S.led[kind]||(S.led[kind]={});L[cat]=r1((L[cat]||0)+amt)}
const sumL=o=>r1(Object.values(o||{}).reduce((s,v)=>s+v,0));
const reconcile=()=>r1(S.led.open+sumL(S.led.inc)-sumL(S.led.out)-sumL(S.led.capex)+sumL(S.led.fin)-S.cl.cash);
const debt=()=>Math.round(S.cl.loans.reduce((s,l)=>s+l.repay*l.weeks,0));
function takeLoan(amount,why){const rate=hd('finance').style==='fund'?1.08:1.12,weeks=26,repay=r1(amount*rate/weeks);S.cl.loans.push({amount,repay,weeks,why});book('fin','Loans received',amount);chron(`Loan ${fm(amount)} (${why}): ${fw(repay)} for ${weeks} weeks.`);return repay}
const hd=k=>S.dept[k];
const MANDF={low:.4,med:.8,high:1};
const mandAmt=(k,m)=>{m=m||hd(k).mandate;return k==='football'?Math.max(5*tm(),Math.round(hd(k).budget*MANDF[m])):MANDATE[m][0]*tm()};
const budLeft=k=>r1(hd(k).budget-hd(k).spent);
const projActive=k=>S.projects.some(p=>p.k===k);
const deptBusy=(k,need)=>capFree(k)<(need||3);

/* ---------- money ---------- */
function attendance(derby){const form=(S.teams[0].form||[]).slice(-3).filter(r=>r==='W').length;return Math.min(S.cl.cap,Math.round(S.cl.fans*(.45+S.trust/140+form*.03+S.cl.id.community/400)*clamp(1.25-.25*S.cl.price,.6,1.1)*(derby?1.3:1)))}
const ticket=()=>Math.round(T().price*S.cl.price);
const playerWages=()=>r1(S.squad.reduce((s,p)=>s+p.wage,0));
const staffWages=()=>r1(S.chars.filter(c=>c.wage).reduce((s,c)=>s+c.wage,0)+S.cl.staffExtra.reduce((s,x)=>s+x.pw,0));
const sponsorW=()=>r1(S.cl.sponsors.reduce((s,x)=>s+x.pw,0));
const duesW=()=>r1(S.cl.members*S.cl.dues/52/1000);
const maintW=()=>r1(.3*tm()+S.cl.training*.3*tm()+S.cl.academyB*.3*tm()+S.cl.cap/1000*.15*tm());
const rentW=()=>r1(S.cl.rent+(S.cl.training===0?.4*tm():0));
const repayW=()=>r1(S.cl.loans.reduce((s,l)=>s+l.repay,0));
const incomeW=()=>r1(T().tv+sponsorW()+duesW()+attendance()*ticket()/1000/2+S.cl.hosp/2);
const opCostW=()=>r1(playerWages()+staffWages()+Math.max(0,maintW()-S.cl.saving)+rentW());
const costW=()=>r1(opCostW()+repayW());
const available=()=>r1(S.cl.cash-S.cl.reserve-Object.keys(S.dept).reduce((s,k)=>s+Math.max(0,budLeft(k)),0));
function payWeek(home,derby){
  book('inc','TV & prize money',T().tv);book('inc','Sponsorship',sponsorW());book('inc','Membership dues',duesW());
  if(home){const a=attendance(derby);book('inc','Matchday',a*ticket()/1000);book('inc','Hospitality',S.cl.hosp);S.cl.lastAtt.push(a/S.cl.cap);S.cl.lastAtt=S.cl.lastAtt.slice(-3)}
  book('out','Player wages',playerWages());book('out','Staff wages',staffWages());book('out','Maintenance',Math.max(0,maintW()-S.cl.saving));book('out','Ground & pitch rent',rentW());
  if(repayW())book('fin','Loan repayments',-repayW());
  S.cl.loans.forEach(l=>l.weeks--);S.cl.loans=S.cl.loans.filter(l=>l.weeks>0);
  S.cl.sponsors.forEach(x=>x.weeks--);const gone=S.cl.sponsors.filter(x=>x.weeks<=0);S.cl.sponsors=S.cl.sponsors.filter(x=>x.weeks>0);
  gone.forEach(x=>{const d=S.dossiers.find(d=>d.sponsor===x.name&&d.status!=='closed');if(d&&d.status==='working')dossierNote(d,`${x.name} deal ended; the search for a replacement continues.`);else if(d)dossierClose(d,`${x.name} deal ended without a renewal. ${fw(x.pw)} stops.`);else msg('commercial',`${x.name} deal ended`,`Our deal with ${x.name} (${fw(x.pw)}) has run out.`)});
}
/* dated forecast (P1): uses the real fixture list, sponsor end dates, loan schedules. Unsigned income is excluded. */
function forecast(extra=0){
  let c=S.cl.cash-extra;const out=[];const sp=S.cl.sponsors.map(x=>({pw:x.pw,w:x.weeks})),ln=S.cl.loans.map(l=>({r:l.repay,w:l.weeks}));
  for(let i=S.ti;i<S.tl.length;i++){const st=S.tl[i];if(st.t==='plan'||st.t==='agm')continue;let home=false;
    if(st.t==='match'){const m=S.fixtures[st.r].find(x=>x.includes(0));home=m[0]===0}
    const inc=T().tv+duesW()+sp.reduce((s,x)=>s+(x.w>0?x.pw:0),0)+(home?attendance()*ticket()/1000+S.cl.hosp:0);
    const outc=opCostW()+ln.reduce((s,l)=>s+(l.w>0?l.r:0),0);
    c+=inc-outc;sp.forEach(x=>x.w--);ln.forEach(l=>l.w--);out.push({i,label:labelAt(i),cash:Math.round(c),home,ends:S.cl.sponsors.filter((x,j)=>sp[j].w===0).map(x=>x.name)})}
  return out}
const forecastLow=(x=0)=>{const f=forecast(x);return Math.round(Math.min(S.cl.cash-x,...f.map(p=>p.cash)))};
/* shared feasibility (P1): never auto-borrow, never auto-create budget */
function feas(cost,dept,opts={}){const r=[];let hard=false;
  if(dept&&!opts.ignoreBusy&&deptBusy(dept)){r.push(`${DEPT[dept].n} is busy with other work`);hard=true}
  if(S.cl.cash<cost){r.push(`Not enough cash (${fm(S.cl.cash)})`);hard=true}
  const short=dept?r1(cost-budLeft(dept)):0;if(dept&&short>0)r.push(`${DEPT[dept].n} budget is ${fm(short)} short`);
  const low=forecastLow(cost);if(low<S.cl.reserve)r.push(`cash would dip to ${fm(low)}, below the ${fm(S.cl.reserve)} reserve`);
  return{ok:!r.length,hard,short:Math.max(0,short),low,reasons:r}}

/* ---------- inbox: decisions are data (P0), effects run through one gateway ---------- */
const EFF={
  mod:(role,t,v,w)=>mod(role,t,v,w),mem:(role,t,v)=>remember(role,t,v),trust:d=>trustD(d),id:(k,d)=>idD(k,d),cu:(k,d)=>cuD(k,d),
  out:(cat,a)=>book('out',cat,a),inc:(cat,a)=>book('inc',cat,a),budget:(k,a)=>{S.dept[k].budget=r1(S.dept[k].budget+a)},flag:(k,v)=>{S.flags[k]=v},
  cmd:(name,...a)=>CMD[name](...a)};
function runOpt(o){let r=o.r||'';for(const e of o.e||[]){const [t,...a]=e;const x=EFF[t](...a);if(typeof x==='string')r=x}return r}
function msg(from,subject,body,opts,def,kind,dossier){
  opts=(opts||[]).map(o=>({n:o.n,fx:typeof o.fx==='function'?o.fx():(o.fx||''),e:o.e||[],r:o.r||''}));
  const m={id:uid(),from,subject,body,opts,def:def===undefined?null:def,kind:kind||(opts.length?'decision':'report'),read:false,done:!opts.length,when:stepLabel(),dossier:dossier||null};
  S.inbox.unshift(m);const open=S.inbox.filter(x=>!x.done),closed=S.inbox.filter(x=>x.done).slice(0,70);S.inbox=S.inbox.filter(x=>!x.done||closed.includes(x));
  if(dossier){const d=S.dossiers.find(x=>x.id===dossier);if(d)d.msgs.push(m.id)}return m}

function runMatch(fx,opp,xi){
  const co=CH('coach'),my=avg(xi.map(p=>p.r))+(co.q-3)+(fx.home?1.5:-1),os=opp.str+(fx.home?-1:1.5),oxi=oppXI(opp);
  const poss=clamp(.5+(my-os)/60,.28,.72),ev=[],st={sh:[0,0],ot:[0,0]},rat={};xi.forEach(p=>rat[p.id]=6.3+R()*.4);

  for(let seg=0;seg<18;seg++){
    if(seg===9)ev.push({min:45,t:'ht',txt:`Half-time: ${fx.home?S.cl.name:opp.name} ${sc()} ${fx.home?opp.name:S.cl.name}.`});

      st.sh[side]++;const r=R();

  spread:{n:'Reduce dependence on one sponsor',owner:'commercial',metric:()=>{const t=sponsorW();return t?Math.round(Math.max(...S.cl.sponsors.map(x=>x.pw))/t*100):100},fmt:v=>`largest ${v}%`,good:(v,t)=>v<=t,def:()=>50,tl:t=>`no sponsor above ${t}% of sponsor income`},
  crowds:{n:'Fill the ground',owner:'commercial',metric:()=>S.cl.lastAtt.length?Math.round(avg(S.cl.lastAtt)*100):0,fmt:v=>`${v}% full`,good:(v,t)=>v>=t,def:()=>90,tl:t=>`home games ${t}% full`},
  resilience:{n:'Financial resilience',owner:'finance',metric:()=>forecastLow(),fmt:v=>`lowest ${fm(v)}`,good:(v,t)=>v>=t,def:()=>S.cl.reserve,tl:t=>`cash never below ${fm(t)} before May`}};
const objActual=o=>OBJ[o.type].metric(),objOk=o=>OBJ[o.type].good(objActual(o),o.target);
const hasObj=t=>(S.objectives||[]).some(o=>o.type===t);
A.addObj=t=>{S.objectives=S.objectives||[];if(hasObj(t)||S.objectives.length>=3)return;const O=OBJ[t];if(t==='pathway'&&CH('coach').style!=='young')mod('coach','Asked to give academy players minutes',-4,16);S.objectives.push({id:uid(),type:t,target:O.def(),set:stepLabel(),priority:S.objectives.length+1});mod(O.owner,'Given a clear objective',4,10);msg(O.owner,`New objective: ${O.n}`,`Target: ${O.tl(S.objectives[S.objectives.length-1].target)} by May. ${objPlanLine(t)}`);render()};
A.dropObj=id=>{S.objectives=(S.objectives||[]).filter(o=>o.id!==id);render()};
function objPlanLine(t){const h=head(OBJ[t].owner),st=hd(OBJ[t].owner).style;
  return({promotion:`${h.name}: "${st==='results'?'I will buy experience and ask the coach for results first.':'Young players need minutes; promotion this year would be a bonus.'}"`,
    pathway:`${h.name}: "I will press the coach for minutes and keep the U18s close to the first team."${CH('coach').style==='young'?'':` ${CH('coach').name} plays ${CSTYLES[CH('coach').style].toLowerCase()}, so this will need your backing.`}`,
    schools:`${h.name}: "${st==='local'?'Partnerships are my strength; coaching capacity is the limit.':'I would rather have one specialist than five schools, but I will try."'}"`,
    sponsors:`${h.name}: "${st==='growth'?'Bigger regional deals.':'More local partners; it takes longer.'}" Renewals will aim higher.`,
    spread:`${h.name}: "I will look for new categories instead of relying on one name." Renewals will favour new partners.`,
    crowds:`${h.name}: "Results, prices and the local community fill the ground."`,
    resilience:`${h.name}: "I will hold discretionary spending back when the forecast dips below the reserve."`})[t]}
/* ---------- capacity (abstract units, synthetic until calibrated) ---------- */
const CAP0={football:10,academy:8,commercial:8,finance:8};
const capTotal=k=>CAP0[k]+S.cl.staffExtra.filter(x=>x.dept===k).reduce((s,x)=>s+(x.cap||3),0);
const capRoutine=k=>k==='football'?4+Math.round(S.squad.length/6):k==='academy'?2+Math.round((S.academy||[]).length/5):k==='commercial'?2+S.cl.sponsors.length:3+S.cl.loans.length+(S.projects.some(p=>p.capex)?1:0);
const capInit=k=>S.projects.filter(p=>p.dept===k&&!p.capex).reduce((s,p)=>s+(p.ext?1:(p.capU||3)),0);
const capFree=k=>capTotal(k)-capRoutine(k)-capInit(k);
const STAFFOPT={football:['Assistant coach',.35],academy:['Part-time youth coach',.25],commercial:['Commercial assistant',.25],finance:['Bookkeeper',.2]};
A.addStaff=k=>{const[n,base]=STAFFOPT[k],pw=r1(base*tm());S.cl.staffExtra.push({n,pw,dept:k,cap:3});mod(DEPT[k].head,'Got extra staff',6,14);msg(DEPT[k].head,`${n} hired`,`+3 capacity for ${DEPT[k].n.toLowerCase()}. Wages +${fw(pw)}, a rolling contract.`);render()};
function capBar(k){const t=capTotal(k),r=capRoutine(k),i=capInit(k),f=Math.max(0,t-r-i);const pc=v=>Math.round(v/t*100);
  return`<div class="capbar"><i class="cr" style="width:${pc(Math.min(r,t))}%"></i><i class="ci" style="width:${pc(Math.min(i,Math.max(0,t-r)))}%"></i></div><p class="small num">Capacity ${t}: routine ${r} · initiatives ${i} · free <b class="${f<3?'b':'g'}">${f}</b>${t-r-i<0?' <span class="b">(overloaded)</span>':''}</p>`}
/* ---------- head's assessment, derived from state ---------- */
function assess(k){const f=capFree(k),out=[];
  if(k==='academy'){const u18=(S.academy||[]).filter(x=>x.age>=17);out.push(`${S.cl.network} schools, ${(S.academy||[]).length} players in the pipeline, ${u18.length} in their last year.`);if(f<3)out.push('Coaching is the bottleneck: strengthen coaching before expanding.');else if(hasObj('schools')&&S.cl.network<(S.objectives.find(o=>o.type==='schools')||{}).target)out.push('Room to add a school partnership.')}
  if(k==='football'){const exp=S.squad.filter(p=>p.contract<=1&&!p.loan).length,inj=S.squad.filter(p=>p.inj).length;out.push(`${ord(myPos())}, expected ${ord(S.expected)}. ${exp} contract${exp===1?'':'s'} ending, ${inj} injured.`);if(hasObj('pathway')&&CH('coach').style!=='young')out.push(`The coach prefers ${CSTYLES[CH('coach').style].toLowerCase()}; the pathway objective pulls the other way.`)}
  if(k==='commercial'){const nx=S.cl.sponsors.slice().sort((a,b)=>a.weeks-b.weeks)[0];out.push(`${S.cl.sponsors.length} sponsors, ${fw(sponsorW())}.${nx?` Next renewal: ${nx.name} in ${nx.weeks} weeks.`:''}`);if(S.cl.lastAtt.length&&avg(S.cl.lastAtt)>.95)out.push('Demand exceeds capacity.')}
  if(k==='finance'){const low=forecastLow();out.push(`Lowest point before May ${fm(low)} against a ${fm(S.cl.reserve)} reserve.`);if(low<S.cl.reserve)out.push('Discretionary spending should wait unless you accept the risk.')}
  if(f<0)out.push('The department is overloaded; work will slip.');
  return out.join(' ')}
function deptObjectives(k){const os=(S.objectives||[]).filter(o=>OBJ[o.type].owner===k||(OBJ[o.type].contrib||[]).includes(k));return os.length?os.map(o=>{const a=objActual(o),ok=objOk(o);return`<div class="objrow"><b>${OBJ[o.type].n}</b>${OBJ[o.type].owner!==k?' <span class="dim small">(contributes)</span>':''}<span class="num ${ok?'g':'b'}">${OBJ[o.type].fmt(a)} / target ${OBJ[o.type].fmt(o.target)}</span></div>`}).join(''):'<p class="dim small">No club objective for this department. Set one under Club.</p>'}
/* ---------- the cross-department tradeoff: academy expansion vs coaching capacity ---------- */
function academyConflict(){
  if(S.flags.acConflict===S.season)return;const want=hasObj('schools')||hasObj('pathway')||hd('academy').style==='local';
  if(!want||capFree('academy')>=3)return;
  S.flags.acConflict=S.season;const pw=r1(STAFFOPT.academy[1]*tm()),low=forecastLow(pw*20),cut=Math.round(Math.min(budLeft('football'),8*tm()));
  const d=dossierOpen('Academy expansion vs coaching load','academy',`${head('academy').name} wants to grow the academy, but coaching capacity is full (free ${capFree('academy')} of ${capTotal('academy')}). Finance: the forecast low with an extra coach is ${fm(low)} (reserve ${fm(S.cl.reserve)}).`,{});
  msg('academy','Academy expansion: we need to choose',`Coaching capacity is full. ${head('finance').name} (finance): "An extra coach takes the lowest point to ${fm(low)}." ${head('commercial').name} (commercial): "I could look for a local academy sponsor, if I have room." ${head('football').name} (football): "Do not take it from my recruitment budget."`,[
    {n:'Delay the expansion',fx:'No cost · the academy grows later · academy manager −4',e:[['mod','academy','Expansion delayed',-4,12]],r:'Delayed until capacity frees up.'},
    {n:`Hire a part-time youth coach (${fw(pw)})`,fx:`+3 academy capacity · wages +${fw(pw)}${low<S.cl.reserve?' · forecast dips below reserve':''}`,e:[['cmd','hireStaff','Part-time youth coach',pw,'academy',false],['mod','academy','Got a coach',6,14]]},
    {n:'Ask Commercial to find an academy sponsor',fx:capFree('commercial')>=3?'Commercial works on it for 3 weeks · if it lands, it pays for a coach':'Commercial has no free capacity right now',e:[['cmd','acSponsor']]},
    {n:`Move ${fm(cut)} from recruitment to the academy`,fx:`Football budget −${fm(cut)} · academy +${fm(cut)} · TD −8`,e:[['budget','football',-cut],['budget','academy',cut],['mod','td','Lost recruitment money to the academy',-8,16],['cmd','hireStaff','Part-time youth coach',pw,'academy',false]]}],0,'decision',d.id);
}
CMD.acSponsor=()=>{if(capFree('commercial')<3)return'Commercial has no capacity; nothing happens.';S.projects.push({id:uid(),dept:'commercial',k:'acSponsor',n:'Academy sponsor search',cost:0,paid:0,weeks:3,left:3,capU:3});return'Commercial is looking for an academy sponsor.'};
const _projDone0=projDone;
projDone=function(p){if(p.k!=='acSponsor')return _projDone0(p);if(R()<.55+(head('commercial').stars-3)*.1){const name=`${pick(['Bakery','Builders','Opticians','Dental'])} ${pick(LN)} Youth Fund`,pw=r1(STAFFOPT.academy[1]*tm()*1.1);S.cl.sponsors.push({name,pw,weeks:30,local:true,sat:60});S.cl.staffExtra.push({n:'Part-time youth coach',pw:r1(STAFFOPT.academy[1]*tm()),dept:'academy',cap:3});idD('community',3);msg('commercial',`Academy sponsor: ${name}`,`${fw(pw)} for 30 weeks, enough to fund a part-time youth coach (+3 academy capacity).`)}else msg('commercial','No academy sponsor found','Nobody local wanted to fund the academy right now. We can try again later.')};
/* ---------- weekly briefing and monthly report ---------- */
function snapBrief(){S.brief0={cash:S.cl.cash,pos:S.week?myPos():null,trust:S.trust,label:stepLabel(),projects:S.projects.map(p=>p.id),inboxIds:S.inbox.map(m=>m.id)}}
function briefCard(){const b=S.brief0;if(!b)return'';const dc=r1(S.cl.cash-b.cash),pos=S.week?myPos():null,newMsgs=S.inbox.filter(m=>!b.inboxIds.includes(m.id)),done=newMsgs.filter(m=>/^(Started|Result|New sponsor|New partner|Findings|.*hired|Academy sponsor)/.test(m.subject)).length,calls=S.inbox.filter(m=>!m.done&&m.kind==='decision').length;
  const lm=(S.matches||[])[0],nexts=[...S.cl.sponsors.filter(x=>x.weeks<=8).map(x=>`${x.name} renewal (${x.weeks} wk)`),...S.projects.filter(p=>p.left<=2).map(p=>`${p.n} (${p.left} wk)`)].slice(0,3);
  return sec(`THIS WEEK · SINCE ${esc(b.label).toUpperCase()}`,`<dl class="kv"><dt>Result</dt><dd>${lm&&lm.date===CAL[Math.max(0,S.week-1)]?`<button class="linkbtn" onclick="A.match('${lm.id}')">${esc(lm.score)}</button>`:'No match'}</dd><dt>Cash</dt><dd class="num">${fm(S.cl.cash)} (${dc>=0?'+':''}${fm(dc)})</dd>${pos?`<dt>League</dt><dd>${ord(pos)}${b.pos&&b.pos!==pos?` (was ${ord(b.pos)})`:''}</dd>`:''}<dt>Members</dt><dd class="num">${S.trust}%${b.trust!==S.trust?` (${S.trust-b.trust>0?'+':''}${S.trust-b.trust})`:''}</dd><dt>Club</dt><dd>${newMsgs.length} new message${newMsgs.length===1?'':'s'}${done?`, ${done} outcome${done>1?'s':''}`:''}${calls?` · <b class="gold">${calls} need you</b>`:''}</dd>${nexts.length?`<dt>Coming up</dt><dd>${esc(nexts.join(' · '))}</dd>`:''}${(S.objectives||[]).length?`<dt>Objectives</dt><dd>${S.objectives.map(o=>`<span class="${objOk(o)?'g':'b'}">■</span> ${OBJ[o.type].n}`).join('<br>')}</dd>`:''}</dl>`,'brief')}
function monthlyReport(r){if(r%4!==3||!(S.objectives||[]).length)return;
  msg('board','Monthly management report',S.objectives.map(o=>{const a=objActual(o),ok=objOk(o),O=OBJ[o.type];return`${O.n}: ${O.fmt(a)} against ${O.fmt(o.target)} (${ok?'on track':'behind'}). ${head(O.owner).name}: ${ok?'"Keep going."':capFree(O.owner)<3?'"We lack capacity."':'"We need more time or resources."'}`}).join(' ')+` Capacity: ${Object.keys(DEPT).map(k=>`${DEPT[k].n} ${Math.max(0,capFree(k))} free`).join(', ')}.`)}
