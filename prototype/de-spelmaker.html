<title>De Spelmaker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: floodlit pitch at night. Player band on top, the week or the match in the middle, the web of people on the side. */
:root{
  --turf:#0c1b15; --turf-stripe:#0f2019; --panel:#132a20; --panel-2:#1a372a; --line:#2c4c3d;
  --chalk:#eef2e6; --muted:#9db3a6; --flood:#f4b83a; --flood-ink:#1d1606;
  --good:#71d091; --bad:#f06c52; --gold:#ffe08a;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--turf);color:var(--chalk)}
body{font-family:var(--body);font-size:15px;line-height:1.45;
  background:repeating-linear-gradient(90deg,var(--turf) 0 90px,var(--turf-stripe) 90px 180px);min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .gold{color:var(--gold)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.08em}
.brand span{color:var(--flood)}
.top .meta{color:var(--muted);font-family:var(--display);font-size:16px;letter-spacing:.04em}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}

/* player band */
.band{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-bottom:16px}
.ten{font-family:var(--display);font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.04em;
  background:linear-gradient(to top,var(--tc) var(--c),rgba(238,242,230,.10) var(--c));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-top:6px;user-select:none;transition:--c .6s}
.tenwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.tier{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700;padding:2px 10px;border-radius:2px;background:var(--panel-2)}
.who h2{font-size:34px;line-height:1}
.who .sub{color:var(--muted);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--chalk);background:var(--panel)}
.chip.me{border-color:var(--flood);color:var(--flood)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:12px}
.stat{border-left:2px solid var(--line);padding-left:10px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

/* layout */
.game{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel h3{font-size:20px;margin-bottom:8px}

/* fixture */
.fixture{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.vs{font-family:var(--display);font-size:28px;font-weight:700}
.vs .at{color:var(--muted);font-size:18px;margin:0 6px}
.sel{margin-top:10px;padding:10px 12px;border-radius:3px;background:var(--panel-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;padding:2px 9px;border-radius:2px}
.pill.start{background:var(--good);color:#082012}
.pill.sub{background:var(--flood);color:var(--flood-ink)}
.pill.bench,.pill.inj{background:var(--bad);color:#2a0a04}

/* event card */
.event{border:1px solid var(--flood);background:linear-gradient(180deg,rgba(244,184,58,.10),transparent 60%),var(--panel);border-radius:4px;padding:16px}
.event h3{font-size:24px;color:var(--gold)}
.event p{margin:6px 0 12px;max-width:62ch}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.choice:hover:not(:disabled){border-color:var(--flood)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice small{display:block;color:var(--muted);font-size:12px}

/* training */
.train{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tbtn{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px;min-height:72px}
.tbtn b{display:block;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.15}
.tbtn small{color:var(--muted);font-size:12px}
.tbtn.on{border-color:var(--flood);box-shadow:inset 0 0 0 1px var(--flood)}
.tbtn:disabled:not(.on){opacity:.4;cursor:not-allowed}
.feed{display:flex;flex-direction:column;gap:4px;font-size:14px}
.feed div{padding-left:10px;border-left:2px solid var(--line)}
.feed .g{border-color:var(--good)} .feed .b{border-color:var(--bad)} .feed .y{border-color:var(--flood)}
.go{width:100%;background:var(--flood);color:var(--flood-ink);border:0;border-radius:3px;padding:14px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.go:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 12px;font-family:var(--display);font-weight:600;letter-spacing:.04em}
.ghost:hover{border-color:var(--flood)}

/* tabs */
.tabs{display:flex;gap:2px;margin:-16px -16px 14px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:11px 4px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--chalk);border-bottom-color:var(--flood)}

/* people */
.person{border-bottom:1px solid var(--line);padding:10px 0}
.person:last-child{border-bottom:0}
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:0}
.phead .role{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.phead .nm{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1}
.op{font-family:var(--display);font-size:22px;font-weight:700;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.opbar{height:4px;background:var(--panel-2);border-radius:2px;margin-top:6px;position:relative;overflow:hidden}
.opbar i{position:absolute;top:0;bottom:0}
.opbar:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.breakdown{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.breakdown div{display:flex;justify-content:space-between;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts .ghost{font-size:13px;padding:5px 9px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--display);font-weight:600;color:var(--muted);text-align:right;padding:4px 5px;letter-spacing:.06em;font-size:12px;text-transform:uppercase}
.tbl td{text-align:right;padding:5px;border-top:1px solid var(--line)}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl tr.mine td{color:var(--flood);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* attributes */
.attr{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.attr .bar{height:8px;background:var(--panel-2);border-radius:2px;position:relative;overflow:hidden}
.attr .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--chalk);opacity:.85}
.attr .bar u{position:absolute;left:0;bottom:0;height:2px;background:var(--flood)}
.attr b{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}

/* match */
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:14px;background:#08130e;border:1px solid var(--line);border-radius:4px}
.board .team{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05}
.board .team.r{text-align:right}
.score{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold);text-align:center}
.clock{font-family:var(--display);color:var(--muted);text-align:center;font-size:16px;letter-spacing:.08em}
.mstrip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:14px}
.log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:14px;padding-right:4px}
.log div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}
.log .m{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.log .goal{color:var(--good)} .log .against{color:var(--bad)} .log .miss{color:var(--muted)} .log .you{color:var(--gold)}
.moment{border:2px solid var(--flood);border-radius:4px;padding:16px;background:linear-gradient(180deg,rgba(244,184,58,.12),transparent 70%),var(--panel)}
.moment h3{font-size:26px;color:var(--gold)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--flood)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt b{font-family:var(--display);font-size:18px;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt .pct{font-family:var(--display);font-size:24px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.opt.flair b{color:var(--gold)}
.result{padding:12px;border-radius:3px;background:var(--panel-2);margin-bottom:10px}
.rating{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}

/* start & season */
.hero{padding-block:28px 10px}
.hero h1{font-size:clamp(56px,11vw,120px);line-height:.85;font-weight:800;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--flood)}
.hero p{max-width:60ch;font-size:17px;color:var(--chalk);opacity:.9}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:10px 12px;color:var(--chalk);font:inherit;font-size:18px;max-width:420px}
.clubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.club{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px}
.club.on{border-color:var(--flood);box-shadow:inset 0 0 0 1px var(--flood)}
.club b{font-family:var(--display);font-size:22px;display:block}
.club small{color:var(--muted)}
.traitpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tp{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 11px}
.tp b{font-family:var(--display);font-size:17px;font-weight:600}
.tp small{display:block;color:var(--muted);font-size:12px}
.tp.on{border-color:var(--flood);box-shadow:inset 0 0 0 1px var(--flood)}
.tp:disabled{opacity:.35;cursor:not-allowed}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

.ten.yr{font-size:84px;letter-spacing:-.02em;line-height:1}
.settings{display:flex;flex-wrap:wrap;gap:18px 28px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.ghost.on{border-color:var(--flood);color:var(--flood)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.desk{display:flex;flex-direction:column}
.drow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.drow>div{min-width:0}
.drow b{font-family:var(--display);font-size:17px;font-weight:600}
.drow small{display:block;color:var(--muted);font-size:12px}
.drow .ghost{white-space:nowrap;flex-shrink:0}
.lvl{color:var(--flood);letter-spacing:2px;font-size:11px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:620px){.ten.yr{font-size:60px}.modes{grid-template-columns:minmax(0,1fr)}.drow{flex-direction:column;align-items:stretch}}
.fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.fx i{font-style:normal;font-size:11.5px;line-height:1.5;padding:0 6px;border-radius:2px;background:var(--turf);color:var(--muted)}
.fx i.g{color:var(--good)} .fx i.b{color:var(--bad)}
.paper{background:var(--chalk);color:#1b1f1a;border-radius:3px;padding:12px 16px}
.paper .eyebrow{color:#5b6358}
.paper .head{font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,34px);line-height:1.05;text-wrap:balance;margin-top:2px}
.gorow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.go.alt{background:transparent;color:var(--flood);border:2px solid var(--flood);font-size:18px}
.kroeg p{margin:6px 0;font-style:italic}
.kroeg .ghost{margin-top:6px}
.grp{margin:14px 0 2px;color:var(--flood)}
.mem{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:0 4px}
.chip.mem{color:var(--gold);border-color:var(--gold);font-size:12px;padding:2px 8px;text-transform:none;letter-spacing:0}
.acts.col{flex-direction:column;align-items:stretch}
.act .fx{margin-top:3px}
@media (max-width:620px){.gorow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1000px){ .game{grid-template-columns:minmax(0,1fr)} .stats{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:620px){
  .band{grid-template-columns:minmax(0,1fr)} .tenwrap{flex-direction:row;justify-content:flex-start;gap:14px}
  .ten{font-size:96px} .train{grid-template-columns:repeat(2,minmax(0,1fr))} .clubs{grid-template-columns:minmax(0,1fr)}
  .score{font-size:40px} .board .team{font-size:17px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div class="wrap" id="app"></div>

<script>
/* ===================== helpers ===================== */
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const FIRST=['Daan','Sem','Milan','Luuk','Bram','Thijs','Jesse','Ruben','Stijn','Noah','Kees','Joep','Youssef','Mees','Rayan','Teun','Floris','Sven','Jurre','Mohamed','Niels','Gijs','Hidde','Owen','Lars','Ilias','Wout','Jelle'];

/* ===================== data ===================== */
const TRAITS={
  ambitieus:{n:'Ambitieus',d:'Traint harder door, maar de bank doet extra pijn.',opp:'tevreden'},
  tevreden:{n:'Tevreden',d:'Laat zich niet gek maken door een bankplek.',opp:'ambitieus'},

const COACH={

  romanticus:{n:'Romanticus',likes:['showman','leergierig','ambitieus'],dislikes:['nuchter','tevreden']},

const ATTR={tec:'Techniek',pas:'Passing',vis:'Visie',afw:'Afwerking',dri:'Dribbelen',snl:'Snelheid',kal:'Kalmte',uit:'Uitstraling'};
const TEAMS0=[['Noordhaven','NOH',79,'#4a86e8'],['Sporting Delta','SPD',76,'#e0533f'],['Rood-Wit Ommeren','RWO',71,'#f2f2f2'],['Union Kade','UNK',68,'#9b72e6'],["Achilles '29",'ACH',65,'#2fbf85'],['VV De Brug','BRG',62,'#f0a03a'],['SC Polder','SCP',59,'#4cc3dc'],['FC Weststad','FCW',56,'#c8cc4a']];
const START_CLUBS=[{i:0,tag:'Topclub',d:'Titelkandidaat, hoog salaris. Je concurrent is een gevestigde naam: minuten moet je verdienen.'},{i:3,tag:'Middenmoter',d:'Een eerlijk gevecht om de 10. Goede trainer, nuchtere club.'},{i:7,tag:'Kleine club',d:'Je speelt gegarandeerd. Weinig geld, veel lef nodig om op te vallen.'}];

const TRAIN=[
  {k:'tech',n:'Techniek & balcontrole',at:['tec','dri'],fit:-6},
  {k:'video',n:'Videoanalyse',at:['vis','pas'],fit:0},
  {k:'afw',n:'Afwerken na de training',at:['afw','tec'],fit:-6},
  {k:'kracht',n:'Krachthonk & sprints',at:['snl'],fit:-12,mult:1.6},
  {k:'mentaal',n:'Mentale coach (€3k)',at:['kal','uit'],fit:0,cost:3,conf:6},
  {k:'rust',n:'Rust & herstel',at:[],fit:20},
];

const MOMENTS=[
  {id:'linies',t:'Ruimte tussen de linies',d:'Je draait weg van je man. De spits zet een diepteloopje in.',o:[
    {k:'steek',n:'Steekpass op de spits',a:['pas','vis'],b:52,res:'assist'},
    {k:'schot',n:'Draaien en zelf schieten',a:['afw','tec'],b:30,res:'goal'},
    {k:'dribbel',n:'Op de man af',a:['dri','snl'],b:40,res:'chance'},
    {k:'veilig',n:'Breed leggen, balbezit houden',a:['pas'],b:88,res:'safe'}]},

function mod(role,t,v,w){const c=C(role);if(!c)return;c.mods=c.mods.filter(m=>m.t!==t);c.mods.push({t,v,w})}
function conf(d){if(d<0&&has('kalm'))d*=.6;if(has('gevoelig'))d*=1.5;const before=P.conf;P.conf=clamp(Math.round(P.conf+d),has('arrogant')?30:0,100);return P.conf-before}

function compat(c){
  const out=[];
  for(const t of c.traits){
    if(has(t))out.push([`Allebei ${TRAITS[t].n.toLowerCase()}`,10]);
    const o=TRAITS[t].opp; if(o&&has(o))out.push([`${TRAITS[t].n} tegenover ${TRAITS[o].n.toLowerCase()}`,-15]);
  }
  if(has('arrogant'))out.push(['Vindt je arrogant',-10]);
  if(has('bescheiden')&&c.role!=='journalist')out.push(['Waardeert je bescheidenheid',5]);
  if(has('leider')&&['aanvoerder','maatje','sterspeler'].includes(c.role))out.push(['Volgt jouw voorbeeld',8]);
  if(has('feestbeest')&&c.role==='maatje')out.push(['Gezellig in de groep',6]);
  if(c.role==='trainer'){const st=COACH[c.style];
    for(const t of st.likes)if(has(t))out.push([`${st.n}: waardeert ${TRAITS[t].n.toLowerCase()}`,12]);
    for(const t of st.dislikes)if(has(t))out.push([`${st.n}: ergert zich aan ${TRAITS[t].n.toLowerCase()}`,-12]);}
  return out;
}
const opinionParts=c=>[['Eerste indruk',c.base],...compat(c),...c.mods.map(m=>[m.t,m.v])];
const opinion=c=>clamp(opinionParts(c).reduce((s,x)=>s+x[1],0),-100,100);

function mkChar(role,extra={}){
  const keys=Object.keys(TRAITS),tr=[];
  while(tr.length<2){const t=pick(keys);if(tr.includes(t)||tr.some(x=>TRAITS[x].opp===t))continue;tr.push(t)}
  return Object.assign({id:role+ri(1e5,9e5),role,name:nm(),age:ri(22,33),traits:tr,base:0,mods:[]},extra);
}

]}

function setClub(i){
  S.club=i; const t=team(i);
  P.salary=salaryFor(t); P.fans=50; P.penTaker=false; P.captain=false;
  const keep=(S.chars||[]).filter(c=>['zaakwaarnemer','journalist'].includes(c.role));
  if(!keep.length){keep.push(mkChar('zaakwaarnemer',{age:ri(35,58),base:20}),mkChar('journalist',{age:ri(26,55)}))}
  S.chars=[...clubChars(t),...keep];
}
function makeFixtures(){
  const n=8,order=[...Array(n).keys()].sort(()=>R()-.5),arr=order.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push(r%2?[b,a]:[a,b])}rounds.push(m);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));
}
function newSeasonSetup(){
  S.fixtures=makeFixtures(); S.week=0;
  S.table=S.teams.map(()=>({p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  P.st={apps:0,goals:0,assists:0,ratings:[]};
}

const myPos=()=>sortedTable().findIndex(r=>r.id===S.club)+1;

 {k:'praat',n:'Praatje maken',roles:null,f:c=>{const ok=R()<.5+(P.attrs.uit-10)*.04;if(ok){mod(c.role,'Goed gesprek',8,6);return[`Goed gesprek met ${c.name}.`,'g']}return[`${c.name} had er niet veel zin in.`,'']}},
 {k:'eten',n:'Uit eten (€2k)',roles:null,cost:2,f:c=>{mod(c.role,'Samen uit eten',14,10);return[`Een lange avond met ${c.name}. Dat schept een band.`,'g']}},
 {k:'minuten',n:'Om speeltijd vragen',roles:['trainer'],f:c=>{if(opinion(c)+(formAvg()-6.6)*25+R()*30>30){S.startBonus+=12;return['"Oké. Je krijgt je kans."','g']}mod('trainer','Zeurde om speeltijd',-10,8);return['"Verdien het op het veld." Koud.','b']}},
 {k:'ondermijn',n:'Ondermijnen',roles:['concurrent'],f:c=>{c.conf=clamp(c.conf-12,0,100);S.rivalPenalty+=8;if(R()<.3){mod('concurrent','Ondermijnde hem',-30,24);mod('aanvoerder','Speelt vals spel',-15,12);mod('trainer','Zorgt voor onrust',-8,8);chron(`${P.name} betrapt op gestook tegen ${c.name}.`);return['Uitgekomen. De hele groep weet wat je deed.','b']}return['Een opmerking hier, een grapje daar. Hij begint te twijfelen.','y']}},
 {k:'interview',n:'Interview geven',roles:['journalist'],f:c=>{fame(4);if(R()<.25+(has('opvliegend')?.2:0)){mod('trainer','Kritiek in de krant',-10,8);return['Eén zin uit zijn verband gerukt. De trainer is niet blij.','b']}mod('journalist','Mooi interview',6,8);return['Een mooi stuk, met een grote foto.','g']}},
 {k:'loon',n:'Loonsverhoging eisen',roles:['voorzitter'],f:c=>{if(opinion(c)>30&&formAvg()>=6.8){P.salary=Math.round(P.salary*1.25*10)/10;mod('voorzitter','Eiste meer geld',-5,8);return[`Akkoord. €${P.salary}k per week.`,'g']}mod('voorzitter','Eiste onterecht meer geld',-15,12);return['"Laat eerst maar eens wat zien."','b']}},
];

function addProg(k,pts){P.prog[k]=(P.prog[k]||0)+pts;while(P.prog[k]>=100){P.prog[k]-=100;if(P.attrs[k]<20){P.attrs[k]++;flash(`${ATTR[k]} omhoog naar ${P.attrs[k]}.`,'g')}}}

/* ===================== week loop ===================== */
function startWeek(){
  S.trained=null;S.social=false;S.flash=[];S.selNoise=ri(-5,5);S.event=null;
  if(R()<.65){const el=EVENTS.filter(e=>(!e.cond||e.cond())&&(S.seenEv[e.id]===undefined||S.abs-S.seenEv[e.id]>9));if(el.length)S.event=pick(el).id}
}
const A={};
A.train=k=>{
  if(S.trained)return;const t=TRAIN.find(x=>x.k===k);
  if(S.injured>0&&k!=='rust')return;
  if(t.cost){if(P.money<t.cost){flash('Daar heb je het geld niet voor.','b');return render()}P.money-=t.cost}
  S.trained=k;fit(t.fit);if(t.conf)conf(t.conf);
  const ageF=P.age<=21?1.25:P.age<=25?1:P.age<=29?.7:.4;
  const g=Math.round(32*ageF*(has('leergierig')?1.3:1)*(has('ambitieus')?1.1:1)*(t.mult||1));
  t.at.forEach(a=>addProg(a,g));
  flash(t.at.length?`${t.n}: +${g} voortgang op ${t.at.map(a=>ATTR[a].toLowerCase()).join(' en ')}.`:'Je benen danken je.','');
  render();
};
A.social=(role,k)=>{
  if(S.social)return;const c=C(role),s=(isChair()?SOCIAL_C:SOCIAL).find(x=>x.k===k);
  if(s.cost){if(P.money<s.cost){flash('Daar heb je het geld niet voor.','b');return render()}P.money-=s.cost}
  S.social=true;const[m,t]=s.f(c);flash(m,t);render();
};
A.choose=i=>{
  const e=(isChair()?EVENTS_C:EVENTS).find(x=>x.id===S.event),c=e.ch[i];if(c.req&&!c.req())return;
  S.seenEv[e.id]=S.abs;const msg=c.f();flash(msg,'y');S.event=null;render();
};
A.tab=t=>{S.tab=t;render()};
A.open=id=>{S.open=S.open===id?null:id;render()};

/* ===================== match ===================== */
function chance(o,opp){
  if(o.res==='pass')return 100;
  const a=o.a.length?avg(o.a.map(k=>P.attrs[k])):12;
  let c=o.b+(a-12)*3.5+(P.conf-50)*.2-(opp.str-66)*.6;
  const t=tier();if(t==='zone')c+=6;if(t==='twijfel'&&!o.res.startsWith('safe'))c-=8;
  if(has('nuchter')&&o.res.startsWith('safe'))c+=6;if(has('showman')&&o.flair)c+=6;
  return clamp(Math.round(c),5,96);
}
function flairOk(o){return!o.flair||P.conf>=o.flair-(has('showman')?15:0)}
A.goMatch=()=>{
  if(S.event||!S.trained)return;
  const fx=myFixture(),opp=team(fx.opp),me=team(S.club);
  let role=selRole();
  if((role==='start'||role==='sub')&&P.fit<30&&R()<.35){S.injured=ri(1,3);role='inj';chron(`${P.name} raakt geblesseerd in de warming-up. ${S.injured} wk eruit.`)}
  let enter=role==='start'?0:role==='sub'?ri(55,70):role==='bench'&&R()<.25?ri(76,84):99;
  const playing=enter<90;
  const myStr=me.str+(playing?(ovr()-60)*.15:-1);
  const lamUs=1.3*Math.pow(myStr/opp.str,2)*(fx.home?1.1:.92),lamThem=1.3*Math.pow(opp.str/myStr,2)*(fx.home?.92:1.1);
  const ev=[];
  for(let i=poisson(lamUs*(playing?.7:1));i>0;i--)ev.push({min:ri(1,90),type:'gu'});
  for(let i=poisson(lamThem);i>0;i--)ev.push({min:ri(1,90),type:'gt'});
  if(playing){
    if(enter>0)ev.push({min:enter,type:'in'});
    const n=enter===0?ri(4,5):enter<75?2:1;
    for(let i=0;i<n;i++){const pen=R()<.08;ev.push({min:ri(Math.max(enter+2,4),89),type:'mo',m:pen?'pen':pick(MOMENTS.filter(x=>x.id!=='pen')).id})}
  }
  ev.sort((a,b)=>a.min-b.min);
  const intro={start:'Je staat in de basis.',sub:'Je begint op de bank.',bench:'Je zit op de bank. Het kan een lange middag worden.',inj:'Je kijkt vanaf de tribune, met ijs op je enkel.'}[role];
  S.match={opp:opp.id,home:fx.home,ev,i:0,min:0,us:0,them:0,rating:role==='start'?6.4:6.3,role,enter,playing,log:[{min:0,t:`Aftrap. ${intro}`,tone:''}],pending:null,last:null,g:0,a:0,confD:0,done:false,sum:null};
  S.phase='match';render();
};
function stepMatch(){
  const m=S.match;if(m.pending||m.done)return false;
  m.min++;
  while(m.i<m.ev.length&&m.ev[m.i].min<=m.min){
    const e=m.ev[m.i++];
    if(e.type==='gu'){m.us++;if(m.playing&&m.min>=m.enter)m.rating+=.05;m.log.push({min:e.min,t:`Doelpunt ${team(S.club).name}. ${m.us}-${m.them}.`,tone:'goal'})}
    else if(e.type==='gt'){m.them++;if(m.playing&&m.min>=m.enter)m.rating-=.1;m.log.push({min:e.min,t:`Tegengoal. ${team(m.opp).name} scoort.`,tone:'against'})}
    else if(e.type==='in'){m.log.push({min:e.min,t:`Wissel: ${lastName()} komt erin.`,tone:'you'})}
    else if(e.type==='mo'){
      if(e.m==='pen'&&!P.penTaker&&P.conf<60){m.log.push({min:e.min,t:`Strafschop! ${C('aanvoerder').name} neemt hem... `+(R()<.75?(m.us++,'en scoort.'):'en mist.'),tone:''});continue}
      m.pending=e.m;m.last=null;return false;
    }
  }
  if(m.min>=90){finishMatch();return false}
  return true;
}
A.play=(instant)=>{
  if(timer)return;const m=S.match;if(!m||m.pending||m.done)return;
  if(instant||REDUCED){while(stepMatch());render();return}
  timer=setInterval(()=>{const go=stepMatch();if(!go){clearInterval(timer);timer=null;render()}else updateBoard()},45);
};
A.resolve=k=>{
  const m=S.match,mo=MOMENTS.find(x=>x.id===m.pending),o=mo.o.find(x=>x.k===k);
  if(!flairOk(o))return;
  const opp=team(m.opp),c=chance(o,opp),ok=R()*100<c,ln=lastName();
  let d=0,cf=0,tone='you',txt='';
  const counter=p=>{if(R()<p){m.them++;d-=.25;return` De tegenstander schakelt om en scoort: ${m.us}-${m.them}.`}return''};
  switch(o.res){
    case'goal':if(ok){m.us++;m.g++;d+=o.big?1.4:1.1;cf+=o.big?14:7;tone='goal';txt=o.big?`PANENKA! ${ln} schept hem door het midden. Het stadion ontploft.`:`DOELPUNT! ${ln} ${pick(GOALTXT)}`;if(o.big){fans(8);fame(3)}}
      else{d-=o.big?.7:.25;cf-=o.big?12:2;tone='miss';txt=o.big?'De panenka is zacht en voorspelbaar. De keeper blijft gewoon staan.':pick(MISSTXT);if(o.big)fans(-5)}break;
    case'assist':if(ok){if(R()<.62){m.us++;m.a++;d+=.8;cf+=5;tone='goal';txt=`DOELPUNT! ${pick(ASSTXT)} Assist ${ln}.`}else{d+=.25;cf+=1;txt='Prachtige bal, maar de spits schiet hem over.'}}
      else{d-=.2;cf-=2;tone='miss';txt='De pass wordt onderschept.'+counter(.12)}break;
    case'chance':if(ok){if(R()<.5){m.us++;m.g++;d+=1.1;cf+=8;tone='goal';txt=`Erlangs... en binnen! DOELPUNT ${ln}!`}else{d+=.35;cf+=3;txt='Erlangs! Het schot wordt nog net gekeerd.'}}
      else{d-=.3;cf-=3;tone='miss';txt='Balverlies.'+counter(.18)}break;
    case'safe':if(ok){d+=.1;txt='Rustig in balbezit. Niks bijzonders, niks fout.'}else{d-=.4;cf-=4;tone='miss';txt='Slordig! De bal is weg.'+counter(.25)}break;
    case'safeplus':if(ok){d+=.3;cf+=2;txt='Je houdt hem af en wordt neergehaald. Vrije trap, en een knikje van de trainer.'}else{d-=.3;cf-=3;tone='miss';txt='Je verliest het duel.'+counter(.15)}break;
    case'pass':{const cap=C('aanvoerder');mod('aanvoerder','Gaf hem de strafschop',8,8);cf-=has('ambitieus')?5:1;if(R()<.75){m.us++;txt=`${cap.name} schiet hem koel binnen.`;tone='goal'}else{txt=`${cap.name} mist! De keeper heeft hem.`;tone='miss'}}break;
  }
  if(txt.includes('tegenstander schakelt'))tone='against';
  m.rating+=d;const real=conf(cf);m.confD+=real;
  m.log.push({min:m.min,t:txt,tone});m.pending=null;m.last={txt,tone,ok,c,real};
  render();
};
function finishMatch(){
  const m=S.match;m.done=true;m.min=90;
  const res=m.us>m.them?'w':m.us<m.them?'l':'d';
  const lines=[];let cd=0;
  // table: my match
  const me=S.club,op=m.opp,[h,a]=m.home?[me,op]:[op,me],[hg,ag]=m.home?[m.us,m.them]:[m.them,m.us];
  applyResult(h,a,hg,ag);
  // the rest of the round
  for(const [x,y] of S.fixtures[S.week]){if(x===me||y===me)continue;const sx=team(x).str,sy=team(y).str;applyResult(x,y,poisson(1.3*Math.pow(sx/sy,2)*1.1),poisson(1.3*Math.pow(sy/sx,2)*.92))}
  const r=C('concurrent');
  if(m.playing){
    m.rating+=res==='w'?.3:res==='l'?-.3:0;m.rating=Math.round(clamp(m.rating,3,10)*10)/10;
    P.form.push(m.rating);P.st.ratings.push(m.rating);P.st.apps++;P.st.goals+=m.g;P.st.assists+=m.a;
    S.lastRating=m.rating;
    cd+=conf((m.rating-6.6)*4+(res==='w'?2:res==='l'?-2:0));
    fit(m.enter===0?-14:-7);fans((m.rating-6.5)*4);fame(m.g*2+m.a+(m.rating>=8?2:0));
    if(m.rating>=8){mod('trainer',`Uitblinker tegen ${team(op).short}`,8,6);lines.push('De trainer noemt je naam in de persconferentie.')}
    if(m.rating<5.5){mod('trainer',`Zwakke wedstrijd tegen ${team(op).short}`,-6,4);lines.push('De trainer loopt zonder iets te zeggen langs je heen.')}
    if(m.g>=2){chron(`${P.name} scoort ${m.g}x tegen ${team(op).name}.`);mod('maatje','Vierde jouw goals mee',4,6)}
    if(m.enter===0){r.conf=clamp(r.conf-3,0,100)}else{r.form.push(Math.round((6.4+(r.ovr-60)/18+(R()-.5)*1.4)*10)/10)}
  }else{
    S.lastRating=null;
    cd+=conf(m.role==='inj'?-1:has('ambitieus')?-7:has('tevreden')?-1:-4);fit(m.role==='inj'?5:8);
    r.form.push(Math.round((6.5+(r.ovr-60)/18+(R()-.5)*1.4)*10)/10);r.conf=clamp(r.conf+3,0,100);
    if(m.role!=='inj')lines.push(`${r.name} speelt de hele wedstrijd op jouw positie.`);
  }
  if(res==='w'&&P.captain)lines.push('Als aanvoerder ga je voorop in de polonaise.');
  m.sum={res,cd:m.confD+cd,lines};
  P.form=P.form.slice(-10);r.form=r.form.slice(-10);
}
function applyResult(h,a,hg,ag){
  const H=S.table[h],Aw=S.table[a];H.p++;Aw.p++;H.gf+=hg;H.ga+=ag;Aw.gf+=ag;Aw.ga+=hg;
  if(hg>ag){H.w++;H.pts+=3;Aw.l++}else if(hg<ag){Aw.w++;Aw.pts+=3;H.l++}else{H.d++;Aw.d++;H.pts++;Aw.pts++}
}
A.afterMatch=()=>{
  S.match=null;S.week++;S.abs++;S.startBonus=0;S.rivalPenalty=0;
  for(const c of S.chars){c.mods.forEach(m=>m.w--);c.mods=c.mods.filter(m=>m.w>0)}
  P.conf=clamp(Math.round(P.conf+(50-P.conf)*.1),has('arrogant')?30:0,100);
  fit(has('professioneel')?14:has('feestbeest')?6:10);
  P.money=Math.round((P.money+P.salary)*10)/10;
  if(S.injured>0)S.injured--;
  if(S.week>=14){seasonEnd();return render()}
  S.phase='week';startWeek();render();window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
};

/* ===================== season end ===================== */
function seasonEnd(){
  const tbl=sortedTable(),pos=tbl.findIndex(r=>r.id===S.club)+1,t=team(S.club);
  const avgR=avg(P.st.ratings),yy=`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
  if(pos===1){S.trophies.push(`Landskampioen ${yy}, ${t.name}`);chron(`${t.name} is kampioen!`);fame(10)}
  if(avgR>=7.3&&P.st.apps>=8){S.trophies.push(`Speler van het jaar ${yy}`);chron(`${P.name} is speler van het jaar.`);fame(8)}
  S.seasons.push({yy,club:t.name,pos,apps:P.st.apps,goals:P.st.goals,assists:P.st.assists,avg:avgR?avgR.toFixed(2):'-'});
  P.car.apps+=P.st.apps;P.car.goals+=P.st.goals;P.car.assists+=P.st.assists;
  // offers
  const offers=[];
  for(const x of S.teams){if(x.id===S.club)continue;const sc=ovr()+(avgR?(avgR-6.5)*10:-8)+P.fame/4+ri(-8,8);if(sc>=x.str-6)offers.push({id:x.id,salary:Math.round(salaryFor(x)*(1+P.fame/200)*10)/10})}
  offers.sort((a,b)=>team(b.id).str-team(a.id).str);
  const vo=opinion(C('voorzitter'));
  const renew=vo>-30?Math.round(P.salary*(vo>30?1.3:vo>0?1.12:1)*10)/10:null;
  let list=offers.slice(0,3);
  if(!list.length&&renew===null){const low=S.teams.filter(x=>x.id!==S.club).sort((a,b)=>a.str-b.str)[0];list=[{id:low.id,salary:salaryFor(low)}]}
  S.offers={list,renew,pos,avgR};
  S.phase='season';
}
A.next=target=>{
  if(target==='retire'){S.phase='retired';chron(`${P.name} stopt met voetballen.`);return render()}
  P.age++;S.season++;S.year++;
  if(P.age<=23)for(let i=0;i<2;i++){const k=pick(Object.keys(ATTR));if(P.attrs[k]<20)P.attrs[k]++}
  if(P.age>=30){for(let i=0;i<P.age-29;i++){const k=R()<.5?'snl':pick(['dri','tec','afw','kal']);if(P.attrs[k]>1)P.attrs[k]--}}
  for(const x of S.teams)x.str=clamp(x.str+ri(-3,3),52,84);
  const r=C('concurrent');
  if(target==='stay'){P.salary=S.offers.renew;chron(`${P.name} tekent bij voor een nieuw seizoen.`);
    if(r){r.age++;r.ovr+=r.age<25?ri(1,3):r.age>30?-ri(1,2):0;r.form=[]}
    if(!P.captain&&has('leider')&&opinion(C('aanvoerder'))>40&&opinion(C('trainer'))>30){P.captain=true;chron(`${P.name} krijgt de aanvoerdersband.`)}
  }else{const o=S.offers.list.find(x=>x.id===target);chron(`Transfer: ${P.name} vertrekt naar ${team(target).name}.`);setClub(target);P.salary=o.salary}
  P.conf=clamp(Math.round((P.conf+55)/2),0,100);P.fit=95;P.form=[];
  newSeasonSetup();S.offers=null;S.phase='week';startWeek();render();window.scrollTo({top:0});
};

/* ===================== rendering ===================== */
function render(){
  if(timer&&S?.phase!=='match'){clearInterval(timer);timer=null}
  const app=document.getElementById('app');
  if(!S){app.innerHTML=startView();return}
  P=S.p;
  if(isChair()){renderChair(app);save();return}
  if(S.phase==='retired'){app.innerHTML=topbar()+retiredView();save();return}
  app.innerHTML=topbar()+band()+(S.phase==='season'?seasonView():`<div class="game"><div class="stack">${S.phase==='match'?matchView():weekView()}</div><aside class="panel">${sideView()}</aside></div>`);
  const lg=document.getElementById('log');if(lg)lg.scrollTop=lg.scrollHeight;
  save();
}
function topbar(){
  const t=team(S.club),yy=`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
  return`<header class="top"><div class="brand">DE <span>SPEL</span>MAKER</div><div class="meta">${esc(t.name)} · ${isChair()?TIERS[S.cl.tier].n+' · ':''}${yy} · Ronde ${Math.min(S.week+1,14)}/14 <button class="linkbtn" onclick="A.reset()">Opnieuw beginnen</button></div></header>`;
}
function band(){
  const [tl,tc]=TIER[tier()];
  const f=P.form.length?formAvg().toFixed(1):'–';
  return`<section class="band">
    <div class="tenwrap"><div class="ten" style="--c:${P.conf}%;--tc:${tc}" aria-label="Vertrouwen ${P.conf} van 100">10</div><div class="tier" style="color:${tc}">${tl} · ${P.conf}</div></div>
    <div class="who"><div class="eyebrow">Middenvelder · Rugnummer 10${P.captain?' · Aanvoerder':''}${P.penTaker?' · Strafschopnemer':''}</div>
      <h2>${esc(P.name)}</h2><div class="sub">${P.age} jaar · Algemeen ${ovr()} · ${esc(team(S.club).name)}</div>
      <div class="chips">${P.traits.map(t=>`<span class="chip me" title="${esc(TRAITS[t].d)}">${TRAITS[t].n}</span>`).join('')}</div>
      <div class="stats">
        <div class="stat"><b>${f}</b><small>Vorm</small></div>
        <div class="stat"><b class="${P.fit<40?'bad':''}">${P.fit}</b><small>Fitheid</small></div>
        <div class="stat"><b>${P.fans}</b><small>Fans</small></div>
        <div class="stat"><b>${P.fame}</b><small>Bekendheid</small></div>
        <div class="stat"><b>€${P.money}k</b><small>Saldo</small></div>
        <div class="stat"><b>€${P.salary}k</b><small>Per week</small></div>
      </div></div></section>`;
}
function weekView(){
  const fx=myFixture(),o=team(fx.opp),role=selRole(),[sl,sc,sd]=SEL[role],r=C('concurrent');
  let h=`<section class="panel"><div class="eyebrow">Volgende wedstrijd · ronde ${S.week+1}</div>
    <div class="fixture"><div class="vs"><span class="dot" style="background:${o.col}"></span>${fx.home?'Thuis':'Uit'}<span class="at">tegen</span>${esc(o.name)}</div><div class="muted num">Sterkte ${o.str} · stand ${sortedTable().findIndex(x=>x.id===o.id)+1}e</div></div>
    <div class="sel"><span class="pill ${sc}">${sl}</span><span>${sd}</span><span class="muted num" style="margin-left:auto">Jij ${youScore()} · ${esc(r.name.split(' ')[0])} ${rivalScore()}</span></div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">De trainer weegt: niveau, vorm, zijn mening over jou, je vertrouwen en fitheid.</p></section>`;

function genOpps(tier,rival){
  const used=new Set([team(0)?.name,rival?.name]);const out=[];
  const n=rival?6:7;
  while(out.length<n){const nm2=pick(PREF)+' '+pick(TOWNS);if(used.has(nm2))continue;used.add(nm2);
    out.push({name:nm2,short:nm2.split(' ').pop().slice(0,3).toUpperCase(),str:TIERS[tier].base+ri(-6,6),col:pick(COLS)})}
  if(rival){rival.str=TIERS[tier].base+ri(-2,4);out.splice(ri(0,out.length),0,rival)}
  return out.map((t,i)=>({...t,id:i+1}));
}
function chairChars(){
  const list=[
    mkChar('trainer',{age:ri(38,62),style:pick(Object.keys(COACH)),q:ri(3,6)}),
    mkChar('sterspeler',{age:ri(24,31),base:5}),
    mkChar('bestuurslid',{age:ri(45,68),base:-5}),
    mkChar('sponsor',{age:ri(40,65),base:5}),
    mkChar('supporters',{age:ri(30,60),base:10}),
    mkChar('wethouder',{age:ri(35,60)}),
    mkChar('journalist',{age:ri(25,55)}),
    mkChar('rivaalvz',{age:ri(45,70),base:-10}),

  for(const r of Object.keys(LOCALS)){const c=mkChar(r,{age:ri(30,64),base:8});c.biz=`${LOCALS[r].biz} ${c.name.split(' ').slice(1).join(' ')}`;list.push(c)}
  return list;
}
function chairNew(name,clubName,traits,carry,diff){
  const legacy=!!carry;
  S={v:2,mode:'chair',diff:diff||'normaal',phase:'week',season:1,year:carry?.year||2026,week:0,abs:0,tab:'mensen',open:null,flash:[],digest:[],papers:[],chron:carry?.chron||[],trophies:carry?.trophies||[],seasons:[],seenEv:{},event:null,evCtx:null,decided:false,social:false,round:false,result:null,club:0,legacy,head:null,kroeg:[],
    playerSeasons:carry?.seasons||null,
    p:{name,age:carry?.age||ri(38,52),traits,money:carry?Math.max(20,Math.round(carry.money*.6)):60,fame:carry?.fame||5,st:null,form:[],car:carry?.car||null},
    cl:{founded:ri(1898,1962),tier:4,budget:DIFF[diff||'normaal'].budget,fac:{stadion:1,training:1,jeugd:1,kantine:1},build:null,ticket:8,wage:'normaal',fansBase:legacy?700+Math.round((carry.fame||0)*10):620,mood:legacy?68:55,mandate:legacy?72:60,goal:4,sponsorF:1,targets:[],coaches:[],promoted:false,lastNet:0,lastAtt:0,best:4,discount:0,inv:0,invW:0,vote:null,joint:false}};
  P=S.p;
  S.teams=[{id:0,name:clubName,short:clubName.split(' ').pop().slice(0,3).toUpperCase(),str:TIERS[4].base-2,col:pick(COLS)}];
  let rn;do{rn=pick(PREF)+' '+pick(TOWNS)}while(rn===clubName);
  const rival={name:rn,short:rn.split(' ').pop().slice(0,3).toUpperCase(),col:pick(COLS),rival:true};
  S.teams.push(...genOpps(4,rival));
  S.chars=chairChars();
  newSeasonSetup();setGoal();
  chron(legacy?`${name} keert terug naar ${clubName}, nu als voorzitter.`:`${name} wordt voorzitter van ${clubName}.`);
  startWeekChair();
  S.papers.unshift({s:yyStr(),w:1,h:legacy?`Clubicoon ${name.split(' ').pop()} wordt voorzitter`:`Nieuwe voorzitter bij ${clubName}`});
  flash(legacy?'Het hele dorp weet wie je bent. De supporters verwachten veel.':`Het bestuur wil ${goalTxt()}. Aartsrivaal: ${rn}.`,'y');
}
const yyStr=()=>`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
function setGoal(){const rank=[...S.teams].sort((a,b)=>b.str-a.str).findIndex(t=>t.id===0)+1;S.cl.goal=S.cl.promoted?7:clamp(rank+1+D().goal,1,7)}
const goalTxt=()=>S.cl.goal>=7?'handhaving (niet laatste worden)':S.cl.goal===1?'het kampioenschap':`een plek bij de eerste ${S.cl.goal}`;
function genMarket(){
  const t=TIERS[S.cl.tier];
  S.cl.targets=[0,1].map(()=>{const b=ri(1,3);return{name:nm(),pos:pick(POS),age:ri(19,32),boost:b,fee:Math.round(b*t.fee*(0.8+R()*.5)*10)/10}});
  S.cl.coaches=[0,1].map(()=>{const q=ri(3,9);return{name:nm(),style:pick(Object.keys(COACH)),q,fee:Math.round(q*t.fee*.5*10)/10}});
}
function newStar(){const old=C('sterspeler');S.chars=S.chars.filter(c=>c!==old);S.chars.splice(1,0,mkChar('sterspeler',{age:ri(23,30),base:0}))}
function newTrainer(q){const o=C('trainer');S.chars=S.chars.filter(c=>c!==o);const n=mkChar('trainer',{age:ri(38,60),style:pick(Object.keys(COACH)),q});S.chars.unshift(n);return[o,n]}

/* memory: strongest unused memory of a sign */
function memPick(sign){let best=null;for(const c of S.chars)for(const m of c.mods)if(m.mem&&!m.used&&(sign<0?m.v<=-12:m.v>=12)&&(!best||Math.abs(m.v)>Math.abs(best.m.v)))best={c,m};return best}

function ctxMem(){const c=ctxChar();return c&&c.mods.find(m=>m.t===S.evCtx.t)}

/* desk: one big decision per week */
A.ticket=d=>{S.cl.ticket=clamp(S.cl.ticket+d,2,80);render()};
A.wage=w=>{S.cl.wage=w;render()};
A.desk=(kind,arg)=>{
  if(S.decided)return;const cl=S.cl,t=TIERS[cl.tier];
  if(kind==='build'){const lv=cl.fac[arg]+1,cost=buildCost(lv);if(cl.build||lv>5||cl.budget<cost)return;
    if(arg==='stadion'&&lv>=3&&opinion(C('wethouder'))<0){flash('Geen vergunning. De wethouder moet minstens neutraal over je zijn.','b');return render()}
    cash(-cost);cl.discount=0;cl.build={k:arg,w:FWEEKS[lv]};flash(`Bouw gestart: ${FAC[arg].n} naar niveau ${lv}. Klaar over ${FWEEKS[lv]} weken.`,'y')}
  if(kind==='sign'){const p=cl.targets[arg];if(!p||cl.budget<p.fee)return;cash(-p.fee);team(0).str+=p.boost;mood(2);chron(`${p.name} (${p.pos}, ${p.age}) komt over voor ${k(p.fee)}.`);flash(`${p.name} tekent. Selectie +${p.boost}.`,'g');cl.targets.splice(arg,1)}
  if(kind==='hire'){const c=cl.coaches[arg],old=C('trainer'),pay=Math.round(old.q*t.fee*.3*10)/10;if(cl.budget<c.fee+pay)return;
    cash(-(c.fee+pay));S.chars=S.chars.filter(x=>x!==old);S.chars.unshift(mkChar('trainer',{name:c.name,style:c.style,q:c.q,age:ri(38,62)}));
    mandate(old.q>=c.q?-4:2);chron(`Trainer ${old.name} ontslagen. ${c.name} volgt hem op.`);S.head=`${old.name.split(' ').pop()} ontslagen, ${c.name.split(' ').pop()} nieuwe trainer`;flash(`${c.name} is je nieuwe trainer (${COACH[c.style].n}, kwaliteit ${c.q}).`,'y')}
  if(kind==='invest'){if(P.money<25)return;P.money-=25;cash(25);mandate(5);mod('bestuurslid','Stak eigen geld in de club',5,8);flash('€25k uit eigen zak naar de club. Het bestuur is onder de indruk.','g')}
  if(kind==='community'){if(cl.budget<4)return;cash(-4);mood(6);cl.fansBase+=40;mod('wethouder','Investeerde in de wijk',8,10);flash('Gratis voetbalkamp voor de wijk. De club staat weer op de kaart.','g')}
  S.decided=true;render();
};
A.round=()=>{
  if(S.round||P.money<.5)return;S.round=true;P.money=Math.round((P.money-.5)*10)/10;mood(2);
  const ranked=S.chars.map(c=>({c,o:opinion(c)})).sort((a,b)=>a.o-b.o);const lo=ranked[0],hi=ranked[ranked.length-1];
  const worst=opinionParts(lo.c).filter(p=>p[1]<0).sort((a,b)=>a[1]-b[1])[0];
  const tips=[];
  if(lo.o<0)tips.push(`Aan de bar hoor je dat ${lo.c.name} (${ROLES[lo.c.role].split(/[,·]/)[0].trim().toLowerCase()}) over je moppert${worst?`: "${worst[0].toLowerCase()}"`:''}.`);
  if(hi.o>20)tips.push(`${hi.c.name} schijnt overal vol lof over je te praten.`);
  if(electionYear()&&!S.cl.vote)tips.push('Iedereen heeft het over de verkiezingen later dit seizoen.');
  if(S.cl.inv===1||S.cl.inv===2)tips.push('Die investeerder is gezien met een man in een duur pak. "Een trainer, zeggen ze."');
  if(opinion(C('bestuurslid'))<-20)tips.push(`${C('bestuurslid').name} zou stemmen werven voor een motie tegen je.`);
  if(!tips.length)tips.push('Niks bijzonders. Iedereen wil vooral weten hoe het met de selectie zit.');
  flash('Rondje gegeven. '+pick(tips),'y');render();
};

/* the pub: what the town says this week */
function makeKroeg(){
  const cl=S.cl,q=[],fx=myFixture(),opp=team(fx.opp);
  if(isDerby(opp.id))q.push(`"Als we van ${opp.name.split(' ').pop()} verliezen, hoef ik zondag niet naar de kerk."`);
  if(cl.mood<35)q.push('"Die voorzitter zit er alleen voor zijn eigen ego."');
  if(cl.mood>70)q.push('"Zo leuk is het hier in jaren niet geweest."');
  if(cl.ticket>TIERS[cl.tier].fair*1.25)q.push(`"€${cl.ticket} voor een kaartje? Ik kijk wel over het hek."`);
  if(cl.build)q.push(`"Mooi hoor, die nieuwe ${FAC[cl.build.k].n.toLowerCase()}. Als hij ooit af komt."`);
  if(myPos()===1&&S.week>2)q.push('"Kampioen worden we. Let maar op."');
  if(myPos()>=7&&S.week>2)q.push('"Degraderen we, dan is het zíjn schuld."');
  if(cl.budget<0)q.push('"De club staat rood, hoor ik. Hoe kan dat nou?"');
  if(cl.inv>0&&cl.inv<3)q.push('"Die investeerder. Ik vertrouw dat niet."');
  const sup=C('supporters');if(sup&&sup.mods.some(m=>m.mem&&m.v<0))q.push(`"Ik ben nog steeds boos over wat hij deed. ${sup.mods.find(m=>m.mem&&m.v<0).t}, weet je nog?"`);
  if(q.length<2)q.push('"Volgende week winnen we gewoon. Toch?"','"Vroeger was het allemaal beter. Behalve het bier."');
  return q.sort(()=>R()-.5).slice(0,2);
}

function startWeekChair(keep){
  S.decided=false;S.social=false;S.round=false;if(!keep)S.flash=[];S.event=null;S.evCtx=null;genMarket();S.kroeg=makeKroeg();
  const ok=e=>(!e.cond||e.cond())&&(S.seenEv[e.id]===undefined||S.abs-S.seenEv[e.id]>9);
  const prio=EVENTS_C.filter(e=>e.prio&&ok(e));let ev=null;
  if(prio.length&&R()<.7)ev=pick(prio);
  else if(R()<.55){const el=EVENTS_C.filter(ok);if(el.length)ev=pick(el)}
  if(ev){if(ev.setup)ev.setup();S.event=ev.id}
}

/* matchday simulation (no rendering) */
function simChairMatch(){
  const cl=S.cl,fx=myFixture(),me=team(0),opp=team(fx.opp),tr=C('trainer'),t=TIERS[cl.tier],derby=!!opp.rival;
  const my=Math.max(20,me.str+(tr.q-5)*.8),os=opp.str;
  const us=poisson(1.3*Math.pow(my/os,2)*(fx.home?1.12:.9)),them=poisson(1.3*Math.pow(os/my,2)*(fx.home?.9:1.12));

  if(cl.mandate<=0){chairOusted();return'ousted'}

    <button class="go" style="margin-top:14px" onclick="A.chairNext()">${S.week>=13?'Seizoen afsluiten':'Volgende week'}</button></section>`;
}
function chairPeopleView(){
  const soc=S.phase==='week'&&!S.social;
  let h='<p class="muted" style="font-size:13px;margin:0 0 6px">Iedereen heeft een mening over je. Tik op iemand om te zien waarom. Grote keuzes blijven mensen bij: die staan er als <b>blijvend</b>.</p>';
  for(const g of['club','dorp','voetbal']){
    const cs=S.chars.filter(c=>GROUP[c.role]===g);if(!cs.length)continue;
    h+=`<div class="eyebrow grp">${GROUPN[g]}</div>`;
    h+=cs.map(c=>{
      const op=opinion(c),col=op>=20?'var(--good)':op<=-20?'var(--bad)':'var(--chalk)',w=Math.abs(op)/2;
      const bar=`<i style="background:${col};${op>=0?`left:50%;width:${w}%`:`left:${50-w}%;width:${w}%`}"></i>`;
      const loc=LOCALS[c.role];
      let extra='';
      if(S.open===c.id){
        const parts=[['Eerste indruk',c.base],...compat(c),...c.mods.map(m=>[m.t,m.v,m.mem])].filter(p=>p[1]!==0);
        const acts=SOCIAL_C.filter(s=>!s.roles||s.roles.includes(c.role));
        extra=`<div class="breakdown">${parts.map(([t,v,mem])=>`<div><span>${esc(t)}${mem?' <span class="mem">blijvend</span>':''}</span><b class="num ${v>0?'good':'bad'}">${v>0?'+':''}${v}</b></div>`).join('')||'<div class="muted">Geen uitgesproken mening.</div>'}</div>
        ${c.role==='trainer'?`<div class="muted" style="font-size:13px;margin-top:6px">${COACH[c.style].n}, kwaliteit ${c.q}/10. Waardeert ${COACH[c.style].likes.map(t=>TRAITS[t].n.toLowerCase()).join(', ')}.</div>`:''}
        ${loc?`<div class="muted" style="font-size:13px;margin-top:6px">Boven +30: ${loc.perk}. Onder −20 stopt de sponsoring.</div>`:''}
        <div class="acts col">${acts.map(s=>`<div class="act"><button class="ghost" ${soc?'':'disabled'} onclick="A.social('${c.role}','${s.k}')">${s.n}</button>${fxHTML(val(s.fx,c))}</div>`).join('')}</div>`;
      }
      const sub=loc?`<div class="muted" style="font-size:12px">${esc(c.biz)} · ${op>-20?`sponsort ${k(loc.base*tierM()*D().inc)}/wk`:'<span class="bad">sponsort niet meer</span>'}${op>=30?` · <span class="good">${loc.perk}</span>`:''}</div>`:c.role==='rivaalvz'?`<div class="muted" style="font-size:12px">${esc(team(S.teams.find(t=>t.rival).id).name)}</div>`:'';
      return`<div class="person"><button class="phead" onclick="A.open('${c.id}')" aria-expanded="${S.open===c.id}"><span><span class="role">${ROLES[c.role]}${c.role==='trainer'?' · '+COACH[c.style].n:''}</span><br><span class="nm">${esc(c.name)}</span> <span class="muted" style="font-size:13px">${c.age}</span></span><span class="op" style="color:${col}">${op>0?'+':''}${op}</span></button>
        ${sub}<div class="chips" style="margin-top:6px">${c.traits.map(t=>`<span class="chip ${has(t)?'me':''}" title="${esc(TRAITS[t].d)}">${TRAITS[t].n}</span>`).join('')}${c.mods.some(m=>m.mem)?'<span class="chip mem">onthoudt iets</span>':''}</div>
        <div class="opbar">${bar}</div>${extra}</div>`;
    }).join('');
  }
  return h;
}
function paperView(){return`<div class="eyebrow" style="margin-bottom:6px">${esc(paperName())} · archief</div><div class="feed">${S.papers.map(p=>`<div><span class="muted num">${p.s} · r${p.w}</span><br><b style="font-family:var(--display);font-size:17px;font-weight:600">${esc(p.h)}</b></div>`).join('')}</div>`}
function clubView(){
  const cl=S.cl;
  return`<div class="eyebrow" style="margin-bottom:6px">Accommodatie</div>
  ${Object.entries(FAC).map(([f,d])=>`<div class="attr"><span>${d.n.split(' ')[0]}</span><span class="bar"><i style="width:${cl.fac[f]*20}%"></i>${cl.build&&cl.build.k===f?`<u style="width:${100-cl.build.w*8}%"></u>`:''}</span><b>${cl.fac[f]}</b></div>`).join('')}
  <div class="eyebrow" style="margin:14px 0 6px">Geldstromen per week (schatting)</div>
  <div class="breakdown"><div><span>Hoofdsponsor (factor ${cl.sponsorF.toFixed(2)})</span><b class="num good">+${k(sponsorIncome())}</b></div>
  <div><span>Lokale sponsors</span><b class="num good">+${k(localIncome())}</b></div>
  <div><span>Kaartverkoop bij thuiswedstrijd</span><b class="num good">+${k(Math.min(CAP[cl.fac.stadion],demand(false))*cl.ticket/1000*D().inc)}</b></div>
  <div><span>Salarissen (${WAGE[cl.wage][0].toLowerCase()})</span><b class="num bad">−${k(wages())}</b></div>
  <div><span>Onderhoud</span><b class="num bad">−${k(upkeep())}</b></div></div>
  ${cl.inv>0&&cl.inv<3?'<p class="muted" style="font-size:13px">Een investeerder bezit 49% van de club.</p>':''}${cl.joint?'<p class="muted" style="font-size:13px">Gezamenlijke jeugdopleiding met het buurdorp.</p>':''}
  <div class="eyebrow" style="margin:14px 0 6px">Historie</div>
  ${S.seasons.length?S.seasons.map(s=>`<div class="num">${s.yy} · ${s.tier} · ${s.pos}e</div>`).join(''):'<div class="muted">Eerste seizoen.</div>'}
  ${S.trophies.length?`<div class="eyebrow" style="margin:14px 0 6px">Prijzenkast</div>${S.trophies.map(t=>`<div class="gold">${esc(t)}</div>`).join('')}`:''}`;
}
function chairSeasonView(){
  const o=S.offers,cl=S.cl,last=S.seasons[S.seasons.length-1];
  return`<section class="panel"><div class="eyebrow">Einde seizoen ${last.yy} · ${last.tier}</div><h2 style="font-size:40px">${esc(team(0).name)} eindigt als ${o.pos}e</h2>
    <p style="font-size:17px">${o.move<0?'<b class="gold">Promotie!</b> Volgend jaar een divisie hoger.':o.move>0?'<b class="bad">Degradatie.</b> Volgend jaar een divisie lager.':'Volgend jaar in dezelfde divisie.'}
    Doel van het bestuur: ${o.met?'<b class="good">gehaald</b>':'<b class="bad">niet gehaald</b>'}. Mandaat nu ${cl.mandate}.</p>
    ${o.notes.map(n=>`<p>${esc(n)}</p>`).join('')}
    <p class="muted num">Clubkas ${k(cl.budget)} · achterban ${cl.fansBase.toLocaleString('nl-NL')} · selectie ${Math.round(team(0).str)}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="go" style="flex:2;min-width:220px" onclick="A.chairSeason()">Volgend seizoen</button><button class="ghost" style="flex:1;min-width:140px" onclick="A.chairRetire()">Aftreden</button></div></section>`;
}
function chairEndView(){
  const cl=S.cl,ousted=S.phase==='ousted';
  return`<section class="hero"><div class="eyebrow">${ousted?'Weggestemd':'Afscheid als voorzitter'}</div><h1>${esc(team(0).name)}</h1>
    <p style="font-size:19px">${ousted?`Het bestuur verloor het vertrouwen. ${esc(C('bestuurslid').name)} neemt jouw stoel over.`:`${esc(P.name)} geeft de hamer door.`} Hoogste niveau: ${TIERS[cl.best].n}. ${S.seasons.length} seizoen(en) als voorzitter.</p>
    ${S.playerSeasons?`<p class="muted">Eerder: ${S.playerSeasons.length} seizoenen als speler${S.p.car?`, ${S.p.car.goals} goals`:''}.</p>`:''}
    ${S.trophies.length?S.trophies.map(t=>`<div class="gold" style="font-family:var(--display);font-size:22px;font-weight:700">${esc(t)}</div>`).join(''):''}
    <div style="max-width:620px;margin-top:20px"><div class="eyebrow" style="margin-bottom:6px">Kroniek</div>${chronView()}</div>
    <button class="go" style="max-width:420px;margin-top:24px" onclick="A.reset()">Nieuw verhaal</button></section>`;
}
function renderChair(app){
  if(S.phase==='ousted'||S.phase==='chairEnd'){app.innerHTML=topbar()+chairEndView();return}
  const main=S.phase==='season'?chairSeasonView():S.phase==='match'?chairMatchView():chairWeekView();
  app.innerHTML=topbar()+chairBand()+(S.phase==='season'?main:`<div class="game"><div class="stack">${main}</div><aside class="panel">${sideView()}</aside></div>`);
}

draft={name:nm(),club:1,traits:[],mode:'player',diff:'normaal',clubName:'VV '+pick(TOWNS)};

try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
