<title>De Spelmaker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: a retro football teletext page. One column of blocks under a solid top bar; chunky press-down buttons. Dark = teletext, light = matchday programme. */
:root{
  --bg:#0a0f2c; --panel:#10184a; --panel2:#18225c; --line:#2c3c8c; --ink:#f4f1e4; --dim:#a3add8;
  --bar:#ffd400; --bar-ink:#0a0f2c; --hd:#1fc8ff; --hd-ink:#04112b; --g:#3ee07f; --b:#ff5b4b; --gold:#ffd400;
  --btn:#ffd400; --btn-ink:#0a0a0a; --btn2:#f4f1e4; --edge:#000; --paper:#f4f1e4; --paper-ink:#111;
  --display:'VT323','Courier New',monospace; --body:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe7d2;--panel:#fffaf0;--panel2:#f3ecdb;--line:#1b1b1b;--ink:#141414;--dim:#55556a;--bar:#c8102e;--bar-ink:#fff;--hd:#0b2a6f;--hd-ink:#fff;--g:#0b7a37;--b:#c8102e;--gold:#9a6b00;--btn:#ffd400;--btn-ink:#0a0a0a;--btn2:#fff;--edge:#111;--paper:#fff;--paper-ink:#111;color-scheme:light}}
:root[data-theme="light"]{--bg:#efe7d2;--panel:#fffaf0;--panel2:#f3ecdb;--line:#1b1b1b;--ink:#141414;--dim:#55556a;--bar:#c8102e;--bar-ink:#fff;--hd:#0b2a6f;--hd-ink:#fff;--g:#0b7a37;--b:#c8102e;--gold:#9a6b00;--btn:#ffd400;--btn-ink:#0a0a0a;--btn2:#fff;--edge:#111;--paper:#fff;--paper-ink:#111;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hd);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.dim,.muted{color:var(--dim)} .small{font-size:13px} .r{text-align:right}
.g,.good{color:var(--g)} .b,.bad{color:var(--b)} .gold{color:var(--gold)}
.eyebrow{font-family:var(--display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

/* chunky buttons */
.btn,.go,.ghost,.tab,.tnav button,.seat,.choice,.tbtn,.opt,.club,.tp{border:3px solid var(--edge);border-radius:0;box-shadow:0 4px 0 var(--edge);transition:transform .05s,box-shadow .05s}
.btn:active:not(:disabled),.go:active:not(:disabled),.ghost:active:not(:disabled),.seat:active,.choice:active:not(:disabled),.tbtn:active:not(:disabled),.opt:active:not(:disabled),.club:active,.tp:active:not(:disabled),.tnav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 16px;background:var(--btn);color:var(--btn-ink);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:14px;text-align:center}
.btn.ghost{background:var(--btn2);color:#111}
.btn.sm{min-height:40px;padding:4px 10px;font-size:13px}
.btn.wide,.go{width:100%;margin-top:6px}
.btn:disabled,.go:disabled{background:var(--panel2);color:var(--dim);box-shadow:0 4px 0 var(--edge);cursor:not-allowed}
.go{min-height:56px;background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-size:28px;text-transform:uppercase;letter-spacing:.05em}
.ghost{background:var(--btn2);color:#111;min-height:44px;padding:6px 12px;font-weight:700;font-size:13px;text-transform:uppercase}
.ghost.on{background:var(--hd);color:var(--hd-ink)}

/* the page frame */
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bar);color:var(--bar-ink);font-family:var(--display);font-size:24px;line-height:1.1;padding:6px 12px;border:3px solid var(--edge);margin-bottom:8px}
.tb-l{display:flex;align-items:center;gap:8px}.tb-r{font-size:20px}
.crest{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);margin-right:6px;vertical-align:-1px}
.tnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tnav button{background:var(--btn2);color:#111;min-height:44px;font-weight:700;font-size:12px;text-transform:uppercase;padding:4px 2px}
.tnav button.on{background:var(--hd);color:var(--hd-ink)}
.page{display:flex;flex-direction:column;gap:12px}
.blk{border:3px solid var(--edge);background:var(--panel)}
.bh{background:var(--hd);color:var(--hd-ink);font-size:24px;line-height:1.1;padding:4px 10px;border-bottom:3px solid var(--edge)}
.bb{padding:12px}
.bb>p:first-child{margin-top:0}.bb>p:last-child{margin-bottom:0}
.dimblk .bh{background:var(--panel2);color:var(--ink)}
.lead{font-size:16px}
.big{font-family:var(--display);font-size:32px;line-height:1;margin:0 0 4px;color:var(--gold)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:8px 0 0}
.kv dt{color:var(--dim);text-transform:uppercase;font-size:12px;padding-top:2px}.kv dd{margin:0}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:140px}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{text-align:left;font-family:var(--display);font-weight:400;font-size:18px;color:var(--dim);padding:2px 6px;border-bottom:2px solid var(--line)}
.tt td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
.tt tr.me td{background:var(--bar);color:var(--bar-ink);font-weight:700}
.tt .dimrow td{color:var(--dim)}
.scroll{overflow-x:auto}
.bd3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.bd3>div{background:#000;color:var(--gold);border:2px solid var(--edge);padding:6px 8px}
.bd3 small{display:block;color:#9fb0ff;font-size:11px;text-transform:uppercase}
.bd3 b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1}
.st{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;padding:1px 6px;border:2px solid var(--edge);background:var(--panel2)}
.st.ok{background:var(--g);color:#000}.st.warn{background:var(--gold);color:#000}.st.bad{background:var(--b);color:#fff}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:0 4px;border:1px solid currentColor;text-transform:uppercase;vertical-align:1px}
.tag.b{color:var(--b)}
.lst{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lst li{padding-left:14px;position:relative}.lst li:before{content:'›';position:absolute;left:0;color:var(--gold)}
.prom{margin:6px 0;padding-left:18px}
.say{border-left:4px solid var(--gold);padding:4px 0 4px 10px;margin:0 0 10px}.say p{margin:2px 0 0}
.copt{border:3px solid var(--edge);background:var(--panel2);padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.copt p{margin:0}.copt-h{font-family:var(--display);font-size:28px;line-height:1;color:var(--gold)}
.call{border:3px solid var(--edge);background:var(--panel2);padding:12px;margin-bottom:10px;box-shadow:6px 6px 0 var(--edge)}
.call:last-child{margin-bottom:0}.call p{margin:4px 0 8px}
.call-h{font-family:var(--display);font-size:24px;line-height:1.05;color:var(--gold)}
.optrow{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.optrow .btn{align-self:flex-start;text-align:left;justify-content:flex-start}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{font-size:12px;padding:0 6px;border:1px solid var(--line);color:var(--dim);background:var(--bg)}
.fx span.g{color:var(--g)}.fx span.b{color:var(--b)}
.knock{border-top:2px dashed var(--line);padding:10px 0}.knock:first-of-type{border-top:0}
.knock p{margin:2px 0 4px}.knock.urg .kh b{color:var(--gold)}.knock.closed{opacity:.5}
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.seat{text-align:left;background:var(--btn2);color:#111;padding:10px;min-height:64px;display:flex;flex-direction:column;gap:2px}
.seat b{text-transform:uppercase;font-size:14px}.seat span{font-size:12px}
.seat.on{background:var(--btn);outline:3px solid var(--hd);outline-offset:-6px}
.cstat{border:3px solid var(--edge);padding:8px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.cstat b{font-family:var(--display);font-size:26px;font-weight:400;line-height:1}
.cs-safe b{color:var(--g)}.cs-watched b{color:var(--ink)}.cs-underpressure b{color:var(--gold)}.cs-onthebrink{background:var(--b)}.cs-onthebrink b,.cs-onthebrink span{color:#fff}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;background:#000;color:#fff;border:2px solid var(--edge);padding:10px;margin-bottom:8px}
.fx-t{font-family:var(--display);font-size:28px;line-height:1}.fx-t:last-child{text-align:right}.fx-v{font-family:var(--display);font-size:24px;color:var(--gold)}
.paper{background:var(--paper);color:var(--paper-ink);border:3px solid var(--edge);padding:12px 14px;box-shadow:6px 6px 0 var(--edge)}
.paper p{margin:6px 0}
.pm{font-family:var(--display);font-size:18px;letter-spacing:.08em;border-bottom:3px double #111;padding-bottom:2px;margin-bottom:6px}
.ph{font-family:var(--display);font-size:clamp(34px,7vw,52px);line-height:.95;text-transform:uppercase}
.escore{font-family:var(--display);font-size:28px;margin:6px 0}
.verdict{margin-top:10px;font-family:var(--display);font-size:32px;padding:6px 12px;border:3px solid var(--edge);text-align:center}
.verdict.ok{background:var(--g);color:#000}.verdict.bad{background:var(--b);color:#fff}
.person2{border-top:2px dashed var(--line);padding:8px 0}.person2:first-child{border-top:0}
.ph2{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;text-align:left;padding:0;min-height:44px}
.opn{font-family:var(--display);font-size:28px}

/* start screen */
.hero{padding-block:8px 4px}
.logo{font-family:var(--display);font-size:clamp(56px,13vw,96px);line-height:.85;background:var(--bar);color:var(--bar-ink);display:inline-block;padding:6px 14px 2px;border:3px solid var(--edge);box-shadow:6px 6px 0 var(--edge)}
.hero p{max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input{background:var(--btn2);color:#111;border:3px solid var(--edge);border-radius:0;padding:10px 12px;font:inherit;font-size:17px;max-width:420px;min-height:48px}
.modes,.clubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.club{text-align:left;background:var(--btn2);color:#111;padding:12px;display:flex;flex-direction:column;gap:4px}
.club b{font-family:var(--display);font-size:28px;font-weight:400;line-height:1}.club small{font-size:13px}
.club.on{background:var(--btn)}
.club .eyebrow{color:#444}
.traitpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tp{text-align:left;background:var(--btn2);color:#111;padding:8px 10px;min-height:48px}
.tp b{font-weight:700;text-transform:uppercase;font-size:13px}.tp small{display:block;font-size:12px}
.tp.on{background:var(--btn)}.tp:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:13px}

/* player mode (Dutch side mode) in the same retro skin */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bar);color:var(--bar-ink);border:3px solid var(--edge);padding:6px 12px;margin-bottom:10px;font-family:var(--display);font-size:22px}
.brand{font-size:26px}.brand span{color:inherit;text-decoration:underline}
.band{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:12px;border:3px solid var(--edge);background:var(--panel);padding:12px}
.ten{font-family:var(--display);font-size:120px;line-height:.8;background:linear-gradient(to top,var(--tc) var(--c),rgba(160,170,220,.18) var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.tenwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.tier{font-size:12px;font-weight:700;text-transform:uppercase;padding:2px 8px;border:2px solid var(--edge);background:var(--panel2)}
.who h2{font-size:38px;line-height:1}.who .sub{color:var(--dim);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;padding:1px 6px;border:2px solid var(--line)}.chip.me{border-color:var(--gold);color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.stat{background:#000;color:var(--gold);border:2px solid var(--edge);padding:4px 6px}.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:400;line-height:1}.stat small{color:#9fb0ff;font-size:10px;text-transform:uppercase}
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.panel{border:3px solid var(--edge);background:var(--panel);padding:12px}
.panel h3{font-size:26px;margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.fixture{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.vs{font-family:var(--display);font-size:30px}.vs .at{color:var(--dim);margin:0 6px}
.sel{margin-top:8px;padding:8px;border:2px solid var(--edge);background:var(--panel2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;text-transform:uppercase;padding:2px 8px;border:2px solid var(--edge)}.pill.start{background:var(--g);color:#000}.pill.sub{background:var(--gold);color:#000}.pill.bench,.pill.inj{background:var(--b);color:#fff}
.event{border:3px solid var(--edge);background:var(--panel2);padding:12px;box-shadow:6px 6px 0 var(--edge)}.event h3{font-size:28px;color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice,.tbtn,.opt{text-align:left;background:var(--btn2);color:#111;padding:10px 12px;min-height:48px}
.choice small,.tbtn small,.opt small{display:block;font-size:12px;color:#444}
.choice:disabled,.tbtn:disabled:not(.on),.opt:disabled{opacity:.45;cursor:not-allowed}
.train{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.tbtn b{display:block;text-transform:uppercase;font-size:13px}.tbtn.on{background:var(--btn)}
.feed{display:flex;flex-direction:column;gap:4px;font-size:14px}.feed div{padding-left:10px;border-left:3px solid var(--line)}.feed .g{border-color:var(--g);color:inherit}.feed .b{border-color:var(--b);color:inherit}.feed .y{border-color:var(--gold)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.tab{background:var(--btn2);color:#111;min-height:44px;font-weight:700;font-size:12px;text-transform:uppercase}.tab.on{background:var(--hd);color:var(--hd-ink)}
.person{border-top:2px dashed var(--line);padding:8px 0}.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;background:none;border:0;text-align:left;padding:0;min-height:44px}
.phead .role{font-size:11px;text-transform:uppercase;color:var(--dim)}.phead .nm{font-family:var(--display);font-size:24px}
.op{font-family:var(--display);font-size:28px}
.opbar{height:6px;background:var(--panel2);border:1px solid var(--line);margin-top:6px;position:relative;overflow:hidden}.opbar i{position:absolute;top:0;bottom:0}
.breakdown{margin-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px}.breakdown div{display:flex;justify-content:space-between;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tbl th{font-family:var(--display);font-weight:400;font-size:18px;color:var(--dim);text-align:right;padding:2px 5px}.tbl td{text-align:right;padding:5px;border-top:1px dashed var(--line)}.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}.tbl tr.mine td{background:var(--bar);color:var(--bar-ink);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border:2px solid var(--edge);margin-right:6px;vertical-align:-1px}
.attr{display:grid;grid-template-columns:110px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:14px;margin:4px 0}.attr .bar{height:10px;background:var(--panel2);border:1px solid var(--line);position:relative}.attr .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}.attr .bar u{position:absolute;left:0;bottom:0;height:3px;background:var(--gold)}.attr b{font-family:var(--display);font-size:22px;font-weight:400;text-align:right}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:12px;background:#000;color:#fff;border:3px solid var(--edge)}
.board .team{font-family:var(--display);font-size:24px;line-height:1}.board .team.r{text-align:right}
.score{font-family:var(--display);font-size:60px;line-height:1;color:var(--gold);text-align:center}.clock{font-family:var(--display);color:#9fb0ff;text-align:center;font-size:20px}
.mstrip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:14px}.log div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px}.log .m{color:var(--dim);text-align:right}.log .goal{color:var(--g)}.log .against{color:var(--b)}.log .miss{color:var(--dim)}.log .you{color:var(--gold)}
.moment{border:3px solid var(--edge);background:var(--panel2);padding:12px;box-shadow:6px 6px 0 var(--edge)}.moment h3{font-size:30px;color:var(--gold)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:center}.opt b{text-transform:uppercase;font-size:14px}.opt .pct{font-family:var(--display);font-size:28px;text-align:right}
.result{padding:10px;border:2px solid var(--edge);background:var(--panel2);margin-bottom:10px}
.rating{font-family:var(--display);font-size:72px;line-height:1}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.band{grid-template-columns:minmax(0,1fr)}.ten{font-size:84px}.bd3 b{font-size:22px}.fx-t{font-size:22px}.tbar{font-size:20px}.tb-r{font-size:17px}}
.msg{border-top:2px dashed var(--line)}.msg:first-child{border-top:0}
.mh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;background:none;border:0;text-align:left;padding:10px 0;min-height:48px}
.mh .mfrom{grid-column:1;font-size:12px;color:var(--dim);text-transform:uppercase}.mh b{grid-column:1;font-weight:700}.mh .mwhen{grid-column:2;grid-row:1/3;font-size:11px;color:var(--dim);align-self:center;text-align:right}
.msg.unread .mh b{color:var(--gold)}.msg.unread .mh b:before{content:'● ';color:var(--gold)}
.msg.news .mh b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1}
.mb{padding:0 0 12px}.mb p{margin:0 0 6px}.res{color:var(--g)}
.older{margin-top:8px;border-top:3px solid var(--edge);padding-top:4px;opacity:.85}
.dept{border-top:2px dashed var(--line);padding:8px 0}.dept:first-of-type{border-top:0}.dept p{margin:2px 0}.lvl{color:var(--gold);letter-spacing:2px}
.rel{font-family:var(--display);font-size:22px}.rel.g{color:var(--g)}.rel.b{color:var(--b)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ===================== helpers ===================== */
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function flash(m,tone=''){S.flash.push({m,tone})}
function chron(t){S.chron.unshift({s:`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`,w:S.week+1,t})}
function mod(role,t,v,w){const c=C(role);if(!c)return;c.mods=c.mods.filter(m=>m.t!==t);c.mods.push({t,v,w})}
function conf(d){if(d<0&&has('kalm'))d*=.6;if(has('gevoelig'))d*=1.5;const before=P.conf;P.conf=clamp(Math.round(P.conf+d),has('arrogant')?30:0,100);return P.conf-before}
function fit(d){P.fit=clamp(Math.round(P.fit+d),0,100)}
function fans(d){P.fans=clamp(Math.round(P.fans+d),0,100)}
function fame(d){if(d>0&&has('bescheiden'))d*=.7;P.fame=clamp(Math.round(P.fame+d),0,100)}

function compat(c){
  const out=[];
  for(const t of c.traits){
    if(has(t))out.push([`Allebei ${TRAITS[t].n.toLowerCase()}`,10]);
    const o=TRAITS[t].opp; if(o&&has(o))out.push([`${TRAITS[t].n} tegenover ${TRAITS[o].n.toLowerCase()}`,-15]);
  }
  if(has('arrogant'))out.push(['Vindt je arrogant',-10]);
  if(has('bescheiden')&&c.role!=='journalist')out.push(['Waardeert je bescheidenheid',5]);
  if(has('leider')&&['aanvoerder','maatje','sterspeler'].includes(c.role))out.push(['Volgt jouw voorbeeld',8]);
  if(has('feestbeest')&&c.role==='maatje')out.push(['Gezellig in de groep',6]);
  if(c.role==='trainer'){const st=COACH[c.style];
    for(const t of st.likes)if(has(t))out.push([`${st.n}: waardeert ${TRAITS[t].n.toLowerCase()}`,12]);
    for(const t of st.dislikes)if(has(t))out.push([`${st.n}: ergert zich aan ${TRAITS[t].n.toLowerCase()}`,-12]);}
  return out;
}
const opinionParts=c=>[['Eerste indruk',c.base],...compat(c),...c.mods.map(m=>[m.t,m.v])];
const opinion=c=>clamp(opinionParts(c).reduce((s,x)=>s+x[1],0),-100,100);

function mkChar(role,extra={}){
  const keys=Object.keys(TRAITS),tr=[];
  while(tr.length<2){const t=pick(keys);if(tr.includes(t)||tr.some(x=>TRAITS[x].opp===t))continue;tr.push(t)}
  return Object.assign({id:role+ri(1e5,9e5),role,name:nm(),age:ri(22,33),traits:tr,base:0,mods:[]},extra);
}
function clubChars(t){return[
  mkChar('trainer',{age:ri(41,63),style:pick(Object.keys(COACH))}),
  mkChar('aanvoerder',{age:ri(27,33),base:5}),
  mkChar('concurrent',{age:ri(21,29),base:-10,ovr:t.str-8+ri(-3,4),form:[],conf:55}),
  mkChar('maatje',{age:ri(19,24),base:15}),
  mkChar('voorzitter',{age:ri(48,70)}),
]}
const salaryFor=t=>Math.round((t.str-50)*.45*10)/10;

function setClub(i){
  S.club=i; const t=team(i);
  P.salary=salaryFor(t); P.fans=50; P.penTaker=false; P.captain=false;
  const keep=(S.chars||[]).filter(c=>['zaakwaarnemer','journalist'].includes(c.role));
  if(!keep.length){keep.push(mkChar('zaakwaarnemer',{age:ri(35,58),base:20}),mkChar('journalist',{age:ri(26,55)}))}
  S.chars=[...clubChars(t),...keep];
}
function makeFixtures(){
  const n=8,order=[...Array(n).keys()].sort(()=>R()-.5),arr=order.slice(),rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push(r%2?[b,a]:[a,b])}rounds.push(m);arr.splice(1,0,arr.pop())}
  return rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));
}
function newSeasonSetup(){
  S.fixtures=makeFixtures(); S.week=0;
  S.table=S.teams.map(()=>({p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  P.st={apps:0,goals:0,assists:0,ratings:[]};
}
function myFixture(){const m=S.fixtures[S.week].find(x=>x.includes(S.club));return{home:m[0]===S.club,opp:m[0]===S.club?m[1]:m[0]}}
function sortedTable(){return S.teams.map(t=>({id:t.id,...S.table[t.id]})).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
const myPos=()=>sortedTable().findIndex(r=>r.id===S.club)+1;

}

function youScore(){return Math.round(ovr()+(formAvg()-6.6)*8+opinion(C('trainer'))/4+(P.conf-50)/8+S.startBonus-(P.fit<50?10:0))}
function rivalScore(){const r=C('concurrent');return Math.round(r.ovr+((r.form.length?avg(r.form.slice(-5)):6.6)-6.6)*8+(r.conf-50)/10+3-S.rivalPenalty+S.selNoise)}
function selRole(){if(S.injured>0)return'inj';const d=youScore()-rivalScore();return d>=0?'start':d>-8?'sub':'bench'}

function addProg(k,pts){P.prog[k]=(P.prog[k]||0)+pts;while(P.prog[k]>=100){P.prog[k]-=100;if(P.attrs[k]<20){P.attrs[k]++;flash(`${ATTR[k]} omhoog naar ${P.attrs[k]}.`,'g')}}}

/* ===================== week loop ===================== */
function startWeek(){
  S.trained=null;S.social=false;S.flash=[];S.selNoise=ri(-5,5);S.event=null;
  if(R()<.65){const el=EVENTS.filter(e=>(!e.cond||e.cond())&&(S.seenEv[e.id]===undefined||S.abs-S.seenEv[e.id]>9));if(el.length)S.event=pick(el).id}
}
const A={};
A.train=k=>{
  if(S.trained)return;const t=TRAIN.find(x=>x.k===k);
  if(S.injured>0&&k!=='rust')return;
  if(t.cost){if(P.money<t.cost){flash('Daar heb je het geld niet voor.','b');return render()}P.money-=t.cost}
  S.trained=k;fit(t.fit);if(t.conf)conf(t.conf);

};
A.social=(role,k)=>{

A.choose=i=>{

A.tab=t=>{S.tab=t;render()};
A.open=id=>{S.open=S.open===id?null:id;render()};

/* ===================== match ===================== */
function chance(o,opp){
  if(o.res==='pass')return 100;
  const a=o.a.length?avg(o.a.map(k=>P.attrs[k])):12;
  let c=o.b+(a-12)*3.5+(P.conf-50)*.2-(opp.str-66)*.6;
  const t=tier();if(t==='zone')c+=6;if(t==='twijfel'&&!o.res.startsWith('safe'))c-=8;
  if(has('nuchter')&&o.res.startsWith('safe'))c+=6;if(has('showman')&&o.flair)c+=6;
  return clamp(Math.round(c),5,96);
}
function flairOk(o){return!o.flair||P.conf>=o.flair-(has('showman')?15:0)}
A.goMatch=()=>{
  if(S.event||!S.trained)return;
  const fx=myFixture(),opp=team(fx.opp),me=team(S.club);
  let role=selRole();
  if((role==='start'||role==='sub')&&P.fit<30&&R()<.35){S.injured=ri(1,3);role='inj';chron(`${P.name} raakt geblesseerd in de warming-up. ${S.injured} wk eruit.`)}
  let enter=role==='start'?0:role==='sub'?ri(55,70):role==='bench'&&R()<.25?ri(76,84):99;
  const playing=enter<90;
  const myStr=me.str+(playing?(ovr()-60)*.15:-1);
  const lamUs=1.3*Math.pow(myStr/opp.str,2)*(fx.home?1.1:.92),lamThem=1.3*Math.pow(opp.str/myStr,2)*(fx.home?.92:1.1);
  const ev=[];
  for(let i=poisson(lamUs*(playing?.7:1));i>0;i--)ev.push({min:ri(1,90),type:'gu'});
  for(let i=poisson(lamThem);i>0;i--)ev.push({min:ri(1,90),type:'gt'});
  if(playing){
    if(enter>0)ev.push({min:enter,type:'in'});
    const n=enter===0?ri(4,5):enter<75?2:1;
    for(let i=0;i<n;i++){const pen=R()<.08;ev.push({min:ri(Math.max(enter+2,4),89),type:'mo',m:pen?'pen':pick(MOMENTS.filter(x=>x.id!=='pen')).id})}
  }
  ev.sort((a,b)=>a.min-b.min);
  const intro={start:'Je staat in de basis.',sub:'Je begint op de bank.',bench:'Je zit op de bank. Het kan een lange middag worden.',inj:'Je kijkt vanaf de tribune, met ijs op je enkel.'}[role];
  S.match={opp:opp.id,home:fx.home,ev,i:0,min:0,us:0,them:0,rating:role==='start'?6.4:6.3,role,enter,playing,log:[{min:0,t:`Aftrap. ${intro}`,tone:''}],pending:null,last:null,g:0,a:0,confD:0,done:false,sum:null};
  S.phase='match';render();
};
function stepMatch(){
  const m=S.match;if(m.pending||m.done)return false;
  m.min++;
  while(m.i<m.ev.length&&m.ev[m.i].min<=m.min){
    const e=m.ev[m.i++];
    if(e.type==='gu'){m.us++;if(m.playing&&m.min>=m.enter)m.rating+=.05;m.log.push({min:e.min,t:`Doelpunt ${team(S.club).name}. ${m.us}-${m.them}.`,tone:'goal'})}
    else if(e.type==='gt'){m.them++;if(m.playing&&m.min>=m.enter)m.rating-=.1;m.log.push({min:e.min,t:`Tegengoal. ${team(m.opp).name} scoort.`,tone:'against'})}
    else if(e.type==='in'){m.log.push({min:e.min,t:`Wissel: ${lastName()} komt erin.`,tone:'you'})}
    else if(e.type==='mo'){
      if(e.m==='pen'&&!P.penTaker&&P.conf<60){m.log.push({min:e.min,t:`Strafschop! ${C('aanvoerder').name} neemt hem... `+(R()<.75?(m.us++,'en scoort.'):'en mist.'),tone:''});continue}
      m.pending=e.m;m.last=null;return false;
    }
  }
  if(m.min>=90){finishMatch();return false}
  return true;
}
A.play=(instant)=>{
  if(timer)return;const m=S.match;if(!m||m.pending||m.done)return;
  if(instant||REDUCED){while(stepMatch());render();return}
  timer=setInterval(()=>{const go=stepMatch();if(!go){clearInterval(timer);timer=null;render()}else updateBoard()},45);
};
A.resolve=k=>{
  const m=S.match,mo=MOMENTS.find(x=>x.id===m.pending),o=mo.o.find(x=>x.k===k);
  if(!flairOk(o))return;
  const opp=team(m.opp),c=chance(o,opp),ok=R()*100<c,ln=lastName();
  let d=0,cf=0,tone='you',txt='';
  const counter=p=>{if(R()<p){m.them++;d-=.25;return` De tegenstander schakelt om en scoort: ${m.us}-${m.them}.`}return''};
  switch(o.res){
    case'goal':if(ok){m.us++;m.g++;d+=o.big?1.4:1.1;cf+=o.big?14:7;tone='goal';txt=o.big?`PANENKA! ${ln} schept hem door het midden. Het stadion ontploft.`:`DOELPUNT! ${ln} ${pick(GOALTXT)}`;if(o.big){fans(8);fame(3)}}
      else{d-=o.big?.7:.25;cf-=o.big?12:2;tone='miss';txt=o.big?'De panenka is zacht en voorspelbaar. De keeper blijft gewoon staan.':pick(MISSTXT);if(o.big)fans(-5)}break;
    case'assist':if(ok){if(R()<.62){m.us++;m.a++;d+=.8;cf+=5;tone='goal';txt=`DOELPUNT! ${pick(ASSTXT)} Assist ${ln}.`}else{d+=.25;cf+=1;txt='Prachtige bal, maar de spits schiet hem over.'}}
      else{d-=.2;cf-=2;tone='miss';txt='De pass wordt onderschept.'+counter(.12)}break;
    case'chance':if(ok){if(R()<.5){m.us++;m.g++;d+=1.1;cf+=8;tone='goal';txt=`Erlangs... en binnen! DOELPUNT ${ln}!`}else{d+=.35;cf+=3;txt='Erlangs! Het schot wordt nog net gekeerd.'}}
      else{d-=.3;cf-=3;tone='miss';txt='Balverlies.'+counter(.18)}break;
    case'safe':if(ok){d+=.1;txt='Rustig in balbezit. Niks bijzonders, niks fout.'}else{d-=.4;cf-=4;tone='miss';txt='Slordig! De bal is weg.'+counter(.25)}break;
    case'safeplus':if(ok){d+=.3;cf+=2;txt='Je houdt hem af en wordt neergehaald. Vrije trap, en een knikje van de trainer.'}else{d-=.3;cf-=3;tone='miss';txt='Je verliest het duel.'+counter(.15)}break;
    case'pass':{const cap=C('aanvoerder');mod('aanvoerder','Gaf hem de strafschop',8,8);cf-=has('ambitieus')?5:1;if(R()<.75){m.us++;txt=`${cap.name} schiet hem koel binnen.`;tone='goal'}else{txt=`${cap.name} mist! De keeper heeft hem.`;tone='miss'}}break;
  }
  if(txt.includes('tegenstander schakelt'))tone='against';
  m.rating+=d;const real=conf(cf);m.confD+=real;
  m.log.push({min:m.min,t:txt,tone});m.pending=null;m.last={txt,tone,ok,c,real};
  render();
};
function finishMatch(){
  const m=S.match;m.done=true;m.min=90;
  const res=m.us>m.them?'w':m.us<m.them?'l':'d';
  const lines=[];let cd=0;
  // table: my match
  const me=S.club,op=m.opp,[h,a]=m.home?[me,op]:[op,me],[hg,ag]=m.home?[m.us,m.them]:[m.them,m.us];
  applyResult(h,a,hg,ag);
  // the rest of the round
  for(const [x,y] of S.fixtures[S.week]){if(x===me||y===me)continue;const sx=team(x).str,sy=team(y).str;applyResult(x,y,poisson(1.3*Math.pow(sx/sy,2)*1.1),poisson(1.3*Math.pow(sy/sx,2)*.92))}
  const r=C('concurrent');
  if(m.playing){
    m.rating+=res==='w'?.3:res==='l'?-.3:0;m.rating=Math.round(clamp(m.rating,3,10)*10)/10;
    P.form.push(m.rating);P.st.ratings.push(m.rating);P.st.apps++;P.st.goals+=m.g;P.st.assists+=m.a;
    S.lastRating=m.rating;
    cd+=conf((m.rating-6.6)*4+(res==='w'?2:res==='l'?-2:0));
    fit(m.enter===0?-14:-7);fans((m.rating-6.5)*4);fame(m.g*2+m.a+(m.rating>=8?2:0));
    if(m.rating>=8){mod('trainer',`Uitblinker tegen ${team(op).short}`,8,6);lines.push('De trainer noemt je naam in de persconferentie.')}
    if(m.rating<5.5){mod('trainer',`Zwakke wedstrijd tegen ${team(op).short}`,-6,4);lines.push('De trainer loopt zonder iets te zeggen langs je heen.')}
    if(m.g>=2){chron(`${P.name} scoort ${m.g}x tegen ${team(op).name}.`);mod('maatje','Vierde jouw goals mee',4,6)}
    if(m.enter===0){r.conf=clamp(r.conf-3,0,100)}else{r.form.push(Math.round((6.4+(r.ovr-60)/18+(R()-.5)*1.4)*10)/10)}
  }else{
    S.lastRating=null;
    cd+=conf(m.role==='inj'?-1:has('ambitieus')?-7:has('tevreden')?-1:-4);fit(m.role==='inj'?5:8);
    r.form.push(Math.round((6.5+(r.ovr-60)/18+(R()-.5)*1.4)*10)/10);r.conf=clamp(r.conf+3,0,100);
    if(m.role!=='inj')lines.push(`${r.name} speelt de hele wedstrijd op jouw positie.`);
  }
  if(res==='w'&&P.captain)lines.push('Als aanvoerder ga je voorop in de polonaise.');
  m.sum={res,cd:m.confD+cd,lines};
  P.form=P.form.slice(-10);r.form=r.form.slice(-10);
}
function applyResult(h,a,hg,ag){
  const H=S.table[h],Aw=S.table[a];H.p++;Aw.p++;H.gf+=hg;H.ga+=ag;Aw.gf+=ag;Aw.ga+=hg;
  if(hg>ag){H.w++;H.pts+=3;Aw.l++}else if(hg<ag){Aw.w++;Aw.pts+=3;H.l++}else{H.d++;Aw.d++;H.pts++;Aw.pts++}
}
A.afterMatch=()=>{
  S.match=null;S.week++;S.abs++;S.startBonus=0;S.rivalPenalty=0;
  for(const c of S.chars){c.mods.forEach(m=>m.w--);c.mods=c.mods.filter(m=>m.w>0)}
  P.conf=clamp(Math.round(P.conf+(50-P.conf)*.1),has('arrogant')?30:0,100);
  fit(has('professioneel')?14:has('feestbeest')?6:10);
  P.money=Math.round((P.money+P.salary)*10)/10;
  if(S.injured>0)S.injured--;
  if(S.week>=14){seasonEnd();return render()}
  S.phase='week';startWeek();render();window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
};

/* ===================== season end ===================== */
function seasonEnd(){
  const tbl=sortedTable(),pos=tbl.findIndex(r=>r.id===S.club)+1,t=team(S.club);
  const avgR=avg(P.st.ratings),yy=`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
  if(pos===1){S.trophies.push(`Landskampioen ${yy}, ${t.name}`);chron(`${t.name} is kampioen!`);fame(10)}
  if(avgR>=7.3&&P.st.apps>=8){S.trophies.push(`Speler van het jaar ${yy}`);chron(`${P.name} is speler van het jaar.`);fame(8)}
  S.seasons.push({yy,club:t.name,pos,apps:P.st.apps,goals:P.st.goals,assists:P.st.assists,avg:avgR?avgR.toFixed(2):'-'});
  P.car.apps+=P.st.apps;P.car.goals+=P.st.goals;P.car.assists+=P.st.assists;
  // offers
  const offers=[];
  for(const x of S.teams){if(x.id===S.club)continue;const sc=ovr()+(avgR?(avgR-6.5)*10:-8)+P.fame/4+ri(-8,8);if(sc>=x.str-6)offers.push({id:x.id,salary:Math.round(salaryFor(x)*(1+P.fame/200)*10)/10})}
  offers.sort((a,b)=>team(b.id).str-team(a.id).str);
  const vo=opinion(C('voorzitter'));
  const renew=vo>-30?Math.round(P.salary*(vo>30?1.3:vo>0?1.12:1)*10)/10:null;
  let list=offers.slice(0,3);
  if(!list.length&&renew===null){const low=S.teams.filter(x=>x.id!==S.club).sort((a,b)=>a.str-b.str)[0];list=[{id:low.id,salary:salaryFor(low)}]}
  S.offers={list,renew,pos,avgR};
  S.phase='season';
}
A.next=target=>{
  if(target==='retire'){S.phase='retired';chron(`${P.name} stopt met voetballen.`);return render()}
  P.age++;S.season++;S.year++;
  if(P.age<=23)for(let i=0;i<2;i++){const k=pick(Object.keys(ATTR));if(P.attrs[k]<20)P.attrs[k]++}
  if(P.age>=30){for(let i=0;i<P.age-29;i++){const k=R()<.5?'snl':pick(['dri','tec','afw','kal']);if(P.attrs[k]>1)P.attrs[k]--}}
  for(const x of S.teams)x.str=clamp(x.str+ri(-3,3),52,84);
  const r=C('concurrent');
  if(target==='stay'){P.salary=S.offers.renew;chron(`${P.name} tekent bij voor een nieuw seizoen.`);
    if(r){r.age++;r.ovr+=r.age<25?ri(1,3):r.age>30?-ri(1,2):0;r.form=[]}
    if(!P.captain&&has('leider')&&opinion(C('aanvoerder'))>40&&opinion(C('trainer'))>30){P.captain=true;chron(`${P.name} krijgt de aanvoerdersband.`)}
  }else{const o=S.offers.list.find(x=>x.id===target);chron(`Transfer: ${P.name} vertrekt naar ${team(target).name}.`);setClub(target);P.salary=o.salary}
  P.conf=clamp(Math.round((P.conf+55)/2),0,100);P.fit=95;P.form=[];
  newSeasonSetup();S.offers=null;S.phase='week';startWeek();render();window.scrollTo({top:0});
};

/* ===================== rendering ===================== */
function render(){
  if(timer&&S?.phase!=='match'){clearInterval(timer);timer=null}
  const app=document.getElementById('app');
  if(!S){app.innerHTML=startView();return}
  P=S.p;
  if(isChair()){renderChair(app);save();return}
  if(S.phase==='retired'){app.innerHTML=topbar()+retiredView();save();return}
  app.innerHTML=topbar()+band()+(S.phase==='season'?seasonView():`<div class="game"><div class="stack">${S.phase==='match'?matchView():weekView()}</div><aside class="panel">${sideView()}</aside></div>`);
  const lg=document.getElementById('log');if(lg)lg.scrollTop=lg.scrollHeight;
  save();
}
function topbar(){
  const t=team(S.club),yy=`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
  return`<header class="top"><div class="brand">DE <span>SPEL</span>MAKER</div><div class="meta">${esc(t.name)} · ${isChair()?TIERS[S.cl.tier].n+' · ':''}${yy} · Ronde ${Math.min(S.week+1,14)}/14 <button class="linkbtn" onclick="A.reset()">Opnieuw beginnen</button></div></header>`;
}

function weekView(){
  const fx=myFixture(),o=team(fx.opp),role=selRole(),[sl,sc,sd]=SEL[role],r=C('concurrent');

    <div class="sel"><span class="pill ${sc}">${sl}</span><span>${sd}</span><span class="muted num" style="margin-left:auto">Jij ${youScore()} · ${esc(r.name.split(' ')[0])} ${rivalScore()}</span></div>

  h+=`<section class="panel"><h3>Training deze week</h3><div class="train">${TRAIN.map(t=>{const dis=!!S.trained||(S.injured>0&&t.k!=='rust');return`<button class="tbtn ${S.trained===t.k?'on':''}" ${dis?'disabled':''} onclick="A.train('${t.k}')"><b>${t.n}</b><small>${t.at.length?t.at.map(a=>ATTR[a]).join(' · '):'Fitheid +20'}${t.fit<0?` · fit ${t.fit}`:''}${t.conf?' · vertrouwen +':''}</small></button>`}).join('')}</div>
    <p class="muted" style="font-size:13px;margin:10px 0 0">${S.social?'Je hebt deze week al met iemand gepraat.':'Eén gesprek per week: open iemand in het paneel <b>Mensen</b>.'}</p></section>`;

function boardHTML(){

  }else{

const upCost=k=>Math.round(DIV[S.cl.tier].fee*(k==='stadium'?14:5)*S.cl[k]);

function startBuild(k,byYou){const cost=upCost(k),w=upWeeks(k)+councilDelay(k);cash(-cost);S.cl.builds[k]=w;chron(`${DEPTS[k].n}: work to level ${S.cl[k]+1} begins (${fm(cost)}).`);if(byYou)mod(DEPTS[k].head,'You invested in his department',8,16);return`Work starts: ready in ${w} weeks.`}
A.invest=k=>{if(S.cl.builds[k]||S.cl[k]>=4||S.cl.cash<upCost(k))return;const r=startBuild(k,true);msg(DEPTS[k].head,`${DEPTS[k].n}: your investment`,r);S.view='club';render()};
const CAL=['9 Aug','23 Aug','13 Sep','27 Sep','11 Oct','25 Oct','15 Nov','6 Dec','24 Jan','7 Feb','28 Feb','21 Mar','11 Apr','2 May'];
const POSN={GK:'goalkeeper',DF:'defender',MF:'midfielder',FW:'striker'};

const isChair=()=>S&&S.mode==='chair';
const fm=v=>{const neg=v<0,a=Math.abs(v);const s=a>=1000?`£${(a/1000).toFixed(a>=10000?0:1)}m`:a<10&&a>0?`£${a.toFixed(1)}k`:`£${Math.round(a)}k`;return(neg?'−':'')+s};
const fw=v=>`${fm(v)}/w`;
const T=()=>DIV[S.cl.tier];
const ord=n=>n+(n===1?'st':n===2?'nd':n===3?'rd':'th');
const wageFor=(r,tier)=>Math.round(.8*Math.pow(r/47,4)*DIV[tier].pay*10)/10;
const valueFor=(p,tier)=>Math.round(wageFor(p.r,tier)*60*(p.age<22?1.6:p.age<26?1.3:p.age>31?.45:1));
const uid=()=>'u'+(S.uid=(S.uid||0)+1);
const CH=role=>S.chars.find(c=>c.role===role);
function remember(role,t,v){const c=CH(role);if(!c)return;c.mods=c.mods.filter(m=>m.t!==t);c.mods.push({t,v,w:999,mem:true})}
const opC=c=>clamp(c.base+c.mods.reduce((s,m)=>s+m.v,0)+c.traits.reduce((s,t)=>s+(has(t)?8:TRAITS[t].opp&&has(TRAITS[t].opp)?-10:0),0),-100,100);
const relWord=c=>{const o=opC(c);return o>=30?'Loyal':o>=10?'Warm':o>-10?'Neutral':o>-30?'Cool':'Hostile'};
const relCls=w=>({Loyal:'g',Warm:'g',Neutral:'',Cool:'b',Hostile:'b'})[w];
function trustD(d){S.trust=clamp(Math.round(S.trust+d),0,100)}
function cash(d){S.cl.cash=Math.round((S.cl.cash+d)*10)/10}
const debt=()=>Math.round(S.cl.loans.reduce((s,l)=>s+l.repay*l.weeks,0));
function takeLoan(amount,why){const weeks=20,repay=Math.round(amount*1.1/weeks*10)/10;S.cl.loans.push({amount,repay,weeks});cash(amount);chron(`Loan ${fm(amount)} (${why}): ${fw(repay)} for ${weeks} weeks.`);return repay}

/* ---------- money: three numbers ---------- */
function attendance(derby){const form=(S.teams[0].form||[]).slice(-3).filter(r=>r==='W').length;return Math.min(S.cl.cap,Math.round(S.cl.fans*(.6+S.trust/125+form*.03)*clamp(1.25-.25*S.cl.price,.6,1.1)*(derby?1.25:1)))}
const ticket=()=>Math.round(T().price*S.cl.price);
const wageBill=()=>Math.round((S.squad.reduce((s,p)=>s+p.wage,0)+S.chars.filter(c=>c.wage).reduce((s,c)=>s+c.wage,0))*10)/10;
const deptCost=()=>Math.round((S.cl.training+S.cl.academy+S.cl.medical+S.cl.stadium)*.45*T().cost*10)/10;
const repayW=()=>Math.round(S.cl.loans.reduce((s,l)=>s+l.repay,0)*10)/10;
const incomeW=()=>Math.round((T().tv+S.cl.sponsor.pw+attendance()*ticket()/1000/2+T().spons*.1)*10)/10;
const costW=()=>Math.round((wageBill()+deptCost()+repayW())*(S.cl.cutUntil>S.abs?1:1)*10)/10-(S.cl.saving||0);
function payWeek(home,derby){
  let inc=T().tv+S.cl.sponsor.pw;if(home)inc+=attendance(derby)*ticket()/1000+T().spons*.2;
  const out=wageBill()+deptCost()+repayW()-(S.cl.saving||0);
  cash(inc-out);S.cl.loans.forEach(l=>l.weeks--);S.cl.loans=S.cl.loans.filter(l=>l.weeks>0);
  S.season_inc+=inc;S.season_out+=out;
}

/* ---------- the inbox ---------- */
function msg(from,subject,body,opts,def,kind){const m={id:uid(),from,subject,body,opts:opts||[],def:def===undefined?null:def,kind:kind||(opts&&opts.length?'decision':'report'),read:false,done:!(opts&&opts.length),when:stepLabel()};S.inbox.unshift(m);S.inbox=S.inbox.slice(0,60);return m}
const fromLabel=f=>f==='board'?'The Board':f==='echo'?`The ${S.cl.town} Echo`:f==='members'?'The members':`${CH(f)?CH(f).name:'?'} · ${ROLE_EN[f]}`;
A.mopen=id=>{const m=S.inbox.find(x=>x.id===id);if(!m)return;m.read=true;S.openMsg=S.openMsg===id?null:id;render()};
A.answer=(id,j)=>{const m=S.inbox.find(x=>x.id===id);if(!m||m.done)return;const r=m.opts[j].f();m.done=true;m.chosen=j;m.result=r||'';m.read=true;render()};

/* ---------- opening (§7.1, MB-39/43) ---------- */
function genDossier(tier,story){
  const st=STORIES[story],town=pick(TOWNS),t=DIV[tier];let rt;do{rt=pick(TOWNS)}while(rt===town);
  const weekly=t.tv+t.spons+t.price*t.fans/2000;
  return{tier,story,town,name:`${town} ${pick(SUFFIX)}`,col:pick(COLS),founded:ri(1878,1931),cash:Math.round(weekly*8*st.cash),loan:story==='red'?Math.round(weekly*6):0,trust:st.trust+ri(-4,4),
    legend:`${nmE()}, ${ri(90,240)} goals`,scar:pick([`Relegated on the last day of ${ri(1996,2019)}`,`Went into administration in ${ri(2002,2015)}`,`Lost the ${ri(1985,2012)} cup final 4–0 to the rival`,`Missed promotion on goal difference in ${ri(2005,2022)}`]),
    rival:`${rt} ${pick(SUFFIX)}`,names:{treasurer:nmE(),td:nmE(),coach:nmE()}};
}
function genChairs(rep){const tiers=rep>=60?[2,3,3]:rep>=30?[3,3,4]:[4,4,4];const st=['title','mid','releg','red'].sort(()=>R()-.5).slice(0,3);return tiers.map((t,i)=>genDossier(t,st[i]))}
function mkPlayer(pos,r,age,tier,youth){const p={id:uid(),name:nmE(),pos,age,r:clamp(Math.round(r),25,92),youth:!!youth,contract:youth?3:ri(1,3),apps:0,goals:0,inj:0,joined:S.year};p.pot=p.r+(age<20?ri(8,18):age<23?ri(3,10):age<26?ri(0,4):0);p.wage=youth?Math.round(wageFor(p.r,tier)*.4*10)/10:wageFor(p.r,tier);return p}
function genSquad(tier,str){const POS=['GK','GK','DF','DF','DF','DF','DF','DF','MF','MF','MF','MF','MF','MF','FW','FW','FW','FW'];const sq=POS.map(p=>mkPlayer(p,str+ri(-7,4),ri(19,33),tier));sq.sort(()=>R()-.5).slice(0,3).forEach(p=>{p.r+=ri(5,8);p.wage=wageFor(p.r,tier)});sq.push(mkPlayer(pick(['DF','MF','FW']),str-10,17,tier,true));return sq}
function genLeague(tier,our,rival){
  const used=new Set([our.name.split(' ')[0],rival.name.split(' ')[0]]);const out=[];
  while(out.length<6){const n=`${pick(TOWNS)} ${pick(SUFFIX)}`;if(used.has(n.split(' ')[0]))continue;used.add(n.split(' ')[0]);out.push({name:n,str:DIV[tier].base+ri(-6,6),col:pick(COLS),form:[]})}
  rival.str=DIV[tier].base+ri(-3,4);rival.form=[];out.splice(ri(0,6),0,rival);
  return[{...our,id:0,form:[]},...out.map((t,i)=>({...t,id:i+1}))];
}
function pickXI(){const av=S.squad.filter(p=>!p.inj),c=CH('coach'),yb=p=>p.youth?(c&&c.style==='young'?3:0):0;const by=pos=>av.filter(p=>p.pos===pos).sort((a,b)=>(b.r+yb(b))-(a.r+yb(a)));let xi=[...by('GK').slice(0,1),...by('DF').slice(0,4),...by('MF').slice(0,4),...by('FW').slice(0,2)];if(xi.length<11)xi=xi.concat(av.filter(p=>!xi.includes(p)).sort((a,b)=>b.r-a.r).slice(0,11-xi.length));return xi}
const xiAvg=()=>Math.round(avg(pickXI().map(p=>p.r))*10)/10;
function setExpected(){const m=xiAvg();S.expected=S.teams.filter(t=>t.id!==0&&t.str>m).length+1}
function chairNew(){S={v:4,mode:'chair',phase:'chairs',p:{name:draft.name.trim()||nmE(),age:ri(42,56),traits:draft.traits.slice(),money:0,fame:5,st:null,form:[]},career:{seasons:[],trophies:[],rep:20},chron:[],year:2026};P=S.p;S.chairs=genChairs(20)}
function takeChair(d){
  const keep={career:S.career,p:S.p,chron:S.chron,year:S.year};
  S={v:4,mode:'chair',phase:'day1',view:'inbox',club:0,year:keep.year,season:1,abs:0,uid:0,p:keep.p,career:keep.career,chron:keep.chron,
    cl:{name:d.name,town:d.town,tier:d.tier,founded:d.founded,col:d.col,cash:d.cash,loans:[],cap:DIV[d.tier].cap,fans:DIV[d.tier].fans,price:1,nextPrice:1,training:1,academy:1,medical:1,stadium:1,builds:{},record:0,sponsor:{name:`${d.town} Building Society`,pw:DIV[d.tier].spons,seasons:1},legend:d.legend,scar:d.scar,story:d.story,saving:0},
    trust:d.trust,promises:[],course:null,budget:{transfer:0,wage:0},inbox:[],echo:[],recs:[],plan:[],win:null,tl:[],ti:0,openMsg:null,season_inc:0,season_out:0};
  P=S.p;
  if(d.loan)takeLoan(d.loan,'inherited');
  S.squad=genSquad(d.tier,DIV[d.tier].base+STORIES[d.story].str);
  S.cl.record=Math.round(Math.max(...S.squad.map(p=>valueFor(p,d.tier)))*1.4);
  S.teams=genLeague(d.tier,{name:d.name,col:d.col},{name:d.rival,col:pick(COLS),rival:true});
  const cw=Math.round(wageFor(DIV[d.tier].base+8,d.tier)*10)/10;
  S.chars=[mkChar('coach',{name:d.names.coach,age:ri(38,60),style:pick(Object.keys(STYLES)),q:ri(2,4),wage:cw,since:0,results:[],base:5}),
    mkChar('td',{name:d.names.td,age:ri(36,58),q:ri(2,4),wage:Math.round(cw*.8*10)/10,base:5}),
    mkChar('treasurer',{name:d.names.treasurer,age:ri(45,66),base:5})];
  for(const r of['commercial','scout','academy','medical','grounds','supporters','council','rivalch'])S.chars.push(mkChar(r,{name:nmE(),age:ri(32,64),base:r==='rivalch'?-10:r==='supporters'?5:0}));
  seasonSetup();setExpected();S.career.rep=S.career.rep||20;
  chron(`${P.name} appointed chairman of ${d.name}.`);
}
function seasonSetup(){S.fixtures=makeFixtures();S.week=0;S.table=S.teams.map(()=>({p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));S.squad.forEach(p=>{p.apps=0;p.goals=0});S.youthApps={};S.cl.startCash=S.cl.cash;S.cl.startDebt=debt();S.season_inc=0;S.season_out=0;S.decDone=false;
  S.tl=[{t:'plan'},...[1,2,3,4].map(w=>({t:'win',k:'summer',w,of:4})),...[0,1,2,3,4,5,6,7].map(r=>({t:'match',r})),{t:'win',k:'winter',w:1,of:2},{t:'win',k:'winter',w:2,of:2},...[8,9,10,11,12,13].map(r=>({t:'match',r})),{t:'agm'}];S.ti=0}
function stepLabel(){if(!S.tl||!S.tl[S.ti])return'';const s=S.tl[S.ti];return s.t==='plan'?'June':s.t==='win'?`${s.k==='summer'?'July':'January'} · window week ${s.w}/${s.of}`:s.t==='match'?`Week ${s.r+1} · ${CAL[s.r]}`:'May'}
function coursePromises(k){
  const exp=S.expected,top=S.cl.tier===1,league=k==='survive'?Math.min(6,exp+2):k==='build'?Math.min(7,exp):top?1:2;
  const money=k==='survive'?{t:'cash',v:Math.round(Math.max(0,S.cl.cash)),txt:`End the season with at least ${fm(Math.max(0,S.cl.cash))} in the bank`}:k==='build'?{t:'loss',v:Math.round(incomeW()*20*.1),txt:`Lose no more than ${fm(incomeW()*20*.1)} this season`}:{t:'debt',v:Math.round(debt()+incomeW()*10),txt:`Keep debt under ${fm(debt()+incomeW()*10)}`};
  const youth=k==='survive'?1:k==='build'?2:0;
  return[{k:'league',v:league,txt:league<=2?(top?'Win the league':'Win promotion (top 2)'):`Finish ${ord(league)} or higher`},{k:'money',...money},{k:'youth',v:youth,txt:youth?`${youth} academy player${youth>1?'s':''} play at least 3 games`:'No youth promise: win now'}];
}
A.course=k=>{
  S.course=k;S.promises=coursePromises(k);const c=COURSES[k];
  if(c.loan){const r=takeLoan(Math.round(incomeW()*6),'to fund the summer');trustD(-2)}
  S.budget.transfer=Math.round(Math.max(0,S.cl.cash-costW()*4)*c.spend);S.budget.wage=Math.round(c.wage*incomeW()*10)/10;
  chron(`Manifest signed: ${c.n}.`);S.phase='inbox';S.view='inbox';
  buildPlan();summerMessages();render();window.scrollTo({top:0});
};
function buildPlan(n){const xi=pickXI(),a=avg(xi.map(p=>p.r));S.plan=['GK','DF','MF','FW'].map(pos=>{const w=xi.filter(p=>p.pos===pos).sort((x,y)=>x.r-y.r)[0];return{pos,cur:w?w.r:0,curName:w?w.name:'-',gap:a-(w?w.r:0)}}).sort((x,y)=>y.gap-x.gap).slice(0,n||(S.course==='go'?3:2)).map(l=>({...l,target:Math.round(Math.max(l.cur+3,a+(S.course==='go'?4:2))),status:'Looking',signed:null}))}
function summerMessages(){
  const td=CH('td'),tr=CH('treasurer'),co=CH('coach');
  msg('treasurer','The books, in three lines',`Cash ${fm(S.cl.cash)}. Income ${fw(incomeW())}, costs ${fw(costW())}.${debt()?` We repay ${fw(repayW())} on loans.`:''} Wages should stay under ${fw(S.budget.wage)}.`);
  msg('coach','My view of the squad',`On paper we are the ${ord(S.expected)} best side in the ${T().n}. I play ${STYLES[co.style].toLowerCase()}.`);
  const sell=COURSES[S.course].sell;
  msg('td','My summer plan',`I want ${S.plan.map(p=>`a ${POSN[p.pos]} (ours: ${p.curName}, ${p.cur})`).join(' and ')}. Budget ${fm(S.budget.transfer)}${sell?', and I will sell one squad player to raise money':''}. I do the deals and call you only when I need you.`,[
    {n:'Approve the plan',fx:'The TD gets to work',f:()=>{mod('td','Got your backing',5,10);return'The TD gets to work.'}},
    {n:`Give him ${fm(Math.max(5,S.cl.cash*.1))} more`,fx:()=>`Transfer budget +${fm(Math.max(5,S.cl.cash*.1))} · cash for the season −${fm(Math.max(5,S.cl.cash*.1))} · TD +8`,f:()=>{const x=Math.round(Math.max(5,S.cl.cash*.1));S.budget.transfer+=x;remember('td','Gave him extra money in the summer',8);return`Budget raised by ${fm(x)}.`}},
    {n:'Spend less: keep the cash',fx:()=>`Transfer budget halved · TD −6`,f:()=>{S.budget.transfer=Math.round(S.budget.transfer/2);mod('td','Had his budget cut',-6,12);return'The TD will shop cheaper.'}}],0);
}

/* ---------- the window: the TD's work, his calls in the inbox ---------- */
function signPlayer(c,pl){
  const p=mkPlayer(c.pos,c.r,c.age,S.cl.tier);p.name=c.name;p.wage=c.wage;p.contract=3;p.fee=c.fee;S.squad.push(p);
  S.budget.transfer=Math.round((S.budget.transfer-c.fee)*10)/10;cash(-c.fee);if(c.fee>S.cl.record)S.cl.record=c.fee;
  if(pl){pl.status='Signed';pl.signed=`${c.name} (${c.r})`}
  if(c.fromRec){const r=S.recs.find(x=>x.name===c.name);if(r)r.gone=true;remember('scout','His player was signed',6)}
  const same=S.squad.filter(x=>x.pos===c.pos&&!x.youth).sort((a,b)=>a.r-b.r);if(S.squad.length>21&&same.length>3)sellPlayer(same[0],.8);
  chron(`${c.name} joins for ${fm(c.fee)}.`);return`${c.name} (${c.pos}, ${c.age}, ${c.r}) signed for ${fm(c.fee)}, ${fw(c.wage)}${c.fromRec?' — your recommendation':''}`;
}
function sellPlayer(p,mult){const fee=Math.round(valueFor(p,S.cl.tier)*mult);S.squad=S.squad.filter(x=>x!==p);cash(fee);S.budget.transfer+=Math.round(fee*.5);chron(`${p.name} leaves for ${fm(fee)}.`);return`${p.name} (${p.pos}, ${p.r}) sold for ${fm(fee)}`}
function candidate(pl){const rec=S.recs.find(r=>r.pos===pl.pos&&!r.gone&&r.r>=pl.cur+2);if(rec&&R()<.8)return{...rec,fromRec:true};const age=ri(20,31),r=pl.target+ri(-3,2),p={name:nmE(),pos:pl.pos,age,r};p.fee=valueFor(p,S.cl.tier);p.wage=wageFor(r,S.cl.tier);return p}
function marketWeek(st){
  const td=CH('td'),done=[],tp=S.plan;
  for(const pl of tp){if(pl.status==='Signed'||pl.status==='Waiting for you')continue;const c=candidate(pl);
    const wageOk=wageBill()+c.wage<=S.budget.wage*1.05;

  const list=[0,1,2,3].map(()=>{const q=ri(2,5),st=pick(Object.keys(STYLES));return{name:nmE(),age:ri(36,61),q,est:[Math.max(1,q-1),Math.min(5,q+1)],st,wage:Math.round(wageFor(T().base+4+q*2,S.cl.tier)*10)/10,from:pick(['a rival club','abroad','out of work','the youth set-up'])}});

/* ---------- the match ---------- */
function playMatch(){
  const fx=myFixture(),opp=team(fx.opp),derby=!!opp.rival,co=CH('coach'),xi=pickXI();
  const my=avg(xi.map(p=>p.r))+(co.q-3)+(S.boost>0?2:0)+(fx.home?1.5:-1),os=opp.str+(fx.home?-1:1.5);
  const us=poisson(1.3*Math.exp((my-os)/16)),them=poisson(1.3*Math.exp((os-my)/16));
  const[h,a,hg,ag]=fx.home?[0,opp.id,us,them]:[opp.id,0,them,us];applyResult(h,a,hg,ag);
  for(const[x,y]of S.fixtures[S.week]){if(x===0||y===0)continue;const sx=team(x).str,sy=team(y).str,gx=poisson(1.3*Math.exp((sx-sy)/16)*1.08),gy=poisson(1.3*Math.exp((sy-sx)/16)*.93);applyResult(x,y,gx,gy);team(x).form.push(gx>gy?'W':gx<gy?'L':'D');team(y).form.push(gy>gx?'W':gy<gx?'L':'D')}
  const res=us>them?'W':us<them?'L':'D';S.teams[0].form.push(res);opp.form.push(res==='W'?'L':res==='L'?'W':'D');co.results.push(res);
  const scorers=[],w=p=>({FW:3,MF:1.4,DF:.4,GK:0}[p.pos])*p.r;
  for(let g=0;g<us;g++){let r=R()*xi.reduce((s,p)=>s+w(p),0);for(const p of xi){r-=w(p);if(r<=0){p.goals++;scorers.push(p);break}}}
  const lines=[];xi.forEach(p=>{if(p.apps===0&&p.youth)lines.push(`${p.name} (${p.age}) made his debut.`);p.apps++;if(p.youth)S.youthApps[p.id]=(S.youthApps[p.id]||0)+1});
  S.squad.forEach(p=>{if(p.inj>0)p.inj--});const ip=.025/(1+(S.cl.medical-1)*.3);xi.forEach(p=>{if(R()<ip){p.inj=ri(1,4);lines.push(`${p.name} injured, out ${p.inj} week${p.inj>1?'s':''}.`)}});
  const best=[...S.squad].sort((a,b)=>b.r-a.r)[0],multi=scorers.find(p=>scorers.filter(x=>x===p).length>=2);
  const cause=multi?`${multi.name} scored ${scorers.filter(x=>x===multi).length}.`:best.inj&&res!=='W'?`We missed ${best.name}, injured.`:Math.abs(my-os)>5?(my>os?`We were the better side: ${Math.round(my)} against ${Math.round(os)} on paper.`:`They were stronger on paper (${Math.round(os)} v ${Math.round(my)}).`):scorers.length?`Goals: ${scorers.map(p=>p.name.split(' ')[1]).join(', ')}.`:'Few chances either way.';
  trustD((res==='W'?2:res==='L'?-2:0)*(derby?2:1));S.trust=Math.round(S.trust+(50-S.trust)*.03);
  if(derby&&S.wager){if(res==='L')trustD(-2);S.wager=false}
  if(S.backing&&S.abs-S.backing.from>=2){const pts=co.results.slice(-3).reduce((s,x)=>s+(x==='W'?3:x==='D'?1:0),0);if(pts<S.backing.need){trustD(-6);lines.push(`You backed the coach; he took ${pts} points from 3. The members noticed.`)}S.backing=null}
  if(S.boost>0)S.boost--;
  payWeek(fx.home,derby);
  if(S.cutFrom&&S.abs>=S.cutFrom&&!S.cl.saving){S.cl.saving=Math.round(deptCost()*.4*10)/10;lines.push(`Cost savings now in effect: ${fw(S.cl.saving)}.`)}
  for(const k in S.cl.builds){S.cl.builds[k]--;if(S.cl.builds[k]<=0){delete S.cl.builds[k];S.cl[k]++;if(k==='stadium')S.cl.cap=Math.round(S.cl.cap*1.4);chron(`${DEPTS[k].n} upgraded to level ${S.cl[k]}.`);lines.push(`${DEPTS[k].n} upgrade finished.`)}}
  const head=derby?(res==='W'?'DERBY DELIGHT':res==='L'?'DERBY HEARTBREAK':'HONOURS EVEN IN THE DERBY'):us-them>=3?`${S.cl.name.toUpperCase()} RUN RIOT`:them-us>=3?`HUMBLED BY ${opp.name.toUpperCase()}`:res==='W'?`${S.cl.name.toUpperCase()} WIN`:res==='L'?`DEFEAT AT ${(fx.home?S.cl.name:opp.name).toUpperCase()}`:'ALL SQUARE';
  const score=`${fx.home?S.cl.name:opp.name} ${fx.home?us:them}–${fx.home?them:us} ${fx.home?opp.name:S.cl.name}`;
  S.echo.unshift({date:CAL[S.week],head,score,cause,lines});
  msg('echo',`${head}: ${score}`,`Why: ${cause} ${lines.join(' ')} We are ${ord(myPos())}.`,null,null,'news');
  S.week++;S.abs++;
  for(const c of S.chars){c.mods.forEach(x=>x.w--);c.mods=c.mods.filter(x=>x.w>0)}
}

/* ---------- continue: one tap ---------- */
A.cnext=()=>{
  // unanswered decisions take their default
  for(const m of S.inbox)if(!m.done&&m.kind==='decision'){if(m.def!==null&&m.def!==undefined){const r=m.opts[m.def].f();m.done=true;m.chosen=m.def;m.result=`No answer, so: ${m.opts[m.def].n.toLowerCase()}. ${r||''}`}else{m.done=true;m.result='No answer.'}}
  const st=S.tl[S.ti];
  if(st.t==='plan'){S.win={};}
  if(st.t==='win'){if(st.w===1){S.win={};if(st.k==='winter'){S.budget.transfer=Math.round(Math.max(0,S.cl.cash-costW()*6)*COURSES[S.course].spend*.5)+(S.winterExtra||0);S.winterExtra=0;buildPlan(1)}}payWeek(false,false);marketWeek(st)}
  if(st.t==='match')playMatch();
  S.ti++;const nx=S.tl[S.ti];
  if(!nx||nx.t==='agm'){agm();render();return window.scrollTo({top:0})}
  if(nx.t==='match')weekMessages(nx.r);
  if(nx.t==='win'&&nx.w===1&&nx.k==='winter')msg('td','The January window',`I will look for ${S.plan.length?'one player':'nothing big'}. Budget follows in the first week.`);
  S.openMsg=null;render();window.scrollTo({top:0});
};

/* ---------- AGM (§7.7) ---------- */
function promiseKept(p){if(p.k==='league')return myPos()<=p.v;if(p.k==='money'){if(p.t==='cash')return S.cl.cash>=p.v;if(p.t==='loss')return S.cl.cash-S.cl.startCash>=-p.v;return debt()<=p.v}return p.v===0||Object.values(S.youthApps).filter(n=>n>=3).length>=p.v}
function agm(){
  const res=S.promises.map(p=>({...p,kept:promiseKept(p)}));
  res.forEach(r=>{if(r.k==='youth'&&r.v===0)return;trustD(r.kept?6:-8)});
  if(debt()>S.cl.startDebt)trustD(-4);if(S.cl.cash>S.cl.startCash)trustD(2);
  const pos=myPos(),move=pos<=2&&S.cl.tier>1?-1:pos===8&&S.cl.tier<4?1:0;trustD(move<0?8:move>0?-12:0);const vote=clamp(S.trust+ri(-5,5),5,95);
  const yy=`${S.year}/${String((S.year+1)%100).padStart(2,'0')}`;
  if(pos===1){S.career.trophies.push(`${T().n} champions ${yy}, ${S.cl.name}`);chron(`${S.cl.name} are champions!`)}else if(move<0)chron(`${S.cl.name} promoted.`);if(move>0)chron(`${S.cl.name} relegated.`);
  S.agm={res,vote,pos,move,elected:vote>=50,profit:Math.round(S.cl.cash-S.cl.startCash)};
  S.career.seasons.push({yy,club:S.cl.name,pos,vote});S.career.rep=clamp(S.career.rep+(vote>=50?6:-8)+(move<0?10:move>0?-8:0),0,100);
  chron(`AGM: ${vote}% for the chairman. ${vote>=50?'Re-elected.':'Voted out.'}`);S.phase='agm';
}
A.nextSeason=()=>{
  const a=S.agm;if(!a.elected){S.chairs=genChairs(S.career.rep);S.phase='chairs';return render()}
  P.age++;S.year++;S.season++;const oldT=S.cl.tier;
  const left=[];S.squad=S.squad.filter(p=>{p.contract--;if(p.contract<=0){if(p.youth){p.contract=2;return true}if(p.age<32&&p.r>=xiAvg()-6&&R()<.7){p.contract=2;return true}left.push(p.name);return false}return true});
  S.squad.forEach(p=>{p.age++;p.asked=false;if(p.age<=23)p.r=Math.min(p.pot,p.r+ri(1,3)+(S.cl.training-1));else if(p.age>=31)p.r-=ri(1,3);if(p.youth&&p.age>=21)p.youth=false;if(!p.youth)p.wage=Math.max(p.wage,Math.round(wageFor(p.r,S.cl.tier)*.9*10)/10)});
  for(let i=0;i<1+(S.cl.academy>=2?1:0);i++)S.squad.push(mkPlayer(pick(['DF','MF','FW']),T().base-12+S.cl.academy*2+ri(-2,5),16,S.cl.tier,true));
  if(S.tdLeaving){const o=CH('td');S.chars=S.chars.filter(c=>c!==o);S.chars.splice(1,0,mkChar('td',{name:nmE(),age:ri(36,58),q:ri(2,4),wage:o.wage,base:0}));chron(`${o.name} leaves. ${CH('td').name} is the new Director of Football.`);S.tdLeaving=false}
  if(a.move){S.cl.tier+=a.move;S.cl.fans=Math.round(S.cl.fans*(a.move<0?1.3:.8));const rv=S.teams.find(t=>t.rival);S.teams=genLeague(S.cl.tier,S.teams[0],rv)}else S.teams.forEach(t=>{if(t.id)t.str=clamp(t.str+ri(-3,3),30,92);t.form=[]});
  S.teams[0].form=[];S.cl.price=S.cl.nextPrice;if(S.cl.nextSponsor){S.cl.sponsor=S.cl.nextSponsor;S.cl.nextSponsor=null}else S.cl.sponsor.seasons--;if(oldT!==S.cl.tier)S.cl.sponsor.pw=Math.round(S.cl.sponsor.pw*DIV[S.cl.tier].spons/DIV[oldT].spons*10)/10;
  S.cl.saving=0;S.cutFrom=null;S.brinkFor=null;
  if(left.length)chron(`Out of contract: ${left.join(', ')}.`);
  seasonSetup();setExpected();S.agm=null;S.inbox=[];S.phase='day1';render();window.scrollTo({top:0});
};

/* ---------- views ---------- */
const fxH=s=>{if(!s)return'';s=typeof s==='function'?s():s;return`<div class="fx">${s.split(' · ').map(t=>`<span class="${/[+]/.test(t)&&!/−/.test(t)?'g':/−/.test(t)&&!/[+]/.test(t)?'b':''}">${esc(t)}</span>`).join('')}</div>`};
const sec=(t,b,cls='')=>`<section class="blk ${cls}"><h3 class="bh">${t}</h3><div class="bb">${b}</div></section>`;
function bar(){const c=S.cl;return`<header class="tbar"><div class="tb-l"><span class="crest" style="background:${c.col}"></span><b>${esc(c.name.toUpperCase())}</b></div><div class="tb-r num">${stepLabel()} · ${S.week?ord(myPos())+' · ':''}${fm(c.cash)} · MEMBERS ${S.trust}%</div></header>`}
function nav(){const unread=S.inbox.filter(m=>!m.read).length;return`<nav class="tnav">${[['inbox',`Inbox${unread?' ('+unread+')':''}`],['club','Club'],['squad','Squad'],['people','People'],['echo','Echo']].map(([k,n])=>`<button class="${S.view===k?'on':''}" onclick="A.view('${k}')">${n}</button>`).join('')}</nav>`}
A.view=v=>{S.view=v;render();window.scrollTo({top:0})};
function nextLabel(){const st=S.tl[S.ti];if(st.t==='plan')return'Continue: open the window';if(st.t==='win')return st.w===st.of?'Continue: deadline day':'Continue: next market week';if(st.t==='match'){const fx=myFixture(),o=team(fx.opp);return`Play week ${st.r+1}: ${fx.home?'v':'at'} ${o.name}${o.rival?' (derby)':''}`}return'Continue'}
function inboxView(){
  const open=S.inbox.filter(m=>!m.done),rest=S.inbox.filter(m=>m.done);
  const item=m=>{const isOpen=S.openMsg===m.id||(!m.done&&m.kind==='decision');return`<div class="msg ${m.read?'':'unread'} ${m.kind}"><button class="mh" onclick="A.mopen('${m.id}')"><span class="mfrom">${m.kind==='decision'&&!m.done?'<span class="st warn">Your call</span> ':''}${esc(fromLabel(m.from))}</span><b>${esc(m.subject)}</b><span class="mwhen">${esc(m.when)}</span></button>
    ${isOpen?`<div class="mb"><p>${esc(m.body)}</p>${!m.done?m.opts.map((o,j)=>`<div class="optrow"><button class="btn" onclick="A.answer('${m.id}',${j})">${esc(o.n)}</button>${fxH(o.fx)}</div>`).join('')+(m.def!==null&&m.def!==undefined?`<p class="dim small">If you don't answer: ${esc(m.opts[m.def].n.toLowerCase())}.</p>`:''):m.result?`<p class="res">› ${esc(m.result)}</p>`:''}</div>`:''}</div>`};
  const fx=S.tl[S.ti].t==='match'?myFixture():null,cs=coachStatus();
  return`<div class="page">${fx?`<div class="fix"><div class="fx-t">${esc(fx.home?S.cl.name:team(fx.opp).name)}</div><div class="fx-v">v</div><div class="fx-t">${esc(fx.home?team(fx.opp).name:S.cl.name)}</div></div><div class="cstat cs-${cs.word.replace(/ /g,'').toLowerCase()}"><b>HEAD COACH: ${cs.word.toUpperCase()}</b><span class="num">${esc(CH('coach').name)} · ${cs.facts}</span></div>`:''}
    ${sec(`INBOX${open.length?` · ${open.filter(m=>m.kind==='decision').length} need you`:''}`,(open.length?open.map(item).join(''):'<p class="dim">Nothing needs you this week.</p>')+(rest.length?`<div class="older">${rest.slice(0,12).map(item).join('')}</div>`:''))}
    ${sec('START SOMETHING YOURSELF',`<div class="row2"><button class="btn ghost" onclick="A.view('club')">Invest in a department</button><button class="btn ghost" onclick="A.view('people')">See your people</button></div>`,'dimblk')}
    <button class="btn wide" onclick="A.cnext()">${nextLabel()}</button></div>`;
}
function clubView(){
  const c=S.cl,net=incomeW()-costW();
  return`<div class="page">${sec('THE MONEY',`<div class="bd3 num"><div><small>Cash</small><b>${fm(c.cash)}</b></div><div><small>Income</small><b>${fw(incomeW())}</b></div><div><small>Costs</small><b>${fw(costW())}</b></div></div>
    <p class="num">${net>=0?`<span class="g">We make ${fw(net)}.</span>`:`<span class="b">We lose ${fw(-net)}.</span>`} Wages ${fw(wageBill())} of a ${fw(S.budget.wage)} budget.${c.loans.length?` Loans: ${fw(repayW())} repayments, ${fm(debt())} still to pay.`:' No loans.'}</p>`)}
    ${sec('YOUR PROMISES TO THE MEMBERS',`<ul class="lst">${S.promises.map(p=>`<li>${promiseKept(p)?'<span class="g">on track</span>':'<span class="b">off track</span>'} · ${esc(p.txt)}</li>`).join('')}</ul><p class="num">Members' trust ${S.trust}%. You need 50% at the AGM in May.</p>`)}
    ${sec('THE CLUB · INVEST YOURSELF',`<p class="dim small">Invest when you choose. Department heads will also bring proposals to your inbox.</p>${Object.entries(DEPTS).map(([k,d])=>{const lv=c[k],b=c.builds[k],cost=lv<4?upCost(k):0,del=councilDelay(k);return`<div class="dept"><div class="dept-h"><b>${d.n}</b> <span class="lvl">${'■'.repeat(lv)}${'□'.repeat(4-lv)}</span><span class="dim small"> · ${esc(CH(d.head).name)}, ${ROLE_EN[d.head].toLowerCase()}</span></div><p class="dim small">${d.d}.</p>${b?`<p class="gold">Building: ready in ${b} week${b>1?'s':''}.</p>`:lv>=4?'<p class="g">Top level.</p>':`<div class="optrow"><button class="btn sm" ${c.cash<cost?'disabled':''} onclick="A.invest('${k}')">Upgrade to level ${lv+1} · ${fm(cost)}</button>${fxH(`Cash −${fm(cost)} · ${upWeeks(k)+del} weeks${del?' (council delay)':''} · upkeep −${fw(.45*T().cost)}${k==='stadium'?` · +${Math.round(c.cap*.4).toLocaleString('en-GB')} seats`:''}`)}</div>`}</div>`}).join('')}
    <dl class="kv"><dt>Stadium</dt><dd class="num">${c.cap.toLocaleString('en-GB')} seats · ticket £${ticket()}</dd><dt>Shirt</dt><dd>${esc(c.sponsor.name)} ${fw(c.sponsor.pw)}</dd><dt>Legend</dt><dd>${esc(c.legend)}</dd><dt>Scar</dt><dd>${esc(c.scar)}</dd></dl>`)}</div>`;
}
function squadView(){const xi=pickXI();return`<div class="page">${sec(`${T().n.toUpperCase()}`,`<table class="tt num"><thead><tr><th>#</th><th>Club</th><th class="r">P</th><th class="r">GD</th><th class="r">Pts</th></tr></thead><tbody>${sortedTable().map((r,i)=>{const t=team(r.id);return`<tr class="${r.id===0?'me':''}"><td>${i+1}</td><td><span class="crest" style="background:${t.col}"></span>${esc(t.name)}${t.rival?' <span class="dim">(rival)</span>':''}</td><td class="r">${r.p}</td><td class="r">${r.gf-r.ga}</td><td class="r"><b>${r.pts}</b></td></tr>`}).join('')}</tbody></table>`)}
  ${sec('THE SQUAD',`<p class="dim small">The coach picks the team, the TD builds the squad. Grey = not in the eleven.</p><div class="scroll"><table class="tt num"><thead><tr><th>Pos</th><th>Name</th><th class="r">Age</th><th class="r">Rat</th><th class="r">Wage</th><th class="r">Apps</th><th class="r">G</th></tr></thead><tbody>${[...S.squad].sort((a,b)=>'GKDFMFFW'.indexOf(a.pos)-'GKDFMFFW'.indexOf(b.pos)||b.r-a.r).map(p=>`<tr class="${xi.includes(p)?'':'dimrow'}"><td>${p.pos}</td><td>${esc(p.name)}${p.youth?' <span class="tag">ACA</span>':''}${p.inj?' <span class="tag b">INJ</span>':''}${p.unsettled?' <span class="tag b">UNHAPPY</span>':''}</td><td class="r">${p.age}</td><td class="r">${p.r}</td><td class="r">${fm(p.wage)}</td><td class="r">${p.apps}</td><td class="r">${p.goals}</td></tr>`).join('')}</tbody></table></div>`)}</div>`}
function cPeopleView(){return`<div class="page">${sec('YOUR PEOPLE',`<table class="tt">${S.chars.map(c=>{const w=relWord(c),mem=c.mods.filter(m=>m.mem).slice(-2);return`<tr><td><b>${esc(c.name)}</b><br><span class="dim small">${ROLE_EN[c.role]}${c.q?' · '+'★'.repeat(c.q):''}${c.style?' · '+STYLES[c.style]:''}</span>${mem.length?`<br><span class="small">Remembers: ${mem.map(m=>`<span class="${m.v>0?'g':'b'}">${esc(m.t.toLowerCase())}</span>`).join('; ')}</span>`:''}</td><td class="r"><span class="rel ${relCls(w)}">${w}</span></td></tr>`}).join('')}</table>`)}
  ${sec('THE MEMBERS',`<p class="num">Trust <b>${S.trust}%</b>. Results, promises, prices and how you treat people move it. You need 50% at the AGM.</p>`)}</div>`}
function echoArchive(){return`<div class="page">${sec(`THE ${esc(S.cl.town.toUpperCase())} ECHO`,S.echo.length?`<ul class="lst">${S.echo.map(e=>`<li><span class="dim num">${e.date}</span> <b>${esc(e.head)}</b><br><span class="num">${esc(e.score)}</span> · ${esc(e.cause)}</li>`).join('')}</ul>`:'<p class="dim">No editions yet.</p>')}${sec('CLUB BOOK',`<ul class="lst">${S.chron.slice(0,30).map(c=>`<li><span class="dim num">${c.s}</span> ${esc(c.t)}</li>`).join('')}</ul>`)}</div>`}
function chairsView(){return`<div class="page">${S.career.seasons.length?`<p class="lead">Your reputation (${S.career.rep}) decides which chairs are open to you.</p>`:''}${sec('OPEN CHAIRS',`<table class="tt"><thead><tr><th>Club</th><th>The job</th><th class="r">Cash</th><th></th></tr></thead><tbody>${S.chairs.map((d,i)=>`<tr><td><span class="crest" style="background:${d.col}"></span>${esc(d.name)}<br><span class="dim small">${DIV[d.tier].n}</span></td><td>${STORIES[d.story].n} ${'★'.repeat(STORIES[d.story].stars)}</td><td class="r num">${fm(d.cash)}</td><td class="r"><button class="btn sm" onclick="A.dossier(${i})">Read</button></td></tr>`).join('')}</tbody></table>`)}</div>`}
A.dossier=i=>{S.dossierI=i;S.phase='dossier';render();window.scrollTo({top:0})};
function dossierView(){const d=S.chairs[S.dossierI],st=STORIES[d.story];return`<div class="page">${sec(`DOSSIER · ${esc(d.name.toUpperCase())}`,`<p class="big">${st.n} ${'★'.repeat(st.stars)}</p><p>${st.line}</p><dl class="kv"><dt>Division</dt><dd>${DIV[d.tier].n}</dd><dt>Founded</dt><dd>${d.founded}</dd><dt>Cash</dt><dd class="num">${fm(d.cash)}${d.loan?` · a loan of ${fm(d.loan)} to repay`:''}</dd><dt>Members' trust</dt><dd class="num">${d.trust}%</dd><dt>Legend</dt><dd>${esc(d.legend)}</dd><dt>Scar</dt><dd>${esc(d.scar)}</dd><dt>Rival</dt><dd>${esc(d.rival)}</dd><dt>Treasurer</dt><dd>${esc(d.names.treasurer)}</dd><dt>Director of Football</dt><dd>${esc(d.names.td)}</dd><dt>Head coach</dt><dd>${esc(d.names.coach)}</dd></dl>`)}<div class="row2"><button class="btn ghost" onclick="S.phase='chairs';render()">Back</button><button class="btn" onclick="takeChair(S.chairs[S.dossierI]);render();window.scrollTo({top:0})">Take the chair</button></div></div>`}
function day1View(){return`<div class="page">${sec('3 JUNE · THE BOARDROOM',`<p class="lead">${S.season===1?`You are the new chairman of ${esc(S.cl.name)}. You were appointed; the AGM in May is your first verdict.`:`A new summer at ${esc(S.cl.name)}.`}</p><p>${esc(CH('treasurer').name)}: "Cash ${fm(S.cl.cash)}, we ${incomeW()>=costW()?'make':'lose'} ${fw(Math.abs(incomeW()-costW()))}."</p><p>${esc(CH('td').name)}: "On paper we are the ${ord(S.expected)} best squad in the ${T().n}."</p>`)}
  ${sec('THE COURSE · YOUR PROMISE TO THE MEMBERS',`<p>One choice. It sets three promises and the money for the summer. They stand until May.</p>${Object.entries(COURSES).map(([k,co])=>`<div class="copt"><div class="copt-h">${co.n}</div><p class="dim">${co.d}</p><ul class="prom">${coursePromises(k).map(p=>`<li>${esc(p.txt)}</li>`).join('')}</ul><button class="btn" onclick="A.course('${k}')">Sign: ${co.n}</button></div>`).join('')}`)}</div>`}
function agmView(){const a=S.agm;return`<div class="page">${sec('24 MAY · ANNUAL GENERAL MEETING',`<p class="lead">${esc(S.cl.name)} finished ${ord(a.pos)}.${a.move<0?' <b class="g">PROMOTED.</b>':a.move>0?' <b class="b">RELEGATED.</b>':''} Result for the year ${fm(a.profit)}.${debt()?` Loans still to repay ${fm(debt())}.`:''}</p><table class="tt">${a.res.map(r=>`<tr><td>${esc(r.txt)}</td><td class="r">${r.k==='youth'&&r.v===0?'–':r.kept?'<span class="st ok">KEPT</span>':'<span class="st bad">BROKEN</span>'}</td></tr>`).join('')}</table><div class="verdict ${a.elected?'ok':'bad'}">${a.vote}% FOR · ${a.elected?'RE-ELECTED':'VOTED OUT'}</div>`)}<button class="btn wide" onclick="A.nextSeason()">${a.elected?'On to the summer':'Look for a new chair'}</button></div>`}
function renderChair(app){
  if(S.phase==='chairs'||S.phase==='dossier'){app.innerHTML=`<header class="tbar"><div class="tb-l"><b>CHAIRMAN</b></div><div class="tb-r">${esc(P.name)}</div></header>`+(S.phase==='chairs'?chairsView():dossierView());return}
  if(S.phase==='day1'){app.innerHTML=bar()+day1View();return}
  if(S.phase==='agm'){app.innerHTML=bar()+agmView();return}
  app.innerHTML=bar()+nav()+({inbox:inboxView,club:clubView,squad:squadView,people:cPeopleView,echo:echoArchive}[S.view]||inboxView)();
}
A.succeed=()=>{draft.name=P.name;draft.traits=P.traits;chairNew();render();window.scrollTo({top:0})};

/* boot */
draft={name:nmE(),club:1,traits:[],mode:'chair'};
function start(data){if(data&&data.S){S=data.S;P=S.p}render()}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
