<title>Northmarch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@1,7..72,400;1,7..72,500&display=swap">
<style>
/* Northmarch house style (northmarch.html @7a2d5d3), plus the system-layer styles of voorzitter-fundering, plus layered-game additions. */

:root{
  --paper:#eef0f1; --card:#fbfcfc; --ink:#151d24; --muted:#56616b; --line:#cfd6dc;
  --navy:#1d3b4f; --signal:#bf4f17; --good:#2b7346; --bad:#b03628; --onnavy:#ffffff; --chip:#e1e7eb;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-voice:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f161c; --card:#17212a; --ink:#e6ecf0; --muted:#9aa8b2; --line:#2b3a46;
  --navy:#8bbad8; --signal:#f08a4b; --good:#7bc896; --bad:#ef8a7a; --onnavy:#0f161c; --chip:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f161c; --card:#17212a; --ink:#e6ecf0; --muted:#9aa8b2; --line:#2b3a46;
  --navy:#8bbad8; --signal:#f08a4b; --good:#7bc896; --bad:#ef8a7a; --onnavy:#0f161c; --chip:#22303a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{max-width:460px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.crest{width:34px;height:34px;flex:none}
.top .club{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.02em;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.top .sub{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top .grow{flex:1;min-width:0}
.tbtn{min-height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);font:600 13px var(--f-body);cursor:pointer;flex:none}
main{display:flex;flex-direction:column;gap:16px;padding-top:18px}
h1,h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;text-wrap:balance;margin:0}
h1{font-size:40px} h2{font-size:26px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.voice{font-family:var(--f-voice);font-style:italic;font-size:19px;line-height:1.45}
.scene{display:flex;flex-direction:column;gap:12px}
.where{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;align-items:center;gap:12px}
.face{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--onnavy);background:var(--navy)}
.face.opp{background:var(--signal)}
.who b{display:block;font-weight:600} .who span{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;border:0;border-radius:10px;background:var(--navy);color:var(--onnavy);font:600 16px var(--f-body);cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn:focus-visible,.choice:focus-visible,.tbtn:focus-visible,.deal:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;min-height:56px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.choice b{font-weight:600} .choice .meta{font-size:13px;color:var(--muted)}
.chance{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:12px;background:var(--chip);color:var(--ink)}
.dots{letter-spacing:.1em;color:var(--signal);font-size:15px}
.deal{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.deal .dt{font-weight:600;font-size:17px}
.deal dl{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;margin:0;font-size:14px}
.deal dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.deal dd{margin:0;min-width:0}
.deal .warn{font-size:13px;color:var(--bad);font-weight:600}
.deal .hit{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.deal.none{border-style:dashed}
.echo{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.echo .mast{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.echo .mast b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.05em}
.echo .mast span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:none}
.echo .head{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:.95;text-transform:uppercase;text-wrap:balance}
.echo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row>span:first-child{min-width:0}
.mood{font-weight:600;text-align:right}
.up{color:var(--good)} .down{color:var(--bad)}
.res{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.wdl{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--onnavy)}
.wdl.W{background:var(--good)} .wdl.D{background:var(--muted)} .wdl.L{background:var(--bad)}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px} .log li{font-size:14px}
.log .why{display:block;color:var(--muted);font-size:13px}
.num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.count{display:flex;flex-direction:column;gap:12px}
.cg{animation:reveal .5s ease both}
.cg:nth-child(2){animation-delay:.9s}.cg:nth-child(3){animation-delay:1.8s}.cg:nth-child(4){animation-delay:2.7s}
.verdict{animation:reveal .6s ease both;animation-delay:3.4s}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cg,.verdict{animation:none}}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden} .bar i{display:block;height:100%;background:var(--navy)}
.big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:.9;text-transform:uppercase}
.overlay{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay .inner{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:12px;align-items:flex-start;min-height:56px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--navy)}
.check.on{border-color:var(--navy)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
/* system layer: hub cards, ground and money overlays */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hubc{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:44px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.hubc b{font-size:20px;font-variant-numeric:tabular-nums}
.grow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;min-height:44px}
.cbar{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden;vertical-align:middle}.cbar i{display:block;height:100%;background:var(--good)}
.cbar.mid i{background:#b7791f}.cbar.lo i{background:var(--bad)}.cnum{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.on{border-color:var(--navy);border-width:2px}.opt.dim{opacity:.6;cursor:default}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.offer{display:flex;flex-direction:column;gap:2px;min-height:44px;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:12px var(--f-body);cursor:pointer;text-align:left}.offer b{font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}.stepper button{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 20px var(--f-body);cursor:pointer}.stepper b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.hline{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;font-size:14px}.hline b{text-align:right;font-variant-numeric:tabular-nums}
.tabs button.on{border-color:var(--navy);color:var(--navy)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.hbar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.hbar i{display:block;height:100%;background:var(--good)}.hbar i.neg{background:var(--bad)}
.fcast{width:100%;height:auto}.fcast .band{fill:var(--chip)}.fcast .zero{stroke:var(--bad);stroke-dasharray:4 3;stroke-width:1}.fcast .mid{fill:none;stroke:var(--ink);stroke-width:2}

/* layered game additions */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);z-index:4;background:var(--paper);display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px 0;border-bottom:1px solid var(--line)}
.nav button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;padding:0 2px}
.nav button.on{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}
.nav button:focus-visible,.tabs button:focus-visible,.opt:focus-visible,.hubc:focus-visible,.prow:focus-visible,.trow:focus-visible,.offer:focus-visible,.stepper button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.tbl{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:26px 1fr 30px 40px 38px;gap:6px;align-items:center;min-height:44px;padding:0 6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:14px var(--f-body);text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;width:100%}
.trow.head{min-height:32px;cursor:default;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trow.me{background:var(--chip);font-weight:600}
.trow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.zone-up{box-shadow:inset 3px 0 0 var(--good)}.trow.zone-down{box-shadow:inset 3px 0 0 var(--bad)}
.trow b{text-align:right}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:52px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.prow .pn{font-weight:600}.prow .pm{font-size:13px;color:var(--muted)}
.qbar{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:600}
.qbar i{display:inline-block;width:40px;height:6px;border-radius:3px;background:var(--chip);position:relative;overflow:hidden}
.qbar i b{position:absolute;inset:0 auto 0 0;background:var(--navy)}
.inj{color:var(--bad);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:10px;background:var(--chip);color:var(--ink)}
.pill.good{background:var(--good);color:var(--onnavy)}.pill.bad{background:var(--bad);color:var(--onnavy)}
.fix{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.fix b{font-family:var(--f-display);font-weight:800;font-size:clamp(14px,4.3vw,18px);text-transform:uppercase;line-height:1.05;overflow-wrap:break-word;hyphens:auto;min-width:0}
.fix .score{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.cmp span:first-child{color:var(--muted)}.cmp b{text-align:right}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 13px var(--f-body);cursor:pointer;padding:4px}
.seg button.on{border-color:var(--navy);background:var(--navy);color:var(--onnavy)}
.note{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.tabs{overflow-x:auto}

.top .tg{flex:1;min-width:0}
.dept{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.dept .dh{display:flex;justify-content:space-between;align-items:center;gap:8px}.dept .dh b{font-size:16px}
.dept .next{color:var(--navy);font-weight:600}
.dept:focus-visible,.dept:hover{border-color:var(--navy)}
.seg button[disabled]{opacity:.55;cursor:default}
.seg5{grid-template-columns:repeat(5,1fr)}.seg5 button{font-size:12px;padding:2px}
.conf{display:block;position:relative;height:10px;border-radius:5px;background:var(--chip);overflow:visible}.conf i{display:block;height:100%;border-radius:5px;background:var(--good)}.conf.mid i{background:#b7791f}.conf.lo i{background:var(--bad)}
.conf b{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);opacity:.5}
.vote{height:18px;border-radius:9px;background:var(--bad);overflow:hidden}.vote i{display:block;height:100%;background:var(--good)}
.sig{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--muted);background:var(--card);color:var(--ink);font:14px var(--f-body);text-align:left;cursor:pointer}
.sig.lv3{border-left-color:var(--bad)}.sig.lv2{border-left-color:#b7791f}.sig.lv1{border-left-color:var(--good)}
.sig:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.fcast .barpos{fill:var(--good)}.fcast .barneg{fill:var(--bad)}

/* L1/L2 chairman overview: navigable, touch-sized decision entry points. */
.boardgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.boardtile{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;min-height:92px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.boardtile>span{font-size:12px;color:var(--muted)}
.boardtile>b{font-size:21px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.boardtile>small{font-size:12px;color:var(--muted)}
.boardlinks{display:flex;flex-direction:column;gap:6px}
.boardlinks button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:48px;padding:10px 12px;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.boardlinks button span{font-size:12px;font-weight:400;color:var(--muted)}
.boardtile:focus-visible,.boardlinks button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
[id^="board-"]{scroll-margin-top:145px}
.subnav{margin-top:-4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.subnav button{padding:0 6px}
main.withbar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.actbar .ab-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:6px}.actbar .small{color:var(--muted);text-align:center}
.deptgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dmini{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:52px;padding:8px;border-radius:8px;border:1px solid var(--line);border-top:3px solid var(--muted);background:var(--paper);color:var(--ink);font:12px var(--f-body);cursor:pointer;min-width:0}
.dmini b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.dmini span{color:var(--signal);letter-spacing:1px}
.dmini.ok{border-top-color:var(--good)}.dmini.bad{border-top-color:var(--bad)}.dmini:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.proj{display:flex;flex-direction:column;gap:4px}
.onboard{border:2px solid var(--navy)}
.impact{display:grid;grid-template-columns:92px 1fr;gap:4px 10px;margin:0;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13px}
.impact dt{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:1px}.impact dd{margin:0;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.grid4 button{padding:0 4px;font-size:13px}
.urgent{border:2px solid var(--bad)}

/* Chairman hub V2: a clear, mobile-first directory of responsibilities. */
.hubhead{margin:12px 0 18px}.hubhead h2{margin:4px 0 8px}.hubstatus{margin-bottom:20px}
.hubsection{margin:22px 0}.hubsection h3{font-size:1rem;margin:0 0 12px;letter-spacing:.01em}
.hubtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hubtile{min-width:0;min-height:94px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:5px;padding:14px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.hubtile b{font-size:.95rem;line-height:1.2}.hubtile span{font-size:.78rem;line-height:1.35;opacity:.75}.hubtile small{font-size:.72rem;line-height:1.3;margin-top:auto;opacity:.85}
.hubtile:focus-visible{outline:3px solid var(--signal);outline-offset:2px}.hubtile:active{transform:translateY(1px)}
.hubback{margin:12px 0 16px}.hubback button{min-height:44px}
@media(max-width:350px){.hubtiles{gap:7px}.hubtile{padding:11px 9px}}

/* Improvement map: existing board actions connected to measurable outcomes. */
.improve{margin:18px 0 24px}.improve-intro h3{font-size:1.2rem;margin:3px 0 6px}
.improve-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.improve-choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;min-height:122px;padding:13px 11px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;cursor:pointer;overflow-wrap:anywhere}

/* ================= Core: seeded RNG and helpers (from Northmarch / voorzitter-fundering core/rng.js) =================
   All randomness in the simulation goes through rnd(), which advances S.rs. Never use Math.random. */
"use strict";

function rnd(){let t=(S.rs=(S.rs+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}

function pickN(a,n){const c=a.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return o}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pois(l,r){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L);return k-1}

/* ---- core/bus.js ---- */
/* ================= Core: events and commands =================
   Events are facts other layers may read (S.ev, newest last). Commands are the only way a player, an AI club,
   a staff member or (later) the story layer changes the world. Every command validates first, then runs inside
   the domain that owns the state. Contract: docs/ARCHITECTURE.md. */
const EV_KEEP=1800;
function emit(type,club,text,data){
  S.evn=(S.evn||0)+1;
  const e={n:S.evn,t:type,c:club||null,s:S.season,w:S.week,text:text||'',...(data||{})};
  S.ev.push(e);if(S.ev.length>EV_KEEP)S.ev.splice(0,S.ev.length-EV_KEEP);
  return e;
}
function eventsSince(n){return S.ev.filter(e=>e.n>n)}
function eventsFor(club,o={}){return S.ev.filter(e=>(!club||e.c===club||(e.c2&&e.c2===club))&&(o.s==null||e.s===o.s)&&(o.w==null||e.w===o.w)&&(!o.types||o.types.includes(e.t)))}

const COMMANDS={}; // name -> {who:[actors], check(club,args)->error|null, run(club,args)->result}
function defCommand(name,def){COMMANDS[name]=def}
/* actor: 'player' | 'ai' | 'td' | 'story'. The player may only command their own club. */
function cmd(name,club,args,actor){
  const d=COMMANDS[name];if(!d)return{ok:false,err:'Unknown command '+name};
  actor=actor||'player';args=args||{};
  if(d.who&&!d.who.includes(actor))return{ok:false,err:`${actor} may not ${name}`};
  if(actor==='player'&&club!==S.my)return{ok:false,err:'Not your club'};
  if(!CL(club))return{ok:false,err:'No such club'};
  const err=d.check?d.check(club,args):null;
  if(err)return{ok:false,err};
  const pre=actor==='player'&&typeof journalBefore==='function'?journalBefore(name,args,club):null;
  const res=d.run(club,args);
  if(actor==='player'){emit('Command',club,'',{cmd:name,args,actor});if(typeof journalAdd==='function')journalAdd(name,args,club,pre)}
  return{ok:true,res};
}

/* ---- world/world.js ---- */
/* ================= World: clubs, people and the start of a new game =================
   Owns S.clubs (identity, tier, support, rivals) and S.P (people). mkPerson/castClub/addRel/weakest are the
   Northmarch functions (northmarch.html @7a2d5d3), kept so the story layer (L4) can attach later.
   Squads (football), grounds (club) and money (finance) are created here but owned by their own domains. */
const VERSION=7;
const SAVE_KEY='northmarch-layered-v1';
const TIERS=[0,1,2];
const TIER_STR=[[51,59],[44,53],[37,46]];
const TIER_SUPPORT=[[1900,4300],[1000,2500],[450,1300]];

function mkPerson(role,club,o={}){
  const id='p'+(S.pc++);
  const p={id,name:o.name||`${pick(FIRST)} ${pick(LAST)}`,age:o.age||(role==='fan'?ri(38,70):role==='captain'?ri(27,33):ri(34,62)),role,club,
    traits:o.traits||pickN(TRAITS,2),value:o.value||pick(VALUES),infl:o.infl??null,loy:o.loy??null,mem:o.mem||[],rel:[],career:club?[club]:[],
    owes:false,withOpp:false,deepKnown:false,shown:0};
  p.deep=DEEP[role][p.value];S.P[id]=p;return id;
}
function weakest(c){return c.groups.slice().sort((a,b)=>a.mood-b.mood)[0].k}
function addRel(a,b,type){if(!a||!b||a===b)return;P(a).rel.push({id:b,type});P(b).rel.push({id:a,type:type==='mentor'?'protégé':type})}
function castClub(c){
  const big=c.groups.slice().sort((a,b)=>b.share-a.share)[0].k;
  c.cast.chair=mkPerson('chair',c.id);
  c.cast.coach=mkPerson('coach',c.id,{infl:c.groups.find(g=>['students','ultras','newcomers'].includes(g.k))?.k||null});
  c.cast.td=mkPerson('td',c.id);
  c.cast.captain=mkPerson('captain',c.id,{infl:big});
  c.cast.fan=mkPerson('fan',c.id,{infl:big});
  c.cast.opp=mkPerson('opp',c.id,{infl:weakest(c)});
  c.cast.talent=mkPerson('talent',c.id,{age:ri(17,19)});
}
function mkClub(id,name,town,tier,o={}){
  const t=TOWNS[town],keys=Object.keys(t.w),n=rnd()<.5?3:4,groups=[];
  if(o.groups)o.groups.forEach(([k,sh,m])=>groups.push({k,share:sh,mood:m}));
  else{const pool=keys.slice();while(groups.length<n&&pool.length){const tot=pool.reduce((a,k)=>a+t.w[k],0);let x=rnd()*tot,k=pool[0];for(const kk of pool){x-=t.w[kk];if(x<=0){k=kk;break}}pool.splice(pool.indexOf(k),1);groups.push({k,share:ri(15,40),mood:ri(34,62)})}
    const sum=groups.reduce((a,g)=>a+g.share,0);groups.forEach(g=>g.share=Math.round(g.share/sum*100));}
  const [s0,s1]=TIER_SUPPORT[tier];
  const c={id,name,town,tier,support:o.support??ri(s0,s1),statute:o.statute||pickN(STATUTE,rnd()<.5?1:2),founded:o.founded||ri(1874,1925),scar:o.scar||pick(SCAR),
    legend:o.legend||`${pick(FIRST)} '${pick(['Big','Wee','Iron','Doc','Sailor'])}' ${pick(LAST)}`,rival:null,rivalWhy:pick(RIVALRY),groups,cast:{},hist:[],binding:[],
    ground:o.ground||pick(['Park','Road','Lane','Meadow','Moor','Fields'])};
  c.ground=`${name.split(' ')[0]} ${c.ground}`;c.rep=repInit(c);
  S.clubs[id]=c;return c;
}
function chairValue(id){const c=CL(id),p=c.cast.chair&&P(c.cast.chair);return p?p.value:'money'}

function newWorld(seed){
  S={v:VERSION,seed,rs:seed|0||1,pc:1,season:1,week:0,phase:'choose',my:null,clubs:{},P:{},squads:{},grounds:{},fin:{},fa:[],
    tbl:{},fx:{},cup:null,qref:11.7,matches:[],ev:[],evn:0,stats:{},members:{},career:[],rep:0,votedOut:null,staffPool:[],records:{},hist:[],layers:{story:false,staff:false,dynasty:false},auto:false,seats:[]};
  // the Northmarch core clubs
  mkClub('pell','Pell United','harbour',1,{support:1600,groups:[['workers',40,58],['students',25,62],['business',35,40]],statute:['No outside owner above 25%'],founded:1891,legend:"Jack 'Sailor' Garside",scar:'lost a cup final to their rivals',ground:'Dock Road'});
  mkClub('corden','Corden Athletic','mill',1,{support:1800});
  mkClub('harrow','Harrowgate Town','cathedral',0,{support:3600});
  CL('pell').rival='corden';CL('pell').rivalWhy='a captain sold to them on deadline day';CL('corden').rival='pell';CL('corden').rivalWhy=CL('pell').rivalWhy;
  CL('pell').ground='Dock Road';
  // 45 more clubs, sized by a hidden potential, then cut into three divisions of 16
  const names=pickN(TOWNNAMES.concat(TOWNNAMES2),45),towns=Object.keys(TOWNS);
  const pot=names.map((tn,i)=>({tn,i,v:rnd()}));pot.sort((a,b)=>b.v-a.v);
  const need=[15,14,16]; // harrow fills tier 0; pell and corden tier 1
  let k=0;for(const tier of TIERS)for(let j=0;j<need[tier];j++){const x=pot[k++];mkClub('c'+x.i,x.tn+(rnd()<.85?' '+pick(SUFFIX):''),pick(towns),tier)}
  const ids=Object.keys(S.clubs);
  ids.forEach(i=>{const c=CL(i);if(c.rival)return;const cands=ids.filter(j=>j!==i&&CL(j).tier===c.tier&&!CL(j).rival);const r=cands.length?pick(cands):pick(ids.filter(j=>j!==i));c.rival=r;if(!CL(r).rival){CL(r).rival=i;CL(r).rivalWhy=c.rivalWhy}});
  ids.forEach(i=>castClub(CL(i)));
  ids.forEach(i=>{const cs=Object.values(CL(i).cast).filter(x=>P(x).role!=='talent');cs.forEach(a=>{if(rnd()<.6){const b=pick(cs.filter(x=>x!==a));addRel(a,b,pick(['friends','rivals','mentor']))}})});
  // the domains: squads, grounds, money
  for(const id of ids){const c=CL(id),[a,b]=TIER_STR[c.tier];
    const str=id==='pell'?48:id==='harrow'?57:ri(a,b)+Math.round((c.support-(TIER_SUPPORT[c.tier][0]+TIER_SUPPORT[c.tier][1])/2)/600);
    S.squads[id]=genSquad(str,id);S.grounds[id]=groundInit(id);S.fin[id]=finInit(id);S.stats[id]=statsInit();S.members[id]=membersInit(id);S.records[id]=recordsInit();giveProfile(CL(id).cast.coach,'coach',CL(id).tier);giveProfile(CL(id).cast.td,'td',CL(id).tier);}
  staffPoolInit();
  for(const id of ids)commercialInit(id);
  S.qref=worldQuality();
  faInit();
  startSeason();
  setBudgetsAll(1);
  makeSeats();
  emit('WorldCreated',null,`${ids.length} clubs in three divisions.`);
  return S;
}
/* three chairs to choose from: one per division, each with its own problem */
function makeSeats(){
  const ids=Object.keys(S.clubs),out=[];
  const t0=ids.filter(i=>CL(i).tier===0).sort((a,b)=>teamStrength(a)-teamStrength(b));
  out.push(t0[ri(0,4)]);out.push('pell');
  const t2=ids.filter(i=>CL(i).tier===2).sort((a,b)=>CL(b).support-CL(a).support);out.push(t2[ri(0,5)]);
  S.seats=out;
}
function chooseClub(id){
  if(!S.seats.includes(id))return false;
  S.my=id;S.phase='season';S.votedOut=null;
  S.career.push({club:id,from:S.season,to:null,why:null});
  const m=M(id);m.conf=r1(clamp(62+S.rep*2,40,80));m.log.push({s:S.season,w:S.week,d:0,why:'A new chairman: the members give you a chance'});
  emit('ChairmanElected',id,`You are elected chairman of ${CL(id).name}.`);
  return true;
}

/* ---- world/league.js ---- */
/* ================= World: divisions, fixtures, tables, promotion and the cup =================
   Owns S.fx, S.tbl, S.cup and S.matches (this week's results). Three divisions of 16 (decision D3):
   30 league weeks, two up and two down between each pair of divisions, and a knock-out cup in six rounds.
   makeFixtures/standings are the Northmarch functions. */
const SEASON_WEEKS=30;
const CUP_WEEKS=[4,9,14,19,24,28];
const CUP_ROUND=['First round','Second round','Third round','Quarter-final','Semi-final','Final'];
const CUP_PRIZE=[1.5,3,6,10,16,30];

/* circle method (from Northmarch), with home and away balanced per club: whoever has been away longest, or at home least, plays at home.
   The Northmarch original alternated by position, which gave clubs runs of up to fifteen away games. Max run now 3. */
function makeFixtures(ids){
  const a=shuffle(ids.slice()),n=a.length,first=[],h={},st={};let arr=a.slice();for(const t of a){h[t]=0;st[t]=0}
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const x=arr[i],y=arr[n-1-i];
      const homeX=st[x]!==st[y]?st[x]<st[y]:h[x]!==h[y]?h[x]<h[y]:(r+i)%2===0;
      const [hh,aa]=homeX?[x,y]:[y,x];m.push([hh,aa]);h[hh]++;st[hh]=st[hh]>0?st[hh]+1:1;st[aa]=st[aa]<0?st[aa]-1:-1}
    first.push(m);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  return first.concat(first.map(rd=>rd.map(([x,y])=>[y,x])));
}
function tierIds(tier){return Object.keys(S.clubs).filter(i=>CL(i).tier===tier)}
function startSeason(){
  S.tbl={};S.fx={};
  for(const tier of TIERS){const ids=tierIds(tier);S.fx[tier]=makeFixtures(ids);
    const byStr=ids.slice().sort((x,y)=>teamStrength(y)-teamStrength(x));byStr.forEach((id,i)=>CL(id).expect=i+1);
    ids.forEach(id=>S.tbl[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,ded:0,form:[]});}
  S.week=0;S.matches=[];
  S.cup={round:0,alive:tierIds(1).concat(tierIds(2)),ties:[],winner:null,log:[]};
  cupDraw();
  setGoalsAll();
}
function standings(tier){return Object.keys(S.tbl).filter(i=>CL(i).tier===tier).sort((x,y)=>{const a=S.tbl[x],b=S.tbl[y];return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||(x<y?-1:1)})}
function posOf(id){return standings(CL(id).tier).indexOf(id)+1}
function ppg(id){const t=S.tbl[id];return t&&t.p?t.pts/t.p:1.35}
function rec(id,f,a){const t=S.tbl[id];t.p++;t.gf+=f;t.ga+=a;const r=f>a?'W':f===a?'D':'L';if(r==='W'){t.w++;t.pts+=3}else if(r==='D'){t.d++;t.pts++}else t.l++;t.form.push(r);if(t.form.length>5)t.form.shift()}
function fixtureOf(id,w){const tier=CL(id).tier,rd=S.fx[tier]&&S.fx[tier][w-1];if(!rd)return null;const m=rd.find(([h,a])=>h===id||a===id);return m?{h:m[0],a:m[1],home:m[0]===id,opp:m[0]===id?m[1]:m[0]}:null}
function cupTieOf(id){if(!S.cup||S.cup.round>=CUP_WEEKS.length)return null;const t=S.cup.ties.find(x=>x.h===id||x.a===id);return t||null}
function nextCupWeek(){return CUP_WEEKS[S.cup.round]}

/* ----- this week's games: league round + cup round. Strength comes from the squads (football/match.js) ----- */
function playWeekMatches(w){
  const out=[];
  for(const tier of TIERS)for(const [h,a] of S.fx[tier][w-1]){const m=playMatch(h,a,{comp:'league',tier});rec(h,m.gh,m.ga);rec(a,m.ga,m.gh);matchAftermath(m);out.push(m)}
  if(CUP_WEEKS[S.cup.round]===w)out.push(...playCupRound());
  S.matches=out;
  for(const m of out){
    const nm=`${CL(m.h).name} ${m.gh}–${m.ga} ${CL(m.a).name}${m.pens?` (${CL(m.pens).name} win on penalties)`:''}`;
    emit('Match',m.h,nm,{c2:m.a,comp:m.comp,gh:m.gh,ga:m.ga,scorers:m.scorers,round:m.round});
  }
  return out;
}
function cupDraw(){
  const cup=S.cup;if(cup.round===1)cup.alive=cup.alive.concat(tierIds(0));
  const a=shuffle(cup.alive.slice());cup.ties=[];
  for(let i=0;i+1<a.length;i+=2)cup.ties.push({h:a[i],a:a[i+1]});
}
function playCupRound(){
  const cup=S.cup,r=cup.round,out=[],won=[];
  for(const t of cup.ties){
    const final=r===CUP_WEEKS.length-1;
    const m=playMatch(t.h,t.a,{comp:'cup',round:r,neutral:final});matchAftermath(m);
    let w=m.gh>m.ga?t.h:m.ga>m.gh?t.a:null;
    if(!w){const p=.5+(m.sh-m.sa)*.01;w=rnd()<p?t.h:t.a;m.pens=w}
    m.winner=w;won.push(w);out.push(m);
    const lose=w===t.h?t.a:t.h;
    bookCupPrize(w,CUP_PRIZE[r],r);if(final)bookCupPrize(lose,CUP_PRIZE[r]/2,r);
    cup.log.push({r,h:t.h,a:t.a,gh:m.gh,ga:m.ga,w});
  }
  cup.round++;cup.alive=won;
  if(cup.round>=CUP_WEEKS.length){cup.winner=won[0];emit('CupWon',won[0],`${CL(won[0]).name} win ${CUP_NAME}.`)}
  else cupDraw();
  return out;
}

/* ----- end of the league: two up, two down between each pair of divisions ----- */
function promoteRelegate(){
  const tables=TIERS.map(t=>standings(t)),moves=[];
  for(let t=0;t<TIERS.length-1;t++){
    const down=tables[t].slice(-2),up=tables[t+1].slice(0,2);
    down.forEach(i=>{CL(i).tier=t+1;moves.push({id:i,from:t,to:t+1});emit('Relegated',i,`${CL(i).name} are relegated to ${TIER_NAME[t+1]}.`)});
    up.forEach(i=>{CL(i).tier=t;moves.push({id:i,from:t+1,to:t});emit('Promoted',i,`${CL(i).name} are promoted to ${TIER_NAME[t]}.`)});
  }
  return moves;
}

   squadQuality come from voorzitter-fundering club/players.js (which took them from claude-game). Adapted so every
   club has a squad (decision D1), with weekly development and injuries driven by the club's facilities. */
const POS=['GK','CB','FB','DM','CM','AM','W','ST'];
const POS_L={GK:'Goalkeepers',CB:'Centre-backs',FB:'Full-backs',DM:'Holding midfield',CM:'Central midfield',AM:'Attacking midfield',W:'Wingers',ST:'Strikers'};

const SQUAD_MIN=20,SQUAD_MAX=27;

function pname(){return `${pick(PFIRST)} ${pick(PLAST)}`}
/* weekly wage in £ for a player of quality q: semi-professional at the bottom, full-time at the top */
/* wages follow the market: quality relative to the world's level (S.qref), so a richer, better world does not inflate wages forever */
function wageFor(q){return Math.max(30,Math.round(150*Math.pow(1.65,q-((S&&S.qref)||11.7)+2.2)/5)*5)}
function worldQuality(){const ids=Object.keys(S.squads);return r2(ids.reduce((a,i)=>a+squadQuality(S.squads[i]),0)/ids.length)}
function newPlayer(pos,o={}){
  const age=o.age??ri(18,33),q=r1(o.q??(9+rnd()*5));
  const head=o.pa!=null?0:age<=19?1.5+rnd()*4:age<=22?rnd()*2.5:age<=24?rnd():0;
  const p={id:'pl'+(S.pc++),name:o.name||pname(),pos,age,q,pa:r1(o.pa??(q+head)),contract:o.contract??ri(1,3),
    wage:Math.round(wageFor(q)*(0.85+rnd()*.3)/5)*5,form:ri(55,75),inj:0,trait:o.trait||pick(PTRAITS),academy:!!o.academy,
    apps:0,goals:0,sApps:0,sGoals:0,joined:S.season,club:o.club||null,career:[],grown:0};
  return lifeDefaults(p);
}
function playerValue(p){const af=p.age<=21?1.6:p.age<=25?1.3:p.age<=29?1:p.age<=31?.6:.3;return Math.max(1,Math.round(wageFor(p.q)*.09*af*(1+Math.max(0,p.pa-p.q)*.15)))}
function qWord(q){return q<8.5?'Poor':q<10?'Squad player':q<11.5?'Solid':q<13?'Key player':q<14.5?'Star':'Elite'}
function genSquad(clubStr,clubId){
  const base=11.5+(clubStr-50)/4,sq=[];
  for(const pos of POS)for(let i=0;i<REQ[pos];i++)sq.push(newPlayer(pos,{q:base-1.2+rnd()*2.6,club:clubId}));
  const short=pick(['FB','CB','W','DM']);sq.splice(sq.findIndex(p=>p.pos===short),1);
  sq.push(newPlayer(pick(['CM','ST','W']),{q:base-.8+rnd()*1.6,club:clubId}));
  sq.push(newPlayer(pick(['ST','W','CM']),{age:ri(17,18),q:base-3+rnd(),academy:true,contract:2,club:clubId}));
  sq.push(newPlayer(pick(['CB','FB','AM']),{age:ri(17,18),q:base-3+rnd(),academy:true,contract:2,club:clubId}));

function fitFor(p,slot){return p.pos===slot?1:NEAR[p.pos].includes(slot)?.85:(slot==='GK'||p.pos==='GK')?.3:.6}
function available(sq){return sq.filter(p=>p.inj<=0&&!(p.susp>0))}
function pickXI(sq){
  const av=available(sq),xi=[];
  const score=p=>p.q+(p.form-65)/40+((p.morale??60)-60)/60-(p.tired?1:0);
  for(const slot of XI_SLOTS){let b=null,bv=-99;for(const p of av){if(xi.some(x=>x.p===p))continue;const v=score(p)*fitFor(p,slot);if(v>bv){bv=v;b=p}}if(b)xi.push({p:b,slot})}
  return xi;
}
function squadQuality(sq){const xi=pickXI(sq);if(!xi.length)return 6;return xi.reduce((a,x)=>a+x.p.q*fitFor(x.p,x.slot)*moraleF(x.p)*(x.p.tired?.96:1),0)/11-(11-xi.length)*.6}
function qualityToStr(q){return 50+(q-11.5)*4}
function squadGaps(sq){
  const out=[];
  for(const pos of POS){const n=available(sq).filter(p=>p.pos===pos).length;if(n<REQ[pos])out.push({pos,kind:'short',text:`${n?'Only '+n:'No'} fit ${POS_ONE[pos]}${n===1?'':'s'}; the squad needs ${REQ[pos]}`})}

}
function wageBillK(id){return r2(S.squads[id].reduce((a,p)=>a+p.wage,0)/1000)}

/* ----- weekly: injuries (medical) and development (training). Called once per club per week ----- */
function playersWeek(id){
  const sq=S.squads[id],sg=groundSignals(id),t=sg.training,med=sg.medPrev,medR=sg.medRec,st=S.stats[id];
  const risk=clamp(1.25-.15*med-(sg.fitness?.08:.03)*Math.min(t,4)-(sg.hasTM?.12:0),.45,1.3);
  const grow=(.12+.08*t)*coachGrowth(id)/SEASON_WEEKS,fade=(1-.06*Math.min(t,8))/SEASON_WEEKS;
  for(const p of sq){
    if(p.inj>0){p.inj--;if(p.inj===0&&id===S.my)emit('Return',id,`${p.name} is fit again.`,{pid:p.id})}
    else if(rnd()<.02*risk*(p.trait==='injury-prone'?1.8:1)){
      let d=rnd()<.06*(1-.12*Math.min(medR,6))?ri(6,16):ri(1,4);d=Math.max(1,Math.round(d*(1-.12*Math.min(medR,6))));p.inj=d;st.inj++;st.injWeeks+=d;
      emit('Injury',id,`${p.name} is injured: out for ${d} week${d>1?'s':''}.`,{pid:p.id,weeks:d,key:p.q>=squadQuality(sq)});
    }
    p.form=clamp(p.form+ri(-5,5),35,90);
    const before=p.q;
    const pt=p.age<=23?(p.played?1.4:.7):1; // young players grow by playing
    if(p.age<=23&&p.pa>p.q)p.q+=(p.pa-p.q)*grow*pt;
    else if(p.age<=29&&p.pa>p.q)p.q+=(p.pa-p.q)*grow*.4;
    else if(p.age>=31)p.q-=.55*fade;
    p.q=Math.round(clamp(p.q,4,19)*1000)/1000;p.grown+=p.q-before;if(p.age<=23)st.youthGrowth+=p.q-before;
  }
}
/* ----- season end: ageing, noise in development, contracts, retirement, academy intake ----- */
function playersSeasonEnd(id){
  const sq=S.squads[id],c=CL(id),sg=groundSignals(id),left=[];
  for(const p of sq.slice()){
    p.age++;p.contract--;p.yel=0;p.susp=0;p.career.push(`${c.name} ${S.season}: ${p.sApps} apps, ${p.sGoals} goals`);if(p.career.length>8)p.career.splice(0,p.career.length-8);p.sApps=0;p.sGoals=0;p.grown=0;
    p.q=r1(clamp(p.q+(rnd()-.5)*.4,4,19));
    if(p.age>=34&&rnd()<(p.age-33)*.22){sq.splice(sq.indexOf(p),1);left.push(p);emit('Retired',id,`${p.name} retires at ${p.age}.`,{pid:p.id})}
    else if(p.contract<=0){sq.splice(sq.indexOf(p),1);left.push(p);faAdd(p,'out of contract',id);if(id===S.my)emit('PlayerLeft',id,`${p.name} leaves at the end of his contract.`,{pid:p.id})}
  }
  // academy intake: the academy level decides how many, how good and how much potential
  // youngsters who will not make it are let go at 19-21, as real academies do
  const sqq=squadQuality(sq),keep=sq.filter(p=>p.age<=21).sort((x,y)=>y.pa-x.pa).slice(0,3);
  for(const p of sq.slice())if(p.age>=18&&p.age<=21&&!p.loan&&!keep.includes(p)&&p.pa<sqq-.3&&sq.length>SQUAD_MIN){sq.splice(sq.indexOf(p),1);left.push(p);faAdd(p,'released by the academy',id);if(id===S.my)emit('PlayerLeft',id,`${p.name} is released: he will not make the grade.`,{pid:p.id})}
  const a=sg.academy,n=1+(a>=3?1:0)+(a>=6?1:0),base=11.5+(tierBaseStr(c.tier)-50)/4;
  const kids=[];
  for(let i=0;i<n;i++){const q=base-3.2+.25*a+rnd()*1.2;const k=newPlayer(pick(POS.slice(1)),{age:ri(16,17),q,pa:q+1+.35*a+rnd()*2.5,academy:true,contract:2,club:id,trait:sg.academyLocal&&rnd()<.4?'local hero':null});
    k.career.push('Academy');sq.push(k);kids.push(k)}
  S.stats[id].intake=kids.length;S.stats[id].intakeBest=r1(Math.max(...kids.map(k=>k.pa)));
  if(id===S.my){
    const st=S.stats[id],history=st.academyHistory||(st.academyHistory=[]);
    history.push({season:S.season,graduates:kids.map(p=>({pid:p.id,name:p.name,pos:p.pos,quality:r1(p.q)}))});
    if(history.length>12)history.splice(0,history.length-12);
  }
  emit('YouthIntake',id,`${kids.length} academy graduate${kids.length>1?'s':''} join the squad.`,{n:kids.length,best:Math.max(...kids.map(k=>k.pa))});
  return left;
}
function statsInit(){return{inj:0,injWeeks:0,youthGrowth:0,intake:0,intakeBest:0,buys:0,misbuys:0,spent:0}}
function tierBaseStr(t){const [a,b]=TIER_STR[t];return (a+b)/2}

/* ---- football/match.js ---- */
/* ================= Football: the match =================
   lambdas/pmf/xpts are the Northmarch match engine (Poisson goals). Strength now comes from each club's own
   squad (fit players, positions, form) plus a home edge from the ground (atmosphere, pitch). */
function lambdas(sa,sb,home){const d=(sa-sb)/20+(home?.15:-.15);return[Math.max(.4,1.35+.6*d),Math.max(.4,1.35-.6*d)]}
function pmf(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function xpts(la,lb){let w=0,d=0;for(let i=0;i<=9;i++){const a=pmf(la,i);for(let j=0;j<=9;j++){const b=pmf(lb,j);if(i>j)w+=a*b;else if(i===j)d+=a*b}}return 3*w+d}
function teamStrength(id){return qualityToStr(squadQuality(S.squads[id]))}
function homeEdge(id){const sg=groundSignals(id);return sg.atmosphere*.12+(sg.pitch<1.5?-.6:0)}
const SCORE_W={GK:0,CB:.5,FB:.5,DM:.6,CM:1.4,AM:2.6,W:2.8,ST:5};
function scorerFrom(xi){const tot=xi.reduce((a,x)=>a+SCORE_W[x.slot]*x.p.q,0);let r=rnd()*tot;for(const x of xi){r-=SCORE_W[x.slot]*x.p.q;if(r<=0)return x.p}return xi[xi.length-1].p}
function playMatch(h,a,o={}){
  const xh=pickXI(S.squads[h]),xa=pickXI(S.squads[a]);
  const sh=teamStrength(h)+coachEdge(h)+(o.neutral?0:homeEdge(h)),sa=teamStrength(a)+coachEdge(a);
  const [lh0,la0]=lambdas(sh,sa,!o.neutral),ch=coachLambda(h),ca=coachLambda(a),lh=lh0*ch[0]*ca[1],la=la0*ca[0]*ch[1];
  const gh=pois(lh,rnd),ga=pois(la,rnd),scorers=[];
  for(const [xi,n,side] of [[xh,gh,'h'],[xa,ga,'a']]){for(const x of xi){x.p.apps++;x.p.sApps++}
    for(let i=0;i<n&&xi.length;i++){const p=scorerFrom(xi);p.goals++;p.sGoals++;scorers.push({side,pid:p.id,name:p.name})}}
  return{xiH:xh.map(x=>x.p.id),xiA:xa.map(x=>x.p.id),comp:o.comp||'league',tier:o.tier,round:o.round,h,a,gh,ga,sh:r1(sh),sa:r1(sa),lh:r2(lh),la:r2(la),xh:r2(xpts(lh,la)),xa:r2(xpts(la,lh)),scorers,neutral:!!o.neutral};
}

/* ---- football/market.js ---- */
/* ================= Football: the market =================
   Free agents (S.fa, idea from voorzitter-fundering club/market.js), renewals, transfers between clubs and forced
   sales. squadManager() is the rule-based director of football that runs every club's squad within the club's
   policy (wage ratio, share of spare cash). It is the standard executor for the player's club too, until staff
   agents arrive in layer 3 (voorzitter-fundering td.js/summer.js are the candidates for that). */
const FA_MAX=90;

function faNew(n){
  // new faces come from below Northmarch Two (local leagues, abroad): mostly weaker; good free agents are players clubs let go
  for(let i=0;i<n;i++){const age=ri(19,33),base=11.5+(tierBaseStr(2)-50)/4 /* fixed level: new faces from below Northmarch Two do not grow with the world (T2) */;
    const p=newPlayer(pick(POS),{age,q:base-1.8+rnd()*2+(rnd()<.1?1.2:0)-(age>=31?.5:0),contract:0});p.why=pick(['released in the summer','out of contract','back from a spell abroad','released after a long injury','left a club that went part-time']);S.fa.push(p)}
}
function faInit(){S.fa=[];faNew(60)}
function faAdd(p,why,from){p.left={club:from||p.club,s:S.season};p.club=null;p.why=why;p.contract=0;p.inj=0;S.fa.push(p)}
function faSummer(){
  S.fa=S.fa.filter(p=>p.age<35);for(const p of S.fa)p.age++;
  S.fa.sort((a,b)=>b.q-a.q);if(S.fa.length>FA_MAX)S.fa.length=FA_MAX;
  faNew(Math.max(10,70-S.fa.length));
}

/* the value a club puts on a player it owns: its best eleven are not for sale cheaply */
function isCore(id,p){const xi=pickXI(S.squads[id]);return xi.some(x=>x.p===p)}
function moveWage(p,toId){return Math.round(wageFor(p.q)*(0.95+rnd()*.25)/5)*5}
function transfer(p,from,to,fee,why,premium){
  const sq=S.squads[from];sq.splice(sq.indexOf(p),1);
  if(fee){book(to,'feesOut',-fee);book(from,'feesIn',fee)}
  p.wage=Math.round(moveWage(p,to)*(premium?1.3:1)/5)*5;p.contract=ri(2,3);p.club=to;p.joined=S.season;S.squads[to].push(p);
  emit('Transfer',to,`${p.name} joins ${CL(to).name} from ${CL(from).name}${fee?` for £${fee}k`:''}.`,{c2:from,pid:p.id,fee,why});
}
function signFree(p,to){S.fa.splice(S.fa.indexOf(p),1);p.wage=moveWage(p,to);p.contract=ri(1,2);p.club=to;p.joined=S.season;S.squads[to].push(p);
  emit('Signing',to,`${CL(to).name} sign free agent ${p.name} (${POS_ONE[p.pos]}).`,{pid:p.id})}
/* releasing a player costs a quarter of what is left on his contract */
function releaseCost(p){return r1(p.wage*SEASON_WEEKS*Math.max(0,p.contract)/1000*.25)}
function release(id,p,why){const sq=S.squads[id];const pay=releaseCost(p);if(pay)book(id,'wages',-pay);sq.splice(sq.indexOf(p),1);faAdd(p,why||'released',id);if(id===S.my)emit('Released',id,`${p.name} is released.`,{pid:p.id})}

/* the players a club's director can see: free agents and players at other clubs, wider with a better scouting office */
function scoutPool(id,pos,n){
  const reach=Math.max(4,6+Math.round(2*groundSignals(id).scouting+(pq(tdOf(id))-10)/2)),out=[];
  const fa=S.fa.filter(p=>(!pos||p.pos===pos)&&!(p.left&&p.left.club===id&&p.left.s>=S.season-1)); // a player who just left does not come back
  for(const p of pickN(fa,Math.ceil(reach*.6)))out.push({p,from:null});
  const others=Object.keys(S.clubs).filter(i=>i!==id&&Math.abs(CL(i).tier-CL(id).tier)<=1);
  for(let k=0;k<reach&&others.length;k++){const o=pick(others),c=S.squads[o].filter(p=>(!pos||p.pos===pos)&&p.inj<=0&&!p.loan);if(c.length){const p=pick(c);out.push({p,from:o,premium:CL(o).rep>CL(id).rep+15&&!p.wantsOut})} /* stepping down to a smaller club costs a wage premium */}
  // Keep a compact record of candidates the director actually encountered.
  // This is evidence of a search, not a promise of a signing or a scout assignment.
  if(id===S.my){
    const st=S.stats[id],history=st.scoutHistory||(st.scoutHistory=[]);
    const found=out.slice(0,n||99);
    history.push({season:S.season,week:S.week,pos:pos||'any',director:tdOf(id).name,
      candidates:found.slice(0,16).map(c=>({pid:c.p.id,name:c.p.name,pos:c.p.pos,age:c.p.age,from:c.from?CL(c.from).name:'Free agent',quality:r1(c.p.q)}))});
    if(history.length>12)history.splice(0,history.length-12);
  }
  return out.slice(0,n||99);
}
function askingFee(p,from){const v=playerValue(p);return Math.round(v*(isCore(from,p)&&!p.wantsOut?1.6:1)*(F(from).cash<0?.75:1)*(p.wantsOut?.85:1))}
function sellerAgrees(p,from,fee){
  if(S.squads[from].length<=SQUAD_MIN)return false;
  const need=S.squads[from].filter(x=>x.pos===p.pos).length<=REQ[p.pos];
  if(need&&F(from).cash>=0&&!p.wantsOut)return false;
  if(from===S.my&&!S.auto)return fee>=playerValue(p)*1.5&&!isCore(from,p); // the player's director only sells surplus at a premium
  return fee>=askingFee(p,from)*.85;
}
function budgetFor(id){const f=F(id),reserve=wageBillK(id)*6;return Math.max(0,Math.round((f.cash-reserve)*f.policy.spend))}

/* buy the best affordable player for a position. Returns true if someone signed */
function shopFor(id,pos,minQ,o={}){
  const cap=wageCapK(id),bill=wageBillK(id);let budget=o.budget??budgetFor(id);
  let best=null,bv=-Infinity;
  const pool=scoutPool(id,pos),evaluated=[];
  for(const c of pool){
    const p=c.p,seen=p.q+(rnd()+rnd()-1)*2.5*tdNoise(id);
    const fee=c.from?Math.round(askingFee(p,c.from)*tdBuyF(id)):0,wage=wageFor(p.q)/1000*(c.premium?1.3:1);
    const coverOk=wage<=wageFor(11.5+(tierBaseStr(2)-50)/4-1)/1000; // emergency cover: within the wage limit, or cheap
    let reason=seen<minQ?'Below target':fee>budget?'Outside transfer budget':bill+wage>cap&&(!o.mustHave||!coverOk)?'Outside wage limit':c.from&&!sellerAgrees(p,c.from,fee)?'Selling club unwilling':'Considered';
    if(reason==='Considered'){
      const v=o.mustHave?-wage*1000-fee:seen+(p.age<=24?(p.pa-p.q)*.18:0)-(p.age>=32?.4:0)-fee/200+(tdYouth(id)&&p.age<=21?.5:0);
      if(v>bv){bv=v;best={...c,fee};}
    }
    if(id===S.my)evaluated.push({pid:p.id,name:p.name,pos:p.pos,age:p.age,from:c.from?CL(c.from).name:'Free agent',estimate:r1(seen),fee,reason});
  }
  if(!best&&o.mustHave){const base=11.5+(tierBaseStr(2)-50)/4 /* fixed level: new faces from below Northmarch Two do not grow with the world (T2) */,p=newPlayer(pos,{age:ri(19,30),q:base-2+rnd()*1.2,contract:0});
    p.why='a trialist from the local leagues';S.fa.push(p);best={p,from:null,fee:0};}
  if(id===S.my){
    const history=S.stats[id].scoutHistory||[];
    const h=history[history.length-1];
    if(h){
      h.target=r1(minQ);h.budget=budget;
      h.candidates=evaluated.slice(0,16);
      h.decision=best?{pid:best.p.id,name:best.p.name,fee:best.fee,reason:o.mustHave?'Emergency cover':'Highest-rated affordable option'}:{reason:'No suitable affordable candidate'};
      for(const c of h.candidates)if(best&&c.pid===best.p.id)c.reason='Selected';
    }
  }
  if(!best)return false;
  if(!o.mustHave&&minQ>0){const st=S.stats[id];st.buys=(st.buys||0)+1;if(best.p.q<minQ)st.misbuys=(st.misbuys||0)+1;st.spent=r1((st.spent||0)+best.fee)}
  if(best.from)transfer(best.p,best.from,id,best.fee,'buy',best.premium);else signFree(best.p,id);
  return best;
}
/* the director's work in a window: fill holes, upgrade the weakest starter, trim the squad to the wage cap */
function squadManager(id,phase){
  const sq=S.squads[id];
  // over the wage cap or too big: let the least useful players go
  const trim=()=>{const cap=wageCapK(id);let guard=14;
    while(guard-->0){const bill=wageBillK(id),crisis=bill>cap*1.15;
      if(!(sq.length>SQUAD_MAX||(bill>cap*1.05&&sq.length>SQUAD_MIN)))break;
      const xi=pickXI(sq).map(x=>x.p);
      const pool=sq.filter(p=>!p.loan&&(crisis||!xi.includes(p))&&!(p.age<=20&&p.pa>p.q+1.5));
      const p=pool.sort((a,b)=>crisis?(b.wage/Math.max(1,b.q)-a.wage/Math.max(1,a.q)):(a.q-a.wage/400)-(b.q-b.wage/400))[0];if(!p)break;
      const fee=playerValue(p),buyers=Object.keys(S.clubs).filter(i=>i!==id&&budgetFor(i)>=fee&&wageBillK(i)+wageFor(p.q)/1000<=wageCapK(i)&&S.squads[i].length<SQUAD_MAX);
      if(buyers.length)transfer(p,id,pick(buyers),fee,'surplus');
      else if(!xi.includes(p)||sq.length>SQUAD_MIN+3)release(id,p,'released to cut the wage bill');else break}};
  trim();
  // players who asked to leave are sold if someone pays a fair price
  for(const p of sq.filter(x=>x.wantsOut&&!x.loan)){const fee=Math.round(playerValue(p)*.9),buyers=Object.keys(S.clubs).filter(i=>i!==id&&budgetFor(i)>=fee&&wageBillK(i)+wageFor(p.q)/1000<=wageCapK(i)&&S.squads[i].length<SQUAD_MAX&&CL(i).rep>=CL(id).rep-10);
    if(buyers.length&&sq.length>SQUAD_MIN){p.wantsOut=false;p.morale=70;transfer(p,id,pick(buyers),fee,'request')}}
  // holes: below the minimum per position (in winter only real emergencies: injuries leave the position bare)
  for(const pos of POS){let guard=3;const have=()=>phase==='winter'?available(sq).filter(p=>p.pos===pos).length+1:sq.filter(p=>p.pos===pos).length;
    while(guard-->0&&have()<REQ[pos]){const base=squadQuality(sq);if(!shopFor(id,pos,base-2.5)&&!shopFor(id,pos,0,{mustHave:true,budget:0}))break}}
  // upgrades: replace the weakest starter if a clearly better player is within reach
  // more money buys more attempts: a rich director keeps looking for upgrades
  if(phase==='summer'){const tries=clamp(Math.round(2+budgetFor(id)/60),3,6);for(let k=0;k<tries;k++){const xi=pickXI(sq);if(!xi.length)break;const worst=xi.slice().sort((a,b)=>a.p.q-b.p.q)[0];
    const got=shopFor(id,worst.slot,worst.p.q+(budgetFor(id)>150?.6:.8));if(!got)break}}
  while(sq.length<SQUAD_MIN){if(!shopFor(id,pick(POS),0,{mustHave:true,budget:0}))break}
  trim();
}
/* renewals in the spring: keep the players worth keeping within the wage cap */
function renewals(id){
  const sq=S.squads[id],med=sq.map(p=>p.q).sort((a,b)=>a-b)[Math.floor(sq.length/2)];
  for(const p of sq.filter(x=>x.contract===1).sort((a,b)=>b.q-a.q)){
    const short=sq.filter(x=>x.contract>1).length<22;
    const want=(p.q>=med-.3||(p.age<=22&&p.pa>med)||short)&&p.age<34;
    if(!want||p.loan)continue;
    // contract talks: the player names his price; the director offers what the wage limit allows
    const demand=wageDemand(p,med),room=(wageCapK(id)*1.05-wageBillK(id))*1000+p.wage,offer=Math.min(demand,Math.round(room/5)*5);
    if(p.wantsOut||offer<demand*.9){p.morale=clamp(p.morale-10,0,100);if(id===S.my)emit('RefusedContract',id,`${p.name} turns down a new contract${p.wantsOut?': he wants to leave':` (he asked £${demand} a week, the wage limit allows £${Math.max(0,offer)})`}. He can leave in the summer.`,{pid:p.id,demand});continue}
    p.wage=offer;p.contract=ri(2,3);p.morale=clamp(p.morale+8,0,100);if(id===S.my)emit('Renewed',id,`${p.name} signs a new ${p.contract}-year contract (£${p.wage} a week).`,{pid:p.id})
  }
}
/* the bank wants cash: sell the most valuable player who fetches a fee */
function forcedSale(id){
  const sq=S.squads[id];if(sq.length<=SQUAD_MIN)return;
  const p=sq.filter(x=>!x.loan).sort((a,b)=>playerValue(b)-playerValue(a))[0];if(!p)return;
  const fee=Math.round(playerValue(p)*.8);
  const buyers=Object.keys(S.clubs).filter(i=>i!==id&&F(i).cash>fee+wageBillK(i)*4&&S.squads[i].length<SQUAD_MAX).sort((a,b)=>F(b).cash-F(a).cash);
  if(buyers.length){transfer(p,id,buyers[0],fee,'forced');emit('ForcedSale',id,`${CL(id).name} must sell ${p.name} to ${CL(buyers[0]).name} for £${fee}k.`,{pid:p.id})}
}
defCommand('ReleasePlayer',{who:['player','td'],check:(id,a)=>{const p=S.squads[id].find(x=>x.id===a.pid);if(!p)return'Not in the squad';if(p.loan)return'He is here on loan';if(S.squads[id].length<=SQUAD_MIN)return`The squad needs at least ${SQUAD_MIN} players`;return null},
  run:(id,a)=>{const p=S.squads[id].find(x=>x.id===a.pid);const pay=releaseCost(p);release(id,p,'released by the club');return pay}});

/* ================= Football: the life of a squad =================
   Morale, cards and suspensions, fatigue in cup weeks, playing time, loans, contract demands and club reputation.
   Owns the player fields morale, yel, susp, tired, played, loan, wantsOut, lowWeeks, and the club field rep.
   The chairman does not pick players (D5); he sees the consequences and sets the loan policy in the director's frame. */
const MORALE_WORD=m=>m<25?'Unhappy':m<45?'Restless':m<65?'Content':m<82?'Happy':'Flying';
function lifeDefaults(p){p.morale??=60;p.yel??=0;p.susp??=0;p.tired??=0;p.played??=0;p.loan??=null;p.wantsOut??=false;p.lowWeeks??=0;return p}
function moraleF(p){return .93+.12*(p.morale??60)/100}
function repInit(c){return Math.round(clamp([68,48,28][c.tier]+(c.support-[3000,1700,850][c.tier])/120,10,95))}
/* after each match: who played, cards and bans, and how the result feels */
function matchAftermath(m){
  for(const [side,club] of [['h',m.h],['a',m.a]]){
    const xi=side==='h'?m.xiH:m.xiA,gf=side==='h'?m.gh:m.ga,ga=side==='h'?m.ga:m.gh,res=gf>ga?1:gf<ga?-1:0;
    for(const pid of xi){const p=S.squads[club].find(x=>x.id===pid);if(!p)continue;
      p.played=1;if(m.comp==='league'&&CUP_WEEKS[S.cup.round]===S.week)p.tired=1; // a league game in a cup week tires a player for the cup tie
      const temper=p.trait==='temperamental'?2:1;
      if(rnd()<.006*temper){p.susp=ri(1,3);if(club===S.my)emit('Suspended',club,`${p.name} is sent off and banned for ${p.susp} match${p.susp>1?'es':''}.`,{pid})}
      else if(rnd()<.09*temper){p.yel++;if(p.yel%5===0){p.susp=1;if(club===S.my)emit('Suspended',club,`${p.name} collects his fifth booking: banned for one match.`,{pid})}}
      p.morale=clamp(p.morale+res*3,0,100);
    }
    for(const p of S.squads[club])if(!xi.includes(p.id))p.morale=clamp(p.morale+res,0,100);
  }
}
/* weekly, after development: bans served, morale drifts, the unhappy ask to leave */
function lifeWeek(id){
  const sq=S.squads[id],med=sq.map(p=>p.q).sort((a,b)=>a-b)[Math.floor(sq.length/2)]||10;
  for(const p of sq){
    if(p.susp>0&&!p.played)p.susp--;
    if(!p.played&&p.inj<=0&&!p.susp&&p.q>=med)p.morale-=2.5;else if(p.played)p.morale+=1;
    if(p.contract===1&&S.week>RENEW_WEEK)p.morale-=.5;
    p.morale=clamp(p.morale+(60-p.morale)*.03,0,100);
    if(p.morale<25){p.lowWeeks++;if(p.lowWeeks>=4&&!p.wantsOut&&!p.loan){p.wantsOut=true;if(id===S.my)emit('WantsOut',id,`${p.name} asks to leave: he is unhappy with his place in the side.`,{pid:p.id})}}
    else{p.lowWeeks=0;if(p.wantsOut&&p.morale>55)p.wantsOut=false}
    p.played=0;p.tired=0;
  }
}
/* loans: young players who would not play go to a club below that needs them, and come back in the summer */
function loanOut(id){
  if(F(id).policy.loans===false||CL(id).tier===2)return;
  const sq=S.squads[id],xi=pickXI(sq).map(x=>x.p);
  const cands=sq.filter(p=>p.age<=21&&!xi.includes(p)&&!p.loan&&p.pa>p.q+1&&sq.length>SQUAD_MIN+2).sort((a,b)=>(b.pa-b.q)-(a.pa-a.q)).slice(0,2);
  for(const p of cands){
    const tos=Object.keys(S.clubs).filter(i=>CL(i).tier>CL(id).tier&&S.squads[i].length<SQUAD_MAX-1&&i!==S.my);
    const need=tos.filter(i=>S.squads[i].filter(x=>x.pos===p.pos).length<REQ[p.pos]+1);const to=need.length?pick(need):tos.length?pick(tos):null;if(!to)continue;
    sq.splice(sq.indexOf(p),1);p.loan={from:id,s:S.season};S.squads[to].push(p);
    emit('Loan',id,`${p.name} joins ${CL(to).name} on loan for the season.`,{c2:to,pid:p.id});
  }
}
function returnLoans(){
  for(const id in S.squads){const sq=S.squads[id];for(const p of sq.slice())if(p.loan&&p.loan.from!==id){sq.splice(sq.indexOf(p),1);const from=p.loan.from;p.loan=null;S.squads[from].push(p);
    if(from===S.my)emit('LoanBack',from,`${p.name} returns from his loan (${p.sApps} appearances).`,{pid:p.id})}}
}
/* contract demands: what a player asks for at renewal (more if he is good, wanted, or unhappy) */
function wageDemand(p,med){return Math.round(wageFor(p.q)*(1+(p.q>=med?.12:0)+rnd()*.12+(p.morale<40?.2:0)+(p.age<=23&&p.pa>p.q+1?.1:0))/5)*5}
/* reputation: how the region sees a club, from where it plays and how it does */
function repSeasonEnd(){
  for(const id in S.clubs){const c=CL(id),pos=posOf(id),target=[70,48,28][c.tier]+(9-pos)*1.6+(S.cup.winner===id?6:0);c.rep=Math.round(clamp(c.rep+(target-c.rep)*.25,5,99))}
}

  const course=(d,c)=>g.depts[d].course===c&&!g.depts[d].pending?1.15:1;
  const roofs=Object.values(g.sides).reduce((a,s)=>a+s.roof,0);
  return{
    capacity:licensed,capTerrace:Math.round(cap.terrace*licensed/Math.max(1,raw)),capSeated:Math.round(cap.seated*licensed/Math.max(1,raw)),
    business:Math.max(0,business),limitedBy:raw>limit?(g.fac.access.lv<=g.fac.safety.lv?'access':'safety'):null,
    atmosphere:r1((cap.terrace/Math.max(1,raw)*6+roofs*.4+eff(g.fac.lights)*.15+(has('clubhouse')&&has('commercial')&&cap.terrace>0?1:0))*course('matchday','atmosphere')),
    comfort:r1((cap.seated/Math.max(1,raw)*4+roofs*.5+eff(g.fac.screen)*.3+eff(g.fac.catering)*.3)*course('matchday','comfort')),
    pitch:r1(eff(g.pitch,'grounds')),

    medical:r1(lvOf('medical')+st('medical')),
    medPrev:r1((lvOf('medical')+st('medical'))*course('medical','prevention')),
    medRec:r1((lvOf('medical')+st('medical'))*course('medical','recovery')),
    hasTM:!!(has('training')&&has('medical')),
    academy:r1((lvOf('academy')+st('academy')+(has('academy')&&has('training')?1:0))*course('academy','broad')),
    academyLocal:course('academy','local')>1,
    scouting:r1((lvOf('scouting')+st('scouting'))*course('scouting','abroad')),
    shop:r1((lvOf('commercial')+st('commercial')*.5)*course('commercial','local')),
    sales:r2(df('commercial')*course('commercial','premium')),
    community:r1((lvOf('clubhouse')+st('community'))*course('community','members')),
    events:r1((lvOf('clubhouse')+st('community'))*course('community','events')),
    ops:r2(df('matchday')),
    access:r1(lvOf('parking')),media:r1(eff(g.fac.media)),

}

/* ----- what can be built ----- */
function projectCatalog(id){
  const g=G(id),out=[],sg=groundSignals(id),raw=Object.values(g.sides).reduce((a,s)=>a+sideCap(s),0),capped=raw>=1400+g.fac.access.lv*700+g.fac.safety.lv*500;
  for(const k in g.sides){const s=g.sides[k];
    out.push({key:'side:'+k+':ring',target:'side:'+k,group:'Stadium',label:`${SIDE_NAME[k]}: add a ring`,cost:s.type==='terrace'?45:60,weeks:s.type==='terrace'?14:16,permit:true,effect:`+${RING[s.type]} ${s.type==='terrace'?'standing places':'seats'}`+(capped?` · licence stays at ${sg.capacity} until turnstiles or safety improve`:'')});
    if(s.roof<2)out.push({key:'side:'+k+':roof',target:'side:'+k,group:'Stadium',label:`${SIDE_NAME[k]}: ${s.roof?'full':'part'} roof`,cost:30,weeks:10,permit:true,effect:'More comfort and atmosphere'});
    out.push({key:'side:'+k+':convert',target:'side:'+k,group:'Stadium',label:`${SIDE_NAME[k]}: convert to ${s.type==='terrace'?'seats':'terrace'}`,cost:Math.round(s.rings*(s.type==='terrace'?60:45)*.6),weeks:12,permit:true,effect:s.type==='terrace'?`${s.rings*RING.seated} seats instead of ${s.rings*RING.terrace} standing; more comfort, less noise`:`${s.rings*RING.terrace} standing instead of ${s.rings*RING.seated} seats; more noise`});
  }
  if(g.pitch.lv<8)out.push({key:'pitch:lv',target:'pitch',group:'Pitch',label:`Relay the pitch (to ${LV_NAME[g.pitch.lv+1]})`,cost:lvCost(8,g.pitch.lv),weeks:4,effect:'A better surface for the home side'});
  if(g.pitch.drain<8)out.push({key:'pitch:drain',target:'pitch',group:'Pitch',label:`Drainage (to ${LV_NAME[g.pitch.drain+1]})`,cost:lvCost(6,g.pitch.drain),weeks:3,effect:'The pitch wears less after home games'});
  for(const k in FAC){const f=g.fac[k];if(f.lv<8)out.push({key:'fac:'+k,target:'fac:'+k,group:'Facilities',label:`${FAC[k].n} (to ${LV_NAME[f.lv+1]})`,cost:lvCost(FAC[k].c,f.lv),weeks:FAC[k].w,effect:FAC[k].sig})}
  g.plots.forEach((p,i)=>{
    if(!p.kind){for(const k in COMPLEX)if(!g.plots.some(q=>q.kind===k))out.push({key:'plot:'+i+':'+k,target:'plot:'+i,group:`Plot ${i+1} (empty)`,label:`Build: ${COMPLEX[k].n}`,cost:COMPLEX[k].c,weeks:COMPLEX[k].w,permit:true,effect:COMPLEX[k].sig})}
    else if(p.lv<8)out.push({key:'plot:'+i+':up',target:'plot:'+i,group:'Club complex',label:`${COMPLEX[p.kind].n} (to ${LV_NAME[p.lv+1]})`,cost:lvCost(COMPLEX[p.kind].c,p.lv+1),weeks:Math.round(COMPLEX[p.kind].w*.7),effect:COMPLEX[p.kind].sig});
  });
  for(const o of out)o.busy=!!building(id,o.target);
  return out;
}
function startProject(id,key,offer){
  const o=projectCatalog(id).find(x=>x.key===key),of=OFFER[offer||'standard'];if(!o||o.busy)return null;
  const g=G(id),over=chance(of.over)?ri(10,30):0,delay=chance(of.delay)?ri(2,6):0;
  const p={id:g.next++,key,target:o.target,label:o.label,offer:offer||'standard',cost:Math.round(o.cost*of.p),over,delay,
    phase:o.permit?'permit':'build',left:o.permit?ri(2,5):o.weeks,weeks:o.weeks,paid:0,started:[S.season,S.week]};
  g.projects.push(p);gLog(id,`Started: ${o.label} with the ${of.n.toLowerCase()} (£${p.cost}k, ${o.weeks} weeks${o.permit?' after the permit':''}).`,'ProjectStarted');
  return p;
}
function finishProject(id,p){
  if(p.key.startsWith('stadium:')){finishStadium(id,p);return}
  const g=G(id),[kind,a,b]=p.key.split(':');
  if(kind==='side'){const s=g.sides[a];if(b==='ring')s.rings++;else if(b==='roof')s.roof++;else{s.type=s.type==='terrace'?'seated':'terrace';s.rings=Math.max(1,Math.round(s.rings*(s.type==='seated'?RING.terrace/RING.seated:RING.seated/RING.terrace)*.75))}s.cond=100}
  else if(kind==='pitch'){if(a==='lv'){g.pitch.lv++;g.pitch.cond=100}else if(a==='drain')g.pitch.drain++}
  else if(kind==='fac'){g.fac[a].lv++;g.fac[a].cond=100}
  else if(kind==='plot'){const pl=g.plots[+a];if(b==='up')pl.lv++;else{pl.kind=b;pl.lv=1}pl.cond=100}

  gLog(id,`Finished: ${p.label}.${p.over?` It ran ${p.over}% over budget.`:''}${p.delay?` ${p.delay} weeks late.`:''}`,'ProjectCompleted');
  g.projects=g.projects.filter(x=>x.phase!=='done'||x===p).slice(-12);
}
/* weekly: building progress (returns this week's construction bill) and wear against the department budget */
function groundWeek(id,home){
  const g=G(id);let construction=0;
  for(const p of g.projects.filter(x=>x.phase!=='done')){
    if(p.phase==='permit'){if(--p.left<=0){if(chance(.12)){p.left=ri(2,4);gLog(id,`Neighbours object to ${p.label.toLowerCase()}. The permit takes longer.`)}else{p.phase='build';p.left=p.weeks+p.delay;gLog(id,`Permit granted: ${p.label}. Building starts.`)}}continue}
    const total=Math.round(p.cost*(1+p.over/100)),pay=r1(Math.min(total-p.paid,total/(p.weeks+p.delay)));
    construction+=pay;p.paid=r1(p.paid+pay);
    if(p.over&&p.left===Math.ceil((p.weeks+p.delay)/2))gLog(id,`${p.label}: the builder reports an overrun of ${p.over}%.`);
    if(--p.left<=0){if(p.paid<total){construction+=r1(total-p.paid);p.paid=total}finishProject(id,p)}
  }
  const gr=g.depts.grounds,base=({tight:.15,normal:.42,generous:.7})[gr.budget]*(.7+.1*gr.staff),rec=()=>base*(gr.course==='stadium'&&!gr.pending?1.15:1),recP=base*(gr.course==='pitch'&&!gr.pending?1.4:1);
  for(const k in g.depts){const d=g.depts[k];if(d.hiring&&--d.hiring.left<=0){d.staff=d.hiring.to;d.hiring=null;if(id===S.my)gLog(id,`${DEPT[k].n}: the new staff have started (${STAFF_WORD[d.staff].toLowerCase()}).`,'StaffJoined')}}
  for(const k in g.sides){const s=g.sides[k];s.cond=clamp(s.cond-.45+rec(),0,100)}
  for(const k in g.fac){const f=g.fac[k];f.cond=clamp(f.cond-.42+rec(),0,100)}
  for(const p of g.plots)if(p.kind)p.cond=clamp(p.cond-.42+rec(),0,100);
  g.pitch.cond=clamp(g.pitch.cond+(home?-(4-g.pitch.drain*.3):0)+1.2+recP,0,100);
  for(const k in g.depts){const d=g.depts[k];if(d.pending&&--d.settle<=0){d.course=d.pending;d.pending=null;gLog(id,`${DEPT[k].n} now works the new way: ${d.course}.`)}}
  return r1(construction);
}
function groundSeasonEnd(id){
  const g=G(id);
  for(const k in g.sides){const s=g.sides[k];if(s.cond<30)gLog(id,`Safety inspection: the ${SIDE_NAME[k]} is in poor shape (${Math.round(s.cond)}%). Half of it stays closed until repaired.`,'SafetyClosure')}
}
function repairCost(o,base){return Math.max(1,Math.round(base*(100-o.cond)/100*.6))}
function repairList(id){
  const g=G(id),out=[];
  for(const k in g.sides){const s=g.sides[k];if(s.cond<90)out.push({key:'side:'+k,label:SIDE_NAME[k],cond:s.cond,cost:repairCost(s,s.rings*(s.type==='terrace'?45:60))})}
  for(const k in g.fac){const f=g.fac[k];if(f.cond<90)out.push({key:'fac:'+k,label:FAC[k].n,cond:f.cond,cost:repairCost(f,lvCost(FAC[k].c,f.lv)*2)})}
  g.plots.forEach((p,i)=>{if(p.kind&&p.cond<90)out.push({key:'plot:'+i,label:COMPLEX[p.kind].n,cond:p.cond,cost:repairCost(p,lvCost(COMPLEX[p.kind].c,p.lv)*2)})});

function repair(id,key){
  const r=repairList(id).find(x=>x.key===key);if(!r)return null;const g=G(id),[kind,a]=key.split(':');

}
function deptWeekCost(id,d,staff,budget){const x=G(id).depts[d];return r2(DEPT_COST[CL(id).tier]*STAFF_COST[staff??x.staff]*BUDGET_F[budget??x.budget])}
function deptCost(id){let t=0;for(const k in G(id).depts)t+=deptWeekCost(id,k);return r2(t)}
function groundCondWorst(id){const g=G(id);const all=[...Object.entries(g.sides).map(([k,s])=>({n:SIDE_NAME[k],c:s.cond})),...Object.entries(g.fac).map(([k,f])=>({n:FAC[k].n,c:f.cond})),{n:'The pitch',c:g.pitch.cond},...g.plots.filter(p=>p.kind).map(p=>({n:COMPLEX[p.kind].n,c:p.cond}))];return all.sort((a,b)=>a.c-b.c)[0]}
