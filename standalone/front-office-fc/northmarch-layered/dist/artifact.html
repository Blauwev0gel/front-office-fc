/* ---- club/finance.js ---- */
/* ================= Club: money =================
   From voorzitter-fundering club/finance.js (weekly ledger with named lines, price elasticity, attendance,
   season tickets, forecast). Adapted to every club (S.fin[id]) and extended with prize money, cup gates,
   transfer fees, loans, an overdraft and administration. book() is the ONLY function that changes cash, so the
   ledger always reconciles: cash = start + every booked line. Amounts in £k. */
const LINE={
  gate:['Tickets: terraces and seats','matchday'],business:['Business seats','matchday'],catering:['Catering','matchday'],seasontix:['Season tickets','matchday'],cupgate:['Cup gate','matchday'],
  sponsors:['Main sponsor','commercial'],partners:['Local partners','commercial'],naming:['Stadium naming rights','commercial'],fundraising:['Members\' appeals','commercial'],merch:['Merchandise','commercial'],events:['Events and hire','commercial'],dues:['Membership dues','commercial'],
  tv:['League and TV money','media'],prize:['League prize money','media'],cupprize:['Cup prize money','media'],
  feesIn:['Transfer fees received','transfers'],feesOut:['Transfer fees paid','transfers'],
  wages:['Player wages','wages'],
  depts:['Department budgets','costs'],upkeep:['Ground upkeep','costs'],ops:['Matchday stewards and police','costs'],travel:['Away travel','costs'],
  staff:['Head coach and director','wages'],staffpay:['Staff compensation','costs'],
  build:['Construction','costs'],repairs:['Repairs','costs'],interest:['Interest','costs'],
  rent:['Ground rent','costs'],
  loanIn:['Loans and bonds drawn','financing'],loanOut:['Loan and bond repayments','financing'],groundSale:['Sale or buy-back of the ground','capital']
};
const HEAD={matchday:'Matchday',commercial:'Commercial',media:'League & cup',transfers:'Transfers',wages:'Wages',costs:'Other costs',financing:'Loans',capital:'The ground'};
const PRICE_DEF=[{terrace:11,seated:16,business:35,season:140},{terrace:9,seated:13,business:30,season:110},{terrace:7,seated:10,business:22,season:85}];
const TV=[4.6,2.2,.8],SPONSOR=[3.4,1.9,.9],PRIZE=[[80,4],[40,2],[15,.6]];
const WAGE_RATIO={tight:.65,normal:.76,ambitious:.88,allin:.98};

function F(id){return S.fin[id]}
function finInit(id){
  const c=CL(id),t=c.tier,cash=[ri(90,260),ri(30,140),ri(10,60)][t],debt=pick([0,0,0,1,2,3])*[90,50,25][t];
  const v=chairValue(id);
  const f={cash:0,start:0,loans:[],prices:{...PRICE_DEF[t]},season:{},last:null,hist:[],od:0,admin:null,holders:0,sold:0,lastGate:null,
    policy:{wage:v==='glory'?'ambitious':v==='money'?'tight':'normal',spend:v==='glory'?.7:v==='money'?.3:.5,loans:true}};
  S.fin[id]=f;f.cash=cash;f.start=cash;
  if(debt){f.loans.push(mkLoan(debt,10,.05,'Old club debt'))}
  return f;
}
function book(id,line,amt){
  amt=r2(amt);if(!amt)return;const f=F(id);
  f.cash=r2(f.cash+amt);f.season[line]=r2((f.season[line]||0)+amt);
  if(f.week)f.week[line]=r2((f.week[line]||0)+amt);
}
function debt(id){return r1(F(id).loans.reduce((a,l)=>a+l.left,0))}

/* ----- demand: who comes to a home game ----- */
function attendance(id,opp,o={}){
  const c=CL(id),f=F(id),g=groundSignals(id),pr=f.prices,ref=PRICE_DEF[c.tier];
  const form=clamp(1+(ppg(id)-1.35)*.35,.6,1.6),pull=opp?Math.pow(CL(opp).support/1500,.15):1;
  const base=c.support*form*pull*(o.derby?1.35:1)*(o.cup?1+.1*(o.round||0):1)*(1+g.access*.03)*(1+g.atmosphere*.01);
  const t=Math.min(g.capTerrace,Math.round(base*.62*Math.pow(ref.terrace/pr.terrace,.6)));
  const s=Math.min(g.capSeated,Math.round(base*.38*(1+g.comfort*.02)*Math.pow(ref.seated/pr.seated,1.2)));
  const b=Math.min(g.business,Math.round(g.business*.7*Math.pow(ref.business/pr.business,.4)));
  const hold=o.cup?0:f.holders,holdT=Math.min(t,Math.round(hold*.62)),holdS=Math.min(s,hold-holdT);
  return{terrace:t,seated:s,business:b,total:t+s+b,paying:{terrace:t-holdT,seated:s-holdS},cap:g.capacity,fill:(t+s)/Math.max(1,g.capTerrace+g.capSeated),full:t>=g.capTerrace||s>=g.capSeated};
}
/* the regular weekly lines (no transfers, prizes or loans; those are booked where they happen) */
function weekLines(id,home,o={}){
  const c=CL(id),f=F(id),g=groundSignals(id),pr=f.prices,L={},t=c.tier,form=clamp(1+(ppg(id)-1.35)*.4,.6,1.5);
  if(home){const a=o.att||attendance(id,o.opp,o);const gate=(a.paying.terrace*pr.terrace+a.paying.seated*pr.seated)/1000;
    if(o.cup)L.cupgate=o.neutral?gate/2:gate;else L.gate=gate;
    L.business=a.business*pr.business/1000;L.catering=a.total*2.5*(.6+g.catering*.1)*.4/1000;L.ops=-(.25+a.total/6000*(o.derby?1.6:1))*(1.3-.3*g.ops)}
  else if(o.away)L.travel=-(t===0?.5:t===1?.35:.2);
  if(o.weekly!==false){
    L.sponsors=sponsorWeekK(id);L.partners=partnersWeekK(id,form);L.naming=namingWeekK(id);L.rent=-rentWeekK(id);
    L.merch=c.support/1000*.45*(1+g.shop*.15)*form;
    L.events=g.shop*.08+g.events*.07;
    L.dues=S.members&&S.members[id]?S.members[id].count*S.members[id].dues/SEASON_WEEKS/1000:c.support*.4*40/SEASON_WEEKS/1000;
    L.tv=TV[t];
    L.wages=-wageBillK(id);L.staff=-staffWeekK(id);L.depts=-deptCost(id);L.upkeep=-(.15+g.capacity/12000);
  }
  for(const k in L){L[k]=r2(L[k]);if(!L[k])delete L[k]}
  return L;
}
function sumLines(L,sign){let t=0;for(const k in L)if(!sign||(sign>0?L[k]>0:L[k]<0))t+=L[k];return r2(t)}

/* ----- loans: an annuity paid over 30 weeks a season ----- */
function mkLoan(amount,years,rate,label){const n=years*SEASON_WEEKS,r=rate/SEASON_WEEKS,pay=amount*r/(1-Math.pow(1+r,-n));return{label,amount,left:amount,rate,weeks:n,pay:r2(pay)}}
function loanRate(id,extra){return r2(.05+.04*clamp((debt(id)+(extra||0))/Math.max(50,estSeasonIncome(id)),0,1.5))}
function maxNewLoan(id){return Math.max(0,Math.floor(estSeasonIncome(id)*.8-debt(id)))}
function creditLimit(id){return Math.max(10,Math.round(estSeasonIncome(id)*.12))}
/* expected operating income over a full season (used by AI wage policy, credit and forecasts) */
function estSeasonIncome(id){
  const c=CL(id),opp=null,a=attendance(id,null,{}),L=weekLines(id,true,{opp,weekly:false,att:a}),wk=weekLines(id,false,{});
  const holdN=c.support*.28*Math.pow(PRICE_DEF[c.tier].season/F(id).prices.season,.8),share=F(id).holders?0:Math.min(.9,holdN/Math.max(1,a.total));
  const h=sumLines(L,1)-(L.gate||0)*share; // season-ticket holders do not pay at the gate
  const reg=(wk.sponsors||0)+(wk.partners||0)+(wk.naming||0)+(wk.merch||0)+(wk.events||0)+(wk.dues||0)+(wk.tv||0);
  const hold=c.support*.28*F(id).prices.season/1000;
  return Math.round(h*SEASON_WEEKS/2+reg*SEASON_WEEKS+hold+PRIZE[c.tier][0]*.6);
}
function wageCapK(id){return r2(estSeasonIncome(id)*wageRatio(id)/SEASON_WEEKS)}

/* ----- the week for one club. matches: this week's games involving the club ----- */
function financeWeek(id,matches){
  const f=F(id),c=CL(id);f.week={};
  if(S.week===1&&f.sold!==S.season){const hold=Math.round(c.support*.28*clamp(1+(ppg(id)-1.35)*.3,.6,1.4)*Math.pow(PRICE_DEF[c.tier].season/f.prices.season,.8));
    f.holders=hold;f.sold=S.season;book(id,'seasontix',hold*f.prices.season/1000)}
  let away=false;
  for(const m of matches){const home=m.h===id,derby=CL(m.h).rival===m.a;
    if(home||(m.neutral&&m.a===id)){const att=attendance(m.h,m.a,{derby,cup:m.comp==='cup',round:m.round});m.att=att.total;if(home&&m.comp==='league')f.lastGate=att;
      const L=weekLines(id,true,{att,derby,cup:m.comp==='cup',neutral:m.neutral,weekly:false});for(const k in L)book(id,k,L[k])}
    else away=true;
    if(m.comp==='league'&&f.sponsor&&f.sponsor.kind==='bonus'&&f.sponsor.until>=S.season){const gf=home?m.gh:m.ga,ga=home?m.ga:m.gh,pts=gf>ga?3:gf===ga?1:0;if(pts)book(id,'sponsors',pts*f.sponsor.perPoint)}}
  const L=weekLines(id,false,{away});for(const k in L)book(id,k,L[k]);
  const b=groundWeek(id,matches.some(m=>m.h===id&&!m.neutral));if(b)book(id,'build',-b);
  const g=G(id);if(g.repairBill){book(id,'repairs',-g.repairBill);g.repairBill=0}
  for(const l of f.loans){const int=l.left*l.rate/SEASON_WEEKS,prin=Math.min(l.left,l.pay-int);book(id,'interest',-int);book(id,'loanOut',-prin);l.left=r2(l.left-prin);l.weeks--}
  f.loans=f.loans.filter(l=>l.left>.05);
  if(f.cash<0)book(id,'interest',f.cash*.12/SEASON_WEEKS);
  solvency(id);
  f.last={lines:f.week,net:sumLines(f.week),cash:f.cash,w:S.week};f.week=null;
  return f.last;
}
/* overdraft beyond the credit limit: the club must sell; three weeks on, administration (once a season) */
function solvency(id){
  const f=F(id),lim=creditLimit(id);
  if(f.cash<-lim){f.od++;
    if(f.od===1)emit('CashCrisis',id,`${CL(id).name} are over their overdraft limit. The bank wants players sold.`);
    forcedSale(id);
    if(f.od>=3&&(!f.admin||f.admin<S.season)){f.admin=S.season;S.tbl[id].pts-=6;S.tbl[id].ded+=6;
      const amt=Math.ceil(-f.cash+lim*.5);f.loans.push(mkLoan(amt,5,.09,'Administration loan'));book(id,'loanIn',amt);f.policy.wage='tight';
      emit('Administration',id,`${CL(id).name} go into administration: six points deducted and a £${amt}k rescue loan at 9%.`)}
  }else f.od=0;
}
/* close the books for the season: league prize money, archive the lines */
function financeSeasonEnd(id,pos,tier){
  const [top,step]=PRIZE[tier];book(id,'prize',top-(pos-1)*step);
  const f=F(id);f.hist.push({s:S.season,tier,pos,lines:f.season,cash:f.cash,debt:debt(id)});while(f.hist.length>(id===S.my?40:12)){const old=f.hist.shift();for(const k in old.lines)f.start=r2(f.start+old.lines[k])} // keep the save small: an archived season is carried into the opening balance, so the ledger still reconciles
  f.season={};f.holders=0;
}
function seasonTotals(id,s){const f=F(id),lines=s==null||s===S.season?f.season:(f.hist.find(h=>h.s===s)||{lines:{}}).lines,head={};
  for(const k in lines){const h=LINE[k][1];head[h]=r1((head[h]||0)+lines[k])}return{lines,head}}
function operatingResult(lines){let t=0;for(const k in lines)if(!['loanIn','loanOut','groundSale'].includes(k))t+=lines[k];return r1(t)}
/* 26-week forecast with a band */
function cashForecast(id,weeks=26){
  const f=F(id),avg=(sumLines(weekLines(id,true,{}))+sumLines(weekLines(id,false,{away:true})))/2;
  const loanPay=f.loans.reduce((a,l)=>a+l.pay,0),build=G(id).projects.filter(p=>p.phase!=='done').reduce((a,p)=>a+Math.max(0,p.cost*(1+p.over/100)-p.paid),0);
  const per=Math.max(1,G(id).projects.filter(p=>p.phase!=='done').reduce((a,p)=>Math.max(a,p.left+(p.phase==='permit'?p.weeks:0)),1));
  const pts=[];let mid=f.cash;const left=SEASON_WEEKS-S.week;
  for(let i=1;i<=weeks;i++){mid+=(i<=left?avg-loanPay:-loanPay*.2)-(i<=per?build/per:0);pts.push(Math.round(mid))}
  const low=pts.map((v,i)=>Math.round(v-(i+1)*Math.abs(avg)*.12-(i+1)*.4)),high=pts.map((v,i)=>Math.round(v+(i+1)*Math.abs(avg)*.1+(i+1)*.4));
  const minV=Math.min(...pts),minW=pts.indexOf(minV)+1;
  return{mid:pts,low,high,minV,minW};
}
function bookCupPrize(id,amt,r){book(id,'cupprize',amt)}
function finHealth(id){const f=F(id),fc=cashForecast(id);return f.cash<0?'red':fc.minV<0||debt(id)>estSeasonIncome(id)*.6?'tight':'healthy'}

/* ----- commands ----- */
defCommand('SetPrice',{check:(id,a)=>{if(!(a.kind in F(id).prices))return'Unknown price';const ref=PRICE_DEF[CL(id).tier][a.kind],step=a.kind==='season'||a.kind==='business'?5:1;
    if(a.delta>0&&hasStatute(id,STATUTE_PRICES)&&F(id).prices[a.kind]+step>Math.round(ref*1.15))return'The statute lets the members set prices: no more than 15% above the usual';return null},run:(id,a)=>{const pr=F(id).prices,k=a.kind,step=k==='season'?5:k==='business'?5:1,ref=PRICE_DEF[CL(id).tier][k];
  pr[k]=clamp(pr[k]+a.delta*step,Math.round(ref*.4),Math.round(ref*2.5));if(id===S.my)emit('Finance',id,`Price change: ${k==='season'?'season ticket':k} now £${pr[k]}.`)}});
defCommand('TakeLoan',{check:(id,a)=>{if(!(a.amount>0))return'Choose an amount';if(a.amount>maxNewLoan(id))return`The bank lends at most £${maxNewLoan(id)}k more`;if(![3,5,10].includes(a.years))return'Choose 3, 5 or 10 years';return null},
  run:(id,a)=>{const rate=loanRate(id,a.amount),l=mkLoan(a.amount,a.years,rate,`Bank loan (${a.years} years)`);F(id).loans.push(l);book(id,'loanIn',a.amount);emit('LoanTaken',id,`${CL(id).name} borrow £${a.amount}k over ${a.years} years at ${Math.round(rate*1000)/10}%.`);return l}});

  run:(id,a)=>{const l=F(id).loans[a.i];book(id,'loanOut',-l.left);emit('LoanRepaid',id,`Loan repaid early: £${r1(l.left)}k.`);F(id).loans.splice(a.i,1)}});

  run:(id,a)=>{const p=F(id).policy;if(a.wage){p.wage=a.wage;p.wageR=WAGE_RATIO[a.wage]}if(a.wageR!=null)p.wageR=r2(a.wageR);if(a.spend!=null)p.spend=a.spend;if(a.loans!=null)p.loans=a.loans}});

/* ---- club/members.js ---- */
/* ================= Club: members, confidence, season targets and the AGM =================
   Owns S.members[id] (members, dues, confidence, its log, the season's targets) and the chairman's career
   (S.career, S.rep). Decisions D6 and D7: confidence moves with real causes, every club holds an AGM after week 30,
   and a chairman who loses the vote is out. The player then picks one of three open chairs in the same world. */
const DUES_REF=[50,40,30]; // £ a year per member, by division
const CONF_BASE=55;
function M(id){return S.members[id]}
function membersInit(id,o={}){
  const c=CL(id);return{count:Math.round(c.support*.4),dues:DUES_REF[c.tier],conf:o.conf??ri(48,62),log:[],goals:[],goalsSeason:0,agm:null};
}
function confLog(id,d,why){
  const m=M(id);if(!d)return;const before=m.conf;m.conf=r1(clamp(m.conf+d,0,100));
  const last=m.log[m.log.length-1];
  if(last&&last.why===why&&last.s===S.season){last.d=r1(last.d+(m.conf-before));last.w=S.week}else m.log.push({s:S.season,w:S.week,d:r1(m.conf-before),why});
  if(m.log.length>40)m.log.shift();
}
function priceIndex(id){const pr=F(id).prices,ref=PRICE_DEF[CL(id).tier];return(pr.terrace/ref.terrace*.6+pr.seated/ref.seated*.4)}
/* weekly: members follow support, dues and the clubhouse; confidence follows results, prices and the club's state */
function membersWeek(id,matches){
  const m=M(id),c=CL(id),g=groundSignals(id),ref=DUES_REF[c.tier];
  const target=c.support*.4*(1+g.community*.05)*Math.pow(ref/m.dues,.5);
  m.count=Math.max(50,Math.round(m.count+(target-m.count)*.04));
  for(const x of matches){
    const home=x.h===id,gf=home?x.gh:x.ga,ga=home?x.ga:x.gh,pts=gf>ga?3:gf===ga?1:0;
    if(x.comp==='league'){const xp=home?x.xh:x.xa,derby=CL(x.h).rival===x.a;confLog(id,(pts-xp)*(derby?1.6:.9),derby?'Derby results':'Results against expectation')}
    else if(x.winner===id&&x.round>=3)confLog(id,1.5,'A cup run');
  }
  if(namingWeekK(id))confLog(id,-.12,'The ground renamed after a sponsor');
  const pi=priceIndex(id);if(pi>1.2)confLog(id,-(pi-1.2)*2.5,'Ticket prices');else if(pi<.9)confLog(id,.15,'Ticket prices');
  if(m.dues>ref*1.3)confLog(id,-(m.dues/ref-1.3)*1.5,'Membership dues');else if(m.dues<ref*.8)confLog(id,.1,'Membership dues');
}
/* events that members react to (called once per event from the clock) */
const CONF_EVENT={Administration:[-20,'Administration'],CashCrisis:[-6,'Money trouble'],ForcedSale:[-3,'Forced player sales'],SafetyClosure:[-4,'A stand closed for safety'],ProjectCompleted:[2,'New facilities'],CupWon:[8,'Winning the cup']};
function membersOnEvents(evs){for(const e of evs){const r=CONF_EVENT[e.t];if(r&&e.c&&S.members[e.c])confLog(e.c,r[0],r[1])}}

/* ----- season targets: league position, money and the academy ----- */
function academyApps(id){return S.squads[id].filter(p=>p.academy).reduce((a,p)=>a+p.sApps,0)}
function setGoals(id){
  const c=CL(id),m=M(id),exp=c.expect||8,f=F(id),inc=estSeasonIncome(id);
  const pos=c.tier>0&&exp<=3?2:clamp(exp+2,1,14);
  m.goals=[
    {k:'league',target:pos,text:c.tier>0&&pos<=2?`Promotion: finish in the top two of ${TIER_NAME[c.tier]}`:`Finish ${ord(pos)} or higher in ${TIER_NAME[c.tier]}`,w:10},
    f.cash<inc*.3?{k:'money',target:0,text:'No operating loss this season',w:6}:{k:'money',target:-Math.round(inc*.1),text:`Keep any operating loss under £${Math.round(inc*.1)}k`,w:6},
    {k:'youth',target:[30,45,60][c.tier],text:`Academy players make ${[30,45,60][c.tier]} appearances between them`,w:5}
  ];m.goalsSeason=S.season;
}
function setGoalsAll(){for(const id in S.clubs)if(S.members[id])setGoals(id)}
function goalProgress(id,gl){
  if(gl.k==='league'){const p=posOf(id);return{now:p,met:p<=gl.target,text:`${ord(p)} now`}}
  if(gl.k==='money'){const r=operatingResult(F(id).season);return{now:r,met:r>=gl.target,text:`${k1v(r)} so far`}}
  const a=academyApps(id);return{now:a,met:a>=gl.target,text:`${a} so far`};
}
function k1v(v){return(v<0?'−':'')+'£'+Math.abs(Math.round(v))+'k'}
/* ----- the AGM: held for every club after week 30, before the season closes ----- */
function holdAGMs(){
  const out=[];
  for(const id in S.clubs){const m=M(id),c=CL(id);
    const goals=[];for(const gl of m.goals){const pr=goalProgress(id,gl);goals.push({text:gl.text,met:pr.met,now:pr.text});confLog(id,pr.met?gl.w*.8:-gl.w*.8,pr.met?'Season targets met':'Season targets missed')}
    const pos=posOf(id);if(c.tier>0&&pos<=2)confLog(id,12,'Promotion');if(c.tier<2&&pos>=15)confLog(id,-15,'Relegation');
    const fresh=id===S.my&&S.career.length&&S.career[S.career.length-1].from===S.season?6:0; // a first season earns some patience
    const forPct=clamp(Math.round(24+.75*m.conf+fresh+(rnd()-.5)*10),3,97);
    m.agm={s:S.season,goals,for:forPct,against:100-forPct,out:forPct<50&&!(S.agmOff&&id===S.my),conf:m.conf,reasons:seasonReasons(id)};
    if(m.agm.out)out.push(id);
  }
  return out;
}
function seasonReasons(id){const by={};for(const l of M(id).log.filter(x=>x.s===S.season))by[l.why]=r1((by[l.why]||0)+l.d);return Object.entries(by).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,5)}
/* after the vote: computer chairmen who lost are replaced (a new chairman has his own values); the player is out */
function afterAGMs(outIds){
  for(const id of outIds){const c=CL(id),m=M(id);
    if(id===S.my){const st=S.career[S.career.length-1];if(st){st.to=S.season;st.why=`Voted out at the AGM (${m.agm.for}% for)`}
      S.rep=r1(S.rep-1);emit('ChairmanOut',id,`You are voted out as chairman of ${c.name}: ${m.agm.for}% for, ${m.agm.against}% against.`,{player:true});S.votedOut=id;continue}
    const old=P(c.cast.chair),nu=c.cast.opp;c.cast.chair=nu;P(nu).role='chair';c.cast.opp=mkPerson('opp',id,{infl:weakest(c)});if(old)old.club=null;
    emit('ChairmanOut',id,`${c.name}: chairman ${old?old.name:''} is voted out at the AGM. ${P(nu).name} takes the chair.`);
    m.conf=58;
    const v=chairValue(id),f=F(id);f.policy.wage=v==='glory'?'ambitious':v==='money'?'tight':'normal';
  }
  for(const id in S.clubs)M(id).conf=r1(M(id).conf+(CONF_BASE-M(id).conf)*.15);
}
/* the player's seats after being voted out: one per division, better clubs for a better reputation */
function seatsAfterOut(){
  const ex=new Set([S.votedOut,...S.career.map(x=>x.club)]),out=[];
  for(const t of TIERS){const ids=tierIds(t).filter(i=>!ex.has(i)).sort((a,b)=>teamStrength(a)-teamStrength(b));
    const k=clamp(Math.round(ids.length*(.35+.06*S.rep))+ri(-2,2),0,ids.length-1);out.push(ids[k])}
  return out;
}
function membersAfterLoad(){if(S.members&&Object.values(S.members).some(m=>m.goalsSeason!==S.season))setGoalsAll()}

defCommand('SetDues',{check:(id,a)=>!(a.delta===1||a.delta===-1)?'Change dues one step at a time':null,run:(id,a)=>{const m=M(id),ref=DUES_REF[CL(id).tier];
  m.dues=clamp(m.dues+a.delta*5,Math.round(ref*.4/5)*5,Math.round(ref*2.5/5)*5);if(id===S.my)emit('Members',id,`Membership dues set to £${m.dues} a year.`)}});

/* ---- club/staff.js ---- */
/* ================= Club: the head coach and the director of football =================
   Owns the professional profile of coaches and directors (P(id).pro) and the pool of free ones (S.staffPool).
   Layer 2: they have quality, a speciality, a wage, a contract and a record, and they change the simulation.
   They have no will of their own yet (mandates and initiative are layer 3). Director skills echo
   voorzitter-fundering club/td.js (eye, deal), reduced to quality plus speciality. */
const STAFF_SPEC={
  coach:{development:'Develops young players',results:'Gets results now',attacking:'Attacking football',defensive:'Hard to beat'},
  td:{eye:'A sharp eye for a player',negotiator:'A hard bargainer',youth:'Builds on young players'}
};
const STAFF_Q=[[10,16],[7,13],[4,10]];
const POOL_SIZE={coach:9,td:7};
function staffWage(role,q){return Math.max(60,Math.round((role==='coach'?120:95)*Math.pow(1.27,q-8)/5)*5)}
function giveProfile(pid,role,tier,o={}){
  const p=P(pid),[a,b]=STAFF_Q[tier];const q=o.q??ri(a,b);
  p.pro={q,spec:o.spec||pick(Object.keys(STAFF_SPEC[role])),wage:staffWage(role,q),contract:o.contract??ri(1,3),since:S.season,record:[],off:ri(-3,3),caretaker:!!o.caretaker};
  return p;
}
function coachOf(id){return P(CL(id).cast.coach)}
function tdOf(id){return P(CL(id).cast.td)}
const pq=p=>p&&p.pro?p.pro.q:6;
/* ----- what they do in the simulation ----- */
function coachEdge(id){const c=coachOf(id);if(!c||!c.pro)return 0;return(c.pro.q-10)*.45*(c.pro.spec==='results'?1.35:1)}
function coachLambda(id){const s=coachOf(id)?.pro?.spec;return s==='attacking'?[1.07,1.03]:s==='defensive'?[.97,.91]:[1,1]}
function coachGrowth(id){const c=coachOf(id);if(!c||!c.pro)return 1;return 1+(c.pro.q-10)*.025+(c.pro.spec==='development'?.18:0)}
function tdNoise(id){const t=tdOf(id),eye=pq(t)+(t?.pro?.spec==='eye'?3:0);return clamp((20-eye)/7,.2,2.6)}
function tdBuyF(id){const t=tdOf(id),d=pq(t)+(t?.pro?.spec==='negotiator'?3:0);return clamp(1.18-d*.018,.82,1.15)}
function tdYouth(id){return tdOf(id)?.pro?.spec==='youth'}
/* what the player sees: an estimate, sharper for people at his own club */
function staffEstimate(pid){const p=P(pid);if(!p||!p.pro)return null;const off=p.club===S.my?Math.round(p.pro.off/2):p.pro.off;return clamp(p.pro.q+off,1,20)}
function staffStars(q){return Math.max(1,Math.min(5,Math.round(q/4)))}
function staffWeekK(id){return r2(((coachOf(id)?.pro?.wage)||0)/1000+((tdOf(id)?.pro?.wage)||0)/1000)}

/* ----- the pool of free coaches and directors ----- */
function staffPoolInit(){S.staffPool=[];staffPoolTopUp()}
function staffPoolTopUp(){
  for(const role of ['coach','td']){let n=S.staffPool.filter(i=>P(i).role===role).length;
    while(n++<POOL_SIZE[role]){const id=mkPerson(role,null,{age:ri(36,60)});giveProfile(id,role,pick([0,1,1,2,2]),{contract:0});S.staffPool.push(id)}}
}
function toPool(pid){const p=P(pid);if(!p)return;p.club=null;p.pro.contract=0;if(!p.pro.caretaker&&!S.staffPool.includes(pid))S.staffPool.push(pid)}
function caretaker(id,role){const pid=mkPerson(role,id,{age:ri(40,58)});giveProfile(pid,role,2,{q:ri(4,7),contract:0,caretaker:true,spec:role==='coach'?'results':'eye'});P(pid).pro.wage=60;return pid}
/* compensation to the club that loses its man; settlement for the man who is sacked */
function compensation(pid){const p=P(pid);if(!p||!p.club||p.pro.caretaker)return 0;return r1(p.pro.wage*SEASON_WEEKS*Math.max(1,p.pro.contract)/1000*.5)}
function settlement(pid){const p=P(pid);if(!p||p.pro.caretaker)return 0;return r1(p.pro.wage*SEASON_WEEKS*Math.max(0,p.pro.contract)/1000*.5)}
function appoint(id,role,pid,why){
  const c=CL(id),old=c.cast[role],p=P(pid),from=p.club&&p.club!==id?p.club:null;
  const comp=from?compensation(pid):0;if(comp){book(id,'staffpay',-comp);book(from,'staffpay',comp)}
  if(old&&old!==pid){const set=settlement(old);if(set)book(id,'staffpay',-set);toPool(old);P(old).career.push(id)}
  S.staffPool=S.staffPool.filter(x=>x!==pid);
  if(from){CL(from).cast[role]=caretaker(from,role);emit('StaffPoached',from,`${p.name} leaves ${CL(from).name} for ${c.name}. A caretaker steps in.`,{c2:id});if(aiRuns(from))aiHire(from,role,true)}
  p.club=id;p.role=role;p.career.push(id);p.pro.since=S.season;p.pro.caretaker=false;if(!p.pro.contract)p.pro.contract=2;p.pro.wage=Math.max(p.pro.wage,staffWage(role,p.pro.q));
  c.cast[role]=pid;
  emit('StaffHired',id,`${c.name} appoint ${p.name} as ${role==='coach'?'head coach':'director of football'}${why?` (${why})`:''}.`,{pid,role,comp});
}
function sackStaff(id,role,why){
  const c=CL(id),old=c.cast[role],p=P(old),set=settlement(old);if(set)book(id,'staffpay',-set);
  emit('StaffSacked',id,`${c.name} sack ${role==='coach'?'head coach':'director'} ${p.name}${why?` ${why}`:''}${set?` (£${set}k settlement)`:''}.`,{pid:old,role});
  toPool(old);c.cast[role]=caretaker(id,role);
}
/* candidates for a club: the free pool, plus people at clubs in the same or a lower division */
/* ambitious people do not join a club below their level: the ceiling is the division's best plus three */
function willJoin(id,pid){return P(pid).pro.q<=STAFF_Q[CL(id).tier][1]+3}
function staffCandidates(id,role){
  const out=S.staffPool.filter(i=>P(i).role===role&&willJoin(id,i)).map(pid=>({pid,from:null,comp:0}));
  for(const o of Object.keys(S.clubs)){if(o===id||CL(o).tier<CL(id).tier)continue;const pid=CL(o).cast[role];const p=P(pid);if(p&&p.pro&&!p.pro.caretaker&&willJoin(id,pid)&&p.pro.q>=pq(P(CL(id).cast[role]))-1)out.push({pid,from:o,comp:compensation(pid)})}
  return out.sort((a,b)=>staffEstimate(b.pid)-staffEstimate(a.pid)).slice(0,12);
}
/* ----- computer boards: sack after failure, hire the best they can pay ----- */
function aiStaffWeek(id){
  const w=S.week;if(w!==10&&w!==20)return;const c=CL(id),gap=posOf(id)-(c.expect||8);
  if(gap>=4&&chance(.3)){sackStaff(id,'coach','after a poor run');aiHire(id,'coach',true)} // mid-season: from the free pool only; poaching waits for the summer
}
/* computer boards prefer the free pool; they only poach from a lower division when that man is clearly better */
function aiHire(id,role,poolOnly){
  const inc=estSeasonIncome(id),cap=inc*.03/SEASON_WEEKS*1000*(role==='coach'?1:.8),f=F(id);
  const ok=x=>P(x.pid).pro.wage<=cap&&x.comp<=Math.max(0,f.cash-reserveK(id))*.3;
  const all=staffCandidates(id,role).filter(ok),pool=all.filter(x=>!x.from),best=pool[0];
  const poach=poolOnly?null:all.find(x=>x.from&&CL(x.from).tier>CL(id).tier&&(!best||staffEstimate(x.pid)>=staffEstimate(best.pid)+3));
  const pickC=poach||best;if(pickC)appoint(id,role,pickC.pid,null);
}
function staffSeasonEnd(){
  for(const id in S.clubs){const c=CL(id),pos=posOf(id);
    for(const role of ['coach','td']){const p=P(c.cast[role]);if(!p||!p.pro)continue;
      p.pro.record.push({club:id,s:S.season,tier:c.tier,pos});if(p.pro.record.length>12)p.pro.record.shift();p.pro.contract--;
      if(id===S.my&&!S.auto){if(p.pro.contract<=0&&!p.pro.caretaker){emit('StaffLeft',id,`${p.name} leaves at the end of his contract.`,{pid:p.id,role});toPool(p.id);c.cast[role]=caretaker(id,role)}continue}
      const gap=pos-(c.expect||8);
      if(p.pro.caretaker||(role==='coach'&&gap>=3&&chance(.45))||(role==='td'&&gap>=5&&chance(.3))){if(!p.pro.caretaker)sackStaff(id,role,'in the summer');aiHire(id,role)}
      else if(p.pro.contract<=0){p.pro.contract=ri(1,3);p.pro.wage=Math.round(p.pro.wage*1.08/5)*5}
    }}
  for(const pid of S.staffPool.slice()){const p=P(pid);p.age++;if(p.age>68){S.staffPool=S.staffPool.filter(x=>x!==pid)}}
  staffPoolTopUp();
  // people who no longer play any part (out of football, past 68, not in the pool or a club) leave the save
  const used=new Set(S.staffPool);for(const id in S.clubs)for(const r in CL(id).cast)used.add(CL(id).cast[r]);
  for(const pid in S.P){const p=S.P[pid];if(!used.has(pid)&&!p.club&&p.age>68){delete S.P[pid]}}
  for(const pid in S.P){const p=S.P[pid];p.rel=p.rel.filter(r=>S.P[r.id])}
}
function staffAfterLoad(){
  if(!S.staffPool||!S.staffPool.length){S.staffPool=S.staffPool||[];staffPoolTopUp()}
  for(const id in S.clubs)for(const role of ['coach','td']){const pid=CL(id).cast[role];if(pid&&P(pid)&&!P(pid).pro)giveProfile(pid,role,CL(id).tier)}
}

defCommand('HireStaff',{check:(id,a)=>{if(!['coach','td'].includes(a.role))return'Unknown role';const c=staffCandidates(id,a.role).find(x=>x.pid===a.pid);if(!c)return'Not available';
  const cost=c.comp+settlement(CL(id).cast[a.role]);if(F(id).cash-cost<-creditLimit(id))return'The bank will not cover this';return null},
  run:(id,a)=>appoint(id,a.role,a.pid)});
defCommand('SackStaff',{check:(id,a)=>{const p=P(CL(id).cast[a.role]);if(!p)return'Nobody to sack';if(p.pro.caretaker)return'A caretaker cannot be sacked; appoint someone';return null},run:(id,a)=>sackStaff(id,a.role)});
defCommand('RenewStaff',{check:(id,a)=>{const p=P(CL(id).cast[a.role]);if(!p||p.pro.caretaker)return'Nobody to renew';if(p.pro.contract>1)return'The contract runs for more than a season';return null},
  run:(id,a)=>{const p=P(CL(id).cast[a.role]);p.pro.contract=2;p.pro.wage=Math.round(p.pro.wage*1.1/5)*5;emit('StaffRenewed',id,`${p.name} signs for two more seasons (£${p.pro.wage} a week).`,{pid:p.id})}});

/* ---- club/commercial.js ---- */
/* ================= Club: the season budget, sponsors and members' financing =================
   Owns F(id).budget (the season plan), F(id).sponsor / offers / naming (commercial deals) and the members' funding
   (bonds, fundraising, the ground sold and leased back). Money still moves only through book(); the squad frame
   (F(id).policy) stays the one source the director works to. The statute (CL(id).statute) limits what a board may do. */
const SPONSOR_NAMES=['Holloway Haulage','Marsh & Daughters','Kestrel Bakeries','North Fen Energy','Brackwater Building Society','Cragside Motors','Ironbridge Insurance','Tarn Valley Dairy','Saltmere Ales','Penhallow Print','Greystone Quarries','Fellside Foods','Harbourline Ferries','Moorgate Joinery'];
const STATUTE_SALE='Members approve any sale above £50k',STATUTE_PRICES='Ticket prices are set by the members';
function hasStatute(id,s){return CL(id).statute.includes(s)}
/* ----- the season plan: what the board expects, and how the season is going against it ----- */
function wageRatio(id){const p=F(id).policy;return p.wageR??WAGE_RATIO[p.wage]}
function setBudget(id,season){
  const f=F(id),inc=estSeasonIncome(id);
  const build=G(id).projects.filter(p=>p.phase!=='done').reduce((a,p)=>a+Math.max(0,p.cost*(1+p.over/100)-p.paid),0);
  f.budget={s:season,income:Math.round(inc),wages:Math.round(wageCapK(id)*SEASON_WEEKS),staff:Math.round(staffWeekK(id)*SEASON_WEEKS),depts:Math.round(deptCost(id)*SEASON_WEEKS),
    build:Math.round(build),transfers:budgetFor(id),loans:Math.round(f.loans.reduce((a,l)=>a+l.pay,0)*SEASON_WEEKS)};
}
function setBudgetsAll(season){for(const id in S.clubs)setBudget(id,season)}
function budgetRows(id){
  const f=F(id),b=f.budget,L=f.season,w=Math.max(1,S.week),proj=v=>v*SEASON_WEEKS/w;
  const inc=Object.keys(L).filter(k=>L[k]>0&&!['loanIn','feesIn','groundSale'].includes(k)).reduce((a,k)=>a+L[k],0);
  const rows=[['Income',b.income,inc,true],['Player wages',-b.wages,L.wages||0,false],['Coach and director',-b.staff,L.staff||0,false],['Departments',-b.depts,L.depts||0,false],['Building',-b.build,L.build||0,false],['Transfers (net)',-b.transfers,(L.feesOut||0)+(L.feesIn||0),false]];
  const once=['seasontix','cupgate','cupprize','fundraising','prize'].reduce((a,k)=>a+Math.max(0,L[k]||0),0),prizeEst=L.prize?0:PRIZE[CL(id).tier][0]*.6;
  const incProj=(inc-once)*SEASON_WEEKS/w+once+prizeEst; // one-off income counts once, not thirty times
  return rows.map(([n,plan,now,isInc])=>{const p=isInc?incProj:n==='Building'||n.startsWith('Transfers')?now:proj(now);return{n,plan,now:r1(now),proj:r1(p),over:isInc?p<plan*.92:p<plan*1.05-1}})
}
function budgetWarnings(id){
  const out=[],f=F(id),b=f.budget;if(!b||!S.week)return out;
  const w=S.week,wg=wageBillK(id)*SEASON_WEEKS;if(wg>b.wages*1.05)out.push(`The wage bill is ${Math.round((wg/b.wages-1)*100)}% over budget.`);
  const ext=-((f.season.feesOut||0));if(b.transfers&&ext>b.transfers*1.05)out.push('Transfer spending is over budget.');
  const inc=budgetRows(id)[0].proj;
  if(w>=6&&inc<b.income*.9)out.push(`Income is tracking ${Math.round((1-inc/b.income)*100)}% below plan.`);
  return out;
}
/* ----- sponsors: one main deal, local partners, and sometimes naming rights for the ground ----- */
function sponsorBase(id){const c=CL(id),t=c.tier,g=groundSignals(id);return SPONSOR[t]*Math.pow(c.support/[3000,1700,850][t],.5)*(1+g.media*.03)*(.7+.3*g.sales)*(.85+.3*(c.rep??50)/100)}
function sponsorOffers(id){
  const b=sponsorBase(id)*.65,names=pickN(SPONSOR_NAMES,3),exp=Math.max(30,(CL(id).expect?(17-CL(id).expect)*3+20:45));
  const offers=[{name:names[0],kind:'fixed',years:3,perWeek:r2(b*.95)},{name:names[1],kind:'fixed',years:1,perWeek:r2(b*1.08)},{name:names[2],kind:'bonus',years:2,perWeek:r2(b*.42),perPoint:r2(b*.56*SEASON_WEEKS/exp)}];
  if(!F(id).naming&&chance(.35))offers.push({name:pick(SPONSOR_NAMES),kind:'naming',years:3,perWeek:r2(sponsorBase(id)*.45)});
  return offers;
}
function signSponsor(id,o){
  const f=F(id);
  if(o.kind==='naming'){f.naming={...o,until:S.season+o.years-1};emit('Naming',id,`${CL(id).ground} is renamed the ${o.name} Stadium for ${o.years} seasons (£${n0w(o.perWeek)}k a week).`)}
  else{f.sponsor={...o,until:S.season+o.years-(S.week>0?0:1)};emit('Sponsor',id,`${o.name} sign as main sponsor of ${CL(id).name} for ${o.years} season${o.years>1?'s':''}${o.kind==='bonus'?' (paid partly by results)':''}.`)}
  f.offers=(f.offers||[]).filter(x=>x!==o&&(o.kind==='naming'?x.kind!=='naming':x.kind==='naming'));
}
function n0w(v){return Math.round(v*10)/10}
/* AI boards pick by their chairman's values: money takes the long fixed deal, glory bets on results */
function aiSponsor(id){const f=F(id),v=chairValue(id),of=f.offers||[];if(!of.length)return;
  const main=of.filter(o=>o.kind!=='naming');if(main.length&&(!f.sponsor||f.sponsor.until<S.season+1))signSponsor(id,v==='money'?main[0]:v==='glory'?main.find(o=>o.kind==='bonus')||main[0]:main[1]||main[0]);
  const nm=(f.offers||[]).find(o=>o.kind==='naming');if(nm&&v==='money'&&!hasStatute(id,STATUTE_SALE))signSponsor(id,nm);
  f.offers=[];}
function sponsorWeekK(id){const f=F(id),s=f.sponsor;return r2(s&&s.until>=S.season?s.perWeek:sponsorBase(id)*.65*.4)}
function namingWeekK(id){const n=F(id).naming;return n&&n.until>=S.season?n.perWeek:0}
function partnersWeekK(id,form){const c=CL(id),t=c.tier,g=groundSignals(id);return SPONSOR[t]*.35*Math.pow(c.support/[3000,1700,850][t],.5)*(1+g.media*.03)*(form??1)*(.4+.6*g.sales)}
/* summer: expiring deals make way for new offers (the player chooses; computer boards choose at once) */
function commercialSeasonEnd(){
  for(const id in S.clubs){const f=F(id);
    if(f.naming&&f.naming.until<S.season+1){emit('Naming',id,`The naming deal for ${CL(id).ground} ends.`);f.naming=null}
    if(!f.sponsor||f.sponsor.until<S.season+1){f.offers=sponsorOffers(id);if(f.sponsor&&id===S.my)emit('Sponsor',id,`${f.sponsor.name}'s deal ends. Three companies have made offers.`);f.sponsor=null}
    else if(!f.naming&&chance(.15))f.offers=sponsorOffers(id).filter(o=>o.kind==='naming');
    if(aiRuns(id))aiSponsor(id);
  }
}
function commercialInit(id){const f=F(id),o=sponsorOffers(id).filter(x=>x.kind!=='naming');const pickO=pick(o);f.sponsor={...pickO,until:S.season+ri(0,2)};f.offers=[];f.naming=null;f.fundLast=-9;f.groundSold=null;f.bondSeason=-9}

/* ----- members' financing ----- */
function bondCap(id){const m=M(id);return Math.max(0,Math.round(m.count*.15*(m.conf/100)*(CL(id).tier===0?1.4:1)))}
function bondRate(id){return r2(.03+(60-M(id).conf)*.0004)}
function fundraiseYield(id){const m=M(id),recent=S.season-F(id).fundLast<2;return Math.round(m.count*.025*(.5+m.conf/100)*(recent?.45:1))}
function groundValue(id){return Math.round(groundSignals(id).capacity*.11*[1.4,1,.75][CL(id).tier])}
function rentWeekK(id){const g=F(id).groundSold;return g?g.rent:0}
defCommand('SignSponsor',{check:(id,a)=>{const o=(F(id).offers||[])[a.i];if(!o)return'That offer has gone';if(o.kind==='naming'&&hasStatute(id,STATUTE_SALE)&&M(id).conf<55)return'The members would vote down naming rights';return null},
  run:(id,a)=>{const o=F(id).offers[a.i];signSponsor(id,o);if(o.kind==='naming')confLog(id,-4,'The ground renamed after a sponsor')}});
defCommand('IssueBond',{check:(id,a)=>{const f=F(id);if(f.bondSeason===S.season)return'One members\' bond a season';if(!(a.amount>0)||a.amount>bondCap(id))return`Members will lend at most £${bondCap(id)}k`;return null},
  run:(id,a)=>{const f=F(id),r=bondRate(id);f.loans.push(mkLoan(a.amount,5,r,'Members\' bond (5 years)'));book(id,'loanIn',a.amount);f.bondSeason=S.season;confLog(id,1.5,'Members invested in the club');
    emit('Bond',id,`${CL(id).name} raise £${a.amount}k from a members' bond at ${Math.round(r*1000)/10}%.`)}});
defCommand('Fundraise',{check:(id)=>F(id).fundLast===S.season?'One appeal a season':null,
  run:(id)=>{const f=F(id),y=fundraiseYield(id),recent=S.season-f.fundLast<2;book(id,'fundraising',y);f.fundLast=S.season;if(recent)confLog(id,-3,'Another appeal for money');
    emit('Fundraising',id,`A members' appeal raises £${y}k${recent?' (donors are tiring)':''}.`);return y}});
defCommand('SellGround',{check:(id)=>{if(F(id).groundSold)return'The ground is already sold';if(hasStatute(id,STATUTE_SALE)&&M(id).conf<60)return'The statute needs the members\' approval, and they would refuse';return null},
  run:(id)=>{const v=groundValue(id),f=F(id);f.groundSold={value:v,rent:r2(v*.075/SEASON_WEEKS),s:S.season};book(id,'groundSale',v);confLog(id,-15,'The ground was sold');
    emit('GroundSold',id,`${CL(id).name} sell ${CL(id).ground} for £${v}k and lease it back (£${n0w(f.groundSold.rent)}k a week).`)}});
defCommand('BuyBackGround',{check:(id)=>{const g=F(id).groundSold;if(!g)return'The club owns its ground';if(F(id).cash<g.value*1.1)return`Buying it back costs £${Math.round(g.value*1.1)}k`;return null},
  run:(id)=>{const g=F(id).groundSold;book(id,'groundSale',-Math.round(g.value*1.1));F(id).groundSold=null;confLog(id,10,'The ground is ours again');emit('GroundBought',id,`${CL(id).name} buy back their ground.`)}});
/* a computer board in trouble asks its members first */
function aiFunding(id){const f=F(id);if(f.cash>=-creditLimit(id)*.5)return;
  const cap=bondCap(id);if(f.bondSeason<S.season-1&&cap>=10&&M(id).conf>=50)cmd('IssueBond',id,{amount:Math.round(cap*.6)},'ai');else if(f.fundLast<S.season-1)cmd('Fundraise',id,{},'ai')}
function commercialAfterLoad(){for(const id in S.clubs){const f=F(id);if(f.fundLast==null)commercialInit(id);if(!f.budget||f.budget.s!==S.season)setBudget(id,S.season)}}

/* ---- club/projects.js ---- */
/* ================= Club: major projects, history, records and signals =================
   Major projects: extra land for the complex and a new stadium (a multi-season project). They reuse the ground's
   project machine (permit, builder, weekly payments through finance) and finish into a new ground.
   History: per-season records on CL(id).hist and S.records[id]. Signals: what needs the chairman's attention. */
const STADIUM_SIZE={compact:{n:'Compact new ground',f:1.4,min:1500,weeks:40},standard:{n:'New stadium',f:2,min:2500,weeks:55},grand:{n:'Grand new stadium',f:3,min:4000,weeks:70}};
const PLOT_MAX=9;
function plotPrice(id){const g=G(id),extra=Math.max(0,g.plots.length-6);return Math.round([90,60,40][CL(id).tier]*Math.pow(1.3,extra))}
function stadiumPlan(id,size){const sg=groundSignals(id),z=STADIUM_SIZE[size],cap=Math.round(Math.max(sg.capacity*z.f,sg.capacity+z.min)/100)*100;
  return{size,cap,cost:Math.round(cap*[.16,.12,.09][CL(id).tier]),weeks:z.weeks,deposit:Math.round(cap*[.16,.12,.09][CL(id).tier]*.15),label:z.n}}
function stadiumProject(id){return G(id).projects.find(p=>p.key.startsWith('stadium:')&&p.phase!=='done')}
function startStadium(id,size){
  const g=G(id),pl=stadiumPlan(id,size);book(id,'build',-pl.deposit);
  const p={id:g.next++,key:'stadium:new:'+size,target:'stadium',label:pl.label+` (${n0s(pl.cap)} places)`,offer:'standard',cost:pl.cost-pl.deposit,over:chance(.25)?ri(5,20):0,delay:chance(.25)?ri(3,10):0,
    phase:'permit',left:ri(8,16),weeks:pl.weeks,paid:0,started:[S.season,S.week],cap:pl.cap};
  g.projects.push(p);emit('NewStadium',id,`${CL(id).name} start work on a ${pl.label.toLowerCase()} for ${n0s(pl.cap)} (£${pl.cost}k, about ${Math.ceil(pl.weeks/SEASON_WEEKS)} seasons).`,{cap:pl.cap,cost:pl.cost});
  return p;
}
function n0s(v){return Math.round(v).toLocaleString('en-GB')}
/* the move: new stands, better facilities, the old ground sold (or the lease ended), a bigger crowd */
function finishStadium(id,p){
  const g=G(id),c=CL(id),f=F(id),cap=p.cap,oldValue=groundValue(id);
  const seatsShare=.55,seated=Math.round(cap*seatsShare),terrace=cap-seated;
  g.sides={N:{type:'terrace',rings:Math.max(1,Math.round(terrace*.5/RING.terrace)),roof:2,cond:100},E:{type:'seated',rings:Math.max(1,Math.round(seated*.35/RING.seated)),roof:2,cond:100},
    S:{type:'terrace',rings:Math.max(1,Math.round(terrace*.5/RING.terrace)),roof:2,cond:100},W:{type:'seated',rings:Math.max(1,Math.round(seated*.65/RING.seated)),roof:2,cond:100}};
  const lv=Math.max(2,Math.ceil((cap-1400)/1200));g.fac.access.lv=Math.max(g.fac.access.lv,lv);g.fac.safety.lv=Math.max(g.fac.safety.lv,lv);
  for(const k of ['lights','catering','media','screen','business'])g.fac[k].lv=Math.min(8,g.fac[k].lv+2);for(const k in g.fac)g.fac[k].cond=100;
  g.pitch={...g.pitch,lv:Math.min(8,g.pitch.lv+1),drain:Math.min(8,g.pitch.drain+2),cond:100};
  if(f.groundSold){f.groundSold=null;emit('GroundBought',id,`The lease on the old ground ends.`)}else book(id,'groundSale',oldValue);
  c.ground=`${c.name.split(' ')[0]} Stadium`;c.support=Math.round(c.support*1.1);
  p.phase='done';p.done=[S.season,S.week];
  emit('StadiumOpened',id,`${c.name} move into ${c.ground}: ${n0s(groundSignals(id).capacity)} places.`,{cap});
  if(S.members&&S.members[id])confLog(id,8,'A new stadium');
}
/* AI: a full big club with money to spare builds a new ground (rarely) */
function aiStadium(id){const c=CL(id),f=F(id);if(S.week!==4||stadiumProject(id)||c.tier>1)return;const a=f.lastGate;if(!a||a.fill<.97)return;
  const pl=stadiumPlan(id,'standard');if(f.cash>pl.cost*.45&&chance(.3))cmd('StartStadium',id,{size:'standard'},'ai')}

/* ----- history and records ----- */
function recordsInit(){return{bigWin:null,crowd:null,topSeason:null}}
function recordsWeek(matches){
  for(const m of matches)for(const [id,gf,ga,opp] of [[m.h,m.gh,m.ga,m.a],[m.a,m.ga,m.gh,m.h]]){const r=S.records[id];if(!r)continue;
    if(gf-ga>0&&(!r.bigWin||gf-ga>r.bigWin.gf-r.bigWin.ga||(gf-ga===r.bigWin.gf-r.bigWin.ga&&gf>r.bigWin.gf)))r.bigWin={gf,ga,opp,s:S.season,w:S.week};
    if(id===m.h&&m.att&&(!r.crowd||m.att>r.crowd.n))r.crowd={n:m.att,opp,s:S.season}}
}
function cupReached(id){const log=S.cup.log.filter(l=>l.h===id||l.a===id);if(!log.length)return null;const last=log[log.length-1];return S.cup.winner===id?'Winners':CUP_ROUND[last.r]+(last.w===id?'':' (out)')}
function topScorer(id){const p=S.squads[id].filter(x=>!x.loan).slice().sort((a,b)=>b.sGoals-a.sGoals)[0];return p&&p.sGoals?{name:p.name,goals:p.sGoals}:null}
function honours(id){const h=CL(id).hist;return{titles:h.filter(x=>x.pos===1).map(x=>({s:x.s,tier:x.tier})),promotions:h.filter((x,i)=>x.tier>0&&x.pos<=2).length,cups:S.hist.filter(x=>x.cup===id).map(x=>x.s)}}

/* ----- signals: what needs attention, each linked to the screen where the chairman acts ----- */
function signals(id){
  const out=[],f=F(id),g=G(id),sq=S.squads[id],m=M(id);
  if(S.week>=18){const end=sq.filter(p=>p.contract===1&&!p.loan&&p.q>=squadQuality(sq)-.5);if(end.length)out.push({lv:2,text:`${end.length} key player${end.length>1?'s':''} out of contract this summer`,act:'tab',arg:'squad'})}
  const ref=sq.filter(p=>p.wantsOut);if(ref.length)out.push({lv:2,text:`${ref[0].name}${ref.length>1?` and ${ref.length-1} more`:''} want${ref.length>1?'':'s'} to leave`,act:'tab',arg:'squad'});
  for(const role of ['coach','td']){const p=P(CL(id).cast[role]);if(p&&p.pro){if(p.pro.caretaker)out.push({lv:3,text:`A caretaker is in charge as ${role==='coach'?'head coach':'director'}`,act:'staff',arg:role});else if(p.pro.contract<=1&&S.week>=15)out.push({lv:1,text:`The ${role==='coach'?'head coach':'director'}'s contract ends this season`,act:'staff',arg:role})}}
  const w=groundCondWorst(id);if(w.c<40)out.push({lv:w.c<30?3:2,text:`${w.n} is at ${Math.round(w.c)}%: repair before inspectors close it`,act:'ctab',arg:'ground'});
  const fc=cashForecast(id);if(fc.minV<-creditLimit(id)*.5)out.push({lv:3,text:`The cash forecast dips to ${k1v(fc.minV)} in ${fc.minW} weeks`,act:'tab',arg:'money'});
  for(const t of budgetWarnings(id))out.push({lv:2,text:t,act:'tobudget'});
  if((f.offers||[]).length)out.push({lv:2,text:`${f.offers.length} sponsor offer${f.offers.length>1?'s':''} waiting`,act:'mtabgo',arg:'sponsors'});
  if(!f.sponsor||f.sponsor.until<S.season)out.push({lv:2,text:'No main sponsor: sign one',act:'mtabgo',arg:'sponsors'});
  if(m.conf<45)out.push({lv:3,text:`Members' confidence is ${Math.round(m.conf)}: an AGM today would be close`,act:'ctab',arg:'members'});
  const sp=stadiumProject(id);if(sp&&sp.phase==='build'&&sp.left<=5)out.push({lv:1,text:`The new stadium opens in ${sp.left} weeks`,act:'ctab',arg:'ground'});
  return out.sort((a,b)=>b.lv-a.lv);
}

/* ================= Simulation: rule-based club boards =================
   Every computer-run club decides through the same commands as the player (cmd(..., 'ai')): repairs, building,
   ticket prices and department budgets. The chairman's value colours the choices (money: careful, glory: bold).
   With S.auto the player's club is run by these rules too (used by the long simulation tests). */
function aiRuns(id){return id!==S.my||S.auto}
function reserveK(id){return wageBillK(id)*6+10}
function aiBoardWeek(id){
  const f=F(id),g=G(id),w=S.week,v=chairValue(id),res=reserveK(id);
  // the squad policy follows the money: rich boards spend, poor boards cut
  if((w===1||w===WINTER_WEEK)&&!(w===WINTER_WEEK&&f.push===S.season)){const inc=estSeasonIncome(id),base=v==='glory'?'ambitious':v==='money'?'tight':'normal';
    const pol=f.cash<res?'tight':f.cash>inc*1.1?'allin':f.cash>inc*.5?(base==='tight'?'normal':'ambitious'):base;
    cmd('SetSquadPolicy',id,{wage:pol,spend:f.cash>inc*.5?.8:v==='money'?.3:.5},'ai')}
  // staff: richer boards hire, poor boards cut (one department at a time, start of each quarter)
  if(w%8===1){const inc=estSeasonIncome(id),want=clamp(STAFF_DEF[CL(id).tier]+(f.cash>inc*.5?1:0)+(f.cash>inc*1.1?1:0)-(f.cash<res*.5?1:0),1,5);
    const ks=Object.keys(g.depts).filter(k=>!g.depts[k].hiring&&g.depts[k].staff!==want);if(ks.length){const k=pick(ks),x=g.depts[k];cmd('SetDeptStaff',id,{dept:k,level:x.staff<want?x.staff+1:x.staff-1},'ai')}}
  aiFunding(id);
  // ambition: a glory-seeking board borrows to push for promotion when it looks within reach (and may overreach)
  if(w===1&&v==='glory'&&CL(id).tier>0&&(CL(id).expect||9)<=5&&debt(id)<estSeasonIncome(id)*.3){const amt=Math.min(maxNewLoan(id),Math.round(estSeasonIncome(id)*.3));
    if(amt>=20&&cmd('TakeLoan',id,{amount:amt,years:5},'ai').ok){cmd('SetSquadPolicy',id,{wageR:1.05,spend:.9},'ai');f.push=S.season}} // a push for promotion is not reined in at mid-season
  // department budgets follow the cash
  const want=f.cash<0?'tight':f.cash>res*3?'normal':f.cash<res*.5?'tight':'normal';
  for(const d in g.depts)if(g.depts[d].budget!==want)cmd('SetDeptBudget',id,{dept:d,level:want},'ai');
  // ticket prices: raise when full, lower when half empty
  if(w===2||w===12||w===22){const a=f.lastGate;if(a){const pr=f.prices,ref=PRICE_DEF[CL(id).tier];
    if(a.fill>.95&&pr.terrace<ref.terrace*1.6){cmd('SetPrice',id,{kind:'terrace',delta:1},'ai');cmd('SetPrice',id,{kind:'seated',delta:1},'ai')}
    else if((a.fill<.55||M(id).conf<40)&&pr.terrace>ref.terrace*.7){cmd('SetPrice',id,{kind:'terrace',delta:-1},'ai');cmd('SetPrice',id,{kind:'seated',delta:-1},'ai')}}}
  // repairs before anything falls apart
  if(w%5===3){for(const r of repairList(id).filter(x=>x.cond<45))if(f.cash-r.cost>res)cmd('Repair',id,{key:r.key},'ai')}
  // one building project at a time, only with money to spare
  const running=g.projects.filter(p=>p.phase!=='done').length;
  if((w===4||w===14||w===24)&&(running===0||(running<3&&f.cash>estSeasonIncome(id)*.6))){
    const o=aiPickProject(id);
    if(o){const offer=v==='money'?'cheap':v==='glory'?'premium':'standard',cost=o.cost*OFFER[offer].p;
      if(f.cash-cost>res*(v==='glory'?.8:1.3))cmd('StartProject',id,{key:o.key,offer},'ai')}}
}
function aiPickProject(id){
  const cat=projectCatalog(id).filter(o=>!o.busy),f=F(id),sg=groundSignals(id),g=G(id),has=k=>g.plots.some(p=>p.kind===k);

  if(f.lastGate&&f.lastGate.fill>.9){if(sg.limitedBy)return by('fac:'+sg.limitedBy);const s=Object.keys(g.sides).find(k=>g.sides[k].type==='terrace')||'N';return by('side:'+s+':ring')}

  if(!has('medical')&&free>=0&&CL(id).tier<=1)return by('plot:'+free+':medical');

/* ---- sim/clock.js ---- */
/* ================= Simulation: the one clock =================
   advanceWeek() is the only way time moves. The order is fixed and documented in docs/ARCHITECTURE.md:
   1 injuries and recovery → 2 matches (league + cup) → 3 development → 4 money and building (per club)
   → 5 boards and directors (windows, renewals) → 6 week closed. closeSeason() runs once after week 30.
   Higher layers (staff, story, dynasty) hook in through S.layers and the event log, never by moving time. */
const WINTER_WEEK=15,RENEW_WEEK=24;

function allIds(){return Object.keys(S.clubs)}
function advanceWeek(){
  if(S.phase!=='season'||S.week>=SEASON_WEEKS)return null;
  S.week++;const w=S.week,ids=allIds();
  const mark=S.evn||0;
  const matches=playWeekMatches(w);
  for(const id of ids)playersWeek(id);
  for(const id of ids)lifeWeek(id);
  for(const id of ids)financeWeek(id,matches.filter(m=>m.h===id||m.a===id));
  recordsWeek(matches);
  for(const id of ids)membersWeek(id,matches.filter(m=>m.h===id||m.a===id));
  for(const id of ids){if(aiRuns(id)){aiBoardWeek(id);aiStaffWeek(id);aiStadium(id)}}
  if(w===WINTER_WEEK)for(const id of shuffle(ids.slice()))squadManager(id,'winter');
  if(w===RENEW_WEEK)for(const id of ids)renewals(id);
  membersOnEvents(eventsSince(mark));
  emit('WeekClosed',null,`Week ${w} played.`);
  for(const f of HOOKS.weekClosed)f(w);
  return eventsSince(mark);
}
function seasonOver(){return S.phase!=='season'||S.week>=SEASON_WEEKS}
function closeSeason(){
  if(S.phase!=='season'||S.week<SEASON_WEEKS)return null;
  const ids=allIds(),s=S.season,tables={};
  // the AGM comes first: targets, promotion and relegation are judged on the final table
  const outIds=holdAGMs(),agm=S.my?{...M(S.my).agm,club:S.my}:null;afterAGMs(outIds);
  for(const t of TIERS){tables[t]=standings(t);tables[t].forEach((id,i)=>{financeSeasonEnd(id,i+1,t);CL(id).hist.push({s,tier:t,pos:i+1,pts:S.tbl[id].pts,top:topScorer(id),cup:cupReached(id),you:id===S.my})})}
  // support grows with success, promotion and the clubhouse; shrinks with failure
  for(const id of ids){const c=CL(id),pos=posOf(id),exp=c.expect||8,sg=groundSignals(id);
    c.support=Math.round(clamp(c.support*(1+.025*(exp-pos)/8+.004*sg.community),250,9000))}
  repSeasonEnd();
  const moves=promoteRelegate();
  for(const m of moves){const c=CL(m.id);c.support=Math.round(c.support*(m.to<m.from?1.08:.93))}
  S.hist.push({s,tables,cup:S.cup.winner,moves:moves.map(m=>({...m})),agm,chairsOut:outIds.filter(i=>i!==S.my)});
  for(const id of ids){const st=S.stats[id];st.prev={inj:st.inj,injWeeks:st.injWeeks,youthGrowth:st.youthGrowth};st.inj=0;st.injWeeks=0;st.youthGrowth=0}
  commercialSeasonEnd();
  returnLoans();
  for(const id of ids)playersSeasonEnd(id);
  S.qref=r2(S.qref*.7+worldQuality()*.3);
  faSummer();
  setBudgetsAll(s+1);
  const order=shuffle(ids.slice()).sort((a,b)=>F(b).cash-F(a).cash);
  for(const pass of [0,1])for(const id of order)squadManager(id,'summer');
  for(const id of order)loanOut(id);
  for(const id of ids)groundSeasonEnd(id);
  staffSeasonEnd();

  for(const f of HOOKS.seasonClosed)f(s);

}

/* ================= Core: savegames with a schema version and migrations =================
   The whole world is one JSON object S. A save carries S.v; load() runs every migration from that version up to
   VERSION, in order. Rule: no VERSION bump without a migration and a test (tests/save-test.js). */
const MIGRATIONS={
  // 1 → 2: eight departments with staff levels (medical and grounds split off), season statistics per club
  2:s=>{for(const id in s.grounds){const d=s.grounds[id].depts,t=s.clubs[id].tier;
      d.medical=d.medical||{budget:d.training.budget,course:'prevention',pending:null,settle:0};
      d.grounds=d.grounds||{budget:d.matchday.budget,course:'stadium',pending:null,settle:0};
      for(const k in d){d[k].staff=d[k].staff??[3,2,1][t];d[k].hiring=d[k].hiring??null}}
    s.stats=s.stats||{};for(const id in s.clubs)s.stats[id]=s.stats[id]||{inj:0,injWeeks:0,youthGrowth:0,intake:0,intakeBest:0};
    s.v=2;},
  // 2 → 3: members, dues, confidence and season targets per club; the chairman's career
  3:s=>{s.members=s.members||{};for(const id in s.clubs){const c=s.clubs[id];s.members[id]=s.members[id]||{count:Math.round(c.support*.4),dues:[50,40,30][c.tier],conf:55,log:[],goals:[],goalsSeason:0,agm:null}}
    s.career=s.career||(s.my?[{club:s.my,from:1,to:null,why:null}]:[]);s.rep=s.rep||0;s.votedOut=s.votedOut||null;s.v=3;},
  // 3 → 4: head coaches and directors get a professional profile; the free pool is filled after loading (staffAfterLoad)
  4:s=>{s.staffPool=s.staffPool||[];s.v=4;},
  // 4 → 5: season budget, sponsor deals, members' financing (filled after loading: commercialAfterLoad)
  5:s=>{s.v=5;},
  // 5 → 6: player morale, cards, loans and transfer requests; club reputation
  6:s=>{const d=p=>{p.morale??=60;p.yel??=0;p.susp??=0;p.tired??=0;p.played??=0;p.loan??=null;p.wantsOut??=false;p.lowWeeks??=0};
    for(const id in s.squads)s.squads[id].forEach(d);(s.fa||[]).forEach(d);
    for(const id in s.clubs){const c=s.clubs[id];c.rep??=Math.round(Math.max(10,Math.min(95,[68,48,28][c.tier]+(c.support-[3000,1700,850][c.tier])/120)))}
    for(const id in s.fin)s.fin[id].policy.loans??=true;s.v=6;},
  // 6 → 7: club records and richer season history (filled after loading: projectsAfterLoad)
  7:s=>{s.records=s.records||{};s.v=7;}

function migrate(s){
  if(!s||typeof s.v!=='number'||s.v<1)throw new Error('Not a Northmarch layered save');
  if(s.v>VERSION)throw new Error('This save comes from a newer version of the game');
  while(s.v<VERSION){const m=MIGRATIONS[s.v+1];if(!m)throw new Error('No migration to version '+(s.v+1));m(s);}
  return s;
}

  return`<header class="top">${crest}<div class="tg"><div class="club">${esc(c.name)}</div><div class="sub">Season ${S.season} · ${S.week?'Week '+S.week:'Pre-season'} · ${TIER_NAME[c.tier]}</div></div><span class="pill ${F(S.my).cash<0?'bad':''}">${k1(F(S.my).cash)}</span></header>
  <nav class="nav" aria-label="Sections">${[['week','Week'],['club','Club'],['squad','Squad'],['money','Money'],['table','League']].map(([k,n])=>`<button class="${UI.tab===k?'on':''}" data-act="tab" data-arg="${k}" aria-current="${UI.tab===k?'page':'false'}">${n}</button>`).join('')}</nav>`;
}
function render(){
  if(!HAS_DOM)return;const app=document.getElementById('app');let h='';
  if(!S||UI.title)h=titleView();
  else if(UI.review)h=reviewView();
  else if(S.phase==='choose')h=chooseView();
  else{const body=UI.tab==='table'?tableView():UI.tab==='squad'?squadView():UI.tab==='club'?clubView():UI.tab==='money'?moneyView():weekView();h=topBar()+`<main class="withbar">${body}</main>`+actionBar()}
  if(S&&UI.over)h+=overlayView();
  app.innerHTML=h;
  document.body.style.overflow=UI.over?'hidden':'';
}

/* ----- title and the choice of club ----- */

  return`<main class="scene" style="padding-top:48px"><p class="eyebrow">The Northmarch</p><h1>Chairman</h1>
  <p class="voice">Forty-eight members' clubs, three divisions, one cup. The world runs whether you act or not.</p>
  <p class="muted">You are the elected chairman. Build the ground, keep the books, set the frame for your director of football, and live with what follows.</p>
  <div class="stack">${hasSave()?`<button class="btn" data-act="cont">Continue</button>`:''}<button class="btn ${hasSave()?'ghost':''}" data-act="new">New game</button></div>
  <p class="note">Layer 1–2 build: the living world and club management. Stories, staff and dynasties are switched off in this version.</p></main>`;
}
function chooseView(){
  const again=S.career.length>0,last=again?S.career[S.career.length-1]:null;
  const probs=again?S.seats.map(id=>`${strWord(id)} in ${TIER_NAME[CL(id).tier]}; ${moneyWord(id).toLowerCase()} finances.`):['A big club that has fallen behind its rivals.','The harbour club: proud, broke enough to matter.','A small club with a big crowd for its size.'];
  return`<main class="scene" style="padding-top:28px"><p class="eyebrow">${again?`Season ${S.season} · after ${esc(CL(last.club).name)}`:'Three open chairs'}</p><h2>${again?'Three clubs want you':'Where do you stand for election?'}</h2>
  <p class="muted">${again?`${esc(last.why||'Your term ended')}. The world kept turning; pick your next club.`:'Each club is a real club in the same world. Pick the one whose problem you want.'}</p>
  <div class="stack">${S.seats.map((id,i)=>{const c=CL(id),sg=groundSignals(id),f=F(id);return`<button class="deal" data-act="choose" data-arg="${id}"><span class="dt">${esc(c.name)}</span><span class="small muted">${probs[i]}</span>
    <dl><dt>Division</dt><dd>${TIER_NAME[c.tier]}</dd><dt>Squad</dt><dd>${strWord(id)}</dd><dt>Support</dt><dd>${n0(c.support)} · ground holds ${n0(sg.capacity)}</dd><dt>Money</dt><dd>${k1(f.cash)} in the bank${debt(id)?` · ${k1(debt(id))} debt`:''}</dd></dl></button>`}).join('')}</div></main>`;
}

/* ----- the week ----- */
/* what the chances said, from the match engine's own expected goals: no invented events */
function xgWord(m){const home=m.h===S.my,xf=home?m.lh:m.la,xa=home?m.la:m.lh,gf=home?m.gh:m.ga,ga=home?m.ga:m.gh,d=(gf-ga)-(xf-xa);return Math.abs(xf-xa)<.25?'an even game on chances':d>1.2?'we got more than the chances suggested':d<-1.2?'we deserved more than we got':xf>xa?'we created more':'they created more'}
function myMatches(){return(S.matches||[]).filter(m=>m.h===S.my||m.a===S.my)}
function headline(m){const home=m.h===S.my,gf=home?m.gh:m.ga,ga=home?m.ga:m.gh,opp=home?m.a:m.h,won=m.pens?m.pens===S.my:gf>ga;
  const cup=m.comp==='cup'?' in the cup':'';
  if(gf===ga&&!m.pens)return`Honours even with ${CL(opp).name}${cup}`;
  return won?(gf-ga>=3?`${C().name} run riot${cup}`:`${C().name} beat ${CL(opp).name}${cup}`):(ga-gf>=3?`Humbled by ${CL(opp).name}${cup}`:`${CL(opp).name} too strong${cup}`)}
function reportView(){
  const ms=myMatches();if(!S.week||!ms.length)return'';
  const evs=UI.lastEv.filter(e=>e.c===S.my&&['Injury','Return','ProjectCompleted','ProjectStarted','SafetyClosure','CashCrisis','ForcedSale','Administration','Renewed','Transfer','Signing','Released','Ground','LoanTaken','CupWon'].includes(e.t));
  const m=ms[0],f=F(S.my).last;
  return`<section class="echo" aria-label="The Northmarch Echo"><div class="mast"><b>THE NORTHMARCH ECHO</b><span>Week ${S.week}</span></div>
  <div class="head">${esc(headline(m))}</div>
  ${ms.map(m=>`<div class="fix"><b>${nm(m.h)}</b><span class="score">${m.gh}–${m.ga}</span><b>${nm(m.a)}</b></div>
  <p class="small muted" style="text-align:center">${m.comp==='cup'?esc(CUP_ROUND[m.round])+' · ':''}${m.att?n0(m.att)+' watching':''}${m.pens?` · ${nm(m.pens)} win on penalties`:''}</p>
  <p class="small muted" style="text-align:center">Expected goals ${m.lh.toFixed(1)}–${m.la.toFixed(1)}: ${xgWord(m)}</p>
  ${m.scorers.length?`<p class="small">${m.scorers.map(s=>esc(s.name.split(' ').slice(-1)[0])+(s.side==='h'?' ('+esc(CL(m.h).name.split(' ')[0])+')':' ('+esc(CL(m.a).name.split(' ')[0])+')')).join(', ')}</p>`:''}`).join('<hr>')}
  ${ms.some(x=>x.comp==='league')?`<p class="small"><b>${TIER_NAME[C().tier]}: ${ord(posOf(S.my))}</b>${UI.prevPos&&UI.prevPos!==posOf(S.my)?` <span class="${UI.prevPos>posOf(S.my)?'up':'down'}">(${UI.prevPos>posOf(S.my)?'▲':'▼'}${Math.abs(UI.prevPos-posOf(S.my))})</span>`:''} · ${S.tbl[S.my].pts} point${S.tbl[S.my].pts===1?'':'s'}</p>`:''}
  <ul>${evs.slice(0,6).map(e=>`<li>${esc(e.text)}</li>`).join('')}${f?`<li>The week's books: ${k1(f.net)}${f.lines.gate?` (gate ${k1(f.lines.gate)})`:''}.</li>`:''}</ul></section>`;
}
function previewView(){
  if(seasonOver())return`<div class="panel"><p class="eyebrow">The season is over</p><p>${TIER_NAME[C().tier]}: you finish ${ord(posOf(S.my))}.</p></div>`;
  const w=S.week+1,fx=fixtureOf(S.my,w),cup=CUP_WEEKS[S.cup.round]===w?cupTieOf(S.my):null,out=[];
  for(const [m,comp] of [[fx,'league'],[cup?{h:cup.h,a:cup.a,home:cup.h===S.my,opp:cup.h===S.my?cup.a:cup.h}:null,'cup']]){if(!m)continue;
    const neutral=comp==='cup'&&S.cup.round===CUP_WEEKS.length-1,sh=teamStrength(m.h)+(neutral?0:homeEdge(m.h)),sa=teamStrength(m.a),[lh,la]=lambdas(sh,sa,!neutral),p=wdlProb(lh,la);
    const mine=m.home?p.w:p.l,theirs=m.home?p.l:p.w;
    out.push(`<div class="panel"><p class="eyebrow">${comp==='cup'?`${CUP_NAME} · ${CUP_ROUND[S.cup.round]}`:`Week ${w} · ${TIER_NAME[C().tier]}`}</p>
    <div class="fix"><b>${nm(m.h)}</b><span class="muted">v</span><b>${nm(m.a)}</b></div>
    <div class="cmp"><span>Position</span><b>${comp==='league'?(S.week?ord(posOf(m.h)):'—'):tierShort(CL(m.h).tier)}</b><b>${comp==='league'?(S.week?ord(posOf(m.a)):'—'):tierShort(CL(m.a).tier)}</b>
    <span>Squad strength</span><b>${Math.round(teamStrength(m.h))}</b><b>${Math.round(teamStrength(m.a))}</b>
    <span>Form</span><b>${(S.tbl[m.h].form||[]).join('')||'—'}</b><b>${(S.tbl[m.a].form||[]).join('')||'—'}</b></div>
    <p class="small muted">The bookmakers: ${pct(mine)} we win, ${pct(p.d)} a draw, ${pct(theirs)} we lose.</p></div>`)}
  if(!out.length)out.push(`<div class="panel"><p class="eyebrow">Week ${w}</p><p class="muted">No game for us this week.</p></div>`);
  return out.join('');
}
function weekView(){
  const over=seasonOver();
  return`${reportView()}${urgentPanel()}${previewView()}${lookPanel()}${targetsPanel()}
  <p class="note">${over?'Prize money, promotion and relegation, contracts and the summer window follow.':'Every week is played. Change prices, budgets or building first if you want them to count this week.'}</p>`;
}

/* ----- tables ----- */
function tableView(){
  const t=UI.tier??C().tier;
  const tabs=`<div class="tabs" role="tablist">${TIERS.map(x=>`<button class="${t===x?'on':''}" data-act="tier" data-arg="${x}" aria-pressed="${t===x}">${tierShort(x)}</button>`).join('')}<button class="${t==='cup'?'on':''}" data-act="tier" data-arg="cup" aria-pressed="${t==='cup'}">Cup</button><button class="${t==='market'?'on':''}" data-act="tier" data-arg="market" aria-pressed="${t==='market'}">Market</button><button class="${t==='archive'?'on':''}" data-act="tier" data-arg="archive" aria-pressed="${t==='archive'}">History</button></div>`;
  if(t==='market')return tabs+marketView();
  if(t==='archive')return tabs+archiveView();
  if(t==='cup')return tabs+cupView();
  const st=standings(t);
  return`${tabs}<div class="panel"><p class="eyebrow">${TIER_NAME[t]}</p><div class="tbl" role="table" aria-label="${TIER_NAME[t]} table">
  <div class="trow head" role="row"><span>#</span><span>Club</span><span>P</span><span>GD</span><b>Pts</b></div>
  ${st.map((id,i)=>{const r=S.tbl[id],zone=(t>0&&i<2)?'zone-up':(t<2&&i>=14)?'zone-down':'';return`<button class="trow ${id===S.my?'me':''} ${zone}" role="row" data-act="club" data-arg="${id}"><span>${i+1}</span><span class="nm">${nm(id)}${r.ded?` <span class="inj">−${r.ded}</span>`:''}</span><span>${r.p}</span><span>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</span><b>${r.pts}</b></button>`}).join('')}</div>
  <p class="note">${t>0?'Top two go up. ':''}${t<2?'Bottom two go down. ':''}Tap a club to inspect it.</p></div>`;
}
function cupView(){
  const cup=S.cup,rounds={};for(const l of cup.log)(rounds[l.r]=rounds[l.r]||[]).push(l);
  const next=cup.round<CUP_WEEKS.length?`<div class="panel"><p class="eyebrow">${CUP_ROUND[cup.round]} · week ${CUP_WEEKS[cup.round]}</p>${cup.ties.map(t=>`<div class="row small ${t.h===S.my||t.a===S.my?'':''}"><span>${t.h===S.my||t.a===S.my?'<b>':''}${nm(t.h)} v ${nm(t.a)}${t.h===S.my||t.a===S.my?'</b>':''}</span></div>`).join('')}</div>`:`<div class="panel"><p class="eyebrow">Winners</p><p><b>${nm(cup.winner)}</b></p></div>`;
  const mine=cup.alive.includes(S.my)||cup.winner===S.my;
  return`<p class="small ${mine?'up':'muted'}">${cup.winner===S.my?'You won the cup.':mine?'Still in the cup.':cup.round===0&&C().tier===0?'Premier clubs enter in the second round.':'Out of the cup.'} Prize money grows every round.</p>${next}
  ${Object.keys(rounds).reverse().map(r=>`<div class="panel"><p class="eyebrow">${CUP_ROUND[r]}</p>${rounds[r].map(l=>`<div class="row small"><span>${l.h===S.my||l.a===S.my?'<b>':''}${nm(l.h)} ${l.gh}–${l.ga} ${nm(l.a)}${l.h===S.my||l.a===S.my?'</b>':''}</span></div>`).join('')}</div>`).join('')}`;
}

/* ----- squad ----- */
function qbar(q){return`<span class="qbar">${r1(q)}<i aria-hidden="true"><b style="width:${clamp((q-5)/12*100,4,100)}%"></b></i></span>`}
function potWord(p){const d=p.pa-p.q;return p.age>=29?'At their level':d>2.5?'Big potential':d>1?'Room to grow':'Close to their best'}
function loanedOutPanel(){const out=Object.entries(S.squads).flatMap(([cid,sq])=>sq.filter(p=>p.loan&&p.loan.from===S.my).map(p=>({p,cid})));
  return out.length?`<div class="panel"><p class="eyebrow">Out on loan</p>${out.map(({p,cid})=>`<div class="row small"><span>${esc(p.name)} <span class="muted">at ${nm(cid)}</span></span><b>${p.sApps} apps</b></div>`).join('')}</div>`:''}
function marketView(){
  const ev=S.ev.filter(e=>['Transfer','Signing','Loan'].includes(e.t)).slice(-200),wins={};
  for(const e of ev){const k=e.w>=SEASON_WEEKS||e.w===0?`Summer ${e.w===0?e.s-1:e.s}`:e.w>=WINTER_WEEK&&e.w<=WINTER_WEEK+1?`Winter, season ${e.s}`:`Season ${e.s}`;(wins[k]=wins[k]||[]).push(e)}
  const keys=Object.keys(wins).reverse().slice(0,3);
  return keys.length?keys.map(k=>{const list=wins[k],fees=list.filter(e=>e.fee).sort((a,b)=>b.fee-a.fee).slice(0,5),mine=list.filter(e=>e.c===S.my||e.c2===S.my);
    return`<div class="panel"><p class="eyebrow">${esc(k)} · ${list.length} moves</p>${fees.length?`<p class="small muted">Biggest fees</p>${fees.map(e=>`<p class="small">${esc(e.text)}</p>`).join('')}`:''}${mine.length?`<p class="small muted">Your club</p>${mine.map(e=>`<p class="small"><b>${esc(e.text)}</b></p>`).join('')}`:''}</div>`}).join(''):'<p class="muted">No transfers yet. Windows: the summer and week '+WINTER_WEEK+'.</p>';
}
function squadView(){
  const id=S.my,sq=S.squads[id].slice().sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||b.q-a.q),gaps=squadGaps(S.squads[id]),f=F(id);
  const bill=wageBillK(id),cap=wageCapK(id),xi=pickXI(S.squads[id]).map(x=>x.p.id);
  return`<div class="panel"><div class="row"><span>Squad strength</span><b>${Math.round(teamStrength(id))} · ${strWord(id)}</b></div>
  <div class="row small"><span>Players</span><b>${sq.length} · average age ${r1(sq.reduce((a,p)=>a+p.age,0)/sq.length)}</b></div>
  <div class="row small"><span>Wage bill</span><b class="${bill>cap?'down':''}">£${n0(bill*1000)} a week · limit £${n0(cap*1000)}</b></div>
  ${gaps.slice(0,3).map(g=>`<p class="small down">${esc(g.text)}</p>`).join('')}</div>
  <div class="panel"><p class="eyebrow">The frame for your director</p><div class="row small"><span>Wage limit</span><b>£${n0(cap*1000)} a week</b></div><div class="row small"><span>Spending power now</span><b>${k1(budgetFor(id))}</b></div><p class="small muted">The director signs and sells within the frame you set in the budget.</p><button class="btn ghost" data-act="tobudget">Set the frame in Money → Budget</button></div>
  ${loanedOutPanel()}
  ${POS.map(pos=>{const ps=sq.filter(p=>p.pos===pos);if(!ps.length)return'';return`<p class="eyebrow">${POS_L[pos]}</p><div class="stack">${ps.map(p=>`<button class="prow" data-act="player" data-arg="${p.id}"><span><span class="pn">${esc(p.name)}${xi.includes(p.id)?' <span class="pill">XI</span>':''}${p.susp>0?' <span class="pill bad">Banned</span>':''}${p.wantsOut?' <span class="pill bad">Wants out</span>':''}${p.loan?' <span class="pill">On loan</span>':''}</span><br><span class="pm">${p.age} · ${p.contract<=1?'<b>contract ends</b>':p.contract+' yrs'} · ${MORALE_WORD(p.morale)} · £${p.wage}/wk${p.inj?` · <span class="inj">out ${p.inj} wk</span>`:''}</span></span>
    <span>${qbar(p.q)}${Math.abs(p.grown)>=.1?`<span class="small ${p.grown>0?'up':'down'}"> ${p.grown>0?'▲':'▼'}</span>`:''}</span></button>`).join('')}</div>`}).join('')}`;
}

function gTabs(cur,list,act,cls){return`<div class="tabs ${cls||''}" role="tablist">${list.map(([k,n])=>`<button class="${cur===k?'on':''}" data-act="${act}" data-arg="${k}" aria-pressed="${cur===k}">${n}</button>`).join('')}</div>`}

function forecastSVG(fc){
  const all=[...fc.low,...fc.high,0],mn=Math.min(...all),mx=Math.max(...all),W=300,H=90,x=i=>Math.round(i/(fc.mid.length-1)*W),y=v=>Math.round(H-4-(v-mn)/(mx-mn||1)*(H-8));
  const band=fc.high.map((v,i)=>`${x(i)},${y(v)}`).join(' ')+' '+fc.low.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');
  return`<svg class="fcast" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash forecast: lowest £${fc.minV}k in ${fc.minW} weeks"><polygon points="${band}" class="band"/><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="zero"/><polyline points="${fc.mid.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" class="mid"/></svg>`;
}
function linesTable(L){return Object.keys(LINE).filter(k=>L[k]).map(k=>`<div class="row small"><span>${LINE[k][0]}</span><b class="${L[k]<0?'down':''}">${k1(L[k])}</b></div>`).join('')||'<p class="small muted">Nothing yet.</p>'}

/* ================= Screens: the club's departments =================
   The Club tab opens on the eight departments: people, money and a way of working, each with what it delivers
   against the division and the next investment within reach. All changes go through cmd(). */
function divAvg(fn){const ids=tierIds(C().tier).filter(i=>i!==S.my);return ids.reduce((a,i)=>a+fn(i),0)/Math.max(1,ids.length)}
function dots(n){return`<span class="dots" aria-label="staff level ${n} of 5">${'●'.repeat(n)}<span class="muted">${'○'.repeat(5-n)}</span></span>`}
/* what a department delivers this season, against the average of the division (better: true / false / null) */
function deptKpi(id,k){
  const st=i=>S.stats[i],sg=groundSignals,cmp=(v,a,hi,fmt)=>({text:`${fmt(v)} · division ${fmt(a)}`,good:Math.abs(v-a)<1e-9?null:hi?v>a:v<a});
  switch(k){
    case'training':{const yg=i=>{const n=S.squads[i].filter(p=>p.age<=23).length;return n?st(i).youthGrowth/n:0};return{label:'Growth per young player this season',...cmp(yg(id),divAvg(yg),true,v=>'+'+v.toFixed(2))}}
    case'medical':return{label:'Weeks lost to injury this season',...cmp(st(id).injWeeks,divAvg(i=>st(i).injWeeks),false,v=>Math.round(v))};
    case'academy':return{label:'Best graduate potential (last intake)',...cmp(st(id).intakeBest||0,divAvg(i=>st(i).intakeBest||0),true,v=>v?r1(v-(S.qref-11.7)).toFixed(1):'—')};
    case'scouting':{const r=i=>6+Math.round(2*sg(i).scouting);return{label:'Players the director sees per search',...cmp(r(id),divAvg(r),true,v=>Math.round(v))}}
    case'commercial':{const c=i=>{const l=F(i).season;return(l.sponsors||0)+(l.merch||0)+(l.events||0)};return{label:'Sponsors, merchandise and hire this season',...cmp(c(id),divAvg(c),true,v=>k1(v))}}
    case'community':{const d=i=>weekLines(i,false,{}).dues||0;return{label:'Membership dues per week',...cmp(d(id),divAvg(d),true,v=>'£'+n0(v*1000))}}
    case'matchday':return{label:'Atmosphere (home edge)',...cmp(sg(id).atmosphere,divAvg(i=>sg(i).atmosphere),true,v=>r1(v).toFixed(1))};
    case'grounds':{const c=i=>{const g=G(i),all=[...Object.values(g.sides),...Object.values(g.fac),...g.plots.filter(p=>p.kind),g.pitch];return all.reduce((a,o)=>a+o.cond,0)/all.length};return{label:'Average condition of the ground',...cmp(c(id),divAvg(c),true,v=>Math.round(v)+'%')}}
  }
}
/* the facility that belongs to a department, and the next building step for it */
function deptFacility(id,k){
  const f=DEPT[k].fac;if(!f)return null;const g=G(id),i=g.plots.findIndex(p=>p.kind===f),cat=projectCatalog(id);
  if(i>=0)return{have:g.plots[i],opt:cat.find(o=>o.key===`plot:${i}:up`),busy:!!building(id,'plot:'+i)};
  const free=g.plots.findIndex(p=>!p.kind&&!building(id,'plot:'+g.plots.indexOf(p)));
  const pend=g.projects.find(p=>p.phase!=='done'&&p.key.endsWith(':'+f));
  return{have:null,opt:free>=0?cat.find(o=>o.key===`plot:${free}:${f}`):null,busy:!!pend,noPlot:free<0};
}
function deptNext(id,k){
  const d=G(id).depts[k],fac=deptFacility(id,k),out=[];
  if(fac&&fac.busy)out.push('Building work under way');else if(fac&&fac.opt)out.push(`${fac.have?'Upgrade':'Build'} ${COMPLEX[DEPT[k].fac].n.toLowerCase()}: £${fac.opt.cost}k`);
  else if(fac&&fac.noPlot&&!fac.have)out.push('No free plot for a building');
  if(d.hiring)out.push(`Recruiting: ${d.hiring.left} wk`);else if(d.staff<5)out.push(`More staff: +£${n0((deptWeekCost(id,k,d.staff+1)-deptWeekCost(id,k))*1000)}/wk`);
  return out.join(' · ');
}
function deptsView(){
  const id=S.my,g=G(id),total=deptCost(id);
  return`<div class="panel"><div class="row"><span>Departments</span><b>£${n0(total*1000)} a week</b></div><p class="small muted">People, budget and a way of working. Each one changes something real on the pitch or in the books; tap one to manage it.</p></div>
  <div class="stack">${Object.keys(DEPT).map(k=>{const d=g.depts[k],kp=deptKpi(id,k);return`<button class="dept" data-act="dept" data-arg="${k}">
    <span class="dh"><b>${DEPT[k].n}</b>${dots(d.staff)}</span>
    <span class="small">${esc(kp.label)}: <b class="${kp.good===true?'up':kp.good===false?'down':''}">${esc(kp.text)}</b></span>
    <span class="small muted">${STAFF_WORD[d.staff]} · ${d.budget} budget · ${d.pending||d.course}${d.hiring?' · recruiting':''}</span>
    <span class="small next">${esc(deptNext(id,k))}</span></button>`}).join('')}</div>`;
}
/* Operational visibility uses only persisted game state; there is no invented shortlist or youth team. */
function departmentPipeline(k){
 const id=S.my,dept=G(id).depts[k],st=S.stats[id];
 if(k==='scouting'){
  const director=tdOf(id),recent=S.ev.filter(e=>e.c===id&&['Transfer','Signing'].includes(e.t)).slice(-6).reverse();
  const history=(st.scoutHistory||[]).slice(-4).reverse();
  const reach=Math.max(4,6+Math.round(2*groundSignals(id).scouting+(pq(director)-10)/2));
  return`<div class="panel"><p class="eyebrow">Scouting desk</p>
  <div class="row small"><span>Recruitment lead</span><b>${esc(director.name)} (director)</b></div>
  <div class="row small"><span>Scouting team</span><b>Level ${dept.staff}/5</b></div>

function confBar(v){const c=v<40?'lo':v<55?'mid':'';return`<span class="conf ${c}" role="img" aria-label="members' confidence ${Math.round(v)} of 100"><i style="width:${Math.round(v)}%"></i><b style="left:40%"></b></span>`}
function agmForecast(id){const fresh=id===S.my&&S.career.length&&S.career[S.career.length-1].from===S.season?6:0;return clamp(Math.round(24+.75*M(id).conf+fresh),3,97)}
function reasonRows(list){return list.map(([why,d])=>`<div class="row small"><span>${esc(why)}</span><b class="${d<0?'down':'up'}">${d>0?'+':''}${r1(d)}</b></div>`).join('')}
function targetsPanel(){
  const id=S.my,m=M(id),f=agmForecast(id);
