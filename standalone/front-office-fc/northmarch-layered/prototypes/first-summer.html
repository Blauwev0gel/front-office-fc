<title>The First Summer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:ital,opsz,wght@1,7..72,400;1,7..72,600&display=swap">
<style>
/* Layout: one scene per screen, like turning the pages of a matchday programme; the club's colours carry everything. */
:root{
  --bg:#e9eeed; --paper:#f8faf9; --ink:#13232a; --muted:#52666b; --line:#cfd9d8;
  --kit:#0e5a61; --kit-ink:#ffffff; --amber:#c98a12; --amber-soft:#f6e6c2;
  --bad:#b8392a; --good:#2f7d46; --pitch:#2d6a3b; --pitch2:#2a6237; --chalk:rgba(255,255,255,.75);
  --shadow:0 1px 0 rgba(19,35,42,.06),0 8px 24px rgba(19,35,42,.08);
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --f-voice:'Literata',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1416; --paper:#122027; --ink:#e6eeed; --muted:#9fb3b5; --line:#24363d;
  --kit:#4fb0ad; --kit-ink:#06201f; --amber:#f0b84a; --amber-soft:#3a2f17;
  --bad:#ef7564; --good:#6fc58a; --pitch:#1f4d2a; --pitch2:#1c4626; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1416; --paper:#122027; --ink:#e6eeed; --muted:#9fb3b5; --line:#24363d;
  --kit:#4fb0ad; --kit-ink:#06201f; --amber:#f0b84a; --amber-soft:#3a2f17;
  --bad:#ef7564; --good:#6fc58a; --pitch:#1f4d2a; --pitch2:#1c4626; --chalk:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* the club bar: who you are and the three things that move */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--kit);color:var(--kit-ink);display:flex;align-items:center;gap:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--kit)}
.bar .id{flex:1;min-width:0;overflow:hidden}
.bar b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.02em;display:block;line-height:1;white-space:nowrap}
.bar small{font-size:.66rem;opacity:.85;letter-spacing:.06em;text-transform:uppercase;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;gap:4px;flex:none}
.meter{background:rgba(255,255,255,.14);border-radius:8px;padding:4px 6px;text-align:center;min-width:42px;position:relative}
:root[data-theme="dark"] .meter{background:rgba(0,0,0,.18)}
.meter span{display:block;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.meter em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;font-size:.86rem}
.pop{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;font-size:.75rem;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;animation:pop 1.8s forwards}
.pop.up{color:var(--good)}.pop.down{color:var(--bad)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-4px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

/* the scene */
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-top:18px}
h1{font-family:var(--f-display);font-weight:900;font-size:2.4rem;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em}
p{margin:0}
.lede{font-size:1.02rem;color:var(--ink)}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.fact b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1;font-weight:800}
.fact span{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* a voice: a person speaks */
.voice{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.face{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;background:var(--kit);color:var(--kit-ink)}
.face.rival{background:#7a1f2b;color:#fff}.face.amber{background:var(--amber);color:#1b1306}.face.grey{background:var(--muted);color:var(--paper)}
.voice .who{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.voice q{display:block;font-family:var(--f-voice);font-style:italic;font-size:1.06rem;line-height:1.4;quotes:"“" "”"}

/* choices: what you can do and what it will cost */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--kit)}.choice:active{transform:scale(.99)}
.choice b{font-size:1rem}.choice span{font-size:.84rem;color:var(--muted)}
.choice.on{border-color:var(--kit);background:color-mix(in srgb,var(--kit) 10%,var(--paper))}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice.on[disabled]{opacity:1;cursor:default}
.next{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.next button{display:block;width:100%;max-width:460px;margin:0 auto;min-height:54px;border:0;border-radius:14px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.next button[disabled]{opacity:.35;cursor:not-allowed}

/* the posters: the open chairs */
.poster{position:relative;border-radius:16px;overflow:hidden;color:#fff;padding:18px 16px 16px;display:flex;flex-direction:column;gap:6px;min-height:190px;text-align:left;border:0;cursor:pointer;box-shadow:var(--shadow)}
.poster .stripe{position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(90deg,#fff 0 18px,transparent 18px 36px)}
.poster *{position:relative}
.poster .tag{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9;font-weight:700}
.poster h2{font-size:2rem}
.poster p{font-family:var(--f-voice);font-style:italic;font-size:1rem;opacity:.95}
.poster .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.poster .row span{background:rgba(0,0,0,.25);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600}
.poster.locked{filter:saturate(.35);cursor:default}

/* the vote */
.vote{height:28px;border-radius:8px;background:var(--line);overflow:hidden;display:flex}
.vote i{display:block;height:100%;background:var(--kit);width:0;transition:width 2.2s cubic-bezier(.2,.8,.2,1)}
.vote i.no{background:var(--bad);opacity:.7}

/* the whiteboard pitch */
.pitch{width:100%;max-width:100%;aspect-ratio:68/88;border-radius:14px;display:block}
.pitch .p-name{font-family:var(--f-body);font-weight:600;font-size:3.1px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:.6px}
.pitch .p-rt{font-family:var(--f-display);font-weight:800;font-size:4.3px;fill:#13232a}

/* meters inside a scene */
.cheer{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.cheer i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--good));transition:width .6s}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:600;font-size:.86rem;cursor:pointer;padding:4px}
.seg button.on{border-color:var(--kit);background:var(--kit);color:var(--kit-ink)}

/* the phone: a call comes in */
.call{border-radius:16px;background:var(--ink);color:var(--paper);padding:16px;display:flex;flex-direction:column;gap:10px}
.call .ring{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:700;display:flex;align-items:center;gap:8px}
.call .ring::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.call q{font-family:var(--f-voice);font-style:italic;font-size:1.08rem;quotes:"“" "”"}
.call .who{font-weight:700}

/* the ticker and the clock */
.ticker{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ticker li{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.ticker li b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.ticker li.us{border-left:4px solid var(--kit)}.ticker li.rival{border-left:4px solid #7a1f2b}
.ticker ul,.ticker{margin:0;padding:0}
.clock{font-family:var(--f-display);font-weight:900;font-size:4.2rem;line-height:.9;font-variant-numeric:tabular-nums;color:var(--amber);letter-spacing:.02em;transition:color .3s}.clock.late{color:var(--bad);animation:blink 1s infinite}
.older summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--muted)}.older .tk{margin-top:6px}

/* the paper */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;box-shadow:var(--shadow)}
.paper .mast{display:flex;justify-content:space-between;border-bottom:3px double var(--ink);padding-bottom:6px;margin-bottom:8px;font-family:var(--f-display);font-weight:800;letter-spacing:.08em}
.paper h1{font-size:2rem}

/* the match */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score b{font-family:var(--f-display);font-weight:900;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-weight:700;font-size:.95rem}
.feed{display:flex;flex-direction:column;gap:6px;margin:0;padding:0}
.feed li{list-style:none;display:grid;grid-template-columns:40px 1fr;gap:8px;padding:9px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);animation:in .35s both}
.feed li b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:var(--muted)}
.feed li.goal{border-color:var(--kit);border-width:2px}.feed li.goal.them{border-color:#7a1f2b}
.feed li .you{display:block;font-size:.78rem;color:var(--amber);font-weight:700;margin-top:2px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chain{display:flex;flex-direction:column;gap:8px;margin:0;padding:0}
.chain li{list-style:none;padding:10px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:.92rem}
.chain li b{display:block}
.note{font-size:.78rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-size:.88rem;z-index:20;max-width:90%;animation:pop 2.6s forwards}
/* ---- the transfer centre ---- */
.tc-head{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0;padding:0}
.days li{list-style:none;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:7px 0;border-radius:8px;background:var(--paper);border:1px solid var(--line);color:var(--muted);transition:background .3s,color .3s}
.days li.past{background:color-mix(in srgb,var(--kit) 18%,var(--paper));color:var(--ink)}
.days li.now{background:var(--amber);border-color:var(--amber);color:#1b1306;transform:translateY(-2px);box-shadow:0 4px 10px color-mix(in srgb,var(--amber) 40%,transparent)}
.dl-head{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:16px}
.board{display:flex;flex-direction:column;gap:8px}
.board-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.board-h b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-transform:uppercase;letter-spacing:.03em}
.deal-c{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--club);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
.deal-c.flashy{animation:glow 1.4s ease-out}
.deal-c:not(.flashy){animation:none}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--amber) 70%,transparent);transform:scale(1.02)}100%{box-shadow:0 0 0 14px transparent;transform:none}}
.deal-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.pos{font-family:var(--f-display);font-weight:900;font-size:1rem;background:var(--ink);color:var(--paper);border-radius:6px;padding:4px 6px;min-width:34px;text-align:center}
.deal-id{min-width:0}.deal-id b{display:block;font-size:1rem}.deal-id span{font-size:.78rem;color:var(--muted)}
.fee{font-family:var(--f-display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0;padding:0}
.rail li{list-style:none;height:6px;border-radius:3px;background:var(--line);transition:background .4s}
.rail li.on{background:var(--kit)}
.deal-c.done .rail li.on{background:var(--good)}
.deal-st{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.deal-st i{font-style:normal;color:var(--amber)}
.deal-c.out{opacity:.75}.deal-c.out .deal-id b{text-decoration:line-through;text-decoration-thickness:2px}
.deal-c.hijacked{border-left-color:var(--bad)}
.stamp{position:absolute;right:10px;bottom:6px;font-family:var(--f-display);font-weight:900;font-size:1.5rem;letter-spacing:.08em;color:var(--good);border:3px solid var(--good);border-radius:6px;padding:0 8px;transform:rotate(-8deg);background:color-mix(in srgb,var(--paper) 80%,transparent)}
.stamp.red{color:var(--bad);border-color:var(--bad)}

.stamp.anim{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.speed{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:.82rem;cursor:pointer}
.tk{display:flex;flex-direction:column;gap:6px;margin:0;padding:0}
.tk li{list-style:none;display:grid;grid-template-columns:50px 1fr;gap:8px;padding:9px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--line);font-size:.9rem}
.tk li b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:.8rem;padding-top:1px}
.tk li.fresh{animation:slide .45s ease-out both}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.tk .tk-us{border-left-color:var(--kit)}.tk .tk-rival{border-left-color:#7a1f2b}.tk .tk-world{border-left-color:var(--line)}
.tk .tk-you{border-left-color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,var(--paper))}
.tk .tk-good{border-left-color:var(--good);font-weight:600}.tk .tk-bad{border-left-color:var(--bad);font-weight:600}
.tk-empty{color:var(--muted);font-style:italic}
.chat{display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--kit) 8%,var(--bg));border-radius:16px;padding:12px}
.bubble{display:flex;gap:8px;align-items:flex-end}
.bubble p{margin:0;padding:10px 12px;border-radius:14px;font-size:.95rem;line-height:1.4}
.bubble.them p{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.me{justify-content:flex-end}.bubble.me p{background:var(--kit);color:var(--kit-ink);border-bottom-right-radius:4px;max-width:85%}
.breaking{border-radius:16px;padding:14px;background:var(--paper);border:3px solid var(--amber);display:flex;flex-direction:column;gap:10px;animation:shake .5s both}
.brk{align-self:flex-start;background:var(--amber);color:#1b1306;font-size:.7rem;font-weight:800;letter-spacing:.12em;padding:4px 8px;border-radius:6px;animation:blink 1s infinite}
@keyframes shake{0%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}100%{transform:none}}
.closed{font-family:var(--f-display);font-weight:900;font-size:2.6rem;text-align:center;color:var(--paper);background:var(--bad);border-radius:12px;padding:10px;letter-spacing:.06em;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ------- The First Summer v3: a playable prototype of Northmarch's opening at Pell United. Not wired to the engine.
   Bible: the director does every transfer (D-L3-2); two exceptions come to the chairman: a bid for a top-three player and a
   club-record fee (D-L3-2b). The chairman talks to the director about the frame: priority, profile, money (§7.2), and may
   travel and recommend (D-S1, MB-12: trips exclude each other). The market is a ticker over weeks: meeting → brief → ticker
   → deadline → paper → debrief (D-G6). Unknown players are estimates (§7.3). Members' trust starts at 62 (T8). No new meters. ------- */
const $=s=>document.querySelector(s);
const FAST=matchMedia('(prefers-reduced-motion:reduce)').matches;
const st={scene:0,budget:0,mood:62,plan:null,prio:'LB',told:null,promise:{league:1,money:1,youth:1},
  trip:null,talk:{},cole:'here',coleUpset:0,signed:[],sold:[],notes:{},debrief:null,match:null,
  tc:{wk:0,phase:'talk',day:-1,ticker:[],queue:[],hold:null,closed:false,speed:1},
  deals:{}};
const XI=[
 {pos:'GK',n:'Boyce',r:61,x:34,y:80},
 {pos:'LB',n:'Petit',r:52,x:10,y:64,weak:1},{pos:'CB',n:'Cole',r:66,x:26,y:68,cap:1},{pos:'CB',n:'Lomax',r:61,x:42,y:68},{pos:'RB',n:'Ormerod',r:59,x:58,y:64},
 {pos:'LM',n:'Illingworth',r:60,x:10,y:44},{pos:'CM',n:'Midgley',r:63,x:26,y:47},{pos:'CM',n:'Garside',r:55,x:42,y:47,kid:1},{pos:'RM',n:'Tetley',r:61,x:58,y:44},
 {pos:'ST',n:'Dunleavy',r:67,x:24,y:22},{pos:'ST',n:'Thackeray',r:53,x:44,y:22,weak:1}];
const BUD={careful:{n:'Careful',v:40,d:'£40k. Money in the bank if things go wrong.'},normal:{n:'Normal',v:70,d:'£70k. A fair share of the cash.'},allin:{n:'All-in',v:110,d:'£110k. Almost everything we have.'}};
const PR={league:{t:'On the pitch',w:[6,10,16],o:[['Safe','Finish 14th or higher'],['Steady','Finish in the top half'],['Bold','Promotion: the top two']]},
 money:{t:'The money',w:[4,6,10],o:[['Safe','Keep any loss under £20k'],['Steady','No operating loss'],['Bold','A £15k profit']]},
 youth:{t:'Our own',w:[3,5,8],o:[['Safe','Academy players: 18 games'],['Steady','Academy players: 30 games'],['Bold','Academy players: 48 games']]}};
const CLUB={holbeck:['Holbeck City','#8a6a1c'],corden:['Corden Town','#7a1f2b'],kestle:['Kestle Rovers','#2f4f8f'],ravensby:['Ravensby Town','#3b3f74'],whinsby:['Whinsby','#4d6b2f'],free:['Free agent','#5b6b70']};
const RECORD=28;
const STAGES=['Scouted','Enquiry','Bid','Talks','Agreed','Signed'];

function bump(k,v){if(!v)return;st[k]+=v;flash(k,v)}
function flash(k,v){const m=document.querySelector(`[data-m="${k}"]`);if(!m)return;const e=document.createElement('i');e.className='pop '+(v>0?'up':'down');e.textContent=(v>0?'+':'')+(k==='budget'?'£'+v+'k':v);m.appendChild(e);setTimeout(()=>e.remove(),1900);const em=m.querySelector('em');if(em)em.textContent=k==='budget'?'£'+st.budget+'k':st[k]}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2700)}
function bar(day){return`<header class="bar"><svg width="26" height="30" viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32 6v13c0 9-7 15-15 18C9 34 2 28 2 19V6z" fill="var(--amber)"/><path d="M17 9v18M11 13h12M10 22c2 4 5 5 7 5s5-1 7-5" stroke="#13232a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
 <div class="id"><b>PELL UNITED</b><small>${day}</small></div>
 <div class="meters"><div class="meter" data-m="budget"><span>Budget</span><em>£${st.budget}k</em></div><div class="meter" data-m="mood"><span>Members' trust</span><em>${st.mood}</em></div></div></header>`}
const face=(i,c='')=>`<span class="face ${c}" aria-hidden="true">${i}</span>`;
const voice=(i,who,q,c)=>`<div class="voice">${face(i,c)}<div><span class="who">${who}</span><q>${q}</q></div></div>`;

function pitch(xi,label){
 const dots=xi.map(p=>{const col=p.nw?'var(--amber)':p.weak?'var(--bad)':'#fff';return`<g transform="translate(${(11+(p.x-10)*1.17).toFixed(1)},${p.y})">${p.weak&&!p.nw?'<circle r="6" fill="none" stroke="var(--bad)" stroke-width="1"><animate attributeName="r" values="4.6;7;4.6" dur="1.6s" repeatCount="indefinite"/></circle>':''}${p.nw?'<circle r="6.2" fill="none" stroke="var(--amber)" stroke-width=".8" opacity=".7"/>':''}<circle r="4.3" fill="${col}"/><text class="p-rt" text-anchor="middle" y="1.5">${p.est?'~':''}${p.r}</text><text class="p-name" text-anchor="middle" y="8.2">${p.n}${p.cap?' (C)':''}</text></g>`}).join('');
 return`<svg class="pitch" viewBox="0 0 78 92" role="img" aria-label="${label}"><defs><pattern id="st" width="78" height="11.5" patternUnits="userSpaceOnUse"><rect width="78" height="5.75" fill="var(--pitch)"/><rect y="5.75" width="78" height="5.75" fill="var(--pitch2)"/></pattern></defs>
 <rect width="78" height="92" rx="4" fill="url(#st)"/><g fill="none" stroke="var(--chalk)" stroke-width=".5"><rect x="3" y="3" width="72" height="86"/><line x1="3" y1="46" x2="75" y2="46"/><circle cx="39" cy="46" r="8"/><rect x="21" y="3" width="36" height="13"/><rect x="21" y="76" width="36" height="13"/></g>${dots}</svg>`}
const signedAt=pos=>Object.values(st.deals).find(d=>d.pos===pos&&d.stage===5);
function currentXI(){const lb=signedAt('LB'),stk=signedAt('ST'),cb=signedAt('CB');return XI.map(p=>{
 if(p.n==='Thackeray'&&stk)return{...p,n:stk.n,r:stk.est,weak:0,nw:1,est:1};
 if(p.n==='Petit'&&lb)return{...p,n:lb.n,r:lb.est,weak:0,nw:1,est:1};
 if(p.n==='Cole'&&st.cole==='sold')return cb?{...p,n:cb.n,r:cb.est,cap:0,nw:1,est:1}:{...p,n:'Wade',r:50,cap:0,weak:1};
 return p})}
const strength=()=>Math.round(currentXI().reduce((a,p)=>a+p.r,0)/11);

const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
S.push({day:'The transfer window',tc:true,render:tcRender,after:tcAfter});

function deal(id,o){st.deals[id]=Object.assign({id,stage:0,fee:0,out:null,mark:0},st.deals[id]||{},o);return st.deals[id]}
function dealCard(d){const c=CLUB[d.from]||CLUB.free,out=d.out,lbl=out==='hijacked'?'Hijacked':out==='walked'?'Walked away':out==='gone'?'Gone':STAGES[d.stage];
 return`<article class="deal-c ${out?'out '+out:''} ${d.stage===5?'done':''} ${d.mark?'flashy':''}" style="--club:${c[1]}">
  <div class="deal-top"><span class="pos">${d.pos}</span><div class="deal-id"><b>${d.n}</b><span>${d.age} · ${c[0]} · ${d.known?'':'~'}${d.est}${d.known?'':' ±'+d.doubt}</span></div><span class="fee">${d.fee?'£'+d.fee+'k':'—'}</span></div>
  <ol class="rail" aria-label="${lbl}">${STAGES.map((s,i)=>`<li class="${i<=d.stage&&!out?'on':''}"></li>`).join('')}</ol>
  <div class="deal-st">${lbl}${d.chair?' · <i>your find</i>':''}</div>
  ${d.stage===5?`<span class="stamp${d.mark===1||d.mark===2?' anim':''}">SIGNED</span>`:''}${out==='hijacked'?`<span class="stamp red${d.hjFresh?' anim':''}">HIJACKED</span>`:''}</article>`}
function tcRender(){const T=st.tc,dl=T.wk===4;
 const head=dl?`<div class="dl-head"><span class="kicker" style="margin:0">Deadline day · the window shuts at 23:00</span><div class="clock ${(T.clock||'')>='22:00'?'late':''}" id="clk">${T.clock||'09:00'}</div></div>`
  :`<div class="tc-head"><div><span class="kicker" style="margin:0">Transfer window</span><h2>${T.wk?'Pre-season week '+T.wk+' of 4':'Before the window opens'}</h2></div><ol class="days">${DAYS.map((d,i)=>`<li class="${i<T.day?'past':i===T.day?'now':''}">${d}</li>`).join('')}</ol></div>`;
 const deals=Object.values(st.deals);
 return`${head}
 ${T.hold?holdCard(T.hold):''}
 ${T.phase==='talk'&&!T.closed?talkCard():''}
 ${T.closed?`<div class="closed" role="status">WINDOW CLOSED</div>`:''}
 <section class="board"><div class="board-h"><b>Aisha’s board</b><span class="note">She does the deals. You set the frame.</span></div>${deals.length?deals.map(dealCard).join(''):'<p class="note">Empty until the window opens on Monday.</p>'}</section>
 <section><div class="board-h"><b>The ticker</b>${T.phase==='play'?`<button class="speed" data-act="speed">${T.speed>1?'Normal speed':'Faster ×3'}</button>`:''}</div><ul class="tk" id="tk" aria-live="polite">${T.ticker.filter(e=>e.wk===T.wk).reverse().map(tkLi).join('')||'<li class="tk-empty">Quiet. For now.</li>'}</ul>${T.ticker.some(e=>e.wk<T.wk)?`<details class="older"><summary>Earlier weeks · ${T.ticker.filter(e=>e.wk<T.wk).length} items</summary><ul class="tk">${T.ticker.filter(e=>e.wk<T.wk).reverse().map(tkLi).join('')}</ul></details>`:''}</section>`}
function tkLi(e){return`<li class="tk-${e.k}${e.fresh?' fresh':''}"><b>${e.d}</b><span>${e.t}</span></li>`}
function tcAfter(){const b=$('#go'),T=st.tc;b.parentElement.hidden=false;
 if(T.closed){b.textContent='To the morning paper';b.disabled=false;return}
 if(T.phase==='talk'){b.textContent=T.wk===3?'▶ Deadline day':'▶ Play week '+(T.wk+1);b.disabled=!talkDone()}
 else{b.textContent=T.hold?'Your decision':'Playing…';b.disabled=true}}

/* talking to Aisha: one message before each week; the frame, never a deal */
const TALK=[
 {q:()=>'The window opens Monday. I\'ll go after the '+(st.prio==='LB'?'left-back':'striker')+' first. Where will you be this week?',k:'trip',
  o:[['holbeck','Watch Holbeck City reserves on Tuesday','£2k petrol and a hotel. Their striker scored nineteen last season.'],['tourney','The Marrow Bay youth tournament','Free. Fifteen-year-olds. Nobody gets famous there, until someone does.'],['bar','Friday night in the Dockers’ bar','Free. You will hear things.']]},
 {q:()=>{const v=st.deals.vos,m=st.deals.mensah||st.deals.hart;return`${m&&m.stage===5?'Left-back done. ':m?m.n+'\'s club are haggling. ':''}${v&&v.stage<5&&!v.out?'Holbeck are slow on Vos and I hear Corden are asking.':'Striker is next.'} Anything you want from me?`},k:'w2',
  o:[['push','“Go hard for the striker. Before Corden do.”','She makes the striker her priority this week.'],['plan','“Stick to your plan.”','She knows the market better than you.'],['money','“I’ll find you another £20k.”','More to spend. Your money promise gets harder.']]},
 {q:()=>`${st.cole==='sold'?'We need a centre-back now Danny\'s gone. ':''}One week left before deadline day. How do you want me to play it?`,k:'w3',
  o:[['young','“If you buy, buy young.”','She leans to players with a future and a resale value.'],['ready','“Players who can start on Saturday.”','She leans to ready-made players. No resale.'],['trust','“Your call. I trust you.”','She is happier. She does it her way.']]},
 {q:()=>'Deadline day. The phones start at nine. Last word?',k:'dl',
  o:[['all','“If the right player is there, bring me the record.”','She may ask you to approve a club-record fee.'],['calm','“No panic buys.”','She will not chase a record fee tonight.']]}];
function talkCard(){const t=TALK[st.tc.wk],v=st.talk[t.k];return`<section class="chat"><div class="bubble them">${face('AW')}<p>${t.q()}</p></div>
 ${v?`<div class="bubble me"><p>${t.o.find(o=>o[0]===v)[1]}</p></div>`:`<div class="choices">${t.o.map(o=>`<button class="choice" data-act="talk" data-arg="${t.k}:${o[0]}"><b>${o[1]}</b><span>${o[2]}</span></button>`).join('')}</div>`}</section>`}
const talkDone=()=>!!st.talk[TALK[st.tc.wk].k];

/* the two decisions that are the chairman's by right (D-L3-2b) */
function holdCard(h){
 if(h==='cole'){const bar=st.trip==='bar';return`<article class="breaking"><span class="brk">BREAKING · THURSDAY 16:40 · YOUR DECISION</span><h2>Corden bid £60k for Danny Cole</h2>
  <p>One of our three best players, so it is your call, not Aisha's. It happened once before: 1987, Bobby Murray, on deadline day.</p>${st.told==='nobody'?voice('DC','Danny Cole','You gave me your word on Monday.'):''}
  <div class="choices"><button class="choice" data-act="cole" data-arg="sell"><b>Accept £60k</b><span>The money goes to Aisha.${st.told==='nobody'?' You promised him.':''}</span></button>
  ${bar?`<button class="choice" data-act="cole" data-arg="ninety"><b>“£90k, or don’t call again.”</b><span>Mags told you their centre-back has done his knee. They are desperate.</span></button>`:`<button class="choice" data-act="cole" data-arg="counter"><b>Ask for £85k</b><span>They will come back with something, or nothing.</span></button>`}
  <button class="choice" data-act="cole" data-arg="keep"><b>“Not for sale. Not to them.”</b><span>He stays. Corden won’t forget it.</span></button></div></article>`}
 if(h==='cole72')return`<article class="breaking"><span class="brk">FRIDAY 10:05 · CORDEN COME BACK</span><h2>£72k. Not a penny more.</h2><div class="choices"><button class="choice" data-act="cole" data-arg="take72"><b>Accept £72k</b><span>${st.told==='nobody'?'You promised him.':'The money goes to Aisha.'}</span></button><button class="choice" data-act="cole" data-arg="keep"><b>Refuse</b><span>Danny heard you were haggling over him.</span></button></div></article>`;
 if(h.rec){const d=st.deals[h.rec];return`<article class="breaking"><span class="brk">22:14 · AISHA ON THE LINE · YOUR DECISION</span><h2>£${h.fee}k for ${d.n}?</h2><p>${CLUB[d.from][0]} have said yes. It beats our club record of £${RECORD}k, so she needs your word.</p>
  <div class="choices"><button class="choice" data-act="rec" data-arg="yes" ${st.budget<h.fee?'disabled':''}><b>Approve the record fee</b><span>${st.budget>=h.fee?'He signs before eleven.':'Not enough left in the budget.'}</span></button><button class="choice" data-act="rec" data-arg="no"><b>Too much</b><span>She walks away.</span></button></div></article>`}
 return''}

 }

  ev(0,()=>{const d=v();if(d.stage===5||d.out)return['world','Holbeck City sign a replacement striker.'];if(stPrio()&&st.budget>=24){d.fee=24;d.stage=4;return['us','Corden bid for Vos. Aisha goes to £24k and Holbeck say yes to Pell.'+(d.known?' Vos remembers who came to watch him.':'')]}d.out='hijacked';return['bad','✗ Corden Town hijack the deal for Ryan Vos: £25k.']});
  ev(1,()=>{const d=v();if(d.stage===4&&!d.out){sign(d);return['good','✍ Ryan Vos signs from Holbeck for £24k.']}if(d.out==='hijacked'){deal('dunn',{n:'Kyle Dunn',pos:'ST',age:st.talk.w3==='young'?20:28,from:'ravensby',est:st.talk.w3==='young'?58:61,doubt:3,stage:1});return['us',`Plan B: Aisha calls Ravensby about ${st.talk.w3==='young'?'young':'experienced'} striker Kyle Dunn.`]}return['world','Whinsby sign a full-back from Kestle.']});
  ev(2,()=>{if(st.cole!=='sold')return['world','Ravensby Town fans protest at ticket prices.'];deal('archer',{n:'Ben Archer',pos:'CB',age:st.talk.w3==='young'?23:30,from:'ravensby',est:st.talk.w3==='young'?59:63,doubt:2,stage:2,fee:st.talk.w3==='young'?22:40});return['us',`Aisha bids for centre-back Ben Archer (${st.talk.w3==='young'?'23':'30'}).`]});
  ev(3,()=>{const dn=st.deals.dunn;if(dn&&!dn.out){dn.stage=3;dn.fee=15;return['us','Ravensby want £15k for Kyle Dunn.']}return['world','Friendly: Pell United 3–0 a Marrow Bay XI.']});
  ev(4,()=>{const dn=st.deals.dunn;if(dn&&dn.stage===3&&st.budget>=15){sign(dn);return['good','✍ Kyle Dunn signs from Ravensby for £15k.']}if(dn&&dn.stage===3){dn.out='walked';return['us','No money left for Dunn. Thackeray it is.']}return['world','Kestle Rovers sell their captain abroad.']});
  ev(5,()=>{const a=st.deals.archer;if(a&&a.fee<=RECORD&&st.budget>=a.fee){sign(a);return['good',`✍ Ben Archer signs from Ravensby for £${a.fee}k.`]}return['world','Corden Town lose a friendly 0–3. Their fans want a centre-back.']});
  ev(6,()=>['world','Deadline day is tomorrow. Every phone in the league is charged.']);
 }
 if(w===4){const times=['09:00','11:20','13:45','16:30','19:10','21:30','22:14','22:51','23:00'];
  ev('09:00',()=>['world','The window opens for its last fourteen hours.']);
  ev('11:20',()=>['rival','Corden Town sign a striker from Kestle for £30k.']);
  ev('13:45',()=>{const a=st.deals.archer;if(a&&a.stage<5&&!a.out){a.stage=3;return['us',`Ravensby hold out for £${a.fee}k for Archer.`]}return['world','Holbeck City announce a new manager.']});
  ev('16:30',()=>['us','Aisha has three phones on her desk.']);
  ev('19:10',()=>{if(st.cole!=='sold')return['rival','Corden’s chairman to the press: “We will be back for Cole next summer.”'];return['world','Whinsby complete a loan deal.']});
  ev('22:14',()=>{if(st.talk.dl!=='all')return['us','Aisha: “Nothing silly tonight. You told me.”'];const a=st.deals.archer,d=st.deals.vos,dn=st.deals.dunn;
   if(a&&a.stage<5&&!a.out&&a.fee>RECORD)return{hold:{rec:'archer',fee:a.fee}};
   if(d&&d.out==='hijacked'&&!(dn&&dn.stage===5)){deal('kane',{n:'Jordan Kane',pos:'ST',age:26,from:'kestle',est:64,doubt:2,stage:3,fee:32});return{hold:{rec:'kane',fee:32}}}
   if(d&&d.stage<5&&!d.out){d.fee=32;return{hold:{rec:'vos',fee:32}}}
   return['us','Aisha: “We’re done. I’m going home.”']});
  ev('22:51',()=>{const s=Object.values(st.deals).find(x=>x.recYes&&x.stage<5);if(s){sign(s);return['good',`✍ RECORD: ${s.n} signs for £${s.fee}k at 22:51.`]}return['world','A fax from Kestle arrives at Corden two minutes late. Ha.']});
  ev('23:00',()=>{for(const d of Object.values(st.deals))if(d.stage<5&&!d.out)d.out='gone';st.tc.closed=true;return['bad','23:00. The window is closed.']});
  E.forEach(e=>e.clock=e.d);
 }
 return E;
}
function sign(d){for(const o of Object.values(st.deals))if(o!==d&&o.pos===d.pos&&o.stage<5&&!o.out)delete st.deals[o.id];d.stage=5;d.mark=1;st.budget-=d.fee;flash('budget',-d.fee);st.signed.push(d.n)}
function playWeek(){const T=st.tc;T.wk++;T.phase='play';T.day=-1;T.queue=weekEvents(T.wk);for(const e of T.ticker)e.fresh=0;draw();step()}
function step(){const T=st.tc;if(T.hold)return;const e=T.queue.shift();
 if(!e){T.phase='talk';T.day=7;if(T.wk>=4)T.closed=true;draw();return}
 if(T.wk===4){T.clock=e.clock}else T.day=e.d;
 const r=e.f();for(const d of Object.values(st.deals))if(d.mark&&d.mark++>2)d.mark=0;
 if(r&&r.hold){T.hold=r.hold;T.pending=e.d;draw();return}
 if(r){T.ticker.forEach(x=>x.fresh=0);T.ticker.push({wk:T.wk,d:T.wk===4?e.clock:DAYS[e.d],t:r[1],k:r[0],fresh:1})}
 draw();setTimeout(step,FAST?120:(T.wk===4?1500:1200)/T.speed)}
function resume(text,k){const T=st.tc;T.hold=null;if(text)T.ticker.push({wk:T.wk,d:T.wk===4?T.clock:DAYS[T.pending],t:text,k:k||'you',fresh:1});draw();setTimeout(step,FAST?120:900/T.speed)}

/* ------- after the window ------- */
S.push({day:'The morning after',btn:'To Dock Road: the derby',render:()=>`
 <div class="paper"><div class="mast"><span>THE NORTHMARCH ECHO</span><span>SUMMER EDITION</span></div>
 <h1>${headline()}</h1>
 <p class="muted" style="margin-top:6px">In: ${st.signed.length?st.signed.join(', '):'nobody'}. Out: ${st.sold.length?st.sold.join(', '):'nobody'}.</p></div>
 ${pitch(currentXI(),'Pell United line-up for the opening day')}
 <div class="facts"><div class="fact"><b>${strength()}</b><span>team rating</span></div><div class="fact"><b>£${st.budget}k</b><span>left</span></div><div class="fact"><b>${st.mood}</b><span>trust</span></div></div>
 <p class="note">~ is an estimate: new players are not known until they have played for us.</p>
 ${voice('TE','Tom Ellery',strength()>=62?'That is a team. Bring on Corden.':'We\'ll fight. Don\'t expect miracles.')}`});
S.push({day:'Opening day · Pell v Corden',btn:'Full time',render:()=>`
 <p class="kicker">Opening day · Dock Road · 2,100 sold out</p><h1>The derby</h1>
 <div class="card"><div class="score"><span>Pell United</span><b id="sc">0–0</b><span>Corden Town</span></div></div>
 <ol class="feed" id="feed"></ol>`,after:playMatch});
S.push({day:'Monday · the debrief',btn:'Play again',need:()=>st.debrief,render:()=>{const m=st.match,g=briefGoals(),met=g.filter(x=>x[1]).length;return`
 <p class="kicker">Full time ${m.h}–${m.a} · Monday, the debrief</p><h1>${m.h>m.a?'Dock Road is singing':m.h===m.a?'A point and a story':'A long walk home'}</h1>
 <div class="card"><b>Aisha’s summer: ${met} of 3 goals met</b><ul class="chain">${g.map(x=>`<li>${x[1]?'✓':'✗'} ${x[0]}</li>`).join('')}</ul>
 <div class="choices"><button class="choice ${st.debrief==='back'?'on':''}" data-act="debrief" data-arg="back" ${st.debrief?'disabled':''}><b>Back her</b><span>More confidence and loyalty.</span></button><button class="choice ${st.debrief==='warn'?'on':''}" data-act="debrief" data-arg="warn" ${st.debrief?'disabled':''}><b>Warn her</b><span>A second warning opens the door to replacing her.</span></button></div></div>
 <h2>What your summer did</h2>
 <ul class="chain">${fingerprints().map(c=>`<li><b>${c[0]}</b>${c[1]}</li>`).join('')}</ul>
 <div class="card"><b>Your promise: ${PR.league.o[st.promise.league][1].toLowerCase()}</b><p class="note">One game in. Members' trust is ${st.mood}; under 50% of the vote in May and you are out.</p></div>
 <p class="note">End of the prototype. In the full game the season goes on from here.</p>`}});

function briefGoals(){return[['A starting left-back',!!signedAt('LB')],['A striker better than Thackeray',!!signedAt('ST')],['Our three best players kept',st.cole!=='sold']]}
function headline(){const s=signedAt('ST'),rec=Object.values(st.deals).find(d=>d.recYes&&d.stage===5);
 if(st.cole==='sold'&&st.told==='nobody')return'Pell sell their captain to Corden. Again.';
 if(rec)return`Record night: ${rec.n} signs at 22:51`;
 if(st.cole==='sold')return'Cole crosses to Corden';
 if(st.deals.vos&&st.deals.vos.out==='hijacked')return'Corden snatch Vos from under Pell’s nose';
 if(s&&s.chair)return'The chairman who went to Holbeck';
 if(st.cole!=='sold'&&st.coleDecided)return'Pell tell Corden: not for sale';
 return'A quiet summer at Dock Road'}
function playMatch(){
 const xi=currentXI(),ev=[],stk=signedAt('ST'),lb=signedAt('LB'),youth=st.promise.youth>=1,vosAtCorden=st.deals.vos&&st.deals.vos.out==='hijacked';let h=0,a=0;
 ev.push([1,'Kick-off. Dock Road is full and loud.']);
 if(st.cole==='sold'){ev.push([23,'Danny Cole, in Corden blue, heads in from a corner. He does not celebrate. Nobody believes him.','them',1,'You sold him to them.']);a++}
 else if(st.coleUpset)ev.push([23,'Cole loses his man at a corner. Boyce saves. The captain looks somewhere else.',null,0,'He heard you haggling over him.']);
 else ev.push([23,'Cole wins every header. The captain is everywhere.',null,0,st.coleDecided?'You told Corden no.':'']);
 if(lb&&lb.est>=62)ev.push([38,`${lb.n} clears off the line. Ellery punches the air.`,null,0,'Aisha’s left-back, signed in week 2.']);
 else if(lb){ev.push([38,`${lb.n} is beaten for pace. Corden score.`,'them',1,'Nineteen. He will learn.']);a++}
 else{ev.push([38,'Petit is turned inside out again. Corden score.','them',1,'No left-back came in.']);a++}
 if(vosAtCorden){ev.push([52,'Ryan Vos, in Corden blue, hits the bar. The away end goes up.',null,0,'Corden hijacked him in week 3.'])}
 if(strength()<62&&a<2){ev.push([55,'Corden break. Their new striker finishes it. The away end goes up.','them',1,'Our team rating is '+strength()+'. Corden spent big this summer.']);a++}
 if(youth)ev.push([61,'Owen Garside comes on. Seventeen. His grandmother stands up in the main stand.',null,0,'Your manifest: academy games.']);
 if(stk){ev.push([67,`${stk.n}! Left foot, bottom corner. 1,800 people lose their minds.`,'us',1,stk.chair?'You went to Holbeck to watch him.':stk.recYes?'You approved the record fee at 22:51.':'Aisha’s signing.']);h++}
 else ev.push([67,'Thackeray blazes over from six yards. A groan you can hear in Corden.',null,0,'No striker came in.']);
 if(youth&&strength()>=60){ev.push([84,'Garside skips past two and squares it: Dunleavy scores!','us',1,'The kid you promised a chance.']);h++}
 else if(strength()>=63){ev.push([84,'Dunleavy curls one in from the edge.','us',1,'']);h++}
 ev.push([90,'Full time.']);
 st.match={h,a};
 const feed=$('#feed'),sc=$('#sc');let i=0,gh=0,ga=0;
 const step2=()=>{if(!feed||i>=ev.length){bump('mood',h>a?6:h===a?1:-5);$('#go').disabled=false;return}const [m,t,side,g,you]=ev[i++];if(g){side==='us'?gh++:ga++;sc.textContent=gh+'–'+ga}
  const li=document.createElement('li');if(g)li.className='goal'+(side==='them'?' them':'');li.innerHTML=`<b>${m}′</b><span>${t}${you?`<span class="you">${you}</span>`:''}</span>`;feed.appendChild(li);li.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(step2,FAST?150:1300)};
 $('#go').disabled=true;setTimeout(step2,500);
}
function fingerprints(){const c=[],stk=signedAt('ST');
 c.push(['Day 1: '+(st.told==='nobody'?'“Nobody leaves without my say.”':'“Everyone has a price.”'),st.cole==='sold'&&st.told==='nobody'?' Then you sold him. The members have not forgotten.':st.coleDecided&&st.cole!=='sold'?' You kept him. The dressing room noticed.':' It gave you room to deal.']);
 c.push(['Your week',st.trip==='holbeck'?' You went to Holbeck and put Vos on Aisha’s desk yourself.':st.trip==='tourney'?' You found Sam Okafor, 15, in Marrow Bay. He decides next summer.':' The Dockers told you Corden were desperate before their fax came.']);
 c.push(['Talking to Aisha',st.talk.w2==='push'?' You told her to go hard for the striker.':st.talk.w2==='money'?' You found her £20k more.':' You let her follow her plan.']);
 c.push(['Up front',stk?` ${stk.n} signed${stk.recYes?' on your record approval':''}.${st.match.h?' Pell scored.':''}`:st.deals.vos&&st.deals.vos.out==='hijacked'?' Corden hijacked Vos. He played against you.':' No striker came. Thackeray started.']);
 if(st.promise.youth>=1)c.push(['The manifest',' You promised academy games. Owen Garside played.']);
 c.push(['The money',` The summer ends with £${st.budget}k${st.sold.length?' after selling '+st.sold.join(', '):''}.`]);
 return c}

/* ------- actions ------- */
function act(a,arg){
 if(a==='locked'){toast('Prototype: Pell United is the playable club.');return}
 if(a==='pell'){go(1);return}
 if(a==='tell'){if(st.told)return;st.told=arg;if(arg==='nobody')bump('mood',4);draw();return}
 if(a==='promise'){const [k,i]=arg.split(':');st.promise[k]=+i;draw();return}
 if(a==='plan'){const old=st.plan?BUD[st.plan].v:0;st.plan=arg;st.budget+=BUD[arg].v-old;draw();flash('budget',BUD[arg].v-old);return}
 if(a==='prio'){st.prio=arg;draw();return}
 if(a==='speed'){st.tc.speed=st.tc.speed>1?1:3;draw();return}
 if(a==='talk'){const [k,v]=arg.split(':');if(st.talk[k])return;st.talk[k]=v;if(k==='trip'){st.trip=v;if(v==='holbeck'){st.budget-=2}if(v==='bar')st.mood+=0}if(k==='w2'&&v==='money'){st.budget+=20}draw();if(k==='w2'&&v==='money')flash('budget',20);if(k==='trip'&&v==='holbeck')flash('budget',-2);return}
 if(a==='cole'){st.coleDecided=1;
  if(arg==='sell')sellCole(60,st.told==='nobody'?-12:-5,st.told==='nobody'?'You accept £60k for Danny Cole. Someone sprays MURRAY on the club shop.':'You accept £60k for Danny Cole.');
  else if(arg==='take72')sellCole(72,st.told==='nobody'?-12:-4,'You accept £72k. Cole is a Corden player.');
  else if(arg==='ninety')sellCole(90,st.told==='nobody'?-10:-2,'Corden pay £90k for Cole. Aisha can buy a proper centre-back.');
  else if(arg==='counter'){st.coleUpset=1;st.tc.hold='cole72';draw();return}
  else{bump('mood',st.coleUpset?3:7);resume(st.coleUpset?'Corden walk away. Danny stays, but he knows you listened.':'You tell Corden: not for sale. NOT TO THEM is on the Echo’s front page tomorrow.','you');return}
  return}
 if(a==='rec'){const h=st.tc.hold,d=st.deals[h.rec];if(arg==='yes'){d.recYes=1;d.fee=h.fee;d.stage=4;resume(`You approve £${h.fee}k for ${d.n}. A club record.`,'you')}else{d.out='walked';resume(`Too much. Aisha walks away from ${d.n}.`,'us')}return}
 if(a==='debrief'){if(st.debrief)return;st.debrief=arg;toast(arg==='back'?'Aisha: “Thank you. I won’t forget it.”':'Aisha: “Understood.”');draw();return}
}
function sellCole(v,mood,txt){st.cole='sold';st.budget+=v;st.sold.push('Cole');bump('mood',mood);resume(txt,'you');flash('budget',v)}
function go(n){st.scene=n;draw();window.scrollTo(0,0)}
function draw(){const s=S[st.scene];$('#app').innerHTML=bar(s.day)+s.render();
 const b=$('#go');b.parentElement.hidden=!s.btn&&!s.tc;if(!s.tc){b.textContent=s.btn||'';b.disabled=!!(s.need&&!s.need())}
 if(s.after)s.after()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)act(t.dataset.act,t.dataset.arg)});
$('#go').addEventListener('click',()=>{const s=S[st.scene];
 if(s.tc){if(st.tc.closed){go(st.scene+1);return}if(st.tc.phase==='talk'&&talkDone()){playWeek();window.scrollTo(0,0)}return}
 if(st.scene===S.length-1){location.reload();return}go(st.scene+1)});
draw();
</script>
