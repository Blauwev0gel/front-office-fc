<div class="nm-test-tools" id="nm-test-tools" aria-label="Test controls">
 <details class="nm-test-fold"><summary>Test tools</summary>
  <div class="nm-test-row nm-test-row-primary">
    <button type="button" data-nm-tool="download"><b>↓ Download the full game</b></button>
    <button type="button" data-nm-tool="open">↗ Open separately</button>
  </div>
  <div class="nm-test-row"><button type="button" data-nm-tool="export">Export save</button>
    <button type="button" data-nm-tool="import">Import save</button></div>
  <p class="nm-test-note">Move a save between versions with export and import. If a download is blocked, open this page in its own browser tab first.</p>
 </details>
  <input type="file" id="nm-save-import" accept=".json,application/json" style="display:none">
  <p id="nm-tool-status" class="nm-test-error" role="status" aria-live="polite"></p>
</div>
