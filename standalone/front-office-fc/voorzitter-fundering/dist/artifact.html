<style>
/* Layout: one narrow column, a matchday programme held in one hand; moorland slate with a lamp-orange signal. */
/* Matchday programme: newsprint paper, black ink, the club's own colours as the identity.
   One deliberate light look (the programme is printed on paper); club colours come in as --club / --club2. */
:root{
  --paper:#f3f1eb; --paper2:#e8e4d8; --card:#fbfaf6; --ink:#151515; --muted:#57534a; --line:#cbc5b6; --rule:#151515;
  --navy:#151515; --signal:#b3261e; --good:#1d6b38; --bad:#a8231b; --onnavy:#ffffff; --chip:#e8e4d8;
  --club:#1d3557; --club2:#f4a300; --onclub:#ffffff; --onclub2:#111111;
  --f-display:"Anton","Arial Narrow",Impact,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-voice:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{max-width:460px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.crest{width:34px;height:34px;flex:none}
.top .club{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.02em;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.top .sub{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.top{flex-wrap:wrap}
.top .grow{flex:1;min-width:0}
.navbtns{display:flex;gap:8px;width:100%;justify-content:flex-start}
.navbtns:empty{display:none}
.tbtn{min-height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);font:600 13px var(--f-body);cursor:pointer;flex:none}
main{display:flex;flex-direction:column;gap:16px;padding-top:18px}
h1,h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;text-wrap:balance;margin:0}
h1{font-size:40px} h2{font-size:26px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.voice{font-family:var(--f-voice);font-style:italic;font-size:19px;line-height:1.45}
.scene{display:flex;flex-direction:column;gap:12px}
.where{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;align-items:center;gap:12px}
.face{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--onnavy);background:var(--navy)}
.face.opp{background:var(--signal)}
.who b{display:block;font-weight:600} .who span{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;min-height:52px;padding:12px 16px;border:0;border-radius:10px;background:var(--navy);color:var(--onnavy);font:600 16px var(--f-body);cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn:focus-visible,.choice:focus-visible,.tbtn:focus-visible,.deal:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;min-height:56px;padding:14px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.choice b{font-weight:600} .choice .meta{font-size:13px;color:var(--muted)}
.chance{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:12px;background:var(--chip);color:var(--ink)}
.dots{letter-spacing:.1em;color:var(--signal);font-size:15px}
.deal{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 16px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.deal .dt{font-weight:600;font-size:17px}
.deal dl{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;margin:0;font-size:14px}
.deal dt{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.deal dd{margin:0;min-width:0}
.deal .warn{font-size:13px;color:var(--bad);font-weight:600}
.deal .hit{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.deal.none{border-style:dashed}
.echo{background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.echo .mast{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.echo .mast b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.05em}
.echo .mast span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex:none}
.echo .head{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:.95;text-transform:uppercase;text-wrap:balance}
.echo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row>span:first-child{min-width:0}
.mood{font-weight:600;text-align:right}
.up{color:var(--good)} .down{color:var(--bad)}
.res{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.wdl{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--onnavy)}
.wdl.W{background:var(--good)} .wdl.D{background:var(--muted)} .wdl.L{background:var(--bad)}
.tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px} .log li{font-size:14px}
.log .why{display:block;color:var(--muted);font-size:13px}
.num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count{display:flex;flex-direction:column;gap:12px}
.cg{animation:reveal .5s ease both}
.cg:nth-child(2){animation-delay:.9s}.cg:nth-child(3){animation-delay:1.8s}.cg:nth-child(4){animation-delay:2.7s}
.verdict{animation:reveal .6s ease both;animation-delay:3.4s}
@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cg,.verdict{animation:none}}
.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden} .bar i{display:block;height:100%;background:var(--navy)}
.big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:.9;text-transform:uppercase}
.overlay{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay .inner{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:12px;align-items:flex-start;min-height:56px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--navy)}
.check.on{border-color:var(--navy)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.tabs button.on{border-color:var(--navy);color:var(--navy)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.face.sm{width:36px;height:36px;font-size:15px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .bb{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;min-width:0}
.bubble .bb b{display:block;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.bubble .bb p{font-family:var(--f-voice);font-style:italic;font-size:17px;line-height:1.4}
.narr{color:var(--muted);font-size:15px}
.deskc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.deskc.done{opacity:.7;flex-direction:column;align-items:flex-start;gap:2px;cursor:default}
.deskc .dk{display:flex;flex-direction:column;gap:2px;min-width:0}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.deal .trade{display:flex;flex-direction:column;gap:2px;font-size:14px}
.deal .trade i{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.deal .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag2{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--ink)}
.tag2.risk{color:var(--muted)}
.tag2.warnt{color:var(--bad);font-weight:600}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-variant-numeric:tabular-nums}
.money span{display:flex;flex-direction:column;min-width:0}
.money i{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.money b{font-size:17px}
.mini{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--navy);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.spark{display:inline-flex;align-items:flex-end;gap:3px;height:24px}
.spark i{display:block;width:8px;border-radius:2px;background:var(--muted)}
.spark i.hi{background:var(--good)} .spark i.lo{background:var(--bad)}
.prow{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:8px 0;color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
.choice.on{border-color:var(--navy)}
details.who-more summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:44px;display:flex;align-items:center}
.feed{display:flex;flex-direction:column;gap:10px}
.fcard{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fcard.follow{border-color:var(--signal)}
.fcard .fc{display:flex;flex-direction:column;gap:4px;min-width:0}
.fsrc{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fhead{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;text-wrap:balance;text-align:left}
.linkish{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;min-height:auto}
.fcard p{font-size:15px}
.reacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.rbtn{min-height:40px;padding:0 12px;border-radius:20px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);font:600 13px var(--f-body);cursor:pointer}
.reply{font-family:var(--f-voice);font-style:italic;color:var(--ink)}
.face.src-region{background:var(--signal)} .face.src-town{background:var(--good)} .face.src-staff{background:var(--muted)}
.fixture .vs{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted)}
.yours{border-color:var(--navy);border-width:1.5px}

/* ===== programme layer ===== */
body{font-family:var(--f-body);font-size:16.5px;line-height:1.5;background:var(--paper);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{background:var(--club)}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1}
h2{font-size:30px}
.eyebrow,.fsrc,.where,.tag,.who span,.deal dt,.money i,.tag2,.tbtn,.tabs button{font-family:var(--f-label);letter-spacing:.08em}
.eyebrow{font-size:14px;font-weight:700;color:var(--ink);border-bottom:3px solid var(--club);display:inline-block;padding-bottom:2px;align-self:flex-start}
.small{font-size:14px}.meta,.choice .meta{font-size:14px}
p{max-width:46ch}
.top{background:var(--club);color:var(--onclub);margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:6px solid var(--club2)}
.top .club{font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--onclub)}
.top .sub{font-family:var(--f-label);font-size:13px;font-weight:600;color:var(--onclub);opacity:.85}
.top .crest{width:40px;height:40px}
.navbtns{display:none}
/* buttons: firm and fast */
.btn,.choice,.deal,.deskc,.rbtn,.prow,.tab,.mini,.fhead.linkish{transition:transform .08s ease,box-shadow .08s ease,background .12s}
.btn:active,.choice:active,.deal:active,.deskc:active,.rbtn:active,.tab:active,.mini:active{transform:scale(.97)}
.btn{background:var(--club);color:var(--onclub);border:2px solid var(--rule);border-radius:4px;font-family:var(--f-label);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 3px 0 var(--rule)}
.btn:active{box-shadow:0 1px 0 var(--rule);transform:translateY(2px)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--rule)}
.btn.primary{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6}
.noNav .btn.primary{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.choice,.deal,.deskc,.panel,.fcard,.mini{border-radius:4px;border:1.5px solid var(--rule);background:var(--card)}
.panel{box-shadow:none}
/* bottom bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:3px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{min-height:62px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--ink)}.tab.on::before{content:"";position:absolute;top:0;left:18%;right:18%;height:5px;background:var(--club)}
.tab .badge{position:absolute;top:8px;right:22%;min-width:20px;height:20px;border-radius:10px;background:var(--signal);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
/* the cover */
.cover{margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));padding:18px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:var(--club);color:var(--onclub);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-bottom:8px solid var(--club2);margin-top:-18px}
.cover .crest{width:96px;height:96px}
.cover h1{font-size:36px;color:var(--onclub);text-wrap:balance}
.cover .meta2{font-family:var(--f-label);font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.cover-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:2px solid var(--rule);background:var(--card)}
.cover-stats>div{padding:8px 10px;border-right:1.5px solid var(--rule);min-width:0}.cover-stats>div:last-child{border-right:0}
.cover-stats i{display:block;font-style:normal;font-family:var(--f-label);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cover-stats b{font-family:var(--f-display);font-weight:400;font-size:24px}
.form{display:flex;gap:4px}.form span{width:22px;height:22px;display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:13px;color:#fff}
.form .W{background:var(--good)}.form .D{background:#77736a}.form .L{background:var(--bad)}
.stadium{width:100%;height:auto;max-width:100%}
/* feed: three weights */
.fcard{border-left:8px solid var(--club)}
.fcard.heavy{flex-direction:column;border-left-width:1.5px;border-top:10px solid var(--club)}
.fcard.heavy .fhead{font-size:30px}
.fcard.small{padding:8px 12px}.fcard.small .fhead{font-size:18px}
.fhead{font-family:var(--f-display);font-weight:400}
.portrait,.crest,.kit{flex:none;display:block}
/* stamp */
.stamp{display:inline-block;font-family:var(--f-display);font-size:18px;letter-spacing:.06em;color:var(--signal);border:3px solid var(--signal);padding:0 8px;transform:rotate(-6deg);animation:stamp .25s ease-out both}
.stamp.no{color:var(--muted);border-color:var(--muted)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.6);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
/* programme page for Saturday */
.prog{border:2px solid var(--rule);background:var(--card)}
.prog .band{background:var(--club);color:var(--onclub);padding:6px 12px;font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:4px solid var(--club2)}
.prog .vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px}
.prog .vsrow .side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.prog .vsrow b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1;text-wrap:balance}
.prog .vs{font-family:var(--f-display);font-size:26px}
.teamsheet{columns:2;column-gap:16px;padding:0 12px 12px;font-size:15px}
.teamsheet li{list-style:none;break-inside:avoid}.teamsheet b{font-family:var(--f-label);display:inline-block;width:24px}
/* scoreboard */
.board{background:#121212;color:#f5c542;border:3px solid var(--rule);padding:12px 14px;font-family:var(--f-display);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.board .t{font-size:22px;color:#f3f1eb;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.board .s{font-size:44px;line-height:1;animation:roll .5s ease-out both}
.board .ft{grid-column:1/-1;font-family:var(--f-label);font-weight:700;letter-spacing:.2em;color:#f5c542;font-size:14px}
@keyframes roll{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.celebrate .crest{animation:pulse .9s ease-out 2}
@keyframes pulse{50%{transform:scale(1.08)}}
.enter{animation:enter .2s ease-out both}
@keyframes enter{from{opacity:0}to{opacity:1}}
main.enter>*{animation:enterUp .2s ease-out both}
@keyframes enterUp{from{opacity:.0;translate:0 6px}to{opacity:1;translate:0 0}}
main.enter>.btn.primary{animation:none}
@media (prefers-reduced-motion:reduce){.enter{animation:fade .15s both}.stamp,.board .s,.celebrate .crest{animation:none}.btn,.choice,.deal,.deskc{transition:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rbtn{border-radius:4px;border:2px solid var(--rule);color:var(--ink);font-family:var(--f-label);font-size:15px;font-weight:700;letter-spacing:.04em;min-height:44px}
.deskc{border-left:8px solid var(--club)}
.face.sm{width:40px;height:40px}
.bubble .bb{border:1.5px solid var(--rule);border-radius:2px 12px 12px 12px}
.bubble .bb b{font-family:var(--f-label);font-size:13px;color:var(--ink);text-transform:uppercase}
.bubble .bb p{font-style:italic;font-size:17px}
/* audit fixes: reach, size, legibility */
.fsrc{font-size:13px}
.deal .trade i{font-size:13px}
.tag2{font-size:13px}
.tab .badge{font-size:13px;min-width:22px;height:22px}
.fhead.linkish{min-height:44px;display:flex;align-items:center;padding:4px 0}

/* hiring the director: candidate cards */

.prio{background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.prio-h{display:flex;align-items:center;gap:10px}.prio-h b{flex:1;font-size:16px;line-height:1.2}
.prio-n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--club);color:var(--onclub);display:grid;place-items:center;font-family:var(--f-display);font-size:18px}
.prio-mv{display:flex;gap:6px}.mv{min-width:44px;min-height:44px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);font-size:16px;cursor:pointer;color:var(--ink)}.mv:disabled{opacity:.35;cursor:default}
.tgts li{display:flex;gap:8px;align-items:center;font-size:15px}.tgt{flex:none;width:26px;height:26px;border-radius:6px;background:var(--paper2);display:grid;place-items:center;font-family:var(--f-display);font-size:15px}

.tk-good .tk-i{background:#e3f3e7;color:var(--good)}.tk-bad .tk-i{background:#fbe5e2;color:var(--bad)}.tk-wait .tk-i{background:#fdf0cf;color:#7a5200}.tk-rumour .tk-i{background:#e6ecf6;color:#2f4c7a}.tk-echo .tk-i{background:#e6ecf6;color:#2f4c7a}
.tk-rumour{font-style:italic}.tk-world{color:var(--muted)}
.talk{background:#fff6d6;border:2px solid var(--rule);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.talk p{margin:0}

.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bal>div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:15px}.bal p{margin:0}

.chipr.good{color:var(--good);background:#e3f3e7}.chipr.bad{color:var(--bad);background:#fbe5e2}

/* assessment, running ticker, report, staff */
.as{display:flex;flex-direction:column;gap:8px}.as-p{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;font-size:15px}
.sv-plain{color:var(--ink);background:var(--paper2)}
.tk-wk{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}

.an-n{font-family:var(--f-display);font-size:18px;text-transform:uppercase}
.chipr.plain{color:var(--muted);background:var(--paper2)}
.pc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--rule);border-radius:14px;padding:10px}.pc.out{border-style:dashed}
.pc-b{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:15px}.pc-b b{font-family:var(--f-display);font-weight:400;font-size:20px;text-transform:uppercase;line-height:1}
.pc-m{color:var(--ink)}.pc-s{margin:2px 0 0;font-family:var(--f-voice);font-style:italic;font-size:15px;color:var(--muted)}
.rb{align-self:flex-start;min-height:44px;padding:0 14px;border:1.5px solid var(--rule);border-radius:999px;background:var(--paper);font:600 14px var(--f-body);color:var(--ink);cursor:pointer}
.lnk{background:none;border:0;padding:0;min-height:44px;font:600 15px var(--f-body);color:var(--ink);text-decoration:underline;cursor:pointer}
.tab span{font-size:13px}

.an-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.an-d{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)}.an-d b{color:var(--ink)}

/* ===== the opening ===== */
.big-h{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:.95;text-transform:uppercase;margin:0;text-wrap:balance}
.lbl{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.ttl{position:relative;min-height:100vh;min-height:100dvh;background:#101418;color:#f4f1e9;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:0!important;max-width:none!important}
.ttl-sky{position:absolute;inset:0;background:radial-gradient(60% 45% at 20% 38%,rgba(255,240,190,.45),transparent 70%),radial-gradient(60% 45% at 82% 34%,rgba(255,240,190,.4),transparent 70%),#101418;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(.9)}to{filter:brightness(1.08)}}
.tw{position:absolute;width:6px;background:#2a2f36;top:36%;bottom:30%}.tw.l{left:20%}.tw.r{left:82%;top:33%}
.tw::before{content:"";position:absolute;left:-20px;top:-16px;width:46px;height:18px;background:repeating-linear-gradient(90deg,#fff6d0 0 9px,transparent 9px 12px);border-radius:2px}
.ttl-town{position:absolute;left:0;right:0;bottom:24%;width:100%;height:120px}
.ttl-b{position:relative;display:flex;flex-direction:column;gap:14px;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#0b0e11 30%)}
.ttl-b h1{font-family:var(--f-display);font-weight:400;font-size:60px;line-height:.9;text-transform:uppercase;margin:0;color:#fff}
.ttl-b p{margin:0;font-size:18px;max-width:28ch}
.ttl-k{color:#ffd84a}
.btn.gold{background:#ffd84a;color:#141417;border-color:#141417}
.btn.ghost.on-dark{background:transparent;color:#f4f1e9;border-color:#f4f1e9;box-shadow:none}
.field{display:flex;flex-direction:column;gap:4px}
.field input{min-height:48px;border:2px solid var(--rule);border-radius:12px;padding:0 12px;font:600 18px var(--f-body);background:var(--card);color:var(--ink)}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--rule);border-radius:4px 16px 16px 16px;padding:10px;animation:msgIn .4s cubic-bezier(.3,1.5,.6,1) both}
.msg:nth-child(2){animation-delay:.45s}.msg:nth-child(3){animation-delay:.9s}.msg:nth-child(4){animation-delay:1.35s}
.msg b{display:block;font-size:15px}.msg i{font-family:var(--f-voice);font-size:16px}
@keyframes msgIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.dos{flex:0 0 86%;scroll-snap-align:center;border:2.5px solid var(--rule);border-radius:18px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--rule)}
.dos-top{background:var(--club);color:var(--onclub);padding:12px;display:flex;gap:10px;align-items:center;min-height:118px}
.dos-top b{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:.95;text-transform:uppercase;display:block}
.dos-town{display:block;font-size:14px;margin-top:2px}
.dos-tag{display:inline-block;margin-top:6px;background:#ffd84a;color:#141417;border:2px solid #141417;border-radius:8px;padding:1px 8px;font-family:var(--f-display);font-size:14px;transform:rotate(-3deg)}
.dos-stars{display:inline-block;margin-left:8px;font-size:14px;letter-spacing:1px}
.dos-mid{padding:10px 12px;display:flex;flex-direction:column;gap:9px;flex:1}.dos-mid p{margin:0;font-size:16px}
.dos-dream{display:flex;gap:8px;align-items:center;font-size:15px}
.dos-env{display:flex;gap:10px;align-items:center;border:2px dashed var(--muted);border-radius:12px;padding:8px 10px;color:var(--muted);font-weight:600;font-size:15px}
.env-ic{display:inline-block;font-size:20px;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,85%,100%{transform:none}90%{transform:rotate(-10deg)}95%{transform:rotate(10deg)}}
.dos-pick{min-height:52px;border:0;border-top:2px solid var(--rule);background:var(--club);color:var(--onclub);font-family:var(--f-display);font-size:19px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.deck-hint{text-align:center;margin:0;font-size:14px}
.contract{background:#fffdf6;border:1.5px solid var(--line);border-radius:6px;padding:16px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;gap:8px;font-family:var(--f-voice);font-size:16px}
.contract p{margin:0}.ct-h{font-family:var(--f-display);font-size:22px;text-transform:uppercase;text-align:center}
.sigline{border-bottom:2px solid var(--ink);height:44px}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.4);transform-origin:left;transform:scaleX(0);pointer-events:none}
.hold.go .fill{transform:scaleX(1);transition:transform .95s linear}
.hold-t{position:relative;pointer-events:none}
.flood{position:relative;background:var(--club);color:var(--onclub);border:2px solid var(--rule);border-radius:18px;min-height:420px;display:grid;place-items:center;text-align:center;overflow:hidden;animation:flood .7s ease both}
@keyframes flood{from{clip-path:circle(0 at 50% 60%)}to{clip-path:circle(150% at 50% 60%)}}
.flood-in{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
.flood-in svg{animation:drop .5s cubic-bezier(.3,1.6,.6,1) .5s both}
@keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.paper{background:#fff;color:#141417;border:2px solid #141417;border-radius:4px;padding:8px 12px;transform:rotate(-2deg);font-family:var(--f-display);font-size:19px;text-transform:uppercase}
.stamp-s{position:absolute;right:14px;top:16px;border:4px solid #fff;color:#fff;font-family:var(--f-display);font-size:24px;padding:0 10px;border-radius:8px;transform:rotate(-12deg);animation:stampIn .3s cubic-bezier(.3,1.6,.6,1) .9s both}
@keyframes stampIn{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.95}}
.envbig{position:relative;width:100%;min-height:180px;border:2.5px solid var(--rule);border-radius:16px;background:#f3e6c4;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;font:inherit;color:inherit}
.envbig .flap{position:absolute;inset:0 0 50% 0;background:#e6d3a3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s}
.envbig.opened .flap{transform:rotateX(180deg)}
.envbig .seal{position:relative;width:60px;height:60px;border-radius:50%;background:#b3261e;color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;text-transform:uppercase;box-shadow:0 2px 0 rgba(0,0,0,.3);animation:wig 2.4s ease-in-out infinite}
.env-sym{position:relative;font-size:52px;animation:drop .45s both}

.chipr.warn{color:#7a5200;background:#fdf0cf}
.stand{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;background:var(--club);border:2px solid var(--rule);border-radius:14px;padding:10px 8px;color:var(--onclub)}
.grp{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.sface{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #141417;display:grid;place-items:center;animation:bump .35s ease both}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.g-m{font-family:var(--f-body);font-weight:600;font-size:13px;text-transform:none;letter-spacing:0}
.prog{display:flex;gap:6px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--club)}
.react{font-weight:700;font-size:16px;margin:0;animation:msgIn .35s both}
.say{font-family:var(--f-voice);font-style:italic;font-size:19px;margin:0}
.trade{display:block;background:var(--card);border:2px solid var(--rule);border-radius:16px;overflow:hidden;width:100%;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;position:relative}
.trade:disabled{cursor:default}.trade:disabled:not(.chosen){opacity:.55}
.trade .tt{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1.5px solid var(--line)}.trade .tt b{flex:1;font-size:16px;line-height:1.15}
.tone{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1.5px solid currentColor}
.tone.safe{color:var(--good);background:#e3f3e7}.tone.bold{color:#7a5200;background:#fdf0cf}
.trade .cols{display:grid;grid-template-columns:1fr 1fr}
.trade .col{padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:600}
.trade .col i{font-style:normal;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.trade .give{background:#fbe5e2}.trade .give i{color:var(--bad)}.trade .get{background:#e3f3e7}.trade .get i{color:var(--good)}
.trade .st{position:absolute;right:12px;top:8px;border:3px solid var(--good);color:var(--good);font-family:var(--f-display);font-size:20px;padding:0 6px;border-radius:6px;transform:rotate(-10deg);display:none;background:rgba(255,255,255,.9)}
.trade.chosen .st{display:block;animation:stampIn .3s both}
@media (prefers-reduced-motion:reduce){.ttl-sky,.msg,.env-ic,.flood,.flood-in svg,.stamp-s,.envbig .seal,.env-sym,.secret,.sface,.react,.trade.chosen .st{animation:none}}
.flood-in .crest{width:120px;height:120px}.dos-top .crest{width:64px;height:64px}.msg .crest{width:40px;height:40px}
/* ===== the ticker, broadcast style ===== */
.tc{--gold:#ffd84a;border:2px solid var(--rule);border-radius:16px;overflow:hidden;background:#11151b;color:#f4f1e9;display:flex;flex-direction:column}
.tc-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0b0e12;border-bottom:3px solid var(--club)}
.live-dot{width:10px;height:10px;border-radius:50%;background:#ff4d3d;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,61,.7)}70%{box-shadow:0 0 0 8px rgba(255,77,61,0)}100%{box-shadow:0 0 0 0 rgba(255,77,61,0)}}
.tc-top b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.clock{margin-left:auto;text-align:right;line-height:1.1}.clock b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}.clock span{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#c9c3b4}

.tc-body{padding:12px;display:flex;flex-direction:column;gap:10px}

.feed{display:flex;flex-direction:column;gap:8px}

function rec(id,f,a){const t=S.tbl[id];t.p++;t.gf+=f;t.ga+=a;if(f>a){t.w++;t.pts+=3}else if(f===a){t.d++;t.pts++}else t.l++}
function simRound(r){
  let mine=null;if(S.cf)C().str=cfStrength(0);
  for(const tier of [0,1])for(const [h,a] of S.fx[tier][r-1]){
    const sh=h===S.my?myStr(r,true,a):CL(h).str,sa=a===S.my?myStr(r,false,h):CL(a).str;
    const [lh,la]=lambdas(sh,sa,true);const gh=pois(lh,rnd),ga=pois(la,rnd);rec(h,gh,ga);rec(a,ga,gh);
    if(h===S.my||a===S.my){const home=h===S.my,gf=home?gh:ga,gag=home?ga:gh,opp=home?a:h;const xp=home?xpts(lh,la):xpts(la,lh);const pts=gf>gag?3:gf===gag?1:0;
      S.realPts+=pts;S.xPts+=xp;if(opp===C().rival)S.derbyPts+=pts;
      mine={r,opp,home,gf,ga:gag,pts,derby:opp===C().rival,xf:home?lh:la,xa:home?la:lh,scorers:[],why:[]};
      if(S.cf)matchDetail(mine);}
  }

}
function standings(tier){return Object.keys(S.tbl).filter(i=>CL(i).tier===tier).sort((x,y)=>{const a=S.tbl[x],b=S.tbl[y];return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf})}
function posOf(id){return standings(CL(id).tier).indexOf(id)+1}
function myPos(){return posOf(S.my)}
function luck(){const d=S.realPts-S.xPts;return d<=-4?'unlucky':d>=4?'lucky':'fair'}
function luckWord(){return{unlucky:'Unlucky: we deserved more',lucky:'Lucky: we got more than we deserved',fair:'About what we deserved'}[luck()]}
function computeChances(){
  if(S.cf)C().str=cfStrength(0);const r=mkRng(S.seed^(S.season*7919)),N=150,c=C(),tier=c.tier,ids=Object.keys(S.clubs).filter(i=>CL(i).tier===tier),cnt={survive:0,topHalf:0,promo:0,derby:0,goals:0};
  for(let s=0;s<N;s++){const tb={};ids.forEach(i=>tb[i]={pts:0,gd:0,gf:0});let dp=0;
    for(const rd of S.fx[tier])for(const [h,a] of rd){const [lh,la]=lambdas(CL(h).str,CL(a).str,true);const gh=pois(lh,r),ga=pois(la,r);const ph=gh>ga?3:gh===ga?1:0,pa=ga>gh?3:gh===ga?1:0;
      tb[h].pts+=ph;tb[a].pts+=pa;tb[h].gd+=gh-ga;tb[a].gd+=ga-gh;tb[h].gf+=gh;tb[a].gf+=ga;if(h===c.id&&a===c.rival)dp+=ph;if(a===c.id&&h===c.rival)dp+=pa}
    const o=ids.slice().sort((x,y)=>tb[y].pts-tb[x].pts||tb[y].gd-tb[x].gd);const p=o.indexOf(c.id)+1;
    if(p<=14)cnt.survive++;if(p<=8)cnt.topHalf++;if(p<=2)cnt.promo++;if(dp>=4)cnt.derby++;if(tb[c.id].gf>=42)cnt.goals++;}
  const out={};for(const k in cnt)out[k]=cnt[k]/N;return out;
}
function chanceWord(p){return p<.12?'Long shot':p<.35?'Unlikely':p<.6?'Coin toss':p<.85?'Likely':'Near certain'}

/* the squad behind the result: who played, who scored, and two lines of why */
function matchDetail(m){
  const xi=pickXI(S.cf.squad,S.youth),c=C();
  for(const x of xi){x.p.apps++;if(x.p.academy&&x.p.apps===1)S.debuts++;if(S.cf.talentPid===x.p.id)S.talentStarts++}
  const w={ST:4,W:3,AM:3,CM:1.2,DM:.5,FB:.4,CB:.5,GK:0};
  const scP=[];for(let g=0;g<m.gf;g++){let tot=0;for(const x of xi)tot+=(w[x.slot]||0)*x.p.q;let r=rnd()*tot,sc=xi[0].p;for(const x of xi){r-=(w[x.slot]||0)*x.p.q;if(r<=0){sc=x.p;break}}sc.goals++;sc.sGoals++;scP.push(sc);m.scorers.push(sc.name.split(' ').slice(-1)[0])}
  const mins=scP.map(()=>ri(3,90)).sort((a,b)=>a-b);m.goals=scP.map((p,i)=>({id:p.id,name:p.name,min:mins[i]}));m.xiIds=xi.map(x=>x.p.id);
  const gk=xi.find(x=>x.slot==='GK');if(gk&&m.ga===0&&m.xa>1.1)m.save={id:gk.p.id,name:gk.p.name};
  if(m.ga>=3){const df=xi.filter(x=>['CB','FB'].includes(x.slot));if(df.length)m.error={id:df[0].p.id,name:fv?df[Math.floor(rnd()*df.length)].p.name:df[0].p.name}}
  storiesAfterMatch(m,xi,scP);m.moments=S.cf.events.filter(e=>e.kind==='story'&&e.w===S.week&&e.s===S.season&&['debut','firstGoal','hundred','comeback','winner'].includes(e.sk)).map(e=>e.text);
  const why=[],oop=xi.filter(x=>x.p.pos!==x.slot),injKey=S.cf.squad.filter(p=>p.inj>0&&p.q>=12),opp=CL(m.opp);
  if(m.pts<3&&oop.length)why.push(`${oop[0].p.name} played ${POS_ONE[oop[0].slot]} out of position${oop.length>1?`, and ${oop.length-1} more were out of place`:''}.`);
  if(m.pts<3&&injKey.length)why.push(`We missed ${injKey[0].name}${injKey.length>1?' and '+injKey[1].name:''} through injury.`);
  if(m.gf+.8<m.xf)why.push('We created enough. The finishing let us down.');
  if(m.gf>m.xf+1.2)why.push('We scored more than our chances deserved.');
  if(m.xa>m.xf+.5&&m.pts<3)why.push(`${opp.name} were simply the stronger side.`);
  if(m.xf>m.xa+.5&&m.pts===3)why.push(`We were the better side and it showed.`);
  if(m.derby&&m.home&&S.flags.derbyCrowd)why.push('The crowd carried us through the derby.');
  if(S.youth&&xi.some(x=>x.p.age<=21))why.push(`The youngsters started: ${xi.filter(x=>x.p.age<=21).map(x=>x.p.name.split(' ').slice(-1)[0]).slice(0,3).join(', ')}.`);
  if(!why.length)why.push(m.pts===3?'A solid team performance.':m.pts===1?'An even game.':'A bad day at the office.');
  m.why=why.slice(0,2);m.xi=xi.map(x=>({n:x.p.name,slot:x.slot,oop:x.p.pos!==x.slot}));
}

/* ================= Opposition and news ================= */
function oppMove(){
  const out=[],opp=P(cast('opp'));if(!opp)return out;
  if(S.flags.oppBoard){out.push(`${opp.name}, now on your board, has gone very quiet.`);return out}
  S.oppMoves=(S.oppMoves||0)+1;
  if(!S.served)grp(S.oppGroup,-2,`You left ${gname(C(),S.oppGroup)} to ${opp.name}`);
  const pending=S.cross.filter(c=>c.dir==='down').map(c=>c.id);
  const low=['captain','td','coach','fan'].map(cast).filter(id=>id&&P(id).loy!=null&&P(id).loy<4&&!P(id).withOpp&&!pending.includes(id));
  if(low.length&&!(S.flags.oppCommittee&&rnd()<.5)){const id=low[0];P(id).withOpp=true;log(`${P(id).name} is now in ${opp.name}'s camp`,`${opp.name} courts the people you neglect`,null);out.push(`Rumour: ${P(id).name} was seen at lunch with ${opp.name}. Twice.`);return out}
  const bp=S.promises.find(p=>p.st==='open'&&behind(p.id));
  if(bp&&!S.flags.truce){const g=pgroups(bp.id)[0];if(g)grp(g,-3,`${opp.name} attacks your promise: ${pdef(bp.id).t}`);out.push(`${opp.name}: "${pdef(bp.id).t}? Look at the table. What else did the chairman promise you?"`);return out}
  out.push(`${opp.name} at a members' evening: "This club could be so much more. Ask yourselves why it isn't."`);return out;
}
function knows(pid){const p=P(pid);return p&&(p.loy!=null||p.mem.length>0)}
function newsPush(text,ids=[],clubs=[]){let pri=4;if(ids.some(knows))pri=1;else if(clubs.includes(C()?.rival))pri=2;else if(clubs.some(c=>CL(c)&&C()&&CL(c).tier===C().tier))pri=3;S.news.push({pri,text,s:S.season,r:S.round})}
function aiWinter(){
  for(const id of Object.keys(S.clubs)){if(id===S.my)continue;const c=CL(id),ch=P(c.cast.chair),pos=posOf(id);
    const imp=ch&&(ch.traits.includes('impulsive')||ch.traits.includes('ambitious')||ch.value==='glory');
    if(pos-c.expect>=(imp?4:6)&&rnd()<.6)sackAI(c,'at Christmas');}
}
function sackAI(c,when){
  const old=c.cast.coach,op=P(old);if(!op)return;op.club=null;S.pool.push(old);c.str=clamp(c.str-0.5,40,60);
  const cand=S.pool.filter(x=>x!==old);let nu=cand.length?pick(cand):mkPerson('coach',null);S.pool=S.pool.filter(x=>x!==nu);
  const np=P(nu);np.club=c.id;np.career.push(c.id);c.cast.coach=nu;c.str=clamp(c.str+(rnd()<.5?1:0),40,60);
  newsPush(`${c.name} sack ${op.name} ${when}. ${np.name} takes over.`,[old,nu],[c.id]);
}
function aiSeasonEnd(){
  for(const id of Object.keys(S.clubs)){if(id===S.my)continue;const c=CL(id),pos=posOf(id);
    if(pos-c.expect>=5&&rnd()<.55){const old=P(c.cast.chair),nu=c.cast.opp;c.cast.chair=nu;P(nu).role='chair';c.cast.opp=mkPerson('opp',id,{infl:weakest(c)});newsPush(`${c.name}: chairman ${old.name} voted out at the AGM. ${P(nu).name} takes the chair.`,[old.id,nu],[id]);old.club=null}
    else if(pos-c.expect>=3&&rnd()<.35)sackAI(c,'in the summer');
    if(c.cast.captain&&P(c.cast.captain).age>=33&&rnd()<.5){const cap=P(c.cast.captain);cap.role='retired';newsPush(`${cap.name} retires as captain of ${c.name}.`,[cap.id],[id]);c.cast.captain=mkPerson('captain',id,{infl:cap.infl})}
  }
}
function promoteRelegate(){
  const t0=standings(0),t1=standings(1),down=t0.slice(-2),up=t1.slice(0,2);
  down.forEach(i=>CL(i).tier=1);up.forEach(i=>CL(i).tier=0);
  up.forEach(i=>newsPush(`${CL(i).name} are promoted to the Northmarch Premier.`,[],[i]));down.forEach(i=>newsPush(`${CL(i).name} go down.`,[],[i]));
  // a relegated club's star moves to a promoted one
  const from=pick(down),to=pick(up);CL(from).str=clamp(CL(from).str-1,40,60);CL(to).str=clamp(CL(to).str+1,40,60);
  newsPush(`${CL(from).name}'s best player joins ${CL(to).name}.`,[],[from,to]);
  Object.keys(S.clubs).forEach(i=>{CL(i).last=posOf(i);CL(i).str=clamp(CL(i).str+(rnd()<.5?-1:1)*(rnd()<.4?1:0),40,60)});
  Object.values(S.P).forEach(p=>p.age++);
}

/* ================= Club foundation: players and the squad =================
   This layer knows nothing about the chairman. It reads core and world only.
   Positions, neighbouring positions and the minimum per position come from claude-game (engine/03-players.js). */
const POS=['GK','CB','FB','DM','CM','AM','W','ST'];
const POS_L={GK:'Goalkeepers',CB:'Centre-backs',FB:'Full-backs',DM:'Holding midfield',CM:'Central midfield',AM:'Attacking midfield',W:'Wingers',ST:'Strikers'};
const POS_ONE={GK:'goalkeeper',CB:'centre-back',FB:'full-back',DM:'holding midfielder',CM:'central midfielder',AM:'attacking midfielder',W:'winger',ST:'striker'};
const NEAR={GK:[],CB:['FB','DM'],FB:['CB','W'],DM:['CM','CB'],CM:['DM','AM'],AM:['CM','W','ST'],W:['AM','FB','ST'],ST:['W','AM']};
const REQ={GK:2,CB:4,FB:3,DM:2,CM:3,AM:2,W:3,ST:3};
const XI_SLOTS=['GK','FB','CB','CB','FB','DM','CM','AM','W','ST','W'];
const PTRAITS=['leader','professional','temperamental','injury-prone','local hero','quiet'];
const PFIRST=['Kyle','Bradley','Ryan','Nathan','Mo','Femi','Josh','Connor','Jamie','Callum','Kieran','Liam','Marcus','Jordan','Sam','Tyler','Ellis','Dean','Reece','Harvey','Aaron','Lewis','Theo','Ollie','Kofi','Jakub','Matty','Ethan','Joe','Danny','Brandon','Cian','Ruben','Isaac','Noah','Alfie','Zach','Billy','Jay','Ashley'];
const PLAST=['Agyeman','Rowntree','Whitlock','Dunleavy','Corrigan','Sefton','Pickles','Fairclough','Ashworth','Barraclough','Cawthorne','Dearden','Entwistle','Fenton','Greenhalgh','Hepworth','Illingworth','Jowett','Kershaw','Lockwood','Midgley','Nolan','Ormerod','Priestley','Ramsden','Sutcliffe','Thackeray','Uttley','Varley','Waddington','Yeadon','Okonjo','Mensah','Kowalczyk','Brannigan','Hussain','Achterberg','Doherty','Lomax','Tetley'];
function pname(){const used=new Set((S.cf&&S.cf.squad||[]).map(p=>p.name));for(let i=0;i<20;i++){const n=`${pick(PFIRST)} ${pick(PLAST)}`;if(!used.has(n))return n}return `${pick(PFIRST)} ${pick(PLAST)}`}
function wageFor(q){return Math.round((200+(q-8)*95)/10)*10}
function newPlayer(pos,o={}){
  const age=o.age??ri(18,33),q=o.q??Math.round((9+rnd()*5)*10)/10;
  const head=age<=19?1.5+rnd()*4:age<=22?rnd()*2.5:age<=24?rnd():0;
  const p={id:'pl'+(S.pc++),name:o.name||pname(),pos,age,q,pa:Math.round((q+head)*10)/10,contract:o.contract??ri(1,3),
    wage:Math.round(wageFor(q)*(0.85+rnd()*.3)/10)*10,form:ri(55,75),inj:0,trait:o.trait||pick(PTRAITS),academy:!!o.academy,loan:false,apps:0,goals:0,joined:S.season,
    morale:ri(55,72),formHist:[],sApps:0,sGoals:0,miles:[],career:o.academy?['Academy']:[]};
  givePlayerLife(p,o);return p;
}
function playerValue(p){return Math.max(1,Math.round((p.q-7)*(p.q-7)*1.6*(p.age<=21?1.6:p.age<=25?1.3:p.age<=29?1:p.age<=31?.6:.35)*(1+Math.max(0,p.pa-p.q)*.12)))}
function qWord(q){return q<9?'Poor':q<10.5?'Squad player':q<12?'Solid':q<13.5?'Key player':'Star'}
function phaseWord(p){return p.age<=23&&p.pa>p.q+1?'rising':p.age>=31?'fading':'at their peak'}
function genSquad(clubStr){
  // A club's squad matches its strength: str 50 ~ average quality 11.5
  const base=11.5+(clubStr-50)/4,sq=[];
  for(const pos of POS)for(let i=0;i<REQ[pos];i++)sq.push(newPlayer(pos,{q:Math.round((base-1.2+rnd()*2.6)*10)/10}));
  // the dice leave real holes: one position short, two academy kids, one extra midfielder
  const short=pick(['FB','CB','W','DM']);sq.splice(sq.findIndex(p=>p.pos===short),1);
  sq.push(newPlayer(pick(['CM','ST','W']),{q:Math.round((base-.8+rnd()*1.6)*10)/10}));
  sq.push(newPlayer(pick(['ST','W','CM']),{age:ri(17,18),q:Math.round((base-3+rnd())*10)/10,academy:true,contract:2}));
  sq.push(newPlayer(pick(['CB','FB','AM']),{age:ri(17,18),q:Math.round((base-3+rnd())*10)/10,academy:true,contract:2}));
  return sq;
}
function fitFor(p,slot){return p.pos===slot?1:NEAR[p.pos].includes(slot)?.85:(slot==='GK'||p.pos==='GK')?.3:.6}
function available(sq){return sq.filter(p=>p.inj<=0&&!p.loan)}
function pickXI(sq,youthBias){
  const av=available(sq),xi=[];
  const score=p=>p.q+(p.form-65)/40+(youthBias&&p.age<=21?youthBias*.9:0);
  for(const slot of XI_SLOTS){let b=null,bv=-99;for(const p of av){if(xi.some(x=>x.p===p))continue;const v=score(p)*fitFor(p,slot);if(v>bv){bv=v;b=p}}if(b)xi.push({p:b,slot})}
  return xi;
}
function squadQuality(sq,youthBias){const xi=pickXI(sq,youthBias);if(!xi.length)return 8;return xi.reduce((a,x)=>a+x.p.q*fitFor(x.p,x.slot),0)/11-(11-xi.length)*.6}
function qualityToStr(q){return 50+(q-11.5)*4}
function squadGaps(sq){
  const out=[];
  for(const pos of POS){const n=available(sq).filter(p=>p.pos===pos).length;if(n<REQ[pos])out.push({pos,kind:'short',text:`${n?'Only '+n:'No'} fit ${POS_ONE[pos]}${n===1?'':'s'}; we need ${REQ[pos]}`})}
  const xi=pickXI(sq,0);for(const x of xi)if(x.p.pos!==x.slot)out.push({pos:x.slot,kind:'oop',text:`${x.p.name} plays ${POS_ONE[x.slot]} out of position`});
  for(const p of sq)if(p.contract===1&&!p.loan&&p.q>=11)out.push({pos:p.pos,kind:'contract',text:`${p.name}'s contract ends in June`});
  return out;
}

/* ================= Club foundation: players who come alive =================
   Profiles (home town, story, what they want) and storylines that follow from the simulation.

const ABROAD=['Lisbon','Accra','Cork','Gdańsk','Lagos','Rotterdam','Bergen','Dakar','Swansea','Glasgow'];
const STORY={
 academy:['Came through the academy from the age of nine.','Was spotted at a Sunday league game in the rain.','Their mum still washes the youth team kit.','Turned down a bigger academy to stay near home.'],
 local:['Grew up two streets from the ground.','Watched from the terrace as a kid; now plays on the pitch.','Works the family shop on Mondays.','Their grandad played for the club in the sixties.'],
 abroad:['Came over at nineteen with one suitcase.','Learned the language from the dressing-room radio.','Calls home every matchday night.','Left a bigger league for a chance to play every week.'],
 journeyman:['This is club number six.','Has played in every division of the Northmarch.','Was a bricklayer until twenty-two.','Nearly quit the game after a bad injury.'],
 veteran:['Has more appearances than anyone in the dressing room.','The first name the young lads ask for advice.','Wants one more good season, then coaching.','Has outlasted four managers.']};
const WANTS={play:'to play every week',contract:'a longer contract',up:'to play at a higher level',roots:'to settle and buy a house here'};
function givePlayerLife(p,o){
  const towns=Object.values(S.clubs||{}).map(c=>c.name.split(' ')[0]);
  const local=p.academy||rnd()<.35;p.home=local&&towns.length?pick(towns):pick(ABROAD.concat(towns.slice(0,8)));
  const kind=p.academy?'academy':p.age>=31?'veteran':ABROAD.includes(p.home)?'abroad':local?'local':'journeyman';
  p.story=pick(STORY[kind]);if(kind==='academy'||kind==='local')p.localKid=true;
  p.want=p.age<=21?'play':p.age>=30?'roots':p.q>=12.5?'up':pick(['contract','play','roots']);
}
function storyEv(p,kind,text){if(!p.storySeen)p.storySeen={};const key=kind+'_'+S.season;if(p.storySeen[key]&&kind!=='winner')return;p.storySeen[key]=1;cfEv('story',text,{pid:p.id,sk:kind})}
function storiesAfterMatch(m,xi,scorers){
  const c=S.clubs[S.cf.club];
  for(const x of xi){const p=x.p;p.sApps++;
    if(p.academy&&p.apps===1)storyEv(p,'debut',`${p.name} made his debut. ${p.story}`);
    if(p.apps===100)storyEv(p,'hundred',`${p.name}'s 100th game for ${c.name}.`);
    if(p.backFromInj&&scorers.includes(p)){storyEv(p,'comeback',`${p.name} scored on his return from injury.`)}
    p.backFromInj=false;
    p.formHist.push(scorers.includes(p)?Math.min(95,p.form+15):p.form);if(p.formHist.length>6)p.formHist.shift();
  }
  for(const p of scorers){if(p.goals===1)storyEv(p,'firstGoal',`${p.name}'s first goal for the club${p.academy?', from the academy':''}.`)}
  if(m.pts===3&&m.gf-m.ga===1&&scorers.length){const hero=scorers[scorers.length-1];storyEv(hero,'winner',`${hero.name} scored the winner${m.derby?' in the derby':''}.`);m.hero=hero.name}
}
function storiesWeekly(w){
  const sq=S.cf.squad;
  for(const p of sq){
    p.morale=clamp(p.morale+(p.want==='play'&&p.sApps<w*.3&&w>6?-2:0)+(p.form>70?1:0)-(p.inj>0?1:0),5,95);
    p.form=clamp(p.form+Math.round((p.morale-60)/15),35,90);
    if(p.form<45&&!p.slumpW)p.slumpW=w;if(p.form>=50)p.slumpW=0;
    if(p.slumpW&&w-p.slumpW>=3)storyEv(p,'slump',`${p.name} has lost his way: three poor weeks in a row.`);
    if(w===10&&p.contract===1&&p.q>=12&&!p.renewDone)storyEv(p,'contractYear',`${p.name} enters the last months of his contract. ${p.want==='up'?'He wants a bigger stage.':'He wants to know where he stands.'}`);
    if(w===2&&p.age>=33&&p.contract===1)storyEv(p,'lastSeason',`${p.name}, ${p.age}, starts what may be his last season. ${p.story}`);
  }
}
function playerById(id){return S.cf&&S.cf.squad.find(p=>p.id===id)}

/* ================= Club foundation: money =================
   A simple weekly model. Amounts are in £k. The chairman sees money as numbers: an owner knows his cash. */
function wageBill(){return Math.round(S.cf.squad.reduce((a,p)=>a+p.wage,0)/100)/10}
function weeklyIncome(home){const c=S.clubs[S.cf.club],t=S.tbl[S.cf.club],ppg=t&&t.p?t.pts/t.p:1.3;

function faInit(){S.fa=faNew(48)}

  S.fa=(S.fa||[]).filter(()=>rnd()>.35);for(const p of S.fa)p.age++;S.fa=S.fa.filter(p=>p.age<=35);S.fa.push(...faNew(22));

function faSign(p,years){S.fa.splice(S.fa.indexOf(p),1);p.free=false;p.contract=years||ri(1,2);p.joined=S.season;p.apps=0;p.goals=0;p.sApps=0;p.sGoals=0;S.cf.squad.push(p);return p}

/* ---- club/td.js ---- */
/* ================= Club foundation: the technical director as a person with a craft =================

   Hidden (1-5): eye (judging quality), deal (price paid and received), plan (sticks to his line), bond (works with the coach).
   This layer knows nothing about the chairman; tdWindow() in club.js reads these hooks. */
const TD_PHIL={

// Old saves and directors made before this module: a profile derived from traits, no random draws.
function tdDefault(p){const tr=p.traits||[];const phil=tr.includes('greedy')?'bargain':tr.includes('ambitious')?'eye':tr.includes('cautious')||tr.includes('loyal')?'network':'data';
  return{phil,eye:3,deal:3,plan:3,bond:3,rumour:null}}
function tdOf(pid){const p=P(pid);if(!p)return null;if(!p.td)p.td=tdDefault(p);return p.td}
function tdSkills(){let s;for(let i=0;i<30;i++){s=TD_SKILLS.map(()=>ri(1,5));const t=s.reduce((a,b)=>a+b,0);if(t>=10&&t<=14)break}return Object.fromEntries(TD_SKILLS.map((k,i)=>[k,s[i]]))}
function tdRumour(td){const k=pick(TD_SKILLS),honest=rnd()<.6,good=td[k]>=3;const positive=honest?good:!good;return{k,positive,honest,text:TD_RUMOUR[k][positive?0:1]}}
function tdCandidates(n=3){
  const phils=pickN(Object.keys(TD_PHIL),n);
  const used=new Set();return phils.map(phil=>{const pid=mkPerson('td',null,{traits:pickN(TD_TRAITS,2),age:ri(36,58)});for(let i=0;i<10&&used.has(P(pid).name.split(' ')[1]);i++)P(pid).name=`${pick(FIRST)} ${pick(LAST)}`;used.add(P(pid).name.split(' ')[1]);const td={phil,...tdSkills()};td.rumour=tdRumour(td);P(pid).td=td;return pid});
}
function tdPlanLines(pid){const td=tdOf(pid);return TD_PHIL[td.phil].plan}

/* ----- hooks for tdWindow and the market ----- */
function curTd(){return S.cf&&S.cf.tdId?tdOf(S.cf.tdId):{phil:'data',eye:3,deal:3,plan:3,bond:3}}
// ages: the mandate's profile and the director's philosophy meet halfway; a director with a loose plan sometimes ignores both
function tdAges(profile){const [f0,f1]=profileAges(profile),td=curTd(),[p0,p1]=TD_PHIL[td.phil].ages;
  if(td.plan<=2&&rnd()<.3)return[19,33];return[Math.round((f0+p0)/2),Math.max(Math.round((f0+p0)/2)+2,Math.round((f1+p1)/2))]}
// the price the director pays, relative to the asking price

/* ---- club/summer.js ---- */

/* ----- 1. the squad review ----- */

    else if(td.phil==='data'&&p.age>=30&&p.q>=xiQ-1)sells.push([p,`${p.age}, and his numbers are dropping. Sell while someone pays.`,2]);
    else if(td.phil==='eye'&&p.age>=28&&p.q>=xiQ)sells.push([p,'Sell high and buy young. That is the plan.',1]);

/* ----- 2. the plan: priorities with targets A, B, C ----- */
function sumTargets(pos,busy){

  const B=fas[0]||mk.filter(p=>A&&p!==A&&p.price<=A.price*.6).sort((a,b)=>a.price-b.price)[0]||mk[1];
  const ac=S.cf.squad.filter(p=>p.academy&&p.age<=20&&!p.loan&&!(busy&&busy.has(p.id))&&(p.pos===pos||NEAR[pos].includes(p.pos))).sort((a,b)=>b.pa-a.pa)[0];
  const C=ac?{kind:'academy',pid:ac.id,name:ac.name,age:ac.age}:{kind:'loan',name:'A loan from a bigger club'};

/* ================= The summer meeting: the owner's mandate =================
   Three voices (director of football, coach, finance director) say what they want.
   The owner decides seven pillars. Each pillar changes how the club runs, and the staff react. */
const PILLARS=[
 {k:'ambition',q:'What do you want from this season?',opts:[
   {v:'survive',t:'Stay up, whatever it takes',d:'The director buys cheap and safe. Nobody expects much.',like:['finance'],dis:['coach']},
   {v:'steady',t:'Steady progress',d:'A sensible season. The director buys where it hurts most.',like:['finance','td'],dis:[]},
   {v:'push',t:'Push for the top half',d:'The director spends to the edge of the budget on quality now.',like:['coach'],dis:['finance']},
   {v:'promotion',t:'Promotion or bust',d:'Everything on this season. Key players are not for sale.',like:['coach'],dis:['finance','td']}]},
 {k:'risk',q:'How much money do you put at risk?',opts:[
   {v:'balanced',t:'Balanced books',d:'A small budget. The club stays healthy.',like:['finance'],dis:['coach']},
   {v:'reserves',t:'Spend the reserves',d:'Most of the cash goes into the squad.',like:['td','coach'],dis:['finance']},
   {v:'borrow',t:'Borrow against the future',d:'£80k from the bank, on top of the reserves. Interest every week.',like:['coach'],dis:['finance']}]},
 {k:'identity',q:'What kind of club are we?',opts:[
   {v:'own',t:'A club for our own',d:'Five academy players always in the squad. The director develops, not buys.',like:[],dis:[]},
   {v:'local',t:'Local lads first',d:'The director looks in the region before anywhere else.',like:[],dis:[]},
   {v:'pros',t:'Proven professionals',d:'Ready-made quality, mostly over 26.',like:['coach'],dis:[]},
   {v:'trade',t:'Buy low, sell high',d:'Find talent cheap, sell it on at the right price.',like:['finance'],dis:['coach']}]},
 {k:'wagehouse',q:'How do we pay people?',opts:[
   {v:'flat',t:'Nobody earns more than the cap',d:'Peace in the dressing room. Stars will not come.',like:['finance'],dis:[]},
   {v:'oneStar',t:'One star allowed',d:'One player may earn well above the cap.',like:['coach','td'],dis:[]},
   {v:'performance',t:'Pay for performance',d:'Players out of form do not get new deals.',like:['finance'],dis:['coach']}]},
 {k:'sales',q:'When do we sell?',opts:[
   {v:'core',t:'Keep the core',d:'Our five best players are close to untouchable.',like:['coach'],dis:['finance']},
   {v:'price',t:'Everyone has a price',d:'A good bid is a good bid.',like:['finance','td'],dis:['coach']},
   {v:'noMid',t:'Never sell mid-season',d:'Sales only in the summer.',like:['coach'],dis:[]}]},
 {k:'kpi',q:'How will you judge the director next June?',opts:[
   {v:'position',t:'Where we finish',d:'He is judged on the table.',like:[],dis:[]},
   {v:'value',t:'What the squad is worth',d:'He is judged on squad value.',like:[],dis:[]},
   {v:'youth',t:'Minutes for our own',d:'He is judged on academy players in the side.',like:[],dis:[]},
   {v:'wages',t:'The wage bill',d:'He is judged on keeping wages in line with income.',like:['finance'],dis:[]}]},
 {k:'rules',multi:true,q:'Any red lines?',opts:[
   {v:'noRival',t:'Never sell to our rival',d:'A higher bid from the rival is refused.'},
   {v:'captainStays',t:'The captain stays',d:'Not sold, and always renewed.'},
   {v:'heroesStay',t:'Our own lads are never sold',d:'Local and academy players stay.'},
   {v:'noOldLong',t:'No long deals over thirty',d:'Players over thirty get one-year contracts only.'}]}
];
const AMB_F={survive:.6,steady:.8,push:1,promotion:1.2};
function staffPid(role){return role==='finance'?cast('finance'):role==='td'?cast('td'):cast('coach')}
function valueLikes(role,pillar,v){
  // the staff member's own value adds a like or dislike on top of their role
  const p=P(staffPid(role));if(!p)return 0;const val=p.value;
  if(val==='money'&&(v==='balanced'||v==='trade'||v==='price'||v==='performance'))return 1;
  if(val==='glory'&&(v==='push'||v==='promotion'||v==='oneStar'))return 1;
  if(val==='control'&&role==='td'&&(v==='price'||v==='trade'))return 1;
  if(val==='community'&&(v==='own'||v==='local'||v==='heroesStay'))return 1;
  if(val==='loyalty'&&(v==='core'||v==='captainStays'))return 1;
  if(val==='recognition'&&role==='coach'&&(v==='push'||v==='pros'))return 1;
  if(val==='money'&&v==='borrow')return -1;
  return 0;
}
function staffVoices(){
  const c=C(),sm=S.cf.sum,td=P(cast('td')),co=P(cast('coach')),fi=P(cast('finance')),plan=cfPlan(),fin=S.cf.fin||{inc:weeklyIncome(false),wb:wageBill()},fc=seasonForecast();
  const gaps=cfNeeds().filter(g=>g.kind==='short'||g.kind==='oop').length,ask=Math.max(20,gaps*30);
  const coPos=(cfNeeds().find(g=>g.kind==='oop'||g.kind==='short')||{pos:'CM'}).pos;
  return[
   {pid:td.id,line:sm&&sm.prios.length?`"My list: ${sm.prios.map(x=>x.goal.charAt(0).toLowerCase()+x.goal.slice(1)).join(', ')}. Give me the money and I will get it done."`:`"The squad is in decent shape. Give me £${ask}k and I'll make it better."`},
   {pid:co.id,line:`"${co.traits.includes('ambitious')?'I want to go for it this year.':'I want us hard to beat.'} ${sm&&sm.prios.some(x=>x.pos===coPos)?`Good that a ${POS_ONE[coPos]} is on the list.`:`I'd have put a ${POS_ONE[coPos]} on that list.`}"`},
   {pid:fi.id,line:`"We have £${Math.round(c.cash)}k in the bank${c.debt?` and £${c.debt}k of debt`:''}. Wages are £${fin.wb}k a week against £${fin.inc}k coming in. ${fc<0?`On this course we lose about £${-fc}k by May.`:`We should end the season about £${fc}k up.`}"`}];
}
function startMeeting(){S.meeting={step:0,choice:{},rules:[]};S.phase='summer';S.screen='meeting';if(S.cf)tdSummerStart()}
function meetingChoose(v){
  const M=S.meeting,pl=PILLARS[M.step-1];
  if(pl.multi){const i=M.rules.indexOf(v);if(i>=0)M.rules.splice(i,1);else M.rules.push(v);return}
  M.choice[pl.k]=v;const o=pl.opts.find(x=>x.v===v);
  for(const role of ['td','coach','finance']){const pid=staffPid(role);if(!pid)continue;let s=(o.like||[]).includes(role)?1:(o.dis||[]).includes(role)?-1:0;s+=valueLikes(role,pl.k,v);
    if(s>0)loy(pid,null,`${P(pid).name} likes it: ${o.t.toLowerCase()}`,{raw:.5*s,noRipple:true});if(s<0)loy(pid,null,`${P(pid).name} disagrees: ${o.t.toLowerCase()}`,{raw:.5*s,noRipple:true})}
  M.step++;
}
function applyMandate(){
  const M=S.meeting,c=C(),F=S.cf.frames,ch=M.choice;
  Object.assign(F,{ambition:ch.ambition,risk:ch.risk,identity:ch.identity,wagehouse:ch.wagehouse,sales:ch.sales,kpi:ch.kpi,rules:M.rules.slice()});
  if(ch.risk==='borrow'){c.debt+=80;c.cash+=80;log('£80k borrowed from the bank','Your mandate: borrow against the future',null)}
  const pot=ch.risk==='balanced'?Math.max(10,c.cash*.25):Math.max(15,c.cash*.65);
  F.budget=Math.max(0,Math.round(pot*AMB_F[ch.ambition]/5)*5);S.cf.budgetLeft=F.budget;
  F.cap=ch.risk==='balanced'?750:ch.risk==='reserves'?900:1000;if(ch.wagehouse==='performance')F.cap+=100;
  F.profile=ch.identity==='own'?'youth':ch.identity==='pros'?'experience':'value';
  if(ch.identity==='trade')F.sales=F.sales||'price';
  S.cf.kpiStart={value:S.cf.squad.reduce((a,p)=>a+playerValue(p),0),wages:wageBill()};
  cfEv('frame',`New mandate: ${PILLARS[0].opts.find(o=>o.v===ch.ambition).t.toLowerCase()}, ${PILLARS[2].opts.find(o=>o.v===ch.identity).t.toLowerCase()}. Budget £${F.budget}k.`);
}
function judgeDirector(){
  // at the AGM: the owner's verdict on the director, against the measure chosen in the summer
  const F=S.cf.frames,td=cast('td');if(!F.kpi||!td)return null;let ok,txt;
  if(F.kpi==='position'){ok=myPos()<=(C().expect||8);txt=`Finished ${ord(myPos())} against an expected ${ord(C().expect||8)}`}
  else if(F.kpi==='value'){const v=S.cf.squad.reduce((a,p)=>a+playerValue(p),0);ok=v>=(S.cf.kpiStart?.value||0);txt=`Squad value ${ok?'up':'down'}`}
  else if(F.kpi==='youth'){const n=S.cf.squad.filter(p=>p.academy&&p.sApps>=5).length;ok=n>=3;txt=`${n} academy players with five or more games`}
  else{ok=wageBill()<=weeklyIncome(false)+2;txt=`Wages £${wageBill()}k a week`}
  loy(td,ok?'wish':'against',`Your verdict on the director: ${txt}`,{raw:ok?1:-1});
  return{ok,txt};
}

/* ---- chairman/reactions.js ---- */
/* ================= Reactions on the feed, and the chairman's touch on match day =================
   On up to two cards a week the owner can send a note (private) or say something in the Echo (public).
   Effects are small and visible in the person's own words. Players the owner touched carry that into match moments. */
const REPLY_NOTE=['"Thanks, chairman. That means a lot."','"I\'ll keep the note. My mum will want to see it."','"Didn\'t expect that from the chairman. Cheers."','"I won\'t let you down."'];
const REPLY_ECHO=['The quote ran on the back page. He pinned it to his locker.','The fans read it on the bus. Some cut it out.','The coach saw it too, and raised an eyebrow.'];
function canReact(card){return card&&(card.pid&&playerById(card.pid)||card.src==='region')&&!(S.reacts||{})[card.id]}
function reactsLeft(){S.reacts=S.reacts||{};return 2-Object.values(S.reacts).filter(r=>r.s===S.season&&r.w===S.week).length}
function setTouch(p,txt){if(p){p.touch={txt,s:S.season,w:S.week}}}
function react(cardId,type){
  const card=(S.feed||[]).find(c=>c.id===cardId);if(!card||!canReact(card)||reactsLeft()<=0)return;
  const p=card.pid?playerById(card.pid):null,co=cast('coach');let reply;
  if(type==='note'&&p){
    p.morale=clamp(p.morale+6,0,99);reply=REPLY_NOTE[(p.name.length+S.week)%REPLY_NOTE.length];
    setTouch(p,card.kind==='slump'?'who got your note when he was struggling':card.kind==='injury'?'who got your note when he was injured':'who got a note from you');
    log(`${p.name}: delighted`,`Your note after "${card.head}"`,'+6');
    const rival=S.cf.squad.find(x=>x!==p&&x.pos===p.pos&&x.trait==='temperamental');if(rival&&rnd()<.5){rival.morale=clamp(rival.morale-3,0,99);reply+=` ${rival.name} noticed, and sulked.`;log(`${rival.name}: a bit jealous`,`You wrote to ${p.name}, not him`,'−3')}
  }
  if(type==='echo'){
    if(p){p.morale=clamp(p.morale+4,0,99);setTouch(p,'who you praised in the Echo');const g=p.localKid?C().groups.slice().sort((a,b)=>b.share-a.share)[0].k:['ultras','workers','students'].find(grpOf);if(g)grp(g,p.localKid?2:1,`The chairman praised ${p.name} in the Echo`);
      if(['training','slump','debut'].includes(card.kind)&&co)loy(co,null,'The chairman talking about players in public',{raw:-.5});
      reply=REPLY_ECHO[(p.name.length+S.week)%REPLY_ECHO.length]}
    else{const riv=CL(C().rival).cast.chair;if(riv&&P(riv))P(riv).mem.push({s:S.season,club:S.my,v:-1,txt:'you mocked them in the Echo'});const g=['workers','ultras'].find(grpOf);if(g)grp(g,2,'The chairman had a dig at the neighbours');reply='The neighbours did not find it funny. Our fans did.'}
  }
  S.reacts[cardId]={type,reply,s:S.season,w:S.week};
}
function influenceMoments(m){
  // lines that tie a match moment to something the owner did; counted for the test
  const out=[];const c=C();
  for(const g of m.goals||[]){const p=playerById(g.id);if(!p)continue;
    if(p.touch&&p.touch.s===S.season&&S.week-p.touch.w<=8)out.push(`${g.min}' ${p.name}, ${p.touch.txt}, scores.`);
    else if(p.mandateSigning===S.season)out.push(`${g.min}' ${p.name}, signed under your mandate, scores.`);
    else if(p.proDealByYou)out.push(`${g.min}' ${p.name}, whose first contract you made special, scores.`);}
  if(m.save){const p=playerById(m.save.id);if(p&&p.mandateSigning===S.season)out.push(`${p.name}, signed under your mandate, keeps a clean sheet.`)}
  if(m.derby&&m.home&&S.flags.derbyCrowd)out.push('The crowd you filled carried us through the derby.');
  S.influence=S.influence||{};S.influence[S.season]=(S.influence[S.season]||0)+out.length;
  return out.slice(0,2);
}
function matchMoments(m){
  const out=[];const win=m.pts===3&&m.goals&&m.goals.length?m.goals[m.goals.length-1]:null;
  if(win&&m.gf-m.ga===1)out.push(`${win.min}' ${win.name} scores the winner.`);
  else if(m.goals&&m.goals.length)out.push(`Goals: ${m.goals.map(g=>`${lastName(g.name)} ${g.min}'`).join(', ')}.`);
  if(m.save)out.push(`${m.save.name} made the save of the afternoon.`);
  if(m.error)out.push(`A mistake from ${m.error.name} cost us.`);
  for(const x of m.moments||[])if(out.length<4)out.push(x);
  return out;
}

/* ---- chairman/transfer.js ---- */
/* ================= The chairman and the transfer summer =================
   The director draws up the plan and presents it in the summer meeting; the chairman's lever is the mandate.
   Then: the brief he signs -> six weeks in the transfer centre -> the summer edition -> the debrief (a strike when it
   went wrong and it was not the market). No negotiation, no calls: the chairman watches, reads and judges. */
function sumAsk(){const s=S.cf.sum;return s?s.prios.reduce((a,x)=>a+(x.targets[0]&&x.targets[0].kind==='buy'?x.targets[0].price:0),0):0}
function startSummer(){tdPlanRefresh();S.cf.sum.step='brief';S.screen='tsum'}
function summerNext(){
  const s=S.cf.sum;
  if(s.step==='brief'){for(let i=0;i<SUM_WEEKS;i++)tdSumWeek();tdSumDeadline();s.step='live';return}
  if(s.step==='live'){s.analysis=sumAnalysis();s.verdict=sumVerdict(true);s.step='edition';log(`The summer edition gives ${P(S.cf.tdId).name}'s summer a ${s.verdict.grade}`,`${s.verdict.met} of ${s.verdict.kpis.length} points of the brief met`,null);return}
  if(s.step==='edition'){s.step='debrief';if(s.verdict.strike)loy(S.cf.tdId,'against','A strike after a bad summer',{raw:-1});return}
  if(s.step==='debrief'){s.step='done';startSeasonPlay()}
}

   title -> the call (your name, three messages) -> the dossiers -> sign -> welcome -> the envelope (the secret,
   with a real consequence) -> the speech (the manifest, with the terrace reacting) -> day one's crisis -> staff.
   Every secret has one concrete effect in existing systems and its own first crisis. Half are good news. */

function seatLabel(c,used){const d=clubDiff(c),order=[d>=4?'chalice':null,c.debt>=150?'rescue':null,c.tier===1&&c.founded<1900?'giant':null,d<=1?'quiet':null,'dark','giant','rescue','quiet','chalice'].filter(Boolean);return order.find(k=>!used.has(k))}
function seatDream(c){const r=CL(c.rival);if(c.debt>=150)return'Clear the debt and own the club again';if(c.tier===1)return'Back to the Northmarch Premier';if(c.last<=6)return'A first league title in a generation';return r?`Finish above ${r.name}, at last`:'A full house every week'}

/* ----- action dispatcher (used by the UI and by the audit bots) ----- */
function act(a,arg){
  switch(a){
    case'new':newWorld(arg??((Date.now()%2147483647)|0));break;
    case'toSeats':S.phase='seats';S.screen='seats';break;
    case'call':startCall(arg);break;
    case'seat':pickSeat(arg);break;
    case'seatsBack':S.screen='seats';break;
    case'sign':signContract();break;
    case'toEnvelope':S.screen='envelope';break;
    case'openEnv':openEnvelope();break;
    case'crisis':answerCrisis(arg);break;
    case'crisisDone':afterCrisis();break;
    case'arrive':S.cashStart=C().cash;S.step=0;S.pick={};S.chances=computeChances();S.phase='manifest';S.screen='manifest';break;
    case'pick':S.pick[['sport','club','person'][S.step]]=arg;speechReact(arg);S.step++;if(S.step>=3){applyManifest();S.speech=[];if(S.dayOne&&secretCrisis())S.screen='crisis';else if(S.cf&&!S.cf.tdHired)startTdHire();else startMeeting()}break;
    case'sit':S.sit=+arg;S.screen='sit';break;
    case'back':S.sit=null;S.screen='week';break;
    case'card':applyCard(+arg);break;
    case'play':playMatch();break;
    case'react':{const [id,type]=String(arg).split('|');react(id,type);break}
    case'next':afterResult();break;
    case'hire':hireCoach(arg);if(S.afterHire==='play'){S.hire=null;playMatch()}else S.screen=S.afterHire||'week';break;
    case'frame':{const [k,v]=String(arg).split(':');setFrame(k,k==='budget'||k==='cap'?+v:v);break}
    case'framesDone':summerWindow();break;
    case'tdhire':hireTd(arg);startMeeting();break;
    case'meetNext':S.meeting.step++;break;
    case'mchoose':meetingChoose(arg);break;
    case'mdone':applyMandate();startSummer();break;
    case'sumNext':summerNext();break;
    case'sumSkip':if(S.cf.sum)S.cf.sum.skip=1;break;
    case'player':S.viewPlayer=arg;break;
    case'windowDone':startSeasonPlay();break;

  const playBtn=`<button class="btn" data-act="play">${open?`Play Saturday · ${open} in the post`:'Play Saturday'}</button>`;
  if(UI.t==='post'){
    const desk=S.desk.map((s,i)=>{const sc=sitBuild(i);const f=sc.who.find(x=>P(x));const hook=(sc.lines.find(l=>l.includes('"'))||sc.lines[0]||'').replace(/^[A-Z][A-Za-z'.\- ]+: /,'');
      return s.done?`<div class="deskc done"><b>${esc(sc.title)}</b><span class="stamp${s.choice==='Left to run its course'||/^No deal/.test(s.choice)?' no':''}">${s.choice==='Left to run its course'?'NO DEAL':'AGREED'}</span><span class="meta">${esc(s.choice)}</span></div>`
        :`<button class="deskc" data-act="sit" data-arg="${i}">${f?personPortrait(f,44):crestSVG(C(),44)}<span class="dk"><b>${esc(sc.title)}</b><span class="meta clamp2">${esc(hook)}</span></span></button>`}).join('');
    return`<p class="eyebrow">In the post · Week ${S.week}</p>${S.desk.length?`<div class="stack">${desk}</div>`:'<p class="muted">Nothing in the post this week. Enjoy it.</p>'}${playBtn}`}

  return`${coverView()}<p class="eyebrow">Club news</p>${feedView()}${fx?fixtureCard(fx):''}${playBtn}`;

function moneyStrip(){if(!S.cf)return'';const c=C(),f=S.cf.fin;return`<div class="money" role="group" aria-label="Club money"><span><i>Bank</i><b>£${Math.round(c.cash)}k</b></span><span><i>Last week</i><b class="${f&&f.net<0?'down':'up'}">${f?(f.net>=0?'+':'−')+'£'+Math.abs(f.net)+'k':'—'}</b></span><span><i>Debt</i><b>£${c.debt}k</b></span></div>`}
function moneyPanel(){const c=C(),f=S.cf.fin||{inc:weeklyIncome(false),wb:wageBill(),interest:0,net:0},fc=seasonForecast();
  return`<div class="panel"><p class="eyebrow">Money · ${esc(P(cast('finance'))?.name||'Finance')}</p><div class="row small"><span>In the bank</span><b>£${Math.round(c.cash)}k</b></div><div class="row small"><span>Debt</span><b>£${c.debt}k</b></div><div class="row small"><span>Income per week</span><b>£${f.inc}k</b></div><div class="row small"><span>Wage bill per week</span><b>£${wageBill()}k</b></div><div class="row small"><span>Transfer budget left</span><b>£${Math.round(S.cf.budgetLeft)}k</b></div><p class="small muted">${fc<0?`On this course the club loses about £${-fc}k over a season.`:`On this course the club makes about £${fc}k over a season.`}</p></div>`}
function mandatePanel(){const F=S.cf.frames,ch=(k,v)=>{const pl=PILLARS.find(x=>x.k===k);const o=pl&&pl.opts.find(x=>x.v===v);return o?o.t:'—'};

function meetingView(){
  const M=S.meeting;
  if(M.step===0){const v=staffVoices();return`<p class="eyebrow">Summer · The boardroom</p><h2>The summer meeting</h2><p>Your staff tell you what they want. Then you set the mandate: seven decisions only an owner makes.</p>${moneyStrip()}
    <section class="scene">${v.map(x=>`<div class="bubble">${face(x.pid).replace('class="face','class="face sm')}<div class="bb"><b>${esc(P(x.pid).name)} · ${esc(ROLE_WORD[P(x.pid).role])}</b><p>${esc(x.line.replace(/^"|"$/g,''))}</p></div></div>`).join('')}</section>${tdAssessment()}<button class="btn" data-act="meetNext">Set the mandate</button>`}
  if(M.step<=PILLARS.length){const pl=PILLARS[M.step-1];
    const opts=pl.opts.map(o=>{const r=['td','coach','finance'].map(role=>{const pid=staffPid(role);if(!pid||pl.multi)return'';let s=(o.like||[]).includes(role)?1:(o.dis||[]).includes(role)?-1:0;s+=valueLikes(role,pl.k,o.v);return s>0?`<span class="up">${esc(P(pid).name.split(' ')[0])} ↑</span>`:s<0?`<span class="down">${esc(P(pid).name.split(' ')[0])} ↓</span>`:''}).filter(Boolean).join(' · ');
      const on=pl.multi&&M.rules.includes(o.v);return`<button class="choice${on?' on':''}" data-act="mchoose" data-arg="${o.v}" ${pl.multi?`aria-pressed="${on}"`:''}><b>${pl.multi?(on?'✓ ':'')+'':''}${esc(o.t)}</b><span class="meta">${esc(o.d)}</span>${r?`<span class="meta">${r}</span>`:''}</button>`}).join('');
    return`<p class="eyebrow">The mandate · ${M.step} of ${PILLARS.length}</p><h2>${esc(pl.q)}</h2><div class="stack">${opts}</div>${pl.multi?`<button class="btn" data-act="meetNext">${M.rules.length?'Done':'No red lines'}</button>`:''}`}
  const ch=M.choice;const c=C();const pot=ch.risk==='balanced'?Math.max(10,c.cash*.25):Math.max(15,(c.cash+(ch.risk==='borrow'?80:0))*.65);const bud=Math.round(pot*AMB_F[ch.ambition]/5)*5;
  const moods=['td','coach','finance'].map(r=>staffPid(r)).filter(Boolean).map(pid=>`<div class="row small"><span>${esc(P(pid).name)}<br><span class="muted">${esc(ROLE_WORD[P(pid).role])}</span></span><span class="mood">${band(P(pid).loy)}</span></div>`).join('');
  return`<p class="eyebrow">The mandate</p><h2>What you decided</h2><div class="panel"><p>${esc(PILLARS[0].opts.find(o=>o.v===ch.ambition).t)}. ${esc(PILLARS[1].opts.find(o=>o.v===ch.risk).t)}. ${esc(PILLARS[2].opts.find(o=>o.v===ch.identity).t)}.</p><p class="small muted">That gives ${esc(P(cast('td')).name)} a budget of about £${bud}k${ch.risk==='borrow'?', with £80k borrowed':''}.</p></div><div class="panel"><p class="eyebrow">How your staff take it</p>${moods}</div><button class="btn" data-act="mdone">Open the summer window</button>`;
}

/* ----- the feed and the fixture card ----- */
function formDots(id){const res=[];const tier=CL(id).tier;for(let r=Math.max(1,S.round-4);r<=S.round;r++){const f=S.fx[tier][r-1];if(!f)continue;const g=f.find(([h,a])=>h===id||a===id);if(!g)continue;res.push(g)}
  // results are not stored per match for AI clubs; use the table trend as an honest proxy
  const t=S.tbl[id];if(!t||!t.p)return'';const ppg=t.pts/t.p;return`<span class="small muted">${t.w}W ${t.d}D ${t.l}L</span>`}
function fixtureCard(fx){const c=C(),o=CL(fx.opp),derby=fx.opp===c.rival,ps=myPos(),po=posOf(fx.opp);
  const stake=derby?'The derby':Math.abs(ps-po)<=2&&ps<=4?'Top of the table':ps>=14&&po>=13?'Six-pointer at the bottom':'League match';
  const home=fx.home?c:o,away=fx.home?o:c,xi=S.cf?pickXI(S.cf.squad,S.youth):[];
  return`<section class="prog"><div class="band">Saturday 3pm · ${esc(home.ground||'')} · ${stake}</div><div class="vsrow"><div class="side">${crestSVG(home,64)}<b>${esc(home.name)}</b><span class="small muted">${ord(posOf(home.id))}</span></div><span class="vs">V</span><div class="side">${crestSVG(away,64)}<b>${esc(away.name)}</b><span class="small muted">${ord(posOf(away.id))}</span></div></div>
  ${xi.length?`<details><summary class="small" style="padding:0 12px 10px;min-height:44px;display:flex;align-items:center;cursor:pointer">Today's teamsheet</summary><ol class="teamsheet">${xi.map((x,i)=>`<li><b>${i+1}</b>${esc(lastName(x.p.name))}${x.p.pos!==x.slot?' <span class="down small">('+x.slot+')</span>':''}</li>`).join('')}</ol></details>`:''}</section>`}
function feedView(){
  const left=reactsLeft();
  const cards=(S.feed||[]).map(c=>{const p=c.pid?playerById(c.pid):null,r=(S.reacts||{})[c.id];
    const img=p?playerPortrait(p,44):c.src==='town'||c.src==='staff'?crestSVG(C(),40):`<span class="face sm src-${c.src}" aria-hidden="true">◆</span>`;const wt=['debut','firstGoal','winner','comeback','hundred','lastSeason'].includes(c.kind)?' heavy':['weather','groundsman','volunteers','physio','pubTalk','leader'].includes(c.kind)?' small':'';
    const btns=!r&&canReact(c)&&left>0?`<span class="reacts">${p?`<button class="rbtn" data-act="react" data-arg="${c.id}|note">Send a note</button>`:''}<button class="rbtn" data-act="react" data-arg="${c.id}|echo">Say it in the Echo</button></span>`:'';
    return`<article class="fcard${wt}${c.follow?' follow':''}">${img}<div class="fc"><span class="fsrc">${FEED_SRC[c.src]}${c.follow?' · Follow-up':''}</span>${p?`<button class="fhead linkish" data-act="player" data-arg="${p.id}">${esc(c.head)}</button>`:`<b class="fhead">${esc(c.head)}</b>`}<p>${esc(c.line)}</p>${r?`<p class="reply">${r.type==='note'?'✉':'📰'} ${esc(r.reply)}</p>`:btns}</div></article>`}).join('');
  return`<section class="feed" aria-label="This week">${cards||'<p class="small muted">A quiet week.</p>'}${left<2&&left>=0?`<p class="small muted">${left} reaction${left===1?'':'s'} left this week.</p>`:''}</section>`;
}

function tkTracker(trk){return trk.map(t=>{const lost=t.st===-1,done=t.st===5,wait=t.st===-2;
