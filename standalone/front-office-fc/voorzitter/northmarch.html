<style>
/* Layout: one narrow column, a matchday programme held in one hand; moorland slate with a lamp-orange signal. */
:root{
  --paper:#eef0f1; --card:#fbfcfc; --ink:#151d24; --muted:#56616b; --line:#cfd6dc;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f161c; --card:#17212a; --ink:#e6ecf0; --muted:#9aa8b2; --line:#2b3a46;
  --navy:#8bbad8; --signal:#f08a4b; --good:#7bc896; --bad:#ef8a7a; --onnavy:#0f161c; --chip:#22303a; color-scheme:dark}}
:root[data-theme="dark"]{

  --navy:#8bbad8; --signal:#f08a4b; --good:#7bc896; --bad:#ef8a7a; --onnavy:#0f161c; --chip:#22303a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{max-width:460px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.crest{width:34px;height:34px;flex:none}
.top .club{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:.02em;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}

.tbtn{min-height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);font:600 13px var(--f-body);cursor:pointer;flex:none}

h1{font-size:40px} h2{font-size:26px}

p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.voice{font-family:var(--f-voice);font-style:italic;font-size:19px;line-height:1.45}

.cg:nth-child(2){animation-delay:.9s}.cg:nth-child(3){animation-delay:1.8s}.cg:nth-child(4){animation-delay:2.7s}

.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden} .bar i{display:block;height:100%;background:var(--navy)}
.big{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:.9;text-transform:uppercase}
.overlay{position:fixed;inset:0;z-index:20;background:var(--paper);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay .inner{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:12px;align-items:flex-start;min-height:56px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--navy)}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--f-body);cursor:pointer}
.tabs button.on{border-color:var(--navy);color:var(--navy)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
</style>

const ROLE_WORD={coach:'Head coach',td:'Director of football',captain:'Captain',fan:'Supporters\' leader',opp:'Opposition candidate',chair:'Chairman',journalist:'Chief reporter, The Echo'};

 coach:{money:'a contract that finally pays like a real job',glory:'a promotion with their name on it',loyalty:'a chairman who stands by them through a bad run',recognition:'to stop being called a stopgap',control:'the final say on who plays',community:'a team built on local players'},

const DEEPQ={money:'"I\'ve given years to this. I\'d like to be paid like I matter."',glory:'"I want one thing people remember. Just one."',loyalty:'"Stand by me when it goes wrong. That\'s all I ask."',recognition:'"Everyone gets the credit but me. Once, I\'d like it said out loud."',control:'"Let me do my job without someone looking over my shoulder."',community:'"This club belongs to the town. I want the town to feel it."'};

const STRONG={money:['money'],glory:['name','role'],loyalty:['security'],recognition:['name','role'],control:['power'],community:['role']};
const WEAK={money:['name'],glory:['security'],loyalty:['money'],recognition:['money'],control:['ask'],community:['money']};
const BLOCK_ENDS=[8,15,23,30];
const MONTH=['','July','October','January','April'];
const GAIN={S:8,M:15,L:22};
const SIZE_WORD={S:'Small promise',M:'Medium promise',L:'Big promise'};

/* ================= RNG and helpers ================= */
let S=null;const UI={over:null,tab:'tables',lobby:{}};
function rnd(){let t=(S.rs=(S.rs+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function mkRng(seed){let s=seed|0;return()=>{let t=(s=(s+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const pick=a=>a[Math.floor(rnd()*a.length)],ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
function pickN(a,n){const c=a.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(rnd()*c.length),1)[0]);return o}
function pois(l,r){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L);return k-1}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
const P=id=>S.P[id], CL=id=>S.clubs[id], C=()=>S.clubs[S.my];
function gname(c,k){return k==='workers'?TOWNS[c.town].wk:ARCH[k].n}

/* ================= World generation ================= */
function mkPerson(role,club,o={}){
  const id='p'+(S.pc++);
  const p={id,name:o.name||`${pick(FIRST)} ${pick(LAST)}`,age:o.age||(role==='fan'?ri(38,70):role==='captain'?ri(27,33):ri(34,62)),role,club,
    traits:o.traits||pickN(TRAITS,2),value:o.value||pick(VALUES),infl:o.infl??null,loy:o.loy??null,mem:o.mem||[],rel:[],career:club?[club]:[],
    owes:false,withOpp:false,deepKnown:false,shown:0};
  p.deep=DEEP[role][p.value];S.P[id]=p;return id;

function mkClub(id,name,town,tier,o={}){
  const t=TOWNS[town],keys=Object.keys(t.w),n=o.groups?o.groups.length:(rnd()<.5?3:4),groups=[];
  if(o.groups)o.groups.forEach(([k,sh,m])=>groups.push({k,share:sh,mood:m}));
  else{const pool=keys.slice();while(groups.length<n&&pool.length){const tot=pool.reduce((a,k)=>a+t.w[k],0);let x=rnd()*tot,k=pool[0];for(const kk of pool){x-=t.w[kk];if(x<=0){k=kk;break}}pool.splice(pool.indexOf(k),1);groups.push({k,share:ri(15,40),mood:ri(34,62)})}
    const sum=groups.reduce((a,g)=>a+g.share,0);groups.forEach(g=>g.share=Math.round(g.share/sum*100));}
  const c={id,name,town,tier,str:o.str??(tier===0?ri(48,58):ri(43,54)),cash:o.cash??ri(20,140),debt:o.debt??pick([0,0,80,200,450]),
    statute:o.statute||pickN(STATUTE,rnd()<.5?1:2),founded:o.founded||ri(1874,1925),scar:o.scar||pick(SCAR),legend:o.legend||`${pick(FIRST)} '${pick(['Big','Wee','Iron','Doc','Sailor'])}' ${pick(LAST)}`,
    rival:null,rivalWhy:pick(RIVALRY),groups,cast:{},last:ri(2,16),hist:[],binding:[]};
  S.clubs[id]=c;return c;
}
function newWorld(seed){
  S={v:1,seed,rs:seed,pc:1,clubs:{},P:{},season:1,round:0,my:null,rep:2,log:[],mlog:[],news:[],
    phase:'title',screen:'title',moment:0,promises:[],flags:{},mods:[],youth:0,debuts:0,talentStarts:0,
    realPts:0,xPts:0,derbyPts:0,cross:[],served:false,echo:null,wait:null,scene:null,block:null,alv:null,
    seats:[],elect:null,pick:{},step:0,chances:null,pool:[],history:[],journalist:null,cashStart:0,hire:null,knownChairs:{}};
  // fixed core
  const pell=mkClub('pell','Pell United','harbour',1,{str:50,cash:60,debt:0,groups:[['workers',40,58],['students',25,62],['business',35,40]],statute:['No outside owner above 25%'],founded:1891,legend:"Jack 'Sailor' Garside",scar:'lost a cup final to their rivals'});
  const corden=mkClub('corden','Corden Athletic','mill',1,{str:53});
  const harrow=mkClub('harrow','Harrowgate Town','cathedral',0,{str:57});
  pell.rival='corden';pell.rivalWhy='a captain sold to them on deadline day';corden.rival='pell';corden.rivalWhy=pell.rivalWhy;
  const names=pickN(TOWNNAMES,29);const towns=Object.keys(TOWNS);
  names.forEach((tn,i)=>{const tier=i<15?0:1;const nm=tn+(rnd()<.85?' '+pick(SUFFIX):'');mkClub('c'+i,nm,pick(towns),tier)});

function genDesk(k){
  const out=[],prev=S.lastGens||[];
  for(const g of ['poach','defect','captain','cash','bid','escalate','story','conflict','petition','returns','rival','league','derby']){
    if(out.length>=4)break;const pri=SIT[g].pri;if(prev.includes(g)&&pri<8&&out.length>=2)continue;const d=SIT[g].make(k);if(d)out.push({gen:g,data:d,done:false,choice:null});}
  if(out.length<4)out.push({gen:'agenda',data:{},done:false,choice:null});
  S.lastGens=out.map(x=>x.gen);return out;
}
function sitBuild(i){const s=S.desk[i];return SIT[s.gen].build(s.data)}

/* ================= Flow (engine; UI calls act()) ================= */
function startMoment(k){
  S.phase='season';S.moment=k;S.mlog=[];S.prevMood=Object.fromEntries(C().groups.map(g=>[g.k,g.mood]));
  const lines=[];
  if(S.flags.captainWaiting){S.flags.captainWaiting=0;loy(cast('captain'),'wait','You sent them to the director and nothing happened')}
  if(k===3)aiWinter();
  if(k>=2)lines.push(...oppMove());
  S.echo=buildEcho(k,lines);S.desk=genDesk(k);S.sit=null;S.served=false;S.screen='echo';
}
function buildEcho(k,lines){
  const c=C();let head,first=[];
  if(k===1){head=S.season===1?`New broom at ${c.name}`:`${c.name}: year ${S.season-S.startSeason+1}`;first=[`The manifest: ${S.promises.map(p=>pdef(p.id).t).join('; ')||'no promises at all'}.`]}
  else{const b=S.block||[];const pts=b.reduce((s,m)=>s+m.pts,0),n=b.length||1,ppg=pts/n;head=ppg>=2?`${c.name} on the rise`:ppg>=1.4?'Steady as she goes':ppg>=.9?`${c.name} stall`:`${c.name} in freefall`;first=[`${pts} points from ${n}. ${luckWord()}. ${ord(myPos())} in the table.`]}
  if(S.flags.pressHostile&&k>=2)first.push('Mo Abara: "The chairman still won\'t talk to this paper. What is he hiding?"');
  const news=S.news.filter(x=>x.s===S.season||x.s==null).sort((a,b)=>a.pri-b.pri).slice(0,3).map(x=>x.text);S.news=S.news.filter(x=>!news.includes(x.text));
  return{date:MONTH[k],head,lines:[...first,...lines,...news]};
}
function currentScene(){return S.sit!=null?sitBuild(S.sit):null}
function sceneCards(sc){return[...sc.cards,...(sc.noDeal?[sc.noDeal]:[])]}
function applyCard(i){const s=S.desk[S.sit],sc=sitBuild(S.sit),card=sceneCards(sc)[i];if(!card)return;card.run();s.done=true;s.choice=card.none?'Left to run its course':card.t;
  for(const pid of sc.who)if(P(pid)){P(pid).seen=(P(pid).seen||0)+1;if(P(pid).seen>=2)P(pid).deepKnown=true}
  S.sit=null;if(S.hire){S.afterHire='desk';S.screen='hire';return}S.screen='desk'}
function deskDone(){for(let i=0;i<S.desk.length;i++){const s=S.desk[i];if(s.done)continue;const sc=sitBuild(i);if(sc.noDeal)sc.noDeal.run();s.done=true;s.choice='Left to run its course'}
  if(S.hire){S.afterHire='review';S.screen='hire';return}S.screen='review'}
function runBlock(){const to=BLOCK_ENDS.find(e=>e>S.round);const res=[];for(let r=S.round+1;r<=to;r++){S.round=r;const m=simRound(r);if(m)res.push(m)}S.block=res;S.screen='block'}
function afterBlock(){if(S.round>=30)startALV();else startMoment(S.moment+1)}

function chooseSeat(id){
  S.my=id;const c=C();S.oppGroup=weakest(c);S.promises=[];S.flags={captainExpiring:rnd()<.6};S.mods=[];S.youth=0;S.debuts=0;S.talentStarts=0;
  S.elect={stage:'wait'};S.mlog=[];S.phase='election';S.screen='elect';
  const fan=cast('fan');meet(fan);
}
function electionScene(){
  const c=C(),fan=P(cast('fan')),g=gname(c,fan.infl);const want=fan.deep;
  return{who:fan.id,lines:[`${fan.name} is at the bar of ${TOWNS[c.town].bar}. They do not turn round when you walk in.`,FLAVOUR[fan.traits[0]],`"Here's what ${g} want: ${want}."`],
    cards:[D(`Put it in your manifest`,`Your name: a public promise to ${g}`,`${g} behind you in the election`,'Every AGM','If you fail, they never forget',()=>{addPromise('fanWish',`Your promise to ${g}`);loy(fan.id,'deep','You made their wish a public promise',{stake:'name'});grp(fan.infl,10,`${fan.name} tells ${g} to back you`)},{stake:'name',hit:`Speaks to what ${fan.name} values: ${VALUE_WORD[fan.value]}`}),
      D(`A seat on the board for ${g}`,'Power: they sit in on decisions',`${g} behind you`,'The AGM',c.statute.some(x=>x.startsWith('Two-thirds'))?'Needs two-thirds of the members':'You will have to listen',()=>{S.flags.fanSeat=1;loy(fan.id,'wish','A seat at the table',{stake:'power'});grp(fan.infl,7,'A seat at the table')},{stake:'power'}),
      D('The honest version','The truth: debts first, dreams later','Respect from the cautious','—','They may campaign for your opponent',()=>{loy(fan.id,'against','You told them what they did not want to hear');for(const x of c.groups)if(['oldguard','business','retirees'].includes(x.k))grp(x.k,4,'Finally, a sensible candidate')})],
    noDeal:noDeal(`You finish your drink and leave. ${fan.name} backs your opponent.`,()=>{grp(fan.infl,-6,`${fan.name} campaigns against you`)})};
}
function electionResult(){
  const c=C();let total=0;const rows=[];
  for(const g of c.groups){let v=g.mood;const promised=S.promises.filter(p=>pgroups(p.id).includes(g.k)).length;v+=promised*6+S.rep*1.5;if(g.k===S.oppGroup)v-=8;v=clamp(v,0,100);rows.push({k:g.k,v});total+=g.share/100*v}
  return{total,rows,won:total>=50};
}
/* ----- AGM ----- */
function startALV(){
  S.phase='alv';S.mlog=[];S.prevMood=Object.fromEntries(C().groups.map(g=>[g.k,g.mood]));
  if(openP('captainDeal')&&!S.flags.captainSigned){if(P(cast('td')).loy>=4){S.flags.captainSigned=1;log('The director signs the captain, reluctantly','Your promise, their signature',null)}else log('The director refuses to sign the captain','Distant with you',null)}
  if(S.flags.leagueVote){cash(20,'TV money from the league vote');const ch=P(S.flags.leagueVote);const riv=CL(CL(ch.club).rival).cast.chair;if(riv&&P(riv))P(riv).mem.push({s:S.season,club:S.my,v:-1,txt:'you voted against them at the league meeting'})}
  const report=[];
  for(const p of S.promises){let v=p.st==='broken'?false:p.st==='void'?'void':evalP(p.id);if(v==='void'){report.push({id:p.id,res:'void'});continue}
    p.st=v?'kept':'broken';if(v)S.rep++;else S.rep--;report.push({id:p.id,res:p.st});for(const g of pgroups(p.id))grp(g,v?GAIN[pdef(p.id).size]:-20,`${v?'Kept':'Broken'}: ${pdef(p.id).t}`)}
  if(C().cash<0&&grpOf('business'))grp('business',-5,'The club is in the red');
  let mg=C().groups.slice().sort((a,b)=>a.mood-b.mood).slice(0,3).map(g=>g.k);if(S.alvExtra&&!mg.includes(S.alvExtra))mg=[S.alvExtra,...mg.slice(0,2)];S.alvExtra=null;const motions=mg.map(k=>({id:k,by:k,...ARCH[k].motion})).filter(m=>!(m.id==='business'&&S.flags.oppBoard));
  S.alv={step:'report',report,motions,lobby:[],speakers:[],defense:null,result:null,two:C().statute.some(x=>x.startsWith('Two-thirds'))};
  S.screen='alv';
}
function applyLobby(sel){
  const A=S.alv,c=C();A.lobby=sel;
  for(const id of sel){const m=A.motions.find(x=>x.id===id);
    if(m){grp(m.by,6,`You back their motion: ${m.t}`);if(m.against&&grpOf(m.against))grp(m.against,-3,'They saw the deal');if(m.anti)log('You backed a motion that limits your own power','Power traded for votes',null);
      if(m.id==='business'&&(hasP('noInvestor'))){const p=S.promises.find(x=>x.id==='noInvestor');if(p.st!=='broken'){p.st='broken';S.rep--;for(const g of pgroups('noInvestor'))grp(g,-20,'Broken: no outside investor')}}}
    if(id==='seat'){S.flags.weakSeat=1;grp(S.oppGroup,9,`You give ${gname(c,S.oppGroup)} a seat with a veto`)}}
  const sides=sel.map(id=>A.motions.find(x=>x.id===id)).filter(Boolean);
  for(const a of sides)for(const b of sides)if(a!==b&&a.against===b.by){grp(a.by,-3,'They saw you promise the other side');}
  const need=A.two?66.7:50;
  for(const m of A.motions){let yes=0;for(const g of c.groups){let base=g.k===m.by?90:g.k===m.against?15:45;if(sel.includes(m.id))base+=10;yes+=g.share/100*clamp(base,0,100)}m.pass=yes>=need;m.yes=yes}
  const sp=[];
  for(const role of ['fan','captain','coach','td']){const pid=cast(role);if(!pid)continue;const p=P(pid);if(p.loy==null)continue;const g=p.infl;
    if(p.withOpp){sp.push({id:pid,line:`${p.name} stands with the opposition: "I backed the wrong person."`});if(g)grp(g,-3,`${p.name} speaks against you`)}
    else if(S.flags[role+'Speaks']||p.owes){p.owes=false;sp.push({id:pid,line:`${p.name}: "The chairman kept faith with me. Keep faith with the chairman."`});if(g)grp(g,3,`${p.name} speaks for you`)}
    else if(g&&p.loy>6)grp(g,Math.min(2,Math.round(p.loy-6)),`${p.name} talks you up around the club`);
    else if(g&&p.loy<4)grp(g,-Math.round(4-p.loy),`${p.name} grumbles about you around the club`);}
  A.speakers=sp;A.candidate=!S.flags.oppBoard&&(S.flags.challenge||weighted()<50||c.groups.some(g=>g.share>=30&&g.mood<40));A.step='speech';
}
function applyDefense(d){
  const A=S.alv,c=C();A.defense=d;
  if(d==='luck'){const v=luck()==='unlucky'?5:-5;for(const g of c.groups)grp(g.k,v,v>0?'They accept it was bad luck: the numbers back you':'Excuses: we got what we deserved')}
  if(d==='success'){const kept=A.report.filter(r=>r.res==='kept');if(kept.length){const g=pgroups(kept[0].id)[0]||c.groups[0].k;grp(g,5,`You remind them: ${pdef(kept[0].id).t}`);const o=c.groups.filter(x=>x.k!==g).sort((a,b)=>a.mood-b.mood)[0];if(o)grp(o.k,-3,'They hear a chairman changing the subject')}else for(const g of c.groups)grp(g.k,-3,'Nothing to point at')}
  if(d==='blame'){const pid=cast('coach');loy(pid,'blame','You blamed the coach in front of the members',{mem:[-2,'you blamed them in front of the members']});const p=P(pid);if(p.infl)grp(p.infl,-3,`They liked ${p.name}`);const o=c.groups.find(x=>x.k!==p.infl);if(o)grp(o.k,4,'Someone finally takes the blame')}
  if(d==='wrong'){S.rep+=0;S.flags.trusted=1;log('You admitted your mistakes','Your next manifest will be believed',null)}
  const total=weighted();A.result={total,won:total>=50};A.step='count';
  S.history.push({s:S.season,club:S.my,txt:`${ord(myPos())} in the ${C().tier===0?'Premier':'One'}. ${A.result.won?'Re-elected':'Voted out'} with ${Math.round(total)}%.`});
}
function endSeason(){
  const won=S.alv.result.won;
  aiSeasonEnd();
  for(const m of S.alv.motions.filter(x=>x.pass)){C().binding.push(`${m.t} (season ${S.season})`);if(m.cost)C().cash-=m.cost;if(m.gain)C().cash+=m.gain}
  for(const k of Object.keys(S.flags))if(k.startsWith('summer_')&&S.flags[k]){const pid=k.slice(7),x=S.flags[k];if(P(pid)&&P(pid).club===S.my){C().cash+=x.fee;newsPush(`${P(pid).name} leaves for ${CL(x.club).name} as agreed.`,[pid],[x.club]);leaveClub(pid,x.club)}}
  promoteRelegate();
  if(!won){const opp=cast('opp');const c=C();c.cast.chair=opp;P(opp).role='chair';c.cast.opp=mkPerson('opp',c.id,{infl:weakest(c)});S.formerClub=S.my;
    newsPush(`${P(opp).name} is the new chairman of ${c.name}.`,[opp],[c.id]);}
  S.season++;startSeasonWorld();
  if(won){S.promises=[];const keep={council:S.flags.council,coachContract:S.flags.coachContract,tdFree:S.flags.tdFree,academy:S.flags.academy,fanSeat:S.flags.fanSeat,fanName:S.flags.fanName,captainFuture:S.flags.captainFuture,oppBoard:S.flags.oppBoard,weakSeat:S.flags.weakSeat};
    S.flags={...keep,captainExpiring:!keep.captainFuture&&rnd()<.4};S.mods=[];S.cashStart=C().cash;S.oppGroup=weakest(C());S.oppMoves=0;S.step=0;S.pick={};S.chances=computeChances();S.phase='manifest';S.screen='manifest';}
  else{S.my=null;makeSeats();S.phase='seats';S.screen='summer';}
}

/* ----- action dispatcher (used by the UI and by the audit bots) ----- */
function act(a,arg){
  switch(a){
    case'new':newWorld(arg??((Date.now()%2147483647)|0));break;
    case'toSeats':S.phase='seats';S.screen='seats';break;
    case'seat':chooseSeat(arg);break;
    case'electCard':{const sc=electionScene();sceneCards(sc)[+arg].run();S.cashStart=C().cash;S.step=0;S.pick={};S.chances=computeChances();S.screen='manifest';break}
    case'pick':S.pick[['sport','club','person'][S.step]]=arg;S.step++;if(S.step>=3){applyManifest();if(S.phase==='election'){S.elect.result=electionResult();S.screen='electResult'}else startMoment(1)}break;
    case'electNext':if(S.elect.result.won){S.startSeason=S.season;S.history.push({s:S.season,club:S.my,txt:`Elected chairman of ${C().name} with ${Math.round(S.elect.result.total)}%.`});for(const id of Object.values(C().cast))if(P(id)&&P(id).role!=='talent'&&P(id).loy==null&&P(id).mem.length)meet(id);startMoment(1)}else{S.seats=S.seats.filter(x=>x.id!==S.my);S.my=null;if(!S.seats.length)makeSeats();S.phase='seats';S.screen='seats'}break;
    case'echoNext':S.screen='desk';break;
    case'sit':S.sit=+arg;S.screen='sit';break;
    case'back':S.sit=null;S.screen='desk';break;
    case'card':applyCard(+arg);break;
    case'deskDone':deskDone();break;
    case'hire':hireCoach(arg);S.screen=S.afterHire||'desk';break;
    case'reviewNext':runBlock();break;
    case'blockNext':afterBlock();break;
    case'alvLobby':S.alv.step='lobby';break;
    case'lobbyDone':applyLobby(arg||[]);break;
    case'defend':applyDefense(arg);break;
    case'toEnd':S.alv.step='end';break;
    case'nextSeason':endSeason();break;
    case'summerNext':S.screen='seats';break;
  }
}

  const sc=sitBuild(S.sit);sc.who.forEach(x=>{if(P(x)&&P(x).role!=='talent')meet(x)});
  const lines=sc.lines.map(l=>l.startsWith('"')||/^[A-Z][^"]*: "/.test(l)?`<p class="voice">${esc(l)}</p>`:`<p>${esc(l)}</p>`).join('');
  return`<p class="eyebrow">On your desk</p><h2>${esc(sc.title)}</h2><section class="scene">${sc.who.filter(x=>P(x)).map(whoRow).join('')}${lines}${sc.who.map(personLine).join('')}</section>
  <p class="eyebrow">On the table</p><div class="stack">${sceneCards(sc).map(dealHTML).join('')}</div><button class="btn ghost" data-act="back">Back to the desk</button>`;
}
function hireView(){
  const list=S.hire.map(pid=>{const p=P(pid);const m=p.mem[p.mem.length-1];const past=p.career.length?`Past: ${p.career.map(x=>CL(x).name).join(', ')}.`:'No league experience.';
    return`<button class="choice" data-act="hire" data-arg="${pid}"><b>${esc(p.name)}</b><span class="meta">${p.traits.join(', ')} · values ${VALUE_WORD[p.value]} · ${p.age}</span><span class="meta">${esc(past)}${m?` Remembers you: ${esc(m.txt)}.`:''}</span></button>`}).join('');
  return`<p class="eyebrow">The coaches available</p><h2>Who takes the job?</h2><p>These are the coaches out of work in the Northmarch right now.</p><div class="stack">${list}</div>`;
}
function reviewView(){
  const items=S.mlog.map(e=>`<li>${esc(e.text)} ${e.num?`<span class="num">${esc(e.num)}</span>`:''}<span class="why">${esc(e.why)}</span></li>`).join('')||'<li>Nothing changed.</li>';
  const to=BLOCK_ENDS.find(e=>e>S.round);
  return`<p class="eyebrow">Looking back</p><h2>What changed, and why</h2><ul class="log">${items}</ul>${moodsPanel()}<button class="btn" data-act="reviewNext">Play rounds ${S.round+1} to ${to}</button>`;
}
function blockView(){
  const b=S.block;const pts=b.reduce((s,m)=>s+m.pts,0);
  const rows=b.map(m=>`<div class="res"><span class="wdl ${m.pts===3?'W':m.pts===1?'D':'L'}">${m.pts===3?'W':m.pts===1?'D':'L'}</span><span>${m.home?'':'at '}${esc(CL(m.opp).name)}${m.derby?' <span class="tag">Derby</span>':''}</span><span>${m.gf}–${m.ga}</span></div>`).join('');
  const st=standings(C().tier),p=st.indexOf(S.my);const around=st.slice(Math.max(0,p-2),Math.min(16,p+3));
  const tbl=around.map(id=>`<div class="row small" style="font-variant-numeric:tabular-nums${id===S.my?';font-weight:600':''}"><span>${st.indexOf(id)+1}. ${esc(CL(id).name)}</span><span>${S.tbl[id].pts} pts</span></div>`).join('');
  const prom=S.promises.filter(x=>x.st==='open').map(x=>`<div class="row small"><span>${esc(pdef(x.id).t)}</span><span class="mood ${behind(x.id)?'down':'up'}">${behind(x.id)?'Behind':'On track'}</span></div>`).join('');
  return`<p class="eyebrow">Rounds ${b[0].r} to ${b[b.length-1].r}</p><h2>${pts} points from ${b.length}</h2><p class="muted">${luckWord()}.</p><div class="panel">${rows}</div><div class="panel"><p class="eyebrow">The table</p>${tbl}</div>${prom?`<div class="panel"><p class="eyebrow">Your promises</p>${prom}</div>`:''}<button class="btn" data-act="blockNext">${S.round>=30?'To the AGM':'Next moment'}</button>`;
}
function verdict(p){return p>=75?'Overwhelmingly for':p>=58?'Clearly for':p>=50?'Narrowly for':p>=42?'Narrowly against':p>=25?'Clearly against':'Overwhelmingly against'}
function alvView(){
  const A=S.alv,c=C();
  if(A.step==='report'){const rows=A.report.map(r=>`<div class="row"><span>${esc(pdef(r.id).t)}</span><span class="mood ${r.res==='kept'?'up':r.res==='broken'?'down':''}">${r.res==='kept'?'Kept':r.res==='broken'?'Broken':'Void'}</span></div>`).join('<hr>')||'<p>You promised nothing.</p>';
    return`<p class="eyebrow">June · ${esc(c.name)}</p><h2>The annual report</h2><p>Final position: ${ord(myPos())}, ${S.tbl[S.my].pts} points. ${luckWord()}.</p><div class="panel">${rows}</div>${moodsPanel('How they walk in')}<button class="btn" data-act="alvLobby">Into the corridor</button>`}
  if(A.step==='lobby'){
    const opts=[...A.motions.map(m=>({id:m.id,t:`Back the ${gname(c,m.by)} motion`,d:`"${m.t}". ${gname(c,m.by)} warm to you${m.against&&grpOf(m.against)?`; ${gname(c,m.against)} see the deal`:''}.${m.anti?' It limits your own power.':''} If it passes, it binds the club.`})),
      ...(!S.flags.weakSeat?[{id:'seat',t:`Offer ${gname(c,S.oppGroup)} a seat with a veto`,d:'They join the table. Your big decisions go past them from now on.'}]:[])];
    return`<p class="eyebrow">The corridor, 7.45pm</p><h2>Motions and deals</h2><p>Binding motions tonight${A.two?', and the statute demands two-thirds':''}:</p><ul class="log">${A.motions.map(m=>`<li><b>${esc(gname(c,m.by))}:</b> ${esc(m.t)}</li>`).join('')}</ul><p>Make as many deals as you like. Everyone in the hall will know about each one.</p>
    <div class="stack">${opts.map(o=>`<label class="check${UI.lobby[o.id]?' on':''}" for="lb-${o.id}"><input type="checkbox" id="lb-${o.id}" data-lobby="${o.id}" ${UI.lobby[o.id]?'checked':''}><span><b>${esc(o.t)}</b><br><span class="small muted">${esc(o.d)}</span></span></label>`).join('')}</div><button class="btn" data-act="lobbyDone">Into the hall</button>`}
  if(A.step==='speech'){const opp=P(cast('opp'));
    const sp=A.speakers.map(s=>`<div class="stack" style="gap:6px">${whoRow(s.id)}<p class="voice">${esc(s.line)}</p></div>`).join('<hr>')||'<p class="muted">Nobody stands up for you, and nobody against.</p>';
    const res=A.motions.map(m=>`<div class="row"><span>${esc(m.t)}</span><span class="mood ${m.pass?'up':'down'}">${m.pass?'Carried':'Defeated'}</span></div>`).join('');
    const cand=A.candidate?`<div class="stack" style="gap:6px">${whoRow(opp.id)}<p class="voice">"Count the chairman's promises. Then vote for someone who delivers."</p></div>`:'<p>No one stands against you. Tonight is a vote of confidence.</p>';
    const defs=[['wrong','"Where I fell short, I was wrong."','Nothing changes tonight. Your next manifest will be believed.'],['luck','"We were unlucky."',luck()==='unlucky'?'True this season. They may accept it.':'The table says otherwise.'],['success','"Look at what worked."','Point to what you delivered. Some will call it changing the subject.'],['blame','"The coach let us down."',`${P(cast('coach')).name} hears every word.`]];
    return`<p class="eyebrow">The hall</p><h2>Motions and voices</h2><div class="panel">${res}</div><div class="panel">${sp}</div><div class="panel"><p class="eyebrow">${A.candidate?'Your opponent':'No challenger'}</p>${cand}</div><p class="eyebrow">Your speech</p><div class="stack">${defs.map(d=>`<button class="choice" data-act="defend" data-arg="${d[0]}"><b>${esc(d[1])}</b><span class="meta">${esc(d[2])}</span></button>`).join('')}</div>`}
  if(A.step==='count'){const order=c.groups.slice().sort((a,b)=>a.mood-b.mood);const won=A.result.won;
    return`<p class="eyebrow">The count</p><h2>${A.candidate?`You or ${esc(P(cast('opp')).name)}`:'Confidence in the chairman'}</h2><div class="count">${order.map(g=>`<div class="cg panel"><div class="row"><b>${esc(gname(c,g.k))}</b><span class="mood">${verdict(g.mood)}</span></div><div class="bar"><i style="width:${Math.round(g.mood)}%"></i></div></div>`).join('')}</div>
    <div class="verdict stack"><p class="big ${won?'up':'down'}">${won?'Re-elected':'Voted out'}</p><p>${won?'The members keep you. What you gave away tonight now binds the club.':'Your time here is over. Your reputation goes with you.'}</p><button class="btn" data-act="toEnd">The season in full</button></div>`}
  if(A.step==='end'){const kept=S.promises.filter(p=>p.st==='kept').length,broken=S.promises.filter(p=>p.st==='broken').length;
    const ppl=['coach','td','captain','fan','opp'].map(cast).filter(x=>x&&P(x).loy!=null).map(x=>`<div class="row small"><span>${esc(P(x).name)}<br><span class="muted">${esc(ROLE_WORD[P(x).role])}</span></span><span class="mood">${band(P(x).loy)}${P(x).withOpp?' · with the opposition':''}</span></div>`).join('');
    return`<p class="eyebrow">End of season ${S.season}</p><h2>${A.result.won?'Chairman for another year':'Former chairman of '+esc(c.name)}</h2><p>${ord(myPos())} with ${S.tbl[S.my].pts} points. Promises kept: ${kept}. Broken: ${broken}.</p>
    ${c.binding.length||A.motions.some(m=>m.pass)?`<div class="panel"><p class="eyebrow">What binds the club</p><ul class="log">${A.motions.filter(m=>m.pass).map(m=>`<li>${esc(m.t)}</li>`).join('')}${c.binding.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`:''}
    <div class="panel"><p class="eyebrow">Your people</p>${ppl}</div><button class="btn" data-act="nextSeason">${A.result.won?'Into the summer':'Into the summer, without a club'}</button>`}
}
function summerView(){
  const news=S.news.filter(n=>n.s===S.season-1||n.s===S.season).sort((a,b)=>a.pri-b.pri).slice(0,5).map(n=>n.text);
  return`${echoBox('June',S.formerClub?`Life after ${CL(S.formerClub).name}`:'The summer',news.length?news:['A quiet summer in the Northmarch.'])}<p>The region moved on while you packed your desk. The people you met remember what you did.</p><button class="btn" data-act="summerNext">See the open seats</button>`;
}
function overlayView(){
  if(UI.over==='table'){const c=C();
    const pr=S.promises.map(p=>`<div class="row small"><span>${esc(pdef(p.id).t)}</span><span class="mood">${p.st!=='open'?p.st:behind(p.id)?'Behind':'On track'}</span></div>`).join('')||'<p class="small muted">No promises.</p>';
    const ppl=['coach','td','captain','fan','opp'].map(cast).filter(Boolean).map(x=>{const p=P(x);return`<div class="row small"><span>${esc(p.name)}<br><span class="muted">${esc(ROLE_WORD[p.role])} · ${p.traits.join(', ')}</span></span><span class="mood">${band(p.loy)}${p.owes?' · owes you':''}${p.withOpp?' · with the opposition':''}</span></div>`}).join('<hr>');
    const fl=S.flags,deals=[fl.coachContract&&'Coach: two-year contract',fl.coachFinalSay&&'Coach has the final say',fl.tdFree&&'Director runs recruitment alone',fl.academy&&'A new academy',fl.captainSigned&&'Captain signed',fl.captainFuture&&'Captain: coaching future',fl.fanSeat&&'Supporters\' seat on the board',fl.fanName&&'A stand named for the supporters',fl.derbyCrowd&&'Free buses for the derby',fl.oppCommittee&&'Opposition chairs a committee',fl.truce&&'Truce with the opposition',fl.oppBoard&&'Opposition on the board',fl.council&&'Members\' council vets spending',fl.pressFriend&&'Exclusive given to the Echo',fl.pressHostile&&'Frozen out the Echo',fl.leagueVote&&`League vote with ${P(fl.leagueVote).name}`].filter(Boolean);
    return`<div class="overlay" role="dialog" aria-label="The table"><div class="inner"><div class="row"><h2>The table</h2><button class="tbtn" data-act="ov">Close</button></div><p class="muted small">${S.round?`${ord(myPos())} after round ${S.round}. `:''}Money: ${moneyWord(c.cash)}${c.debt?`, £${c.debt}k debt`:''}.</p>
    <div class="panel"><p class="eyebrow">Your promises</p>${pr}</div><div class="panel"><p class="eyebrow">Deals on the table</p>${deals.length?deals.map(d=>`<p class="small">${esc(d)}</p>`).join(''):'<p class="small muted">None yet.</p>'}</div>${moodsPanel('The members')}<div class="panel"><p class="eyebrow">Your people</p>${ppl}</div></div></div>`}
  const tabs=`<div class="tabs" role="tablist">${[['tables','Tables'],['people','People you know'],['history','Your career']].map(([k,n])=>`<button class="${UI.tab===k?'on':''}" data-act="tab" data-arg="${k}">${n}</button>`).join('')}</div>`;
  let body='';
  if(UI.tab==='tables'){body=[0,1].map(t=>`<div class="panel"><p class="eyebrow">${t===0?'Northmarch Premier':'Northmarch One'}</p>${standings(t).map((id,i)=>`<div class="row small" style="font-variant-numeric:tabular-nums${id===S.my?';font-weight:600':''}"><span>${i+1}. ${esc(CL(id).name)}</span><span>${S.tbl[id].pts}</span></div>`).join('')}</div>`).join('')}
  if(UI.tab==='people'){const known=Object.values(S.P).filter(p=>(p.loy!=null||p.mem.length)&&p.role!=='talent');body=`<div class="panel">${known.map(p=>`<div class="row small"><span>${esc(p.name)}<br><span class="muted">${esc(ROLE_WORD[p.role]||p.role)} · ${p.club?esc(CL(p.club).name):'out of work'}</span></span><span class="mood">${band(p.loy)}</span></div>`).join('<hr>')||'<p class="small muted">Nobody yet.</p>'}</div>`}
  if(UI.tab==='history'){body=`<div class="panel"><ul class="log">${S.history.map(h=>`<li><span class="num">S${h.s}</span> ${esc(h.txt)}</li>`).join('')}</ul></div><p class="small muted">Reputation: ${S.rep>=4?'a chairman who keeps promises':S.rep>=0?'mixed':'a chairman who breaks promises'}.</p>`}
  return`<div class="overlay" role="dialog" aria-label="The region"><div class="inner"><div class="row"><h2>The Northmarch</h2><button class="tbtn" data-act="ov">Close</button></div>${tabs}${body}</div></div>`;
}

/* ================= Input, save, boot ================= */
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);if(t){const s=JSON.parse(t);if(s&&s.v===1){S=s;return true}}}catch(e){}return false}
if(HAS_DOM){
  document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.lobby;if(id){UI.lobby[id]=e.target.checked;render()}});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,arg=b.dataset.arg;
    if(a==='ov'){UI.over=arg||null;if(arg==='region')UI.tab='tables';render();return}
    if(a==='tab'){UI.tab=arg;render();return}
    if(a==='continue'){if(load())render();return}
    if(a==='new'){UI.lobby={};UI.over=null;act('new');}
    else if(a==='lobbyDone'){act('lobbyDone',Object.keys(UI.lobby).filter(k=>UI.lobby[k]));UI.lobby={}}
    else act(a,arg);
    save();render();if(!['listen','point'].includes(a))window.scrollTo(0,0);});
  const boot=data=>{if(data&&data.S)S=data.S;render()};
  window.claude?.hot?.snapshot?.(()=>({S}));
  window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
if(typeof module!=='undefined')module.exports={act,get S(){return S},set S(v){S=v},currentScene,sceneCards,electionScene,manifestOptions,sitBuild,P,C,weighted,myPos,pdef};
</script>
