<style>

<script>
"use strict";
/* ---------- Static world ---------- */

const TEAMS=[['pell','Pell United',50],['corden','Corden Athletic',53],['saltmere','Saltmere Rovers',48],['kestle','Kestle Albion',46],['brack','Brackwater',55],['dunmore','Dunmore Vale',44],['fenwick','Fenwick Athletic',51],['holbeck','Holbeck Town',49],['ilsworth','Ilsworth United',52],['marrow','Marrow Bay',45],['north','Northcliffe',58],['ottery','Ottery Wanderers',47],['ravens','Ravensby',54],['selcombe','Selcombe City',43],['tarn','Tarn Valley',50],['wexmoor','Wexmoor',56],['yarrow','Yarrowby',47],['harrow','Harrowgate Town',57]];
const TNAME={},TSTR={};TEAMS.forEach(t=>{TNAME[t[0]]=t[1];TSTR[t[0]]=t[2]});
const BLOCK_ENDS=[9,17,27,34];

const CH={
 esteves:{name:'Maria Esteves',short:'Esteves',role:'Head coach',traits:['honest','ambitious'],infl:'students',dislike:'docks',canDefect:true,place:'training',
  surface:'Promotion, and one day a bigger job.',deep:'She wants to be trusted with a project, not judged every Saturday.',

 ward:{name:'Colin Ward',short:'Ward',role:'Director of football',traits:['loyal','stubborn'],infl:null,dislike:null,canDefect:true,place:'office',

 hart:{name:'Lewis Hart',short:'Hart',role:'Captain',traits:['proud','loyal'],infl:'docks',dislike:'students',canDefect:true,place:'carpark',

 kearney:{name:'Pat Kearney',short:'Kearney',role:'Leader of the Docks',traits:['stubborn','loyal'],infl:'docks',dislike:'business',canDefect:false,place:'cafe',

 okon:{name:'Ruth Okon',short:'Okon',role:'Chair, business association',traits:['honest','stubborn'],infl:'business',dislike:null,canDefect:true,place:'business',

 vance:{name:'Gareth Vance',short:'Vance',role:'Opposition candidate',traits:['sly','ambitious'],infl:'business',dislike:null,canDefect:false,place:'hotel',
  surface:'Outside money, growth, and your job.',deep:'His father ran half the town and was never asked onto the club board.',
  deepLine:'"My father gave this club forty years of money. They never once asked him into the boardroom."'}
};
const OPEN={
 esteves:['"I\'ve said what I needed to say to the board, chairman."','"Gareth Vance asked me for a coffee. I haven\'t said no."','"Chairman. If it\'s about Saturday, the report\'s on your desk."','"Good timing. The lads are flying in training."','"You came down. I like that. Pull up a cone."'],
 talbot:['"Say what you came to say."','"I hear things, chairman. Most of them about you."','"Talbot. You\'ll want the short version."','"Not bad, this lot. Not bad at all."','"Chairman. Tea\'s on. Sit."'],
 ward:['"I\'ve nothing more to discuss."','"Vance\'s people rang. I didn\'t ring back. Yet."','"Colin Ward. Spreadsheets, mostly."','"Come in. I\'ve got a lad you should see."','"Chairman! Shut the door, look at this."'],
 hart:['"I\'ve got nothing to say to you."','"Gareth Vance at least returns my calls."','"Chairman." He keeps his kit bag on his shoulder.','"Alright, chairman? Good session today."','"Here he is. The lads were asking after you."'],
 kearney:['"You\'ve got a nerve coming in here."','"The Docks are watching you, chairman. Closely."','"Pint? You\'re paying."','"Sit down, chairman. Ignore that lot singing."','"Room for the chairman! Make room!"'],
 okon:['"I think we\'ve said everything, chairman."','"Gareth Vance has been very attentive lately."','"Ruth Okon. Shall we keep this short?"','"Chairman. Coffee? The good stuff, not the board\'s."','"There he is. My favourite chairman."'],
 vance:['"Chairman. Come to concede?"','"Chairman. Come to concede?"','"Chairman. Drink? I insist. Members\' money, after all."','"Chairman. Drink? I insist. Members\' money, after all."','"Chairman. I think we could do business, you and I."']
};
const PLACES={
 training:{name:'Training ground',who:()=>S.coach},
 carpark:{name:'Car park after training',who:()=>'hart'},
 office:{name:'Ward\'s office',who:()=>'ward'},
 cafe:{name:'The Anchor, supporters\' café',who:()=>'kearney'},
 business:{name:'Business club',who:()=>'okon'},

};
const PROM={
 top8:{slot:'sport',t:'Top eight',size:'M',g:['docks','business'],desc:'The Docks and Business want to see progress.'},
 derby:{slot:'sport',t:'Four points from the Corden derbies',size:'M',g:['docks'],desc:'Kearney lives for these two games.'},
 goals:{slot:'sport',t:'Fifty league goals',size:'S',g:['students'],desc:'Attacking football. A small promise gives Vance something to mock.'},
 promo:{slot:'sport',t:'Promotion',size:'L',g:['docks','students','business'],desc:'Every member dreams of it. Clubs this size rarely manage it.'},
 tickets:{slot:'club',t:'Tickets under £10',size:'M',g:['students','docks'],desc:'Costs £60k a year. Business will notice the gap.',word:'Yours to keep'},
 stadium:{slot:'club',t:'A stadium plan put to the members',size:'L',g:['business'],desc:'Business wants it badly. You will need a partner.',word:'Needs a partner'},
 youth3:{slot:'club',t:'Three academy debuts',size:'M',g:['students'],desc:'Ward will love it. The coach decides who plays.',word:'Needs the coach'},
 estevesYear:{slot:'person',t:'Esteves gets the season',size:'M',g:['students'],desc:'She is backed in public. You cannot sack her without breaking your word.',word:'Yours to keep'},
 hartContract:{slot:'person',t:'Hart gets a new contract',size:'M',g:['docks'],desc:'The Docks adore him. Contracts are Ward\'s call.',word:'Needs Ward'},
 okoro:{slot:'person',t:'Jay Okoro starts ten games',size:'M',g:['students'],desc:'Ward\'s wonderkid. The coach picks the team.',word:'Needs the coach'},
 noInvestor:{slot:'deal',t:'No outside investor while you are chairman',size:'M',g:['docks']},
 harlanReview:{slot:'deal',t:'A fair review of outside investment',size:'M',g:['business']}
};
const SIZE_WORD={S:'Small promise',M:'Medium promise',L:'Big promise'};
const GAIN={S:8,M:15,L:22};

/* ---------- RNG ---------- */
let S=null; const UI={table:false,lobby:{},showLog:false};
function rnd(){let t=(S.rs=(S.rs+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}
function mkRng(seed){let s=seed|0;return()=>{let t=(s=(s+0x6D2B79F5)|0);t=Math.imul(t^(t>>>15),1|t);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function pois(l,r){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L);return k-1}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- Football ---------- */
function makeFixtures(r){
  const ids=TEAMS.map(t=>t[0]);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  const n=ids.length;let arr=ids.slice();const first=[];
  for(let k=0;k<n-1;k++){const m=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];m.push((k+i)%2?[b,a]:[a,b])}first.push(m);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  let k=first.findIndex(rd=>rd.some(([a,b])=>(a==='pell'&&b==='corden')||(a==='corden'&&b==='pell')));
  [first[8],first[k]]=[first[k],first[8]];
  const second=first.map(rd=>rd.map(([a,b])=>[b,a]));
  return first.concat(second);
}
function lambdas(sa,sb,home){const d=(sa-sb)/20+(home?.15:-.15);return[Math.max(.4,1.35+.6*d),Math.max(.4,1.35-.6*d)]}
function pmf(l,k){let p=Math.exp(-l);for(let i=1;i<=k;i++)p*=l/i;return p}
function xpts(la,lb){let w=0,d=0;for(let i=0;i<=9;i++){const a=pmf(la,i);for(let j=0;j<=9;j++){const b=pmf(lb,j);if(i>j)w+=a*b;else if(i===j)d+=a*b}}return 3*w+d}
function pellStr(round,home,opp){let s=50;for(const m of S.mods)if(m.from<=round&&m.until>=round)s+=m.v;s-=.5*S.youth;if(opp==='corden'&&home&&S.flags.docksDerby)s+=2;return s}
function addMod(key,v,until,from){S.mods.push({key,v,until,from:from??S.round+1})}
function nextBlockEnd(r){return BLOCK_ENDS.find(e=>e>=r)??34}
function simRound(r){
  let mine=null;
  for(const [h,a] of S.fx[r-1]){
    const sh=h==='pell'?pellStr(r,true,a):TSTR[h], sa=a==='pell'?pellStr(r,false,h):TSTR[a];
    const [lh,la]=lambdas(sh,sa,true);const gh=pois(lh,rnd),ga=pois(la,rnd);
    rec(h,gh,ga);rec(a,ga,gh);
    if(h==='pell'||a==='pell'){
      const home=h==='pell',gf=home?gh:ga,gag=home?ga:gh,opp=home?a:h;
      const xp=home?xpts(lh,la):xpts(la,lh);const pts=gf>gag?3:gf===gag?1:0;
      S.realPts+=pts;S.xPts+=xp;
      if(opp==='corden')S.derbyPts+=pts;
      if(S.youth>0){if(S.youth===2||rnd()<.5)S.okoroStarts++;if(S.debuts<6&&rnd()<.12*S.youth)S.debuts++}
      mine={r,opp,home,gf,ga:gag,pts,derby:opp==='corden'};
    }
  }
  return mine;
}
function rec(id,f,a){const t=S.tbl[id];t.p++;t.gf+=f;t.ga+=a;if(f>a){t.w++;t.pts+=3}else if(f===a){t.d++;t.pts++}else t.l++}
function standings(){return Object.keys(S.tbl).sort((x,y)=>{const a=S.tbl[x],b=S.tbl[y];return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf})}
function pos(){return standings().indexOf('pell')+1}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function luck(){const d=S.realPts-S.xPts;return d<=-4?'unlucky':d>=4?'lucky':'fair'}
function luckWord(){return{unlucky:'Unlucky: we deserved more',lucky:'Lucky: we got more than we deserved',fair:'About what we deserved'}[luck()]}

function computeChances(){
  const r=mkRng(S.seed^0x5eed),N=220,c={top8:0,derby:0,goals:0,promo:0};
  for(let s=0;s<N;s++){
    const tb={};TEAMS.forEach(t=>tb[t[0]]={pts:0,gd:0,gf:0});let dp=0;
    for(const rd of S.fx)for(const [h,a] of rd){const [lh,la]=lambdas(TSTR[h],TSTR[a],true);const gh=pois(lh,r),ga=pois(la,r);
      const ph=gh>ga?3:gh===ga?1:0,pa=ga>gh?3:gh===ga?1:0;tb[h].pts+=ph;tb[a].pts+=pa;tb[h].gd+=gh-ga;tb[a].gd+=ga-gh;tb[h].gf+=gh;tb[a].gf+=ga;
      if(h==='pell'&&a==='corden')dp+=ph;if(a==='pell'&&h==='corden')dp+=pa}
    const order=Object.keys(tb).sort((x,y)=>tb[y].pts-tb[x].pts||tb[y].gd-tb[x].gd);const p=order.indexOf('pell')+1;
    if(p<=8)c.top8++;if(p<=3)c.promo++;if(dp>=4)c.derby++;if(tb.pell.gf>=50)c.goals++;
  }
  const out={};for(const k in c)out[k]=c[k]/N;return out;
}
function chanceWord(p){return p<.12?'Long shot':p<.35?'Unlikely':p<.6?'Coin toss':p<.85?'Likely':'Near certain'}

/* ---------- Words ---------- */
function band(l){return l<2?'Broken':l<4?'Distant':l<6?'Businesslike':l<8?'Warm':'Devoted'}
function bandIdx(l){return l<2?0:l<4?1:l<6?2:l<8?3:4}
function moodWord(p){return p<25?'Furious':p<40?'Angry':p<50?'Wary':p<65?'Content':'Thrilled'}
function moneyWord(c){return c>=100?'Comfortable':c>=40?'Tight':c>=0?'Stretched':'In the red'}
function weighted(){return GORDER.reduce((s,g)=>s+GROUPS[g].share*S.grp[g],0)}

/* ---------- State changes (every change is logged with its cause) ---------- */
function log(text,why,num){const e={r:S.round,text,why,num};S.log.push(e);S.mlog.push(e)}
const KIND={protect:[2,'loyal',1.5],wish:[1,'ambitious',1.5],against:[-1,'stubborn',2],bypass:[-2,'proud',1.5],blame:[-3,'honest',.5],deep:[3,null,1],wait:[-1,'proud',1.5]};
function loy(id,kind,why,raw){
  const c=S.ch[id];if(!c)return;const d=CH[id];let v;
  if(raw!=null)v=raw;else{const [b,t,m]=KIND[kind];v=b*(t&&d.traits.includes(t)?m:1)}
  const before=c.loy;c.loy=clamp(c.loy+v,0,10);
  if(before<8&&c.loy>=8){c.owes=true;S.cross.push({id,dir:'up'})}
  if(before>=8&&c.loy<8)c.owes=false;
  if(before>=4&&c.loy<4&&!c.withVance)S.cross.push({id,dir:'down'});
  log(`${d.short}: ${band(before)} → ${band(c.loy)}`,why,(v>0?'+':'')+v);
}
function grp(g,d,why){if(!d)return;const b=S.grp[g];S.grp[g]=clamp(b+d,0,100);if(g==='business'&&d>0)S.served=true;log(`${GROUPS[g].name}: ${moodWord(b)} → ${moodWord(S.grp[g])}`,why,(d>0?'+':'')+d)}
function cash(d,why){S.cash+=d;log(`Money: ${d>0?'+':'−'}£${Math.abs(d)}k`,why,null)}
function hasP(id){return S.promises.some(p=>p.id===id)}
function openP(id){return S.promises.find(p=>p.id===id&&p.st==='open')}
function addPromise(id,why){if(hasP(id))return;S.promises.push({id,st:'open'});log(`New promise: ${PROM[id].t}`,why,null)}
function breakPromise(id,why){const p=openP(id);if(!p)return;p.st='broken';log(`Promise broken: ${PROM[id].t}`,why,null)}
function comply(id,against,useOwes){const c=S.ch[id];if(useOwes){c.owes=false;return'full'}if(!against)return c.loy>=2?'full':'refuse';return c.loy>=4?'half':'refuse'}
function youthAsk(id,useOwes){
  const r=comply(id,true,useOwes);
  if(r==='refuse'){log(`${CH[id].short} refuses to play the kids`,`${CH[id].short} is ${band(S.ch[id].loy).toLowerCase()} with you`,null);return}
  S.youth=Math.max(S.youth,r==='full'?2:1);
  log(r==='full'?'The academy kids start every week':'The kids get some minutes, not many',r==='full'?'The coach does it properly':'The coach does it half-heartedly',null);
  if(!useOwes)loy(id,'against','You asked for youth over results');
  if(S.ch.ward)loy('ward','wish','Ward sees his academy players get minutes');
}
function behind(id){
  const r=S.round,p=pos(),gf=S.tbl.pell.gf;
  switch(id){
    case'top8':return r>=9&&p>10; case'promo':return r>=9&&p>6;
    case'derby':return r>=9&&(S.derbyPts<(r>=26?4:3));
    case'goals':return r>=9&&gf<50*r/34-3;
    case'youth3':return r>=17&&S.debuts<3*r/34-.5;
    case'okoro':return r>=17&&S.okoroStarts<10*r/34-1;
    case'hartContract':return r>=27&&!S.flags.hartSigned;
    case'stadium':return r>=17&&!S.flags.stadiumPartner;
    default:return false;
  }
}
function evalP(id){
  switch(id){
    case'top8':return pos()<=8; case'promo':return pos()<=3; case'derby':return S.derbyPts>=4; case'goals':return S.tbl.pell.gf>=50;
    case'tickets':return true; case'stadium':return !!S.flags.stadiumPartner; case'youth3':return S.debuts>=3;
    case'estevesYear':return S.flags.estevesLeft?'void':S.coach==='esteves';
    case'hartContract':return !!S.flags.hartSigned; case'okoro':return S.okoroStarts>=10;
    case'noInvestor':return true; case'harlanReview':return true;
  }
}
function pStatus(p){if(p.st!=='open')return p.st==='broken'?'Broken':p.st;if(S.phase==='alv'){const v=evalP(p.id);return v==='void'?'Void':v?'Kept':'Broken'}return behind(p.id)?'Behind':'On track'}

/* ---------- New game ---------- */
function newGame(){
  const seed=(Date.now()%2147483647)|0;
  S={v:1,seed,rs:seed,phase:'intro',screen:'intro',round:0,moment:0,
    grp:{docks:55,students:60,business:42},grpPrev:{docks:55,students:60,business:42},
    ch:{esteves:{loy:6},ward:{loy:7},hart:{loy:5},kearney:{loy:5},okon:{loy:4},vance:{loy:2}},
    coach:'esteves',flags:{},promises:[],mods:[],youth:0,okoroStarts:0,debuts:0,cash:120,
    tbl:{},fx:null,realPts:0,xPts:0,derbyPts:0,log:[],mlog:[],cross:[],served:false,talked:false,
    pick:{},step:0,chances:null,echo:null,wait:null,scene:null,block:null,alv:null};
  for(const id in S.ch)Object.assign(S.ch[id],{owes:false,withVance:false,deepKnown:false});
  TEAMS.forEach(t=>S.tbl[t[0]]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  S.fx=makeFixtures(rnd);
  S.chances=computeChances();
  save();render();
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE_KEY);if(t){const s=JSON.parse(t);if(s&&s.v===1){S=s;return true}}}catch(e){}return false}

/* ---------- Manifest ---------- */
const SLOTS=[{key:'sport',title:'Your sporting promise',ask:'What do you promise about the first team?'},
  {key:'club',title:'Your promise about the club',ask:'What do you promise about the club itself?'},
  {key:'person',title:'Your personal promise',ask:'One public promise about one person.'}];
function chanceFor(id){const c=S.chances;return{top8:chanceWord(c.top8),derby:chanceWord(c.derby),goals:chanceWord(c.goals),promo:chanceWord(c.promo)}[id]||PROM[id].word}
function applyManifest(){
  for(const k of ['sport','club','person']){const id=S.pick[k];if(id&&id!=='none')addPromise(id,'Your manifest')}
  if(hasP('tickets')){cash(-60,'Tickets under £10: the first year\'s gap');grp('business',-3,'Business sees £60k walk out of the door')}
  if(hasP('estevesYear')){loy('esteves','protect','You promised her the season in public');S.flags.protectCoach=1}
  if(hasP('hartContract')){loy('hart','protect','You promised his contract in public');loy('ward','bypass','Contracts are Ward\'s call, and you made it for him')}
  if(hasP('okoro')){loy('ward','wish','You backed his wonderkid in public');youthAsk(S.coach,false)}
  if(hasP('youth3'))loy('ward','wish','Academy debuts are Ward\'s dream');
  if(S.pick.person==='none')log('No personal promise','You keep your hands free',null);
  startMoment(1);
}

/* ---------- Moments ---------- */
function startMoment(k){
  S.phase='season';S.moment=k;S.mlog=[];S.grpPrev={...S.grp};
  const lines=[];
  if(S.flags.hartWaiting){S.flags.hartWaiting=0;loy('hart','wait','You sent him to Ward and nothing happened')}
  if(k===2&&hasP('tickets')&&!S.flags.gapSolved){S.flags.gapSolved=1;addMod('sold',-1,34);cash(70,'Ward sells a midfielder to cover the ticket gap');loy('ward','wait','You never answered him about the money');lines.push('Ward sells midfielder Dean Fry to cover the ticket gap.')}
  if(k===3&&S.flags.sponsorForWard&&!S.flags.sponsor){S.flags.sponsorForWard=0;addMod('sold',-1,34);cash(70,'The sponsor never came, so Ward sells after all');loy('ward','against','You said you would find the money')}
  if(k>=2)lines.push(...oppMove());
  S.echo=buildEcho(k,lines);
  S.wait=pickWait(k);
  S.served=false;S.talked=false;S.scene=null;S.screen='echo';save();render();
}
function oppMove(){
  const out=[];
  if(S.flags.vanceBoard){out.push('Gareth Vance, now on your board, has gone very quiet.');return out}
  if(!S.served)grp('business',-2,'You left the Business vote to Vance');
  const pending=S.cross.filter(c=>c.dir==='down').map(c=>c.id);
  const low=['hart','ward',S.coach,'okon'].filter(id=>S.ch[id]&&CH[id].canDefect&&S.ch[id].loy<4&&!S.ch[id].withVance&&!pending.includes(id));
  if(low.length&&!(S.flags.vanceCommittee&&rnd()<.5)){const id=low[0];S.ch[id].withVance=true;log(`${CH[id].short} is now in Vance's camp`,'Vance courts the people you neglect',null);out.push(`Rumour: ${CH[id].short} was seen at the Harbour Hotel with Gareth Vance. Twice.`);return out}
  const bp=S.promises.find(p=>p.st==='open'&&behind(p.id));
  if(bp&&!S.flags.truce){grp(PROM[bp.id].g[0],-3,`Vance attacks your promise: ${PROM[bp.id].t}`);out.push(`Vance: "${PROM[bp.id].t}? Look at the table. What else did he promise you?"`);return out}
  if(S.flags.truce){out.push('Vance keeps his word on the truce. The Echo finds him dull.');return out}
  out.push('Vance at the business breakfast: "Pell could be twice this size. Ask yourselves why it isn\'t."');
  return out;
}
function buildEcho(k,lines){
  const months=['','July','October','January','April'];
  if(k===1){
    const ps=S.promises.map(p=>PROM[p.id].t);
    return{date:months[k],head:'New chairman, old problems',lines:[`Elected with 52%. Vance: "One year. Then we talk."`,ps.length?`The manifest: ${ps.join('; ')}.`:'A manifest with no promises at all.',...lines]};
  }
  const b=S.block||[];const pts=b.reduce((s,m)=>s+m.pts,0),n=b.length||1,ppg=pts/n;
  const head=ppg>=2?'Pell on the rise':ppg>=1.4?'Steady as she goes':ppg>=.9?'Pell stall':'Pell in freefall';
  const open=S.promises.filter(p=>p.st==='open');const beh=open.find(p=>behind(p.id));
  const status=beh?`Behind schedule: ${PROM[beh.id].t}.`:open.length?`On track: ${PROM[open[0].id].t}.`:null;
  return{date:months[k],head,lines:[`${pts} points from ${n} games. ${luckWord()}. ${ord(pos())} in the table.`,...lines,...(status?[status]:[])]};
}
function pickWait(k){
  S.cross=S.cross.filter(c=>S.ch[c.id]&&c.id!=='vance'&&(c.id!=='esteves'||S.coach==='esteves')&&(c.id!=='talbot'||S.coach==='talbot')&&(c.dir==='up'?S.ch[c.id].owes:(S.ch[c.id].loy<4&&!S.ch[c.id].withVance)));
  if(k>=2&&S.coach==='esteves'&&!S.flags.offerDone&&!S.flags.coachContract&&(S.realPts-S.xPts>=4||(k>=3&&pos()<=4))){S.flags.offerDone=1;return{type:'offer',id:'esteves'}}
  const up=S.cross.find(c=>c.dir==='up');if(up){S.cross.splice(S.cross.indexOf(up),1);return{type:'owes',id:up.id}}
  const dn=S.cross.find(c=>c.dir==='down');if(dn){S.cross.splice(S.cross.indexOf(dn),1);return{type:'defect',id:dn.id}}
  if(k===3&&!S.flags.hartSigned&&!S.flags.hartDeal&&!hasP('hartContract'))return{type:'hart',id:'hart'};
  if(k===1&&hasP('tickets'))return{type:'gap',id:'ward'};
  if(k>=2){const bp=S.promises.find(p=>p.st==='open'&&PROM[p.id].slot==='sport'&&behind(p.id));if(bp)return{type:'behind',id:S.coach,prom:bp.id}}
  return null;
}

function D(t,give,get,test,fail,run,warn){return{t,give,get,test,fail,run,warn}}
function noDeal(text,run){return{t:'No deal',none:true,fail:text,run:run||(()=>{})}}

      D('"It\'s Ward\'s call."','Nothing','Ward stays in charge of contracts','—','Hart keeps waiting, and he is proud',()=>{S.flags.hartWaiting=1;log('You sent Hart to Ward','Contracts are Ward\'s call',null)}),
      D('"Finish twelfth or better and it\'s yours."','A condition on your word','A captain with something to play for','End of season','If we finish lower, he feels cheated',()=>{S.flags.hartDeal=1;loy('hart','wish','A deal with a target');log('Deal: twelfth or better and Hart signs','A target for the run-in',null)})],

      ...(S.ch.esteves.owes?[D('Call in the favour','The favour she owes you','She stays, for you','—','—',()=>{S.ch.esteves.owes=false;log('Esteves turns Harrowgate down','She owed you',null)})]:[]),
      D('Go with my blessing','Your coach','Goodwill, and a new coach','—','The Students loved her',()=>{S.flags.estevesLeft=1;S.coach='talbot';S.ch.talbot={loy:6,owes:false,withVance:false,deepKnown:false};addMod('talbot',1,34);S.youth=Math.min(S.youth,1);S.flags.coachBacked=0;log('Esteves leaves for Harrowgate. Bryn Talbot takes over','You let her go',null);grp('students',-4,'Their coach is gone')})],
    noDeal:noDeal('She goes. You did not even try.',()=>{S.flags.estevesLeft=1;S.coach='talbot';S.ch.talbot={loy:6,owes:false,withVance:false,deepKnown:false};addMod('talbot',1,34);S.youth=Math.min(S.youth,1);S.flags.coachBacked=0;log('Esteves leaves for Harrowgate. Bryn Talbot takes over','You did not fight for her',null);grp('students',-6,'He did not even try to keep her')})};
  if(w.type==='behind'){const pr=PROM[w.prom].t;return{who:id,place:'training',lines:[`${n} finds you in the stand.`,`"We're behind on your promise, chairman. ${pr}. I thought you should hear it from me."`],
    cards:[D('Play it safe until the next moment','Nothing. It is an ask','Steadier results','Next block','The Students hate dull football',()=>{const r=comply(id,true,false);if(r==='refuse'){log(`${n} ignores the request`,'Distant with you',null);return}addMod('safe',r==='full'?1:.5,nextBlockEnd(S.round+1));loy(id,'against','You asked for safety over style');grp('students',-2,'Dull football at Pell')}),
      D('"It\'s on me. Keep going."','Nothing','A coach who feels trusted','—','The promise is still behind',()=>{loy(id,'wish','You took the blame yourself')})],

function placeScene(id){
  const c=S.ch[id],lines=[OPEN[id][bandIdx(c.loy)]];
  if(S.scene.listened)lines.push(CH[id].deepLine);
  return{who:id,place:CH[id].place,lines,cards:placeCards(id),noDeal:noDeal(`You leave with nothing agreed. ${CH[id].short} notices.`)};
}
function hint(pl){
  const id=PLACES[pl].who(),c=S.ch[id];if(!c)return'';
  if(c.withVance)return`${CH[id].short} leaves early. Vance's car is outside.`;
  if(id==='hart'&&!S.flags.hartSigned&&S.moment>=2)return'Hart lingers by your car. His contract still isn\'t sorted.';
  if(id==='ward'&&hasP('tickets')&&!S.flags.gapSolved)return'The light is on. Ward is still waiting on an answer about the money.';
  if(id==='vance')return S.flags.vanceBoard?'Vance, now on your board, is buying rounds.':'Vance holds court with three business owners.';
  if(c.owes)return`${CH[id].short} owes you a favour.`;
  const b=bandIdx(c.loy);
  return[`${CH[id].short} looks away when you arrive.`,`${CH[id].short} is cool, and keeping their distance.`,`${CH[id].short} is busy. Polite.`,`${CH[id].short} waves you over.`,`${CH[id].short} lights up when they see you.`][b];
}
function applyCard(i){
  const sc=S.wait&&!S.scene?waitScene(S.wait):placeScene(S.scene.id);
  const list=[...sc.cards,...(sc.noDeal?[sc.noDeal]:[])];const card=list[i];if(!card)return;
  card.run();
  if(S.wait&&!S.scene){S.wait=null;S.screen='places'}else{S.talked=true;S.screen='review'}
  save();render();window.scrollTo(0,0);
}

/* ---------- Blocks ---------- */
function runBlock(){
  const to=BLOCK_ENDS.find(e=>e>S.round);const res=[];
  for(let r=S.round+1;r<=to;r++){S.round=r;res.push(simRound(r))}
  S.block=res;S.screen='block';save();render();window.scrollTo(0,0);
}
function afterBlock(){if(S.round>=34)startALV();else startMoment(S.moment+1);window.scrollTo(0,0)}

/* ---------- AGM ---------- */
function startALV(){
  S.phase='alv';S.mlog=[];S.grpPrev={...S.grp};
  if(openP('hartContract')&&!S.flags.hartSigned){if(S.ch.ward.loy>=4){S.flags.hartSigned=1;log('Ward signs Hart, reluctantly','Your promise, his signature',null)}else log('Ward refuses to sign Hart','Ward is distant with you',null)}
  if(S.flags.hartDeal&&!S.flags.hartSigned){if(pos()<=12){S.flags.hartSigned=1;log('Hart signs: we finished twelfth or better','Your deal with him',null)}else loy('hart',null,'We missed the target in your deal',-3)}
  const report=[];
  for(const p of S.promises){
    let v=p.st==='broken'?false:evalP(p.id);
    if(v==='void'){p.st='void';report.push({id:p.id,res:'void'});continue}
    p.st=v?'kept':'broken';report.push({id:p.id,res:p.st});
    for(const g of PROM[p.id].g)grp(g,v?GAIN[PROM[p.id].size]:-20,`${v?'Kept':'Broken'}: ${PROM[p.id].t}`);
  }
  if(S.cash<0)grp('business',-5,'The club is in the red');
  const motions=[];
  if(!S.flags.vanceBoard&&(S.grp.business<55||!S.flags.truce))motions.push({id:'inv',by:'business',against:'docks',t:'Allow outside investment up to 49%'});
  motions.push({id:'cap',by:'docks',against:'business',t:'No outside owner above 25%, ever'});
  motions.push({id:'tix',by:'students',against:null,t:hasP('tickets')&&S.promises.find(p=>p.id==='tickets').st==='kept'?'Freeze tickets under £10 for three seasons':'Cut tickets to under £10'});
  S.alv={step:'report',report,motions,lobby:[],speakers:[],defense:null,result:null};
  S.screen='alv';save();render();
}
function applyLobby(sel){
  const A=S.alv;A.lobby=sel;const m=id=>A.motions.find(x=>x.id===id);
  for(const id of sel){
    const mo=m(id);
    if(mo){grp(mo.by,10,`You back their motion: ${mo.t}`);if(mo.against)grp(mo.against,-3,'They saw the deal');if(id==='inv'){S.flags.backedInvestor=1;if(openP('noInvestor')||(hasP('noInvestor')&&S.promises.find(p=>p.id==='noInvestor').st==='kept')){const p=S.promises.find(p=>p.id==='noInvestor');p.st='broken';grp('docks',-20,'Broken: no outside investor')}}}
    if(id==='seat'){S.flags.commission=1;grp('business',15,'You give Business a finance seat with a veto')}
    if(id==='stand'){S.flags.stand=1;cash(-15,'The Dockers\' Stand');grp('docks',10,'The North Stand becomes the Dockers\' Stand');grp('business',-3,'Money on signs')}
  }
  if(sel.includes('inv')&&sel.includes('cap')){grp('docks',-5,'He promised both sides');grp('business',-5,'He promised both sides')}
  for(const mo of A.motions){let yes=0;for(const g of GORDER){let base=g===mo.by?90:g===mo.against?15:45;if(sel.includes(mo.id))base+=10;yes+=GROUPS[g].share*clamp(base,0,100)}mo.pass=yes>=50}
  const sp=[];
  const voices=[['kearney','kearneySpeaks'],['hart','hartSpeaks'],['okon','okonSpeaks'],[S.coach,null],['ward',null]];
  for(const [id,fl] of voices){const c=S.ch[id];if(!c)continue;const g=CH[id].infl;
    if(c.withVance){sp.push({id,for:false,line:`${CH[id].short} stands with Vance: "I backed the wrong man last summer."`});if(g)grp(g,-3,`${CH[id].short} speaks for Vance`)}
    else if((fl&&S.flags[fl])||c.owes){if(c.owes)c.owes=false;sp.push({id,for:true,line:`${CH[id].short}: "He kept faith with me. Keep faith with him."`});if(g)grp(g,3,`${CH[id].short} speaks for you`)}
    else if(g&&c.loy>6)grp(g,Math.round(c.loy-6),`${CH[id].short} talks you up around the club`);
    else if(g&&c.loy<4)grp(g,-Math.round(4-c.loy),`${CH[id].short} grumbles about you around the club`);
  }
  A.speakers=sp;A.candidate=!S.flags.vanceBoard&&(weighted()<50||S.grp.business<40);
  A.step='speech';save();render();window.scrollTo(0,0);
}
function applyDefense(d){
  const A=S.alv;A.defense=d;
  if(d==='luck'){const v=luck()==='unlucky'?5:-5;for(const g of GORDER)grp(g,v,v>0?'They accept it was bad luck: the numbers back you':'Excuses: we got what we deserved')}
  if(d==='success'){const kept=A.report.filter(r=>r.res==='kept');if(kept.length){const g=PROM[kept[0].id].g[0];grp(g,5,`You remind them: ${PROM[kept[0].id].t}`);const other=GORDER.filter(x=>x!==g).sort((a,b)=>S.grp[a]-S.grp[b])[0];grp(other,-3,'They hear a man changing the subject')}else for(const g of GORDER)grp(g,-3,'Nothing to point at')}
  if(d==='blame'){const id=S.coach;loy(id,'blame','You blamed the coach in front of the members');const dis=CH[id].dislike;if(dis)grp(dis,5,`They never liked ${CH[id].short}`);if(CH[id].infl)grp(CH[id].infl,-3,`They liked ${CH[id].short}`)}
  if(d==='wrong'){S.flags.trusted=1;log('You admitted your mistake','Next manifest starts trusted',null)}
  const total=weighted();A.result={total,won:total>=50};A.step='count';save();render();window.scrollTo(0,0);
}

const $=document.getElementById('app');

function blockView(){
  const b=S.block;const pts=b.reduce((s,m)=>s+m.pts,0);
  const rows=b.map(m=>`<div class="res"><span class="wdl ${m.pts===3?'W':m.pts===1?'D':'L'}">${m.pts===3?'W':m.pts===1?'D':'L'}</span><span>${m.home?'':'at '}${esc(TNAME[m.opp])}${m.derby?' <span class="tag">Derby</span>':''}</span><span>${m.gf}–${m.ga}</span></div>`).join('');
  const st=standings();const p=st.indexOf('pell');const around=st.slice(Math.max(0,p-2),Math.min(18,p+3));
  const tbl=around.map(id=>`<div class="row small" style="font-variant-numeric:tabular-nums${id==='pell'?';font-weight:600':''}"><span>${st.indexOf(id)+1}. ${esc(TNAME[id])}</span><span>${S.tbl[id].pts} pts</span></div>`).join('');
  const prom=S.promises.filter(x=>x.st==='open').map(x=>`<div class="row small"><span>${esc(PROM[x.id].t)}</span><span class="mood ${behind(x.id)?'down':'up'}">${behind(x.id)?'Behind':'On track'}</span></div>`).join('');
  return`<p class="eyebrow">Rounds ${b[0].r} to ${b[b.length-1].r}</p><h2>${pts} points from ${b.length}</h2><p class="muted">${luckWord()}.</p>
  <div class="panel">${rows}</div><div class="panel"><p class="eyebrow">The table</p>${tbl}</div>${prom?`<div class="panel"><p class="eyebrow">Your promises</p>${prom}</div>`:''}
  <button class="btn" data-act="blockNext">${S.round>=34?'To the AGM':'Next moment'}</button>`;
}
function verdict(p){return p>=75?'Overwhelmingly for':p>=58?'Clearly for':p>=50?'Narrowly for':p>=42?'Narrowly against':p>=25?'Clearly against':'Overwhelmingly against'}
function alvView(){
  const A=S.alv;
  if(A.step==='report'){
    const rows=A.report.map(r=>`<div class="row"><span>${esc(PROM[r.id].t)}<br><span class="small muted">${PROM[r.id].g.map(g=>GROUPS[g].name).join(', ')}</span></span><span class="mood ${r.res==='kept'?'up':r.res==='broken'?'down':''}">${r.res==='kept'?'Kept':r.res==='broken'?'Broken':'Void'}</span></div>`).join('<hr>')||'<p>You promised nothing.</p>';
    const moods=GORDER.map(g=>`<div class="row"><span>${GROUPS[g].name}</span><span class="mood">${moodWord(S.grp[g])} ${arrow(g)}</span></div>`).join('');
    return`<p class="eyebrow">June · Sports hall, 8pm</p><h2>The annual report</h2><p>Final position: ${ord(pos())}, ${S.tbl.pell.pts} points. ${luckWord()}.</p><div class="panel">${rows}</div><div class="panel"><p class="eyebrow">How they walk in</p>${moods}</div><button class="btn" data-act="alvLobby">Into the corridor</button>`;
  }
  if(A.step==='lobby'){
    const opts=[...A.motions.map(m=>({id:m.id,t:`Back the ${GROUPS[m.by].name} motion`,d:`"${m.t}". ${GROUPS[m.by].name} warm to you${m.against?`; ${GROUPS[m.against].name} see the deal`:''}. If it passes, it binds the club.`})),
      ...(!S.flags.commission?[{id:'seat',t:'Offer Business a finance seat with a veto',d:'Business at the table. Your big spending goes past them from now on.'}]:[]),
      ...(!S.flags.stand?[{id:'stand',t:'Promise the Docks: the Dockers\' Stand',d:'£15k of signs and history. Business grumbles.'}]:[])];
    const mo=A.motions.map(m=>`<li><b>${GROUPS[m.by].name}:</b> ${esc(m.t)}</li>`).join('');
    const ch=opts.map(o=>`<label class="check${UI.lobby[o.id]?' on':''}" for="lb-${o.id}"><input type="checkbox" id="lb-${o.id}" data-lobby="${o.id}" ${UI.lobby[o.id]?'checked':''}><span><b>${esc(o.t)}</b><br><span class="small muted">${esc(o.d)}</span></span></label>`).join('');
    return`<p class="eyebrow">The corridor, 7.45pm</p><h2>Motions and deals</h2><p>Binding motions on tonight's agenda:</p><ul class="log">${mo}</ul><p>Make as many deals as you like. Everyone in the hall will know about every one of them.</p><div class="stack">${ch}</div><button class="btn" data-act="lobbyDone">Into the hall</button>`;
  }
  if(A.step==='speech'){
    const sp=A.speakers.map(s=>`<div class="stack" style="gap:6px">${whoRow(s.id)}<p class="voice">${esc(s.line)}</p></div>`).join('<hr>')||'<p class="muted">Nobody stands up for you, and nobody against.</p>';
    const res=A.motions.map(m=>`<div class="row"><span>${esc(m.t)}</span><span class="mood ${m.pass?'up':'down'}">${m.pass?'Carried':'Defeated'}</span></div>`).join('');
    const cand=A.candidate?`<div class="stack" style="gap:6px">${whoRow('vance')}<p class="voice">"He promised you things. Count them. Then vote for someone who delivers."</p></div>`:'<p>No one stands against you. Tonight is a vote of confidence.</p>';
    const defs=[['wrong','"Where I fell short, I was wrong."','Nothing changes tonight. The members will trust your next manifest more.'],['luck','"We were unlucky."',luck()==='unlucky'?'True this season. They may accept it.':'The table says otherwise.'],['success','"Look at what worked."','Point to what you delivered. Some will call it changing the subject.'],['blame',`"The coach let us down."`,`${CH[S.coach].short} hears every word.`]];
    return`<p class="eyebrow">The hall</p><h2>Motions and voices</h2><div class="panel">${res}</div><div class="panel">${sp}</div><div class="panel"><p class="eyebrow">${A.candidate?'Your opponent':'No challenger'}</p>${cand}</div><p class="eyebrow">Your speech</p><div class="stack">${defs.map(d=>`<button class="choice" data-act="defend" data-arg="${d[0]}"><b>${esc(d[1])}</b><span class="meta">${esc(d[2])}</span></button>`).join('')}</div>`;
  }
  if(A.step==='count'){
    const order=GORDER.slice().sort((a,b)=>S.grp[a]-S.grp[b]);
    const rows=order.map(g=>`<div class="cg panel"><div class="row"><b>${GROUPS[g].name}</b><span class="mood">${verdict(S.grp[g])}</span></div><div class="bar"><i style="width:${Math.round(S.grp[g])}%"></i></div></div>`).join('');
    const won=A.result.won;
    return`<p class="eyebrow">The count</p><h2>${A.candidate?'You or Gareth Vance':'Confidence in the chairman'}</h2><div class="count">${rows}</div>
    <div class="verdict stack"><p class="big ${won?'up':'down'}">${won?'Re-elected':'Voted out'}</p><p>${won?'The members keep you. What you gave away tonight now binds the club.':'Vance takes the chair. Your reputation goes with you to the next club.'}</p><button class="btn" data-act="toEnd">The season in full</button></div>`;
  }
  if(A.step==='end')return endView();
}
function endView(){
  const A=S.alv,kept=S.promises.filter(p=>p.st==='kept').length,broken=S.promises.filter(p=>p.st==='broken').length;
  const binds=[...A.motions.filter(m=>m.pass).map(m=>`Motion carried: ${m.t}`),...(S.flags.commission?['Business finance committee with a veto']:[]),...(S.flags.stand?['The Dockers\' Stand']:[]),...(S.flags.coachContract?[`${CH[S.coach].short} under contract for two more years`]:[]),...(S.flags.vanceBoard?['Gareth Vance on your board']:[]),...(S.flags.hartSigned?['Hart signed for two more years']:['Hart\'s contract has run out'])];
  const ppl=Object.keys(S.ch).filter(id=>id!=='esteves'||S.coach==='esteves').map(id=>`<div class="row small"><span>${esc(CH[id].name)}</span><span class="mood">${band(S.ch[id].loy)}${S.ch[id].withVance?' · with Vance':''}</span></div>`).join('');
  return`<p class="eyebrow">End of season one</p><h2>${A.result.won?'Chairman for another year':'Former chairman'}</h2>
  <p>${ord(pos())} with ${S.tbl.pell.pts} points. Promises kept: ${kept}. Broken: ${broken}. ${A.defense==='wrong'?'Your next manifest starts trusted.':''}</p>
  <div class="panel"><p class="eyebrow">What the club carries into next season</p><ul class="log">${binds.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
  <div class="panel"><p class="eyebrow">Your people</p>${ppl}</div>
  <div class="stack"><button class="btn ghost" data-act="showLog">Read every change, with its cause</button><button class="btn" data-act="new">Play season one again</button></div>`;
}
function tableView(){
  const g=GORDER.map(k=>`<div class="row"><span>${GROUPS[k].name}</span><span class="mood">${moodWord(S.grp[k])} ${arrow(k)}</span></div>`).join('');
  const ppl=Object.keys(S.ch).filter(id=>!(id==='esteves'&&S.coach!=='esteves')).map(id=>`<div class="row small"><span>${esc(CH[id].name)}<br><span class="muted">${esc(CH[id].role)}</span></span><span class="mood">${band(S.ch[id].loy)}${S.ch[id].owes?' · owes you':''}${S.ch[id].withVance?' · with Vance':''}</span></div>`).join('<hr>');
  const pr=S.promises.map(p=>`<div class="row small"><span>${esc(PROM[p.id].t)}</span><span class="mood">${pStatus(p)}</span></div>`).join('')||'<p class="small muted">No promises.</p>';
  const deals=[...(S.flags.coachContract?[`${CH[S.coach].short}: two-year contract`]:[]),...(S.flags.commission?['Business finance committee (veto)']:[]),...(S.flags.vanceCommittee?['Vance chairs a stadium committee']:[]),...(S.flags.truce?['Truce with Vance']:[]),...(S.flags.vanceBoard?['Vance on the board']:[]),...(S.flags.hartFuture?['Hart: coaching future']:[]),...(S.flags.hartDeal?['Hart: twelfth or better and he signs']:[]),...(S.flags.hartSigned?['Hart signed']:[]),...(S.flags.sponsorForWard?['Promised Ward a sponsor by January']:[]),...(S.flags.sponsor?['Local sponsorship']:[]),...(S.flags.stand?['The Dockers\' Stand']:[]),...(S.flags.docksDerby?['The Docks fill the derby']:[]),...(S.flags.wardFree?['Ward runs recruitment alone']:[])];
  return`<div class="overlay" role="dialog" aria-label="The table"><div class="inner"><div class="row"><h2>The table</h2><button class="tbtn" data-act="table">Close</button></div>
  <p class="muted small">${S.round?`${ord(pos())} after round ${S.round}. `:''}Money: ${moneyWord(S.cash)}.</p>
  <div class="panel"><p class="eyebrow">Your promises</p>${pr}</div>
  <div class="panel"><p class="eyebrow">Deals on the table</p>${deals.length?deals.map(d=>`<p class="small">${esc(d)}</p>`).join(''):'<p class="small muted">None yet.</p>'}</div>
  <div class="panel"><p class="eyebrow">The members</p>${g}</div>
  <div class="panel"><p class="eyebrow">Your people</p>${ppl}</div></div></div>`;
}
function logView(){
  const items=S.log.map(e=>`<li><span class="num">R${e.r}</span> ${esc(e.text)} ${e.num?`<span class="num">${esc(e.num)}</span>`:''}<span class="why">${esc(e.why)}</span></li>`).join('');
  return`<div class="overlay" role="dialog" aria-label="Season log"><div class="inner"><div class="row"><h2>The season</h2><button class="tbtn" data-act="showLog">Close</button></div><ul class="log">${items}</ul></div></div>`;
}

/* ---------- Input ---------- */
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.lobby;if(id){UI.lobby[id]=e.target.checked;render()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,arg=b.dataset.arg;
  switch(a){
    case'new':UI.showLog=false;UI.table=false;UI.lobby={};newGame();window.scrollTo(0,0);break;
    case'continue':if(load())render();break;
    case'toManifest':S.screen='manifest';S.step=0;save();render();window.scrollTo(0,0);break;
    case'pick':S.pick[SLOTS[S.step].key]=arg;S.step++;if(S.step>=3)applyManifest();else{save();render()}window.scrollTo(0,0);break;
    case'echoNext':S.screen=S.wait?'wait':'places';save();render();window.scrollTo(0,0);break;
    case'place':S.scene={id:PLACES[arg].who(),step:0,listened:false};S.screen='scene';save();render();window.scrollTo(0,0);break;
    case'listen':S.scene.listened=true;S.ch[S.scene.id].deepKnown=true;S.scene.step=1;save();render();break;
    case'point':S.scene.step=1;save();render();break;
    case'card':applyCard(+arg);break;
    case'reviewNext':runBlock();break;
    case'blockNext':afterBlock();break;
    case'table':UI.table=!UI.table;render();break;
    case'showLog':UI.showLog=!UI.showLog;render();break;
    case'alvLobby':S.alv.step='lobby';UI.lobby={};save();render();window.scrollTo(0,0);break;
    case'lobbyDone':applyLobby(Object.keys(UI.lobby).filter(k=>UI.lobby[k]));break;
    case'defend':applyDefense(arg);break;
    case'toEnd':S.alv.step='end';save();render();window.scrollTo(0,0);break;
  }
});
function boot(data){if(data&&data.S)S=data.S;render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

</body>
